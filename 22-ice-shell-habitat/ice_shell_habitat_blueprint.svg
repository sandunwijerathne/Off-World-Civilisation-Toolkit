<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#16406B" stroke-width="0.6"/>
    </pattern>
    <pattern id="gridMajor" width="125" height="125" patternUnits="userSpaceOnUse">
      <rect width="125" height="125" fill="url(#grid)"/>
      <path d="M 125 0 L 0 0 0 125" fill="none" stroke="#1E5288" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6FC3FF"/>
    </marker>
    <marker id="warrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#DCEBFA"/>
    </marker>
    <marker id="dim" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M1,1 L9,9 M5,0 L5,10" stroke="#DCEBFA" stroke-width="1" fill="none"/>
    </marker>
  </defs>

  <rect width="1400" height="1000" fill="#0B2A4A"/>
  <rect width="1400" height="1000" fill="url(#gridMajor)"/>
  <rect x="20" y="20" width="1360" height="960" fill="none" stroke="#DCEBFA" stroke-width="2"/>
  <rect x="28" y="28" width="1344" height="944" fill="none" stroke="#DCEBFA" stroke-width="0.8"/>

  <text x="50" y="70" fill="#DCEBFA" font-size="27" letter-spacing="2" font-weight="bold">ICE-SHELL HABITAT — IS-1 "CISTERN"</text>
  <text x="50" y="96" fill="#6FC3FF" font-size="14" letter-spacing="2">SHIELD = RESERVE · SECTIONED HABITAT · THERMAL + WATER LOOP · VOLUME II · SHEET 1 OF 5</text>
  <line x1="50" y1="110" x2="1350" y2="110" stroke="#6FC3FF" stroke-width="1"/>

  <!-- ======== MAIN SECTION VIEW: nested spheres ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="2">
    <!-- outer ice shell -->
    <circle cx="470" cy="470" r="290" stroke-width="2.4"/>
    <circle cx="470" cy="470" r="230" stroke-width="1.4"/>
    <!-- ice hatching between the two radii -->
    <g stroke="#6FC3FF" stroke-width="0.6">
      <line x1="470" y1="180" x2="470" y2="240"/>
      <line x1="620" y1="230" x2="588" y2="278"/>
      <line x1="720" y1="380" x2="670" y2="410"/>
      <line x1="740" y1="500" x2="690" y2="500"/>
      <line x1="700" y1="620" x2="660" y2="586"/>
      <line x1="600" y1="710" x2="576" y2="666"/>
      <line x1="470" y1="760" x2="470" y2="700"/>
      <line x1="340" y1="710" x2="364" y2="666"/>
      <line x1="240" y1="620" x2="280" y2="586"/>
      <line x1="200" y1="500" x2="250" y2="500"/>
      <line x1="220" y1="380" x2="270" y2="410"/>
      <line x1="320" y1="230" x2="352" y2="278"/>
    </g>
    <text x="470" y="205" fill="#6FC3FF" font-size="10" text-anchor="middle" stroke="none">ICE SHELL (FROZEN, METRES THICK)</text>
    <text x="470" y="742" fill="#6FC3FF" font-size="9" text-anchor="middle" stroke="none">= RADIATION SHIELD + WATER RESERVE</text>

    <!-- inner pressure hull -->
    <circle cx="470" cy="470" r="180" stroke-width="2.2"/>
    <text x="470" y="470" fill="#6FC3FF" font-size="10" text-anchor="middle" stroke="none">INNER PRESSURE HULL</text>
    <text x="470" y="486" fill="#DCEBFA" font-size="9" text-anchor="middle" stroke="none">WARM LIVING VOLUME</text>

    <!-- decks inside -->
    <line x1="310" y1="420" x2="630" y2="420" stroke-width="0.7"/>
    <line x1="300" y1="520" x2="640" y2="520" stroke-width="0.7"/>
    <!-- little crew figures -->
    <g stroke-width="1"><circle cx="410" cy="444" r="5"/><line x1="410" y1="449" x2="410" y2="462"/><line x1="410" y1="462" x2="404" y2="472"/><line x1="410" y1="462" x2="416" y2="472"/></g>
    <g stroke-width="1"><circle cx="530" cy="544" r="5"/><line x1="530" y1="549" x2="530" y2="562"/><line x1="530" y1="562" x2="524" y2="572"/><line x1="530" y1="562" x2="536" y2="572"/></g>

    <!-- insulation gap note -->
    <path d="M 650 470 l 40 0" stroke="#6FC3FF" stroke-width="0.8" marker-end="url(#arrow)"/>
    <text x="656" y="452" fill="#6FC3FF" font-size="8" stroke="none">INSULATION GAP</text>

    <!-- incoming radiation stopped by ice -->
    <g stroke="#DCEBFA" stroke-width="1.2">
      <line x1="760" y1="240" x2="700" y2="300" marker-end="url(#warrow)"/>
      <line x1="800" y1="360" x2="740" y2="400" marker-end="url(#warrow)"/>
      <line x1="810" y1="480" x2="750" y2="484" marker-end="url(#warrow)"/>
    </g>
    <text x="770" y="228" fill="#DCEBFA" font-size="9" stroke="none">GCR / SOLAR PARTICLES</text>
    <!-- absorbed marks in the shell -->
    <g stroke="#6FC3FF" stroke-width="0.8">
      <path d="M 700 300 l 8 -6 M 700 300 l 6 8 M 740 400 l 8 -4 M 740 400 l 2 9"/>
    </g>
    <text x="620" y="336" fill="#6FC3FF" font-size="8.5" stroke="none">ABSORBED IN HYDROGEN-RICH WATER</text>

    <!-- tap-off point (melt) -->
    <circle cx="470" cy="240" r="10" stroke="#DCEBFA"/>
    <path d="M 470 250 l 0 40" stroke="#6FC3FF" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="486" y="236" fill="#DCEBFA" font-size="8.5" stroke="none">HEATED TAP-OFF (MELT)</text>

    <!-- outer surface radiates -->
    <g stroke="#6FC3FF" stroke-width="0.9">
      <path d="M 320 720 l -14 14 M 350 736 l -10 16 M 380 748 l -6 18"/>
    </g>
    <text x="250" y="768" fill="#6FC3FF" font-size="8.5" stroke="none">OUTER FACE RADIATES → STAYS FROZEN</text>
  </g>

  <!-- ======== WATER LOOP INSET (top right) ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.2">
    <rect x="900" y="140" width="440" height="240" fill="#0E3357" stroke="#6FC3FF"/>
    <text x="918" y="166" fill="#6FC3FF" font-size="12" letter-spacing="1" stroke="none">FIG. B — THE WALL IS A TANK</text>
    <line x1="918" y1="176" x2="1322" y2="176" stroke="#6FC3FF" stroke-width="0.7"/>
    <!-- shell block -->
    <rect x="930" y="200" width="70" height="150" rx="4"/>
    <g stroke="#6FC3FF" stroke-width="0.5"><line x1="940" y1="210" x2="932" y2="222"/><line x1="960" y1="210" x2="952" y2="222"/><line x1="980" y1="210" x2="972" y2="222"/><line x1="940" y1="300" x2="932" y2="312"/><line x1="970" y1="330" x2="962" y2="342"/></g>
    <text x="965" y="366" fill="#DCEBFA" font-size="8.5" text-anchor="middle" stroke="none">ICE SHELL</text>
    <!-- melt out -->
    <path d="M 1000 240 h 90" marker-end="url(#arrow)" stroke="#6FC3FF" stroke-width="1"/>
    <text x="1100" y="238" fill="#DCEBFA" font-size="8.5" stroke="none">MELT → DRINK / CROPS /</text>
    <text x="1100" y="252" fill="#DCEBFA" font-size="8.5" stroke="none">ELECTROLYSIS (O2 + FUEL)</text>
    <!-- return in -->
    <path d="M 1090 310 h -90" marker-end="url(#arrow)" stroke="#6FC3FF" stroke-width="1"/>
    <text x="1100" y="308" fill="#DCEBFA" font-size="8.5" stroke="none">RECLAIMED WATER → REFREEZE</text>
    <text x="918" y="360" fill="#6FC3FF" font-size="9" stroke="none">TOP UP FROM LOCAL ICE (MOON / ASTEROID)</text>
  </g>

  <!-- ======== DETAIL A: shield stack ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.4">
    <circle cx="1120" cy="580" r="92" stroke="#6FC3FF"/>
    <!-- layered stack -->
    <line x1="1060" y1="520" x2="1180" y2="520" stroke-width="1.4"/>
    <text x="1120" y="514" fill="#DCEBFA" font-size="8" text-anchor="middle" stroke="none">SPACE (VACUUM)</text>
    <!-- ice band -->
    <rect x="1060" y="524" width="120" height="56"/>
    <g stroke="#6FC3FF" stroke-width="0.5"><line x1="1072" y1="528" x2="1062" y2="542"/><line x1="1096" y1="528" x2="1086" y2="542"/><line x1="1120" y1="528" x2="1110" y2="542"/><line x1="1144" y1="528" x2="1134" y2="542"/><line x1="1168" y1="528" x2="1158" y2="542"/><line x1="1084" y1="558" x2="1074" y2="572"/><line x1="1132" y1="558" x2="1122" y2="572"/></g>
    <text x="1120" y="558" fill="#DCEBFA" font-size="8" text-anchor="middle" stroke="none">ICE (H-RICH)</text>
    <!-- hull -->
    <rect x="1060" y="580" width="120" height="14"/>
    <text x="1120" y="590" fill="#DCEBFA" font-size="7.5" text-anchor="middle" stroke="none">HULL</text>
    <!-- crew -->
    <rect x="1060" y="594" width="120" height="28"/>
    <text x="1120" y="612" fill="#6FC3FF" font-size="8" text-anchor="middle" stroke="none">CREW (WARM, SAFE)</text>
    <!-- dose reduction arrow -->
    <path d="M 1200 520 l 0 100" stroke="#6FC3FF" stroke-width="1" marker-end="url(#arrow)"/>
    <text x="1206" y="574" fill="#6FC3FF" font-size="8">DOSE</text>
    <text x="1206" y="586" fill="#6FC3FF" font-size="8">DROPS</text>
    <text x="1120" y="694" fill="#6FC3FF" font-size="12" text-anchor="middle" stroke="none">DETAIL A — SHIELD STACK</text>
    <line x1="750" y1="440" x2="1032" y2="562" stroke="#6FC3FF" stroke-width="0.9" stroke-dasharray="5 4"/>
  </g>

  <!-- ======== DIMENSION ======== -->
  <g stroke="#DCEBFA" stroke-width="1" fill="#DCEBFA">
    <line x1="180" y1="470" x2="290" y2="470" marker-start="url(#dim)" marker-end="url(#dim)"/>
    <text x="150" y="500" text-anchor="middle" font-size="11" transform="rotate(-90 150 500)">SHELL THICKNESS = SHIELD DEPTH = RESERVE VOLUME</text>
  </g>

  <!-- ======== CALLOUTS ======== -->
  <g stroke="#6FC3FF" stroke-width="1" fill="none">
    <line x1="470" y1="200" x2="360" y2="800" marker-start="url(#arrow)"/>
    <line x1="470" y1="290" x2="500" y2="800" marker-start="url(#arrow)"/>
    <line x1="470" y1="240" x2="640" y2="800" marker-start="url(#arrow)"/>
    <line x1="700" y1="300" x2="200" y2="800" marker-start="url(#arrow)"/>
    <line x1="360" y1="730" x2="790" y2="800" marker-start="url(#arrow)"/>
  </g>
  <g fill="#DCEBFA" font-size="13">
    <g><circle cx="360" cy="812" r="12" fill="none" stroke="#6FC3FF"/><text x="360" y="817" text-anchor="middle">1</text></g>
    <g><circle cx="500" cy="812" r="12" fill="none" stroke="#6FC3FF"/><text x="500" y="817" text-anchor="middle">2</text></g>
    <g><circle cx="640" cy="812" r="12" fill="none" stroke="#6FC3FF"/><text x="640" y="817" text-anchor="middle">3</text></g>
    <g><circle cx="200" cy="812" r="12" fill="none" stroke="#6FC3FF"/><text x="200" y="817" text-anchor="middle">4</text></g>
    <g><circle cx="790" cy="812" r="12" fill="none" stroke="#6FC3FF"/><text x="790" y="817" text-anchor="middle">5</text></g>
  </g>

  <!-- ======== PARTS LIST ======== -->
  <g font-size="12.5" fill="#DCEBFA">
    <rect x="50" y="832" width="640" height="124" fill="#0E3357" stroke="#6FC3FF" stroke-width="1"/>
    <text x="66" y="856" fill="#6FC3FF" font-size="13" letter-spacing="2" font-weight="bold">PARTS &amp; SYSTEMS INDEX</text>
    <line x1="66" y1="865" x2="674" y2="865" stroke="#6FC3FF" stroke-width="0.7"/>
    <text x="66" y="885">1 — ICE SHELL: frozen water jacket = shielding + water reserve in one mass</text>
    <text x="66" y="905">2 — INNER PRESSURE HULL: the real pressure boundary, warm living volume</text>
    <text x="66" y="925">3 — HEATED TAP-OFF: melt water for drinking, crops, electrolysis; refreeze return</text>
    <text x="66" y="941" font-size="10.5" fill="#6FC3FF">4 — SHELL ABSORBS RADIATION (hydrogen-rich) · 5 — OUTER FACE RADIATES, STAYS FROZEN</text>
  </g>

  <text x="1350" y="812" fill="#6FC3FF" font-size="11" text-anchor="end" letter-spacing="1">DESIGNED BY: W.A. SANDUN PRIYANKARA WIJERATHNE · sandunwijerathne51@gmail.com · github.com/sandunwijerathne</text>

  <!-- ======== TITLE BLOCK ======== -->
  <g font-size="12" fill="#DCEBFA">
    <rect x="710" y="832" width="640" height="124" fill="#0E3357" stroke="#DCEBFA" stroke-width="1.5"/>
    <line x1="710" y1="866" x2="1350" y2="866" stroke="#DCEBFA"/>
    <line x1="710" y1="900" x2="1350" y2="900" stroke="#DCEBFA"/>
    <line x1="710" y1="934" x2="1350" y2="934" stroke="#DCEBFA"/>
    <line x1="1040" y1="832" x2="1040" y2="956" stroke="#DCEBFA"/>
    <text x="726" y="852" fill="#6FC3FF" letter-spacing="1">PROJECT</text>
    <text x="726" y="862" font-size="11" font-weight="bold">OFF-WORLD TOOLKIT · VOLUME II</text>
    <text x="1056" y="852" fill="#6FC3FF">DRAWING NO.</text>
    <text x="1056" y="862" font-size="11" font-weight="bold">IS-1-GA-001 · REV A</text>
    <text x="726" y="886" fill="#6FC3FF">UNIT DESIGNATION</text>
    <text x="726" y="896" font-weight="bold" font-size="10.5">IS-1 "CISTERN" — GENERAL ARRANGEMENT</text>
    <text x="1056" y="886" fill="#6FC3FF">SHELL DOUBLES AS</text>
    <text x="1056" y="896" font-weight="bold" font-size="11">SHIELD + WATER RESERVE</text>
    <text x="726" y="920" fill="#6FC3FF">SHIELD MATERIAL</text>
    <text x="726" y="930" font-weight="bold" font-size="10.5">WATER ICE (HYDROGEN-RICH)</text>
    <text x="1056" y="920" fill="#6FC3FF">PRESSURE BOUNDARY</text>
    <text x="1056" y="930" font-weight="bold" font-size="11">INNER HULL (SEPARATE)</text>
    <text x="726" y="944" fill="#6FC3FF">FUNCTION</text>
    <text x="726" y="954" font-weight="bold" font-size="10.5">ONE MASS SHIELDS THE CREW AND SUPPLIES THEM</text>
    <text x="1056" y="944" fill="#6FC3FF">STATUS</text>
    <text x="1056" y="954" font-weight="bold" font-size="10">CONCEPT — NEAR-TERM (SHELTER FIRST)</text>
  </g>
</svg>
