<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#16406B" stroke-width="0.6"/>
    </pattern>
    <pattern id="gridMajor" width="125" height="125" patternUnits="userSpaceOnUse">
      <rect width="125" height="125" fill="url(#grid)"/>
      <path d="M 125 0 L 0 0 0 125" fill="none" stroke="#1E5288" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6FC3FF"/>
    </marker>
    <marker id="warrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#DCEBFA"/>
    </marker>
  </defs>

  <rect width="1400" height="1000" fill="#0B2A4A"/>
  <rect width="1400" height="1000" fill="url(#gridMajor)"/>
  <rect x="20" y="20" width="1360" height="960" fill="none" stroke="#DCEBFA" stroke-width="2"/>
  <rect x="28" y="28" width="1344" height="944" fill="none" stroke="#DCEBFA" stroke-width="0.8"/>

  <text x="50" y="70" fill="#DCEBFA" font-size="27" letter-spacing="2" font-weight="bold">ISOTOPE SORTING COLUMN — IS-1 "ASTON"</text>
  <text x="50" y="96" fill="#6FC3FF" font-size="14" letter-spacing="2">PRINCIPLE ONLY · NO ENGINEERING SHOWN · GOVERNANCE SHEET · VOLUME II · SHEET 1 OF 3</text>
  <line x1="50" y1="110" x2="1350" y2="110" stroke="#6FC3FF" stroke-width="1"/>

  <!-- ======== SCOPE BANNER ======== -->
  <g>
    <rect x="50" y="128" width="1300" height="52" fill="#0E3357" stroke="#6FC3FF" stroke-width="1.4"/>
    <text x="68" y="150" fill="#6FC3FF" font-size="12" letter-spacing="1" font-weight="bold">⚠ NOTE ON SCOPE — THIS SHEET IS DELIBERATELY INCOMPLETE</text>
    <text x="68" y="170" fill="#DCEBFA" font-size="10">DUAL-USE TECHNOLOGY. TEXTBOOK PRINCIPLE ONLY. NO PLANT LAYOUT, NO STAGING, NO OPERATING PARAMETERS — BY INTENT.</text>
  </g>

  <!-- ======== MAIN: the textbook principle ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="2">
    <text x="80" y="222" fill="#6FC3FF" font-size="12" letter-spacing="1" stroke="none">THE PRINCIPLE — SAME ELEMENT, DIFFERENT MASS</text>

    <!-- two isotope atoms, schematic -->
    <circle cx="150" cy="300" r="34"/>
    <text x="150" y="292" fill="#DCEBFA" font-size="9" text-anchor="middle" stroke="none">SAME</text>
    <text x="150" y="306" fill="#DCEBFA" font-size="9" text-anchor="middle" stroke="none">PROTONS</text>
    <text x="150" y="356" fill="#6FC3FF" font-size="9" text-anchor="middle" stroke="none">ISOTOPE A (LIGHTER)</text>
    <circle cx="290" cy="300" r="34"/>
    <text x="290" y="292" fill="#DCEBFA" font-size="9" text-anchor="middle" stroke="none">+ EXTRA</text>
    <text x="290" y="306" fill="#DCEBFA" font-size="9" text-anchor="middle" stroke="none">NEUTRONS</text>
    <text x="290" y="356" fill="#6FC3FF" font-size="9" text-anchor="middle" stroke="none">ISOTOPE B (HEAVIER)</text>
    <text x="220" y="392" fill="#DCEBFA" font-size="9" text-anchor="middle" stroke="none">CHEMICALLY NEARLY IDENTICAL —</text>
    <text x="220" y="406" fill="#6FC3FF" font-size="9" text-anchor="middle" stroke="none">NO CHEMISTRY CAN SORT THEM</text>

    <!-- mass-dependent deflection, schematic (Aston's instrument) -->
    <line x1="420" y1="300" x2="560" y2="300" stroke="#6FC3FF" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="490" y="288" fill="#DCEBFA" font-size="9" text-anchor="middle" stroke="none">CHARGED ATOMS</text>
    <!-- field region -->
    <rect x="560" y="240" width="90" height="120" stroke-dasharray="6 4" stroke-width="1"/>
    <g fill="#6FC3FF"><circle cx="580" cy="266" r="2"/><circle cx="612" cy="266" r="2"/><circle cx="640" cy="266" r="2"/><circle cx="580" cy="300" r="2"/><circle cx="612" cy="300" r="2"/><circle cx="640" cy="300" r="2"/><circle cx="580" cy="334" r="2"/><circle cx="612" cy="334" r="2"/><circle cx="640" cy="334" r="2"/></g>
    <text x="605" y="230" fill="#6FC3FF" font-size="9" text-anchor="middle" stroke="none">MAGNETIC FIELD</text>
    <!-- two curved paths, different radii -->
    <path d="M 650 300 C 720 296 770 268 800 232" stroke="#DCEBFA" stroke-width="1.6" marker-end="url(#warrow)"/>
    <path d="M 650 300 C 730 300 790 292 840 276" stroke="#6FC3FF" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="822" y="222" fill="#DCEBFA" font-size="8.5" stroke="none">LIGHTER — TIGHTER CURVE</text>
    <text x="856" y="272" fill="#6FC3FF" font-size="8.5" stroke="none">HEAVIER — WIDER CURVE</text>
    <text x="700" y="352" fill="#DCEBFA" font-size="9" stroke="none">PATH RADIUS DEPENDS ON MASS → THEY ARRIVE APART</text>
    <text x="700" y="370" fill="#6FC3FF" font-size="8.5" stroke="none">(the mass spectrograph — how isotopes were discovered, Aston 1920)</text>

    <!-- the difficulty: separation is tiny -->
    <rect x="80" y="440" width="770" height="86" rx="4" fill="#0E3357"/>
    <rect x="80" y="440" width="770" height="86" rx="4"/>
    <text x="98" y="464" fill="#6FC3FF" font-size="11" letter-spacing="1" stroke="none">WHY IT IS HARD — AND WHY THAT MATTERS</text>
    <text x="98" y="486" fill="#DCEBFA" font-size="9.5" stroke="none">THE MASS DIFFERENCE IS MINUTE, SO ANY ONE PASS SORTS ALMOST NOTHING.</text>
    <text x="98" y="504" fill="#DCEBFA" font-size="9.5" stroke="none">REAL SEPARATION IS LARGE, COMPLEX, AND VERY ENERGY-HUNGRY.</text>
    <text x="98" y="520" fill="#6FC3FF" font-size="9.5" stroke="none">THAT DIFFICULTY HAS BEEN A PROLIFERATION BARRIER FOR 80 YEARS.</text>
  </g>

  <!-- ======== LEGITIMATE DEMAND INSET ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.2">
    <rect x="900" y="200" width="440" height="190" fill="#0E3357" stroke="#6FC3FF"/>
    <text x="918" y="226" fill="#6FC3FF" font-size="12" letter-spacing="1" stroke="none">FIG. B — THE PEACEFUL DEMAND</text>
    <line x1="918" y1="236" x2="1322" y2="236" stroke="#6FC3FF" stroke-width="0.7"/>
    <g fill="#DCEBFA" font-size="9" stroke="none">
      <text x="918" y="258">HELIUM-3   — fusion research; solar-wind implanted</text>
      <text x="990" y="274" fill="#6FC3FF">in lunar regolith, rare on Earth</text>
      <text x="918" y="296">DEUTERIUM  — fusion research, tracers; from local water</text>
      <text x="918" y="318">STABLE ISOTOPES — medicine, biology, environmental science</text>
      <text x="918" y="340">PURIFIED MATERIALS — electronics, detectors</text>
    </g>
    <text x="918" y="368" fill="#6FC3FF" font-size="9" stroke="none">SMALL IN QUANTITY · HIGH IN VALUE · A LATE ACQUISITION</text>
  </g>

  <!-- ======== GOVERNANCE PANEL (occupies the DETAIL A position) ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.4">
    <rect x="900" y="420" width="440" height="330" fill="#0E3357" stroke="#6FC3FF" stroke-width="2"/>
    <text x="918" y="450" fill="#6FC3FF" font-size="13" letter-spacing="1" font-weight="bold" stroke="none">THE GOVERNANCE PROBLEM</text>
    <text x="918" y="466" fill="#DCEBFA" font-size="8.5" stroke="none">(this panel replaces the technical detail that would normally sit here)</text>
    <line x1="918" y1="478" x2="1322" y2="478" stroke="#6FC3FF" stroke-width="0.7"/>

    <text x="918" y="502" fill="#DCEBFA" font-size="9.5" stroke="none">ON EARTH THIS CAPABILITY IS WATCHED:</text>
    <g fill="#6FC3FF" font-size="9" stroke="none">
      <text x="930" y="520">· NON-PROLIFERATION TREATY</text>
      <text x="930" y="536">· IAEA SAFEGUARDS + INSPECTION</text>
      <text x="930" y="552">· MATERIAL ACCOUNTING, EXPORT CONTROL</text>
      <text x="930" y="568">· LARGE PLANTS ARE SIMPLY VISIBLE</text>
    </g>

    <text x="918" y="596" fill="#DCEBFA" font-size="9.5" stroke="none">OFF EARTH, NONE OF IT IS TESTED:</text>
    <g fill="#6FC3FF" font-size="9" stroke="none">
      <text x="930" y="614">· OUTER SPACE TREATY (1967) BARS WEAPONS</text>
      <text x="930" y="630">  — BUT HAS NO SAFEGUARDS MECHANISM</text>
      <text x="930" y="646">· NO MATERIAL ACCOUNTING REGIME</text>
      <text x="930" y="662">· NO RESIDENT INSPECTOR, NO PROTOCOL</text>
      <text x="930" y="678">· WHO VERIFIES A PRIVATE OPERATOR?</text>
    </g>

    <line x1="918" y1="694" x2="1322" y2="694" stroke="#16406B" stroke-width="0.7"/>
    <text x="918" y="716" fill="#DCEBFA" font-size="9.5" stroke="none">THE INSTITUTIONS MUST COME FIRST.</text>
    <text x="918" y="736" fill="#6FC3FF" font-size="9.5" stroke="none">LIMITING FACTOR: NOT PHYSICS — TRUST.</text>
  </g>

  <!-- ======== DIFFICULTIES PANEL ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.4">
    <rect x="80" y="556" width="770" height="140" rx="4" fill="#0E3357"/>
    <rect x="80" y="556" width="770" height="140" rx="4"/>
    <text x="98" y="580" fill="#6FC3FF" font-size="11" letter-spacing="1" stroke="none">! HONEST DIFFICULTIES (SETTING GOVERNANCE ASIDE)</text>
    <line x1="98" y1="588" x2="832" y2="588" stroke="#6FC3FF" stroke-width="0.7"/>
    <g fill="#DCEBFA" font-size="9.5" stroke="none">
      <text x="98" y="610">· ENERGY IS THE DOMINANT COST — A LUXURY WHERE KILN AND REFINERY COMPETE FOR WATTS</text>
      <text x="98" y="632">· HELIUM-3 IN REGOLITH IS RICH BY EARTH STANDARDS BUT TINY IN ABSOLUTE TERMS:</text>
      <text x="118" y="650" fill="#6FC3FF">ENORMOUS SOIL VOLUMES FOR MEANINGFUL YIELD — ECONOMICS LONG CONTESTED</text>
      <text x="98" y="672">· THE FUSION TECHNOLOGY THAT WOULD CONSUME IT DOES NOT YET EXIST</text>
    </g>
    <text x="98" y="690" fill="#6FC3FF" font-size="9.5" stroke="none">A MACHINE FOR A MATURE SETTLEMENT WITH SURPLUS POWER — NOT FOR A FRONTIER.</text>
  </g>

  <text x="1350" y="782" fill="#6FC3FF" font-size="11" text-anchor="end" letter-spacing="1">DESIGNED BY: W.A. SANDUN PRIYANKARA WIJERATHNE · sandunwijerathne51@gmail.com · github.com/sandunwijerathne</text>

  <!-- ======== PARTS/PRINCIPLE INDEX ======== -->
  <g font-size="11.5" fill="#DCEBFA">
    <rect x="50" y="820" width="640" height="138" fill="#0E3357" stroke="#6FC3FF" stroke-width="1"/>
    <text x="66" y="844" fill="#6FC3FF" font-size="12.5" letter-spacing="2" font-weight="bold">PRINCIPLE INDEX (NO PARTS LIST — BY INTENT)</text>
    <line x1="66" y1="852" x2="674" y2="852" stroke="#6FC3FF" stroke-width="0.7"/>
    <text x="66" y="874">A — ISOTOPES: same element, same chemistry, different mass</text>
    <text x="66" y="894">B — MASS-DEPENDENT PATH: charged atoms curve by mass in a field</text>
    <text x="66" y="914">C — SPEED / DENSITY EFFECTS: heavier atoms move and settle differently</text>
    <text x="66" y="934">D — SINGLE-PASS GAIN IS TINY: this is why such plants are hard to build</text>
    <text x="66" y="952" font-size="10" fill="#6FC3FF">E — NO CASCADE, LAYOUT, OR PARAMETERS ARE GIVEN ANYWHERE ON THIS SHEET</text>
  </g>

  <!-- ======== TITLE BLOCK ======== -->
  <g font-size="11.5" fill="#DCEBFA">
    <rect x="710" y="820" width="640" height="138" fill="#0E3357" stroke="#DCEBFA" stroke-width="1.5"/>
    <line x1="710" y1="852" x2="1350" y2="852" stroke="#DCEBFA"/>
    <line x1="710" y1="884" x2="1350" y2="884" stroke="#DCEBFA"/>
    <line x1="710" y1="916" x2="1350" y2="916" stroke="#DCEBFA"/>
    <line x1="1040" y1="820" x2="1040" y2="958" stroke="#DCEBFA"/>
    <text x="726" y="838" fill="#6FC3FF" letter-spacing="1">PROJECT</text>
    <text x="726" y="848" font-size="10.5" font-weight="bold">OFF-WORLD TOOLKIT · VOLUME II</text>
    <text x="1056" y="838" fill="#6FC3FF">DRAWING NO.</text>
    <text x="1056" y="848" font-size="10.5" font-weight="bold">IS-1-PR-001 · REV A</text>
    <text x="726" y="868" fill="#6FC3FF">UNIT DESIGNATION</text>
    <text x="726" y="878" font-weight="bold" font-size="9.5">IS-1 "ASTON" — PRINCIPLE SHEET ONLY</text>
    <text x="1056" y="868" fill="#6FC3FF">SORTS BY</text>
    <text x="1056" y="878" font-weight="bold" font-size="10">MASS ALONE (CHEMISTRY CANNOT)</text>
    <text x="726" y="900" fill="#6FC3FF">SCOPE</text>
    <text x="726" y="910" font-weight="bold" font-size="9.5">CONCEPTUAL · DUAL-USE · NO ENGINEERING</text>
    <text x="1056" y="900" fill="#6FC3FF">GOVERNED BY</text>
    <text x="1056" y="910" font-weight="bold" font-size="9.5">NPT · IAEA ON EARTH — NOTHING TESTED OFF IT</text>
    <text x="726" y="932" fill="#6FC3FF">FUNCTION</text>
    <text x="726" y="942" font-weight="bold" font-size="9">SEPARATES ISOTOPES FOR FUSION + SCIENCE</text>
    <text x="1056" y="932" fill="#6FC3FF">PREREQUISITE</text>
    <text x="1056" y="942" font-weight="bold" font-size="9.5">SAFEGUARDS, BUILT BEFORE THE PLANT</text>
    <text x="726" y="954" fill="#6FC3FF" font-size="9">STATUS</text>
    <text x="800" y="954" font-weight="bold" font-size="9">CONCEPT — INSTITUTIONS PENDING</text>
  </g>
</svg>
