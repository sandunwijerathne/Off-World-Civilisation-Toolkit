<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#16406B" stroke-width="0.6"/>
    </pattern>
    <pattern id="gridMajor" width="125" height="125" patternUnits="userSpaceOnUse">
      <rect width="125" height="125" fill="url(#grid)"/>
      <path d="M 125 0 L 0 0 0 125" fill="none" stroke="#1E5288" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6FC3FF"/>
    </marker>
    <marker id="dim" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M1,1 L9,9 M5,0 L5,10" stroke="#DCEBFA" stroke-width="1" fill="none"/>
    </marker>
  </defs>

  <rect width="1400" height="1000" fill="#0B2A4A"/>
  <rect width="1400" height="1000" fill="url(#gridMajor)"/>
  <rect x="20" y="20" width="1360" height="960" fill="none" stroke="#DCEBFA" stroke-width="2"/>
  <rect x="28" y="28" width="1344" height="944" fill="none" stroke="#DCEBFA" stroke-width="0.8"/>

  <text x="50" y="70" fill="#DCEBFA" font-size="27" letter-spacing="2" font-weight="bold">DEBRIS BROOM — DB-1 "SWEEPER"</text>
  <text x="50" y="96" fill="#6FC3FF" font-size="14" letter-spacing="2">DIRECTED-ENERGY DEBRIS REMOVAL · SYSTEM SCHEMATIC · ABLATION DETAIL · SHEET 1 OF 5</text>
  <line x1="50" y1="110" x2="1350" y2="110" stroke="#6FC3FF" stroke-width="1"/>

  <!-- ======== MAIN SCHEMATIC ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="2">
    <!-- Earth surface arc (bottom) -->
    <path d="M 80 720 Q 500 660 920 720" stroke-width="1.4"/>
    <g stroke-width="0.6">
      <line x1="200" y1="700" x2="190" y2="712"/><line x1="300" y1="690" x2="290" y2="702"/>
      <line x1="500" y1="684" x2="490" y2="696"/><line x1="700" y1="690" x2="690" y2="702"/>
    </g>
    <text x="500" y="748" fill="#6FC3FF" font-size="10" text-anchor="middle" stroke="none">EARTH SURFACE</text>

    <!-- ground station: telescope + laser -->
    <g stroke-width="2">
      <path d="M 470 690 l 40 0 l -6 -40 l -28 0 z"/>
      <rect x="482" y="628" width="16" height="24"/>
      <circle cx="490" cy="628" r="10"/>
    </g>
    <text x="490" y="712" fill="#6FC3FF" font-size="9" text-anchor="middle" stroke="none">LASER + TELESCOPE</text>
    <!-- adaptive optics note -->
    <text x="360" y="640" fill="#6FC3FF" font-size="8.5" stroke="none">ADAPTIVE OPTICS</text>

    <!-- debris orbit (dashed arc across top) -->
    <path d="M 140 300 Q 620 180 1120 320" stroke-width="1" stroke-dasharray="8 6"/>
    <text x="200" y="270" fill="#6FC3FF" font-size="9" stroke="none">DEBRIS ORBIT (8 km/s)</text>

    <!-- debris fragments (small irregular dots) -->
    <g fill="#DCEBFA">
      <circle cx="380" cy="250" r="4"/><circle cx="560" cy="222" r="5"/>
      <circle cx="740" cy="228" r="4"/><circle cx="900" cy="262" r="4"/>
    </g>

    <!-- laser beam up to target fragment -->
    <line x1="490" y1="618" x2="560" y2="232" stroke="#6FC3FF" stroke-width="2"/>
    <g stroke="#6FC3FF" stroke-width="0.7">
      <path d="M 500 560 l 12 -3 M 508 500 l 12 -3 M 516 440 l 12 -3 M 524 380 l 12 -3"/>
    </g>
    <text x="560" y="420" fill="#6FC3FF" font-size="9" stroke="none">PULSED BEAM</text>

    <!-- target fragment highlighted + ablation puff -->
    <circle cx="560" cy="222" r="9" stroke="#6FC3FF" stroke-width="1.4" fill="none"/>
    <g stroke="#DCEBFA" stroke-width="0.8">
      <path d="M 560 213 l -6 -12 M 560 213 l 0 -14 M 560 213 l 6 -12"/>
    </g>
    <!-- recoil arrow lowering orbit -->
    <path d="M 568 230 l 26 18" stroke="#6FC3FF" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="600" y="256" fill="#6FC3FF" font-size="9" stroke="none">RECOIL LOWERS PERIGEE</text>

    <!-- deorbit spiral down to atmosphere -->
    <path d="M 590 260 Q 700 400 780 620" stroke="#DCEBFA" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
    <text x="790" y="600" fill="#6FC3FF" font-size="9" stroke="none">RE-ENTRY + BURN-UP</text>
    <!-- burn-up flame -->
    <path d="M 780 620 q -6 14 0 24 q 6 -10 0 -24" stroke="#6FC3FF" stroke-width="1"/>
  </g>

  <!-- ======== SPACE-BASED VARIANT INSET (top right) ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.2">
    <rect x="1000" y="140" width="340" height="240" fill="#0E3357" stroke="#6FC3FF"/>
    <text x="1016" y="164" fill="#6FC3FF" font-size="12" letter-spacing="1" stroke="none">FIG. B — SPACE-BASED SWEEPER</text>
    <!-- orbital laser sat -->
    <rect x="1050" y="240" width="50" height="34" rx="4"/>
    <rect x="1024" y="248" width="22" height="18"/>
    <rect x="1104" y="248" width="22" height="18"/>
    <path d="M 1100 257 l 60 -20" stroke="#6FC3FF" stroke-width="1.6"/>
    <circle cx="1170" cy="232" r="6" stroke="#6FC3FF"/>
    <path d="M 1176 228 l 16 -8" stroke="#6FC3FF" stroke-width="1.2" marker-end="url(#arrow)"/>
    <g fill="#DCEBFA" font-size="8.5" stroke="none">
      <text x="1075" y="300" text-anchor="middle">ORBITAL LASER</text>
      <text x="1200" y="220">FRAGMENT</text>
    </g>
    <text x="1016" y="336" fill="#6FC3FF" font-size="9" stroke="none">NO ATMOSPHERE: CLOSER, DIRECT ENGAGE</text>
    <text x="1016" y="358" fill="#DCEBFA" font-size="8.5" stroke="none">BUT MUST CARRY POWER + COOLING</text>
  </g>

  <!-- ======== DETAIL A: ablation physics ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.4">
    <circle cx="1150" cy="600" r="90" stroke="#6FC3FF"/>
    <!-- fragment chunk -->
    <path d="M 1120 620 q 20 -30 60 -10 q 20 20 -6 40 q -40 16 -60 -6 q -8 -12 6 -24 z"/>
    <!-- incoming pulse -->
    <line x1="1090" y1="540" x2="1135" y2="600" stroke="#6FC3FF" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="1070" y="536" fill="#DCEBFA" font-size="8.5" stroke="none">PULSE</text>
    <!-- ablation plume -->
    <g stroke="#6FC3FF" stroke-width="1">
      <path d="M 1135 600 l -18 -14 M 1135 600 l -22 -6 M 1135 600 l -16 -20"/>
    </g>
    <text x="1090" y="600" fill="#6FC3FF" font-size="7.5" stroke="none">PLASMA JET</text>
    <!-- recoil -->
    <path d="M 1150 610 l 30 22" stroke="#6FC3FF" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="1160" y="648" fill="#DCEBFA" font-size="8">THRUST</text>
    <text x="1150" y="712" fill="#6FC3FF" font-size="12" text-anchor="middle" stroke="none">DETAIL A — ABLATION = TINY ROCKET</text>
    <line x1="600" y1="240" x2="1064" y2="590" stroke="#6FC3FF" stroke-width="0.9" stroke-dasharray="5 4"/>
  </g>

  <!-- ======== CALLOUTS ======== -->
  <g stroke="#6FC3FF" stroke-width="1" fill="none">
    <line x1="490" y1="690" x2="360" y2="790" marker-start="url(#arrow)"/>
    <line x1="530" y1="420" x2="470" y2="790" marker-start="url(#arrow)"/>
    <line x1="560" y1="213" x2="620" y2="790" marker-start="url(#arrow)"/>
    <line x1="590" y1="248" x2="760" y2="790" marker-start="url(#arrow)"/>
    <line x1="780" y1="632" x2="900" y2="790" marker-start="url(#arrow)"/>
  </g>
  <g fill="#DCEBFA" font-size="13">
    <g><circle cx="360" cy="802" r="12" fill="none" stroke="#6FC3FF"/><text x="360" y="807" text-anchor="middle">1</text></g>
    <g><circle cx="470" cy="802" r="12" fill="none" stroke="#6FC3FF"/><text x="470" y="807" text-anchor="middle">2</text></g>
    <g><circle cx="620" cy="802" r="12" fill="none" stroke="#6FC3FF"/><text x="620" y="807" text-anchor="middle">3</text></g>
    <g><circle cx="760" cy="802" r="12" fill="none" stroke="#6FC3FF"/><text x="760" y="807" text-anchor="middle">4</text></g>
    <g><circle cx="900" cy="802" r="12" fill="none" stroke="#6FC3FF"/><text x="900" y="807" text-anchor="middle">5</text></g>
  </g>

  <!-- ======== PARTS LIST ======== -->
  <g font-size="13" fill="#DCEBFA">
    <rect x="50" y="822" width="620" height="134" fill="#0E3357" stroke="#6FC3FF" stroke-width="1"/>
    <text x="66" y="847" fill="#6FC3FF" font-size="14" letter-spacing="2" font-weight="bold">PARTS &amp; SYSTEMS INDEX</text>
    <line x1="66" y1="856" x2="654" y2="856" stroke="#6FC3FF" stroke-width="0.7"/>
    <text x="66" y="876">1 — GROUND STATION: pulsed laser + tracking telescope + adaptive optics</text>
    <text x="66" y="896">2 — PULSED BEAM: fired through atmosphere at a catalogued fragment</text>
    <text x="66" y="916">3 — TARGET FRAGMENT: ablated (not shattered), see DETAIL A</text>
    <text x="66" y="936">4 — RECOIL: lowers perigee pass by pass until atmospheric drag wins</text>
    <text x="66" y="951" font-size="10.5" fill="#6FC3FF">5 — RE-ENTRY: fragment burns up harmlessly · DUAL-USE: govern openly</text>
  </g>

  <text x="1350" y="812" fill="#6FC3FF" font-size="11" text-anchor="end" letter-spacing="1">DESIGNED BY: W.A. SANDUN PRIYANKARA WIJERATHNE · sandunwijerathne51@gmail.com · github.com/sandunwijerathne</text>

  <!-- ======== TITLE BLOCK ======== -->
  <g font-size="12" fill="#DCEBFA">
    <rect x="700" y="822" width="650" height="134" fill="#0E3357" stroke="#DCEBFA" stroke-width="1.5"/>
    <line x1="700" y1="856" x2="1350" y2="856" stroke="#DCEBFA"/>
    <line x1="700" y1="890" x2="1350" y2="890" stroke="#DCEBFA"/>
    <line x1="700" y1="924" x2="1350" y2="924" stroke="#DCEBFA"/>
    <line x1="1030" y1="822" x2="1030" y2="956" stroke="#DCEBFA"/>
    <text x="716" y="842" fill="#6FC3FF" letter-spacing="1">PROJECT</text>
    <text x="716" y="852" font-size="12" font-weight="bold">OFF-WORLD CIVILISATION TOOLKIT</text>
    <text x="1046" y="842" fill="#6FC3FF">DRAWING NO.</text>
    <text x="1046" y="852" font-size="12" font-weight="bold">DB-1-GA-001 · REV A</text>
    <text x="716" y="876" fill="#6FC3FF">UNIT DESIGNATION</text>
    <text x="716" y="886" font-weight="bold" font-size="11">DB-1 "SWEEPER" — GENERAL ARRANGEMENT</text>
    <text x="1046" y="876" fill="#6FC3FF">METHOD</text>
    <text x="1046" y="886" font-weight="bold" font-size="11">LASER ABLATION</text>
    <text x="716" y="910" fill="#6FC3FF">DEPLOYMENT</text>
    <text x="716" y="920" font-weight="bold" font-size="11">GROUND + ORBITAL, LEO CLEAN-UP</text>
    <text x="1046" y="910" fill="#6FC3FF">STUDIED BY</text>
    <text x="1046" y="920" font-weight="bold" font-size="11">JAXA / ESA / LABS</text>
    <text x="716" y="944" fill="#6FC3FF">FUNCTION</text>
    <text x="716" y="954" font-weight="bold" font-size="11">DEORBITS SMALL DEBRIS WITH LIGHT, NO CONTACT</text>
    <text x="1046" y="944" fill="#6FC3FF">STATUS</text>
    <text x="1046" y="954" font-weight="bold" font-size="10">CONCEPT — NEAR-TERM, DUAL-USE</text>
  </g>
</svg>
