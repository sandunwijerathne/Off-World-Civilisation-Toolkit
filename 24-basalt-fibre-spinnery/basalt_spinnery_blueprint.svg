<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#16406B" stroke-width="0.6"/>
    </pattern>
    <pattern id="gridMajor" width="125" height="125" patternUnits="userSpaceOnUse">
      <rect width="125" height="125" fill="url(#grid)"/>
      <path d="M 125 0 L 0 0 0 125" fill="none" stroke="#1E5288" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6FC3FF"/>
    </marker>
    <marker id="dim" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M1,1 L9,9 M5,0 L5,10" stroke="#DCEBFA" stroke-width="1" fill="none"/>
    </marker>
  </defs>

  <rect width="1400" height="1000" fill="#0B2A4A"/>
  <rect width="1400" height="1000" fill="url(#gridMajor)"/>
  <rect x="20" y="20" width="1360" height="960" fill="none" stroke="#DCEBFA" stroke-width="2"/>
  <rect x="28" y="28" width="1344" height="944" fill="none" stroke="#DCEBFA" stroke-width="0.8"/>

  <text x="50" y="70" fill="#DCEBFA" font-size="27" letter-spacing="2" font-weight="bold">BASALT FIBRE SPINNERY — BF-1 "ARACHNE"</text>
  <text x="50" y="96" fill="#6FC3FF" font-size="14" letter-spacing="2">MELT-AND-DRAW FIBRE LINE · PROCESS FLOW · DRAW-HEAD DETAIL · VOLUME II · SHEET 1 OF 5</text>
  <line x1="50" y1="110" x2="1350" y2="110" stroke="#6FC3FF" stroke-width="1"/>

  <!-- ======== PROCESS FLOW (left to right) ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="2">
    <!-- 1. feedstock hopper -->
    <path d="M 110 260 h 90 l -18 60 h -54 z"/>
    <g fill="#DCEBFA"><circle cx="140" cy="278" r="3"/><circle cx="158" cy="284" r="3"/><circle cx="172" cy="276" r="3"/><circle cx="150" cy="296" r="3"/><circle cx="166" cy="298" r="3"/></g>
    <text x="155" y="248" fill="#6FC3FF" font-size="10" text-anchor="middle" stroke="none">BASALT FEED</text>
    <text x="155" y="336" fill="#DCEBFA" font-size="8.5" text-anchor="middle" stroke="none">ROCK ONLY, NO ADDITIVES</text>
    <path d="M 155 320 l 0 40" stroke="#6FC3FF" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- 2. melting furnace -->
    <rect x="110" y="370" width="150" height="120" rx="6"/>
    <path d="M 130 470 q 25 -30 50 0 q 25 30 50 0" stroke="#6FC3FF" stroke-width="1.4"/>
    <path d="M 130 450 q 25 -30 50 0 q 25 30 50 0" stroke="#6FC3FF" stroke-width="1"/>
    <!-- heating coil marks -->
    <g stroke="#6FC3FF" stroke-width="0.7"><path d="M 122 390 h 12 M 122 404 h 12 M 122 418 h 12 M 236 390 h 12 M 236 404 h 12 M 236 418 h 12"/></g>
    <text x="185" y="360" fill="#6FC3FF" font-size="10" text-anchor="middle" stroke="none">MELTING FURNACE</text>
    <text x="185" y="512" fill="#DCEBFA" font-size="8.5" text-anchor="middle" stroke="none">MELT HELD AT STEADY TEMP</text>

    <!-- flow to draw head -->
    <path d="M 260 460 h 90 l 0 -40" stroke="#6FC3FF" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="300" y="452" fill="#6FC3FF" font-size="8.5" stroke="none">MOLTEN BASALT</text>

    <!-- 3. draw head with bushing plate -->
    <rect x="330" y="380" width="120" height="46" rx="4"/>
    <text x="390" y="372" fill="#6FC3FF" font-size="10" text-anchor="middle" stroke="none">DRAW HEAD (BUSHING PLATE)</text>
    <!-- fine holes -->
    <g stroke-width="1"><line x1="346" y1="426" x2="346" y2="470"/><line x1="362" y1="426" x2="362" y2="470"/><line x1="378" y1="426" x2="378" y2="470"/><line x1="394" y1="426" x2="394" y2="470"/><line x1="410" y1="426" x2="410" y2="470"/><line x1="426" y1="426" x2="426" y2="470"/></g>
    <text x="470" y="450" fill="#DCEBFA" font-size="8.5" stroke="none">FILAMENTS DRAWN + COOLED</text>

    <!-- filaments converge to strand -->
    <path d="M 346 470 q 20 30 44 40 M 362 470 q 16 26 28 40 M 378 470 q 8 22 12 40 M 394 470 q -6 22 -4 40 M 410 470 q -14 26 -24 40 M 426 470 q -24 30 -44 40" stroke-width="0.8"/>
    <circle cx="388" cy="516" r="4" fill="#DCEBFA"/>
    <text x="388" y="540" fill="#6FC3FF" font-size="8.5" text-anchor="middle" stroke="none">GATHERED STRAND</text>

    <!-- 4. winder spool -->
    <path d="M 388 516 h 120" stroke="#6FC3FF" stroke-width="1.2" marker-end="url(#arrow)"/>
    <circle cx="560" cy="516" r="44"/>
    <circle cx="560" cy="516" r="30" stroke-width="1"/>
    <circle cx="560" cy="516" r="16" stroke-width="0.8"/>
    <text x="560" y="580" fill="#6FC3FF" font-size="10" text-anchor="middle" stroke="none">WINDER → CONTINUOUS FIBRE</text>
  </g>

  <!-- ======== PRODUCTS FAN (lower centre) ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.4">
    <path d="M 604 516 h 60" stroke="#6FC3FF" stroke-width="1" marker-end="url(#arrow)"/>
    <text x="680" y="470" fill="#6FC3FF" font-size="10" stroke="none">PRODUCTS</text>
    <!-- cable -->
    <path d="M 670 500 q 30 -8 60 0" stroke-width="1.6"/>
    <text x="736" y="500" fill="#DCEBFA" font-size="9" stroke="none">CABLE / CORDAGE</text>
    <!-- chopped rebar -->
    <g stroke-width="1.4"><line x1="672" y1="524" x2="692" y2="524"/><line x1="700" y1="524" x2="720" y2="524"/><line x1="728" y1="524" x2="748" y2="524"/></g>
    <text x="756" y="528" fill="#DCEBFA" font-size="9" stroke="none">CHOPPED → REBAR</text>
    <!-- woven -->
    <g stroke-width="0.9"><path d="M 672 548 h 60 M 672 556 h 60 M 678 544 v18 M 690 544 v18 M 702 544 v18 M 714 544 v18 M 726 544 v18"/></g>
    <text x="756" y="556" fill="#DCEBFA" font-size="9" stroke="none">WOVEN CLOTH</text>
  </g>

  <!-- ======== DRAW-HEAD DETAIL A (right) ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.4">
    <circle cx="1120" cy="330" r="92" stroke="#6FC3FF"/>
    <!-- melt reservoir above plate -->
    <path d="M 1064 292 h 112 v 20 h -112 z" fill="#0E3357"/>
    <text x="1120" y="286" fill="#DCEBFA" font-size="8" text-anchor="middle" stroke="none">MOLTEN BASALT</text>
    <!-- bushing plate with holes -->
    <rect x="1064" y="312" width="112" height="12"/>
    <g stroke-width="1"><line x1="1078" y1="324" x2="1078" y2="360"/><line x1="1098" y1="324" x2="1098" y2="360"/><line x1="1118" y1="324" x2="1118" y2="360"/><line x1="1138" y1="324" x2="1138" y2="360"/><line x1="1158" y1="324" x2="1158" y2="360"/></g>
    <text x="1194" y="322" fill="#6FC3FF" font-size="8" stroke="none">HOT PLATE,</text>
    <text x="1194" y="334" fill="#6FC3FF" font-size="8" stroke="none">FINE HOLES</text>
    <!-- filaments cooling -->
    <g stroke="#6FC3FF" stroke-width="0.6"><path d="M 1078 360 l -2 20 M 1098 360 l -1 20 M 1118 360 l 0 20 M 1138 360 l 1 20 M 1158 360 l 2 20"/></g>
    <text x="1120" y="396" fill="#DCEBFA" font-size="8" text-anchor="middle" stroke="none">COOL → SOLID FIBRE</text>
    <text x="1120" y="444" fill="#6FC3FF" font-size="12" text-anchor="middle" stroke="none">DETAIL A — DRAW HEAD</text>
    <line x1="450" y1="400" x2="1030" y2="352" stroke="#6FC3FF" stroke-width="0.9" stroke-dasharray="5 4"/>
  </g>

  <!-- ======== COMPRESSION+TENSION PAIRING INSET ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.2">
    <rect x="980" y="500" width="360" height="200" fill="#0E3357" stroke="#6FC3FF"/>
    <text x="998" y="526" fill="#6FC3FF" font-size="12" letter-spacing="1" stroke="none">FIG. B — COMPLETES THE PALETTE</text>
    <line x1="998" y1="536" x2="1322" y2="536" stroke="#6FC3FF" stroke-width="0.7"/>
    <!-- ceramic arch -->
    <path d="M 1010 630 A 46 46 0 0 1 1102 630" stroke-width="2"/>
    <line x1="1010" y1="630" x2="1102" y2="630" stroke-width="0.7"/>
    <text x="1056" y="650" fill="#DCEBFA" font-size="8" text-anchor="middle" stroke="none">SINTERED / CAST</text>
    <text x="1056" y="662" fill="#6FC3FF" font-size="8" text-anchor="middle" stroke="none">COMPRESSION ✓</text>
    <text x="1056" y="674" fill="#DCEBFA" font-size="8" text-anchor="middle" stroke="none">TENSION ✗</text>
    <!-- plus -->
    <text x="1140" y="622" fill="#DCEBFA" font-size="18" text-anchor="middle" stroke="none">+</text>
    <!-- fibre -->
    <path d="M 1170 600 q 30 -6 60 0 q -30 12 -60 0" stroke-width="1.6"/>
    <text x="1200" y="650" fill="#DCEBFA" font-size="8" text-anchor="middle" stroke="none">BASALT FIBRE</text>
    <text x="1200" y="662" fill="#6FC3FF" font-size="8" text-anchor="middle" stroke="none">TENSION ✓</text>
    <text x="998" y="692" fill="#6FC3FF" font-size="9" stroke="none">= REINFORCED STRUCTURES, ALL FROM LOCAL ROCK</text>
  </g>

  <!-- ======== CALLOUTS ======== -->
  <g stroke="#6FC3FF" stroke-width="1" fill="none">
    <line x1="155" y1="300" x2="180" y2="800" marker-start="url(#arrow)"/>
    <line x1="185" y1="430" x2="340" y2="800" marker-start="url(#arrow)"/>
    <line x1="390" y1="426" x2="500" y2="800" marker-start="url(#arrow)"/>
    <line x1="388" y1="516" x2="640" y2="800" marker-start="url(#arrow)"/>
    <line x1="700" y1="524" x2="790" y2="800" marker-start="url(#arrow)"/>
  </g>
  <g fill="#DCEBFA" font-size="13">
    <g><circle cx="180" cy="812" r="12" fill="none" stroke="#6FC3FF"/><text x="180" y="817" text-anchor="middle">1</text></g>
    <g><circle cx="340" cy="812" r="12" fill="none" stroke="#6FC3FF"/><text x="340" y="817" text-anchor="middle">2</text></g>
    <g><circle cx="500" cy="812" r="12" fill="none" stroke="#6FC3FF"/><text x="500" y="817" text-anchor="middle">3</text></g>
    <g><circle cx="640" cy="812" r="12" fill="none" stroke="#6FC3FF"/><text x="640" y="817" text-anchor="middle">4</text></g>
    <g><circle cx="790" cy="812" r="12" fill="none" stroke="#6FC3FF"/><text x="790" y="817" text-anchor="middle">5</text></g>
  </g>

  <!-- ======== PARTS LIST ======== -->
  <g font-size="12.5" fill="#DCEBFA">
    <rect x="50" y="832" width="640" height="124" fill="#0E3357" stroke="#6FC3FF" stroke-width="1"/>
    <text x="66" y="856" fill="#6FC3FF" font-size="13" letter-spacing="2" font-weight="bold">PARTS &amp; SYSTEMS INDEX</text>
    <line x1="66" y1="865" x2="674" y2="865" stroke="#6FC3FF" stroke-width="0.7"/>
    <text x="66" y="885">1 — BASALT FEED: local rock, single feedstock, no additives</text>
    <text x="66" y="905">2 — MELTING FURNACE: melts + holds basalt at steady temperature</text>
    <text x="66" y="925">3 — DRAW HEAD: melt flows through fine holes → filaments (DETAIL A)</text>
    <text x="66" y="941" font-size="10.5" fill="#6FC3FF">4 — WINDER → CONTINUOUS FIBRE · 5 — PRODUCTS: cable, rebar, cloth, composite</text>
  </g>

  <text x="1350" y="812" fill="#6FC3FF" font-size="11" text-anchor="end" letter-spacing="1">DESIGNED BY: W.A. SANDUN PRIYANKARA WIJERATHNE · sandunwijerathne51@gmail.com · github.com/sandunwijerathne</text>

  <!-- ======== TITLE BLOCK ======== -->
  <g font-size="12" fill="#DCEBFA">
    <rect x="710" y="832" width="640" height="124" fill="#0E3357" stroke="#DCEBFA" stroke-width="1.5"/>
    <line x1="710" y1="866" x2="1350" y2="866" stroke="#DCEBFA"/>
    <line x1="710" y1="900" x2="1350" y2="900" stroke="#DCEBFA"/>
    <line x1="710" y1="934" x2="1350" y2="934" stroke="#DCEBFA"/>
    <line x1="1040" y1="832" x2="1040" y2="956" stroke="#DCEBFA"/>
    <text x="726" y="852" fill="#6FC3FF" letter-spacing="1">PROJECT</text>
    <text x="726" y="862" font-size="11" font-weight="bold">OFF-WORLD TOOLKIT · VOLUME II</text>
    <text x="1056" y="852" fill="#6FC3FF">DRAWING NO.</text>
    <text x="1056" y="862" font-size="11" font-weight="bold">BF-1-GA-001 · REV A</text>
    <text x="726" y="886" fill="#6FC3FF">UNIT DESIGNATION</text>
    <text x="726" y="896" font-weight="bold" font-size="10.5">BF-1 "ARACHNE" — GENERAL ARRANGEMENT</text>
    <text x="1056" y="886" fill="#6FC3FF">FEEDSTOCK</text>
    <text x="1056" y="896" font-weight="bold" font-size="11">BASALT ONLY (SINGLE INPUT)</text>
    <text x="726" y="920" fill="#6FC3FF">PROCESS</text>
    <text x="726" y="930" font-weight="bold" font-size="10.5">MELT + DRAW (INDUSTRIAL ON EARTH)</text>
    <text x="1056" y="920" fill="#6FC3FF">PROVIDES</text>
    <text x="1056" y="930" font-weight="bold" font-size="11">TENSION-BEARING MATERIAL</text>
    <text x="726" y="944" fill="#6FC3FF">FUNCTION</text>
    <text x="726" y="954" font-weight="bold" font-size="10.5">STEEL-MILL EQUIVALENT FROM MELTED ROCK</text>
    <text x="1056" y="944" fill="#6FC3FF">STATUS</text>
    <text x="1056" y="954" font-weight="bold" font-size="10">CONCEPT — MATERIAL ALREADY COMMERCIAL</text>
  </g>
</svg>
