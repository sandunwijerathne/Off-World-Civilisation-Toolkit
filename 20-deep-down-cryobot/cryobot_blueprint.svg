<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#16406B" stroke-width="0.6"/>
    </pattern>
    <pattern id="gridMajor" width="125" height="125" patternUnits="userSpaceOnUse">
      <rect width="125" height="125" fill="url(#grid)"/>
      <path d="M 125 0 L 0 0 0 125" fill="none" stroke="#1E5288" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6FC3FF"/>
    </marker>
    <marker id="dim" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M1,1 L9,9 M5,0 L5,10" stroke="#DCEBFA" stroke-width="1" fill="none"/>
    </marker>
  </defs>

  <rect width="1400" height="1000" fill="#0B2A4A"/>
  <rect width="1400" height="1000" fill="url(#gridMajor)"/>
  <rect x="20" y="20" width="1360" height="960" fill="none" stroke="#DCEBFA" stroke-width="2"/>
  <rect x="28" y="28" width="1344" height="944" fill="none" stroke="#DCEBFA" stroke-width="0.8"/>

  <text x="50" y="70" fill="#DCEBFA" font-size="28" letter-spacing="3" font-weight="bold">DEEP-DOWN CRYOBOT — CB-1</text>
  <text x="50" y="96" fill="#6FC3FF" font-size="14" letter-spacing="2">EUROPA MELTING PROBE · DESCENT SECTION · PROBE DETAIL · AUTONOMY LOOP · SHEET 1 OF 5</text>
  <line x1="50" y1="110" x2="1350" y2="110" stroke="#6FC3FF" stroke-width="1"/>

  <!-- ======== DESCENT SECTION (vertical, left-centre) ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="2">
    <!-- surface line -->
    <path d="M 120 220 h 620" stroke-width="2.5"/>
    <text x="130" y="208" fill="#6FC3FF" font-size="10" stroke="none">EUROPA SURFACE (VACUUM ABOVE)</text>
    <!-- surface lander + antenna -->
    <g stroke-width="2">
      <rect x="300" y="188" width="70" height="32" rx="4"/>
      <path d="M 312 188 l -8 -14 M 358 188 l 8 -14"/>
      <path d="M 335 188 l 0 -22"/>
      <path d="M 322 166 q 13 -14 26 0" stroke-width="1.4"/>
    </g>
    <text x="392" y="186" fill="#DCEBFA" font-size="9" stroke="none">SURFACE STATION → ORBITER → EARTH</text>
    <path d="M 348 158 l 40 -34" stroke="#6FC3FF" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

    <!-- ice shell block with texture -->
    <path d="M 120 220 v 420 h 620 v -420" stroke-width="0.9"/>
    <g stroke-width="0.5" stroke="#1E5288">
      <line x1="160" y1="230" x2="200" y2="270"/><line x1="240" y1="240" x2="290" y2="290"/>
      <line x1="420" y1="250" x2="460" y2="300"/><line x1="560" y1="235" x2="610" y2="285"/>
      <line x1="180" y1="380" x2="230" y2="430"/><line x1="470" y1="400" x2="520" y2="450"/>
      <line x1="620" y1="330" x2="660" y2="380"/><line x1="150" y1="520" x2="200" y2="570"/>
      <line x1="530" y1="540" x2="580" y2="590"/><line x1="640" y1="480" x2="690" y2="530"/>
    </g>
    <text x="620" y="300" fill="#6FC3FF" font-size="10" stroke="none">ICE SHELL (km-SCALE, THICKNESS UNCERTAIN)</text>

    <!-- brine pocket + void hazards -->
    <ellipse cx="240" cy="420" rx="34" ry="18" stroke="#6FC3FF" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="240" y="454" fill="#6FC3FF" font-size="8.5" text-anchor="middle" stroke="none">BRINE POCKET</text>
    <ellipse cx="600" cy="470" rx="26" ry="14" stroke="#6FC3FF" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="600" y="500" fill="#6FC3FF" font-size="8.5" text-anchor="middle" stroke="none">VOID</text>

    <!-- refrozen channel above probe -->
    <path d="M 328 220 v 250 M 348 220 v 250" stroke="#6FC3FF" stroke-width="1" stroke-dasharray="5 4"/>
    <g stroke="#6FC3FF" stroke-width="0.6">
      <path d="M 330 260 h16 M 330 300 h16 M 330 340 h16 M 330 380 h16 M 330 420 h16"/>
    </g>
    <text x="390" y="330" fill="#6FC3FF" font-size="9" stroke="none">CHANNEL REFREEZES BEHIND</text>

    <!-- relay pucks frozen in -->
    <g fill="#DCEBFA">
      <rect x="332" y="272" width="10" height="7"/>
      <rect x="332" y="352" width="10" height="7"/>
      <rect x="332" y="432" width="10" height="7"/>
    </g>
    <text x="200" y="352" fill="#DCEBFA" font-size="9" stroke="none">FROZEN-IN RELAYS</text>
    <path d="M 262 348 l 62 4" stroke="#6FC3FF" stroke-width="0.8" marker-end="url(#arrow)"/>

    <!-- the cryobot itself, descending -->
    <g stroke-width="2">
      <rect x="325" y="474" width="26" height="86" rx="4"/>
      <path d="M 325 560 q 13 26 26 0" />
      <path d="M 331 486 h14 M 331 500 h14" stroke-width="0.6"/>
    </g>
    <text x="240" y="530" fill="#DCEBFA" font-size="9" stroke="none">CRYOBOT (MELTING)</text>
    <!-- heat glow marks at nose -->
    <g stroke="#6FC3FF" stroke-width="1">
      <path d="M 320 572 l -10 10 M 338 580 l 0 12 M 356 572 l 10 10"/>
    </g>
    <text x="410" y="588" fill="#6FC3FF" font-size="9" stroke="none">HEATED NOSE MELTS ICE</text>
    <!-- meltwater below -->
    <path d="M 316 592 q 22 12 44 0" stroke="#6FC3FF" stroke-width="1.2"/>

    <!-- ocean below -->
    <path d="M 120 640 h 620" stroke-width="2.5"/>
    <g stroke="#6FC3FF" stroke-width="0.9">
      <path d="M 150 668 q 30 -12 60 0 q 30 12 60 0"/>
      <path d="M 330 690 q 30 -12 60 0 q 30 12 60 0"/>
      <path d="M 520 664 q 30 -12 60 0 q 30 12 60 0"/>
      <path d="M 200 712 q 30 -12 60 0 q 30 12 60 0"/>
    </g>
    <text x="140" y="662" fill="#6FC3FF" font-size="11" stroke="none">GLOBAL SALT-WATER OCEAN</text>
    <text x="470" y="726" fill="#DCEBFA" font-size="9" stroke="none">BREAKTHROUGH → SWIMS AS SUBMERSIBLE</text>
  </g>

  <!-- ======== DEPTH DIMENSION ======== -->
  <g stroke="#DCEBFA" stroke-width="1" fill="#DCEBFA">
    <line x1="96" y1="220" x2="96" y2="640" marker-start="url(#dim)" marker-end="url(#dim)"/>
    <text x="82" y="440" text-anchor="middle" font-size="11" transform="rotate(-90 82 440)">SHELL THICKNESS — MONTHS OF DESCENT</text>
  </g>

  <!-- ======== AUTONOMY LOOP INSET (top right) ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.2">
    <rect x="800" y="140" width="540" height="230" fill="#0E3357" stroke="#6FC3FF"/>
    <text x="818" y="166" fill="#6FC3FF" font-size="12" letter-spacing="1" stroke="none">FIG. B — WHY IT MUST DECIDE ALONE</text>
    <line x1="818" y1="176" x2="1322" y2="176" stroke="#6FC3FF" stroke-width="0.7"/>
    <!-- earth -->
    <circle cx="860" cy="240" r="16"/>
    <text x="860" y="276" fill="#DCEBFA" font-size="8.5" text-anchor="middle" stroke="none">EARTH</text>
    <!-- long delay arrow -->
    <line x1="882" y1="240" x2="1050" y2="240" stroke="#6FC3FF" stroke-width="1" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
    <text x="966" y="230" fill="#6FC3FF" font-size="8.5" text-anchor="middle" stroke="none">~1 HR EACH WAY</text>
    <!-- europa -->
    <circle cx="1075" cy="240" r="18"/>
    <path d="M 1060 234 h30 M 1064 248 h24" stroke-width="0.6"/>
    <text x="1075" y="276" fill="#DCEBFA" font-size="8.5" text-anchor="middle" stroke="none">EUROPA</text>
    <!-- ice barrier -->
    <line x1="1120" y1="205" x2="1120" y2="285" stroke="#DCEBFA" stroke-width="3"/>
    <text x="1136" y="228" fill="#DCEBFA" font-size="8.5" stroke="none">ICE BLOCKS RADIO</text>
    <text x="1136" y="244" fill="#6FC3FF" font-size="8.5" stroke="none">ENTIRELY</text>
    <!-- probe alone -->
    <rect x="1250" y="228" width="14" height="30" rx="3"/>
    <text x="1257" y="276" fill="#DCEBFA" font-size="8.5" text-anchor="middle" stroke="none">PROBE</text>
    <!-- conclusion text -->
    <g fill="#DCEBFA" font-size="9.5" stroke="none">
      <text x="818" y="312">NO COMMAND CAN REACH IT IN TIME — OR AT ALL.</text>
      <text x="818" y="332">IT MUST JUDGE: WHAT IS INTERESTING? WHAT IS DANGEROUS?</text>
      <text x="818" y="352" fill="#6FC3FF">AUTONOMY IS NOT A CONVENIENCE — IT IS THE PAYLOAD.</text>
    </g>
  </g>

  <!-- ======== DETAIL A: probe cross-section ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.4">
    <circle cx="1080" cy="530" r="96" stroke="#6FC3FF"/>
    <!-- probe body vertical -->
    <rect x="1062" y="452" width="36" height="130" rx="5"/>
    <path d="M 1062 582 q 18 30 36 0"/>
    <!-- internal stack -->
    <line x1="1062" y1="480" x2="1098" y2="480" stroke-width="0.8"/>
    <line x1="1062" y1="512" x2="1098" y2="512" stroke-width="0.8"/>
    <line x1="1062" y1="546" x2="1098" y2="546" stroke-width="0.8"/>
    <!-- heat source hatch -->
    <g stroke-width="0.6">
      <line x1="1066" y1="552" x2="1094" y2="576"/><line x1="1066" y1="562" x2="1088" y2="580"/>
      <line x1="1074" y1="548" x2="1096" y2="566"/>
    </g>
    <!-- tether spool at top -->
    <circle cx="1080" cy="466" r="9"/>
    <path d="M 1080 452 v -14" stroke-width="1"/>
    <g fill="#DCEBFA" font-size="8" stroke="none">
      <text x="1116" y="446">TETHER / RELAY DISPENSER</text>
      <text x="1116" y="498">AUTONOMY + INSTRUMENTS</text>
      <text x="1116" y="530">SAMPLING + SENSORS</text>
      <text x="1116" y="568">NUCLEAR HEAT SOURCE</text>
      <text x="1080" y="600" text-anchor="middle">MELT NOSE</text>
    </g>
    <text x="1080" y="646" fill="#6FC3FF" font-size="12" text-anchor="middle" stroke="none">DETAIL A — PROBE STACK</text>
    <line x1="360" y1="510" x2="984" y2="512" stroke="#6FC3FF" stroke-width="0.9" stroke-dasharray="5 4"/>
  </g>

  <!-- ======== PLANETARY PROTECTION PANEL ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.4">
    <rect x="800" y="672" width="270" height="112" fill="#0E3357" stroke="#6FC3FF" stroke-width="1.4"/>
    <text x="816" y="696" fill="#6FC3FF" font-size="11" letter-spacing="1" stroke="none">! PLANETARY PROTECTION</text>
    <line x1="816" y1="704" x2="1054" y2="704" stroke="#6FC3FF" stroke-width="0.7"/>
    <g fill="#DCEBFA" font-size="9" stroke="none">
      <text x="816" y="722">• OCEAN MAY ALREADY HOLD LIFE</text>
      <text x="816" y="740">• CONTACT WOULD BE IRREVERSIBLE</text>
      <text x="816" y="758">• EXTREME STERILISATION REQUIRED</text>
      <text x="816" y="776" fill="#6FC3FF">IF NOT CLEAN ENOUGH — DO NOT FLY</text>
    </g>
  </g>

  <!-- ======== CALLOUTS ======== -->
  <g stroke="#6FC3FF" stroke-width="1" fill="none">
    <line x1="335" y1="220" x2="180" y2="790" marker-start="url(#arrow)"/>
    <line x1="338" y1="360" x2="330" y2="790" marker-start="url(#arrow)"/>
    <line x1="338" y1="516" x2="470" y2="790" marker-start="url(#arrow)"/>
    <line x1="338" y1="592" x2="600" y2="790" marker-start="url(#arrow)"/>
    <line x1="400" y1="680" x2="720" y2="790" marker-start="url(#arrow)"/>
  </g>
  <g fill="#DCEBFA" font-size="13">
    <g><circle cx="180" cy="802" r="12" fill="none" stroke="#6FC3FF"/><text x="180" y="807" text-anchor="middle">1</text></g>
    <g><circle cx="330" cy="802" r="12" fill="none" stroke="#6FC3FF"/><text x="330" y="807" text-anchor="middle">2</text></g>
    <g><circle cx="470" cy="802" r="12" fill="none" stroke="#6FC3FF"/><text x="470" y="807" text-anchor="middle">3</text></g>
    <g><circle cx="600" cy="802" r="12" fill="none" stroke="#6FC3FF"/><text x="600" y="807" text-anchor="middle">4</text></g>
    <g><circle cx="720" cy="802" r="12" fill="none" stroke="#6FC3FF"/><text x="720" y="807" text-anchor="middle">5</text></g>
  </g>

  <!-- ======== PARTS LIST ======== -->
  <g font-size="12.5" fill="#DCEBFA">
    <rect x="50" y="828" width="700" height="128" fill="#0E3357" stroke="#6FC3FF" stroke-width="1"/>
    <text x="66" y="852" fill="#6FC3FF" font-size="13" letter-spacing="2" font-weight="bold">PARTS &amp; SYSTEMS INDEX</text>
    <line x1="66" y1="861" x2="734" y2="861" stroke="#6FC3FF" stroke-width="0.7"/>
    <text x="66" y="881">1 — SURFACE STATION: relays to orbiter, then Earth · 2 — FROZEN-IN RELAYS</text>
    <text x="66" y="901">3 — CRYOBOT: sinks under own weight, channel refreezes behind (DETAIL A)</text>
    <text x="66" y="921">4 — HEATED NOSE: radioisotope/fission heat melts ice, no drilling, no cuttings</text>
    <text x="66" y="941">5 — OCEAN BREAKTHROUGH: becomes submersible, searches for biosignatures</text>
  </g>

  <text x="1350" y="800" fill="#6FC3FF" font-size="11" text-anchor="end" letter-spacing="1">DESIGNED BY: W.A. SANDUN PRIYANKARA WIJERATHNE · sandunwijerathne51@gmail.com · github.com/sandunwijerathne</text>

  <!-- ======== TITLE BLOCK ======== -->
  <g font-size="11.5" fill="#DCEBFA">
    <rect x="780" y="828" width="570" height="128" fill="#0E3357" stroke="#DCEBFA" stroke-width="1.5"/>
    <line x1="780" y1="860" x2="1350" y2="860" stroke="#DCEBFA"/>
    <line x1="780" y1="892" x2="1350" y2="892" stroke="#DCEBFA"/>
    <line x1="780" y1="924" x2="1350" y2="924" stroke="#DCEBFA"/>
    <line x1="1075" y1="828" x2="1075" y2="956" stroke="#DCEBFA"/>
    <text x="796" y="846" fill="#6FC3FF" letter-spacing="1">PROJECT</text>
    <text x="796" y="858" font-weight="bold" font-size="11">OFF-WORLD CIVILISATION TOOLKIT</text>
    <text x="1091" y="846" fill="#6FC3FF">DRAWING NO.</text>
    <text x="1091" y="858" font-weight="bold" font-size="11">CB-1-GA-001 · REV A</text>
    <text x="796" y="878" fill="#6FC3FF">UNIT DESIGNATION</text>
    <text x="796" y="890" font-weight="bold" font-size="10.5">CB-1 CRYOBOT — GENERAL ARRANGEMENT</text>
    <text x="1091" y="878" fill="#6FC3FF">TARGET</text>
    <text x="1091" y="890" font-weight="bold" font-size="11">EUROPA SUBSURFACE OCEAN</text>
    <text x="796" y="910" fill="#6FC3FF">METHOD</text>
    <text x="796" y="922" font-weight="bold" font-size="10.5">MELTS, DOES NOT DRILL · NUCLEAR HEAT</text>
    <text x="1091" y="910" fill="#6FC3FF">DECISIVE SYSTEM</text>
    <text x="1091" y="922" font-weight="bold" font-size="11">FULL AUTONOMY</text>
    <text x="796" y="942" fill="#6FC3FF">FUNCTION</text>
    <text x="796" y="954" font-weight="bold" font-size="10.5">SEARCHES AN ALIEN OCEAN FOR LIFE, ALONE</text>
    <text x="1091" y="942" fill="#6FC3FF">STATUS</text>
    <text x="1091" y="954" font-weight="bold" font-size="10">CONCEPT — AGENCY-STUDIED, DECADE-SCALE</text>
  </g>
</svg>
