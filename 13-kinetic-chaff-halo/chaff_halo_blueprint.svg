<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#16406B" stroke-width="0.6"/>
    </pattern>
    <pattern id="gridMajor" width="125" height="125" patternUnits="userSpaceOnUse">
      <rect width="125" height="125" fill="url(#grid)"/>
      <path d="M 125 0 L 0 0 0 125" fill="none" stroke="#1E5288" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6FC3FF"/>
    </marker>
    <marker id="warrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#DCEBFA"/>
    </marker>
    <marker id="dim" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M1,1 L9,9 M5,0 L5,10" stroke="#DCEBFA" stroke-width="1" fill="none"/>
    </marker>
  </defs>

  <rect width="1400" height="1000" fill="#0B2A4A"/>
  <rect width="1400" height="1000" fill="url(#gridMajor)"/>
  <rect x="20" y="20" width="1360" height="960" fill="none" stroke="#DCEBFA" stroke-width="2"/>
  <rect x="28" y="28" width="1344" height="944" fill="none" stroke="#DCEBFA" stroke-width="0.8"/>

  <text x="50" y="70" fill="#DCEBFA" font-size="28" letter-spacing="3" font-weight="bold">KINETIC CHAFF HALO — CH-1 "AEGIS"</text>
  <text x="50" y="96" fill="#6FC3FF" font-size="14" letter-spacing="2">SELF-ORGANISING DEFENCE SWARM · TACTICAL SCHEMATIC · INTERCEPT SEQUENCE · SHEET 1 OF 5</text>
  <line x1="50" y1="110" x2="1350" y2="110" stroke="#6FC3FF" stroke-width="1"/>

  <!-- ======== MAIN TACTICAL VIEW: asset + halo + threat ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="2">
    <!-- protected asset (station) -->
    <rect x="420" y="410" width="90" height="60" rx="6"/>
    <rect x="360" y="428" width="60" height="24"/>
    <rect x="510" y="428" width="60" height="24"/>
    <path d="M 372 428 v24 M 384 428 v24 M 396 428 v24 M 522 428 v24 M 534 428 v24 M 546 428 v24" stroke-width="0.6"/>
    <text x="465" y="445" fill="#6FC3FF" font-size="9" text-anchor="middle" stroke="none">ASSET</text>

    <!-- halo ring (resting formation) -->
    <circle cx="465" cy="440" r="220" stroke-width="0.8" stroke-dasharray="6 6"/>
    <!-- swarm units (dots) around halo -->
    <g fill="#DCEBFA">
      <circle cx="465" cy="220" r="4"/><circle cx="560" cy="245" r="4"/><circle cx="640" cy="310" r="4"/>
      <circle cx="685" cy="440" r="4"/><circle cx="640" cy="570" r="4"/><circle cx="560" cy="635" r="4"/>
      <circle cx="465" cy="660" r="4"/><circle cx="370" cy="635" r="4"/><circle cx="290" cy="570" r="4"/>
      <circle cx="245" cy="440" r="4"/><circle cx="290" cy="310" r="4"/><circle cx="370" cy="245" r="4"/>
      <circle cx="520" cy="230" r="3"/><circle cx="410" cy="230" r="3"/><circle cx="660" cy="380" r="3"/>
      <circle cx="660" cy="500" r="3"/><circle cx="270" cy="380" r="3"/><circle cx="270" cy="500" r="3"/>
    </g>
    <text x="465" y="200" fill="#6FC3FF" font-size="9" text-anchor="middle" stroke="none">RESTING HALO (SPARSE)</text>

    <!-- incoming threat -->
    <circle cx="820" cy="250" r="8"/>
    <path d="M 812 258 L 700 360" stroke="#DCEBFA" stroke-width="1.4" marker-end="url(#warrow)"/>
    <text x="828" y="242" fill="#DCEBFA" font-size="9" stroke="none">INCOMING (8 km/s)</text>

    <!-- thickened intercept screen on threat side -->
    <g fill="#6FC3FF">
      <circle cx="640" cy="320" r="4.5"/><circle cx="655" cy="345" r="4.5"/><circle cx="668" cy="372" r="4.5"/>
      <circle cx="625" cy="345" r="4.5"/><circle cx="640" cy="372" r="4.5"/><circle cx="612" cy="372" r="4.5"/>
      <circle cx="655" cy="398" r="4.5"/><circle cx="628" cy="398" r="4.5"/>
    </g>
    <path d="M 690 300 q -20 -8 -40 6" stroke="#6FC3FF" stroke-width="0.8"/>
    <text x="700" y="300" fill="#6FC3FF" font-size="9" stroke="none">SWARM THICKENS HERE</text>
    <!-- units migrating arrows -->
    <g stroke="#6FC3FF" stroke-width="0.8">
      <path d="M 560 245 q 40 30 70 60" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
      <path d="M 685 440 q -10 -50 -20 -70" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
    </g>

    <!-- shatter spray at intercept -->
    <g stroke="#DCEBFA" stroke-width="0.8">
      <path d="M 668 372 l 16 -8 M 668 372 l 18 2 M 668 372 l 14 12"/>
    </g>
  </g>

  <!-- ======== INTERCEPT SEQUENCE INSET (top right) ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.2">
    <rect x="1000" y="140" width="340" height="250" fill="#0E3357" stroke="#6FC3FF"/>
    <text x="1016" y="164" fill="#6FC3FF" font-size="12" letter-spacing="1" stroke="none">FIG. B — INTERCEPT SEQUENCE</text>
    <!-- step 1 detect -->
    <circle cx="1050" cy="210" r="14" stroke-dasharray="3 3"/>
    <circle cx="1050" cy="210" r="3" fill="#DCEBFA"/>
    <text x="1050" y="242" fill="#DCEBFA" font-size="8" text-anchor="middle" stroke="none">1 DETECT</text>
    <!-- step 2 predict -->
    <circle cx="1170" cy="210" r="14" stroke-dasharray="3 3"/>
    <path d="M 1160 218 l 20 -16" stroke="#6FC3FF" stroke-width="1" marker-end="url(#arrow)"/>
    <text x="1170" y="242" fill="#DCEBFA" font-size="8" text-anchor="middle" stroke="none">2 PREDICT</text>
    <!-- step 3 thicken -->
    <circle cx="1290" cy="210" r="14" stroke-dasharray="3 3"/>
    <g fill="#6FC3FF"><circle cx="1284" cy="204" r="2.5"/><circle cx="1294" cy="204" r="2.5"/><circle cx="1289" cy="214" r="2.5"/></g>
    <text x="1290" y="242" fill="#DCEBFA" font-size="8" text-anchor="middle" stroke="none">3 THICKEN</text>
    <line x1="1064" y1="210" x2="1156" y2="210" marker-end="url(#arrow)" stroke="#6FC3FF" stroke-width="0.8"/>
    <line x1="1184" y1="210" x2="1276" y2="210" marker-end="url(#arrow)" stroke="#6FC3FF" stroke-width="0.8"/>
    <!-- step 4 heal -->
    <text x="1016" y="300" fill="#6FC3FF" font-size="9" stroke="none">4 ABSORB (WHIPPLE SHATTER) → 5 HEAL</text>
    <path d="M 1030 316 q 40 20 80 0 q 40 -20 80 0 q 40 20 80 0" stroke="#DCEBFA" stroke-width="1"/>
    <g fill="#DCEBFA"><circle cx="1030" cy="316" r="2"/><circle cx="1110" cy="316" r="2"/><circle cx="1190" cy="316" r="2"/><circle cx="1270" cy="316" r="2"/></g>
    <text x="1016" y="366" fill="#DCEBFA" font-size="8.5" stroke="none">FRESH UNITS DRIFT IN TO REPLACE LOSSES</text>
  </g>

  <!-- ======== DETAIL A: single unit ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.4">
    <circle cx="1150" cy="580" r="88" stroke="#6FC3FF"/>
    <rect x="1120" y="550" width="60" height="60" rx="6"/>
    <!-- thrusters -->
    <path d="M 1120 560 l -10 -6 M 1120 600 l -10 6 M 1180 560 l 10 -6 M 1180 600 l 10 6" stroke-width="1.2"/>
    <!-- sensor -->
    <circle cx="1150" cy="566" r="7"/>
    <!-- antenna -->
    <line x1="1150" y1="550" x2="1150" y2="534"/>
    <circle cx="1150" cy="531" r="3"/>
    <!-- processor grid -->
    <rect x="1136" y="582" width="28" height="18"/>
    <path d="M 1136 588 h28 M 1136 594 h28 M 1145 582 v18 M 1155 582 v18" stroke-width="0.5"/>
    <g fill="#DCEBFA" font-size="8.5" stroke="none">
      <text x="1150" y="524" text-anchor="middle">LINK</text>
      <text x="1096" y="556" text-anchor="end">THRUST</text>
      <text x="1150" y="626" text-anchor="middle" font-size="8">CPU + BUMPER BODY</text>
    </g>
    <text x="1150" y="690" fill="#6FC3FF" font-size="12" text-anchor="middle" stroke="none">DETAIL A — FIST-SIZED UNIT</text>
    <line x1="685" y1="440" x2="1064" y2="562" stroke="#6FC3FF" stroke-width="0.9" stroke-dasharray="5 4"/>
  </g>

  <!-- ======== CALLOUTS ======== -->
  <g stroke="#6FC3FF" stroke-width="1" fill="none">
    <line x1="465" y1="470" x2="360" y2="770" marker-start="url(#arrow)"/>
    <line x1="245" y1="440" x2="200" y2="770" marker-start="url(#arrow)"/>
    <line x1="640" y1="360" x2="560" y2="770" marker-start="url(#arrow)"/>
    <line x1="812" y1="258" x2="740" y2="770" marker-start="url(#arrow)"/>
  </g>
  <g fill="#DCEBFA" font-size="13">
    <g><circle cx="360" cy="782" r="12" fill="none" stroke="#6FC3FF"/><text x="360" y="787" text-anchor="middle">1</text></g>
    <g><circle cx="200" cy="782" r="12" fill="none" stroke="#6FC3FF"/><text x="200" y="787" text-anchor="middle">2</text></g>
    <g><circle cx="560" cy="782" r="12" fill="none" stroke="#6FC3FF"/><text x="560" y="787" text-anchor="middle">3</text></g>
    <g><circle cx="740" cy="782" r="12" fill="none" stroke="#6FC3FF"/><text x="740" y="787" text-anchor="middle">4</text></g>
  </g>

  <!-- ======== PARTS LIST ======== -->
  <g font-size="13" fill="#DCEBFA">
    <rect x="50" y="810" width="620" height="146" fill="#0E3357" stroke="#6FC3FF" stroke-width="1"/>
    <text x="66" y="835" fill="#6FC3FF" font-size="14" letter-spacing="2" font-weight="bold">PARTS &amp; SYSTEMS INDEX</text>
    <line x1="66" y1="844" x2="654" y2="844" stroke="#6FC3FF" stroke-width="0.7"/>
    <text x="66" y="864">1 — PROTECTED ASSET: station or high-value satellite at halo center</text>
    <text x="66" y="884">2 — RESTING HALO: sparse formation of fist-sized units, low power</text>
    <text x="66" y="904">3 — INTERCEPT SCREEN: units thicken where threat will cross (Whipple)</text>
    <text x="66" y="924">4 — INCOMING HAZARD: debris / uncatalogued object / threat at 8 km/s</text>
    <text x="66" y="946" font-size="11" fill="#6FC3FF">UNIT DETAIL A · SEQUENCE FIG. B · SWARM HEALS AFTER LOSSES</text>
  </g>

  <text x="1350" y="800" fill="#6FC3FF" font-size="11" text-anchor="end" letter-spacing="1">DESIGNED BY: W.A. SANDUN PRIYANKARA WIJERATHNE · sandunwijerathne51@gmail.com · github.com/sandunwijerathne</text>

  <!-- ======== TITLE BLOCK ======== -->
  <g font-size="12" fill="#DCEBFA">
    <rect x="700" y="810" width="650" height="146" fill="#0E3357" stroke="#DCEBFA" stroke-width="1.5"/>
    <line x1="700" y1="846" x2="1350" y2="846" stroke="#DCEBFA"/>
    <line x1="700" y1="882" x2="1350" y2="882" stroke="#DCEBFA"/>
    <line x1="700" y1="920" x2="1350" y2="920" stroke="#DCEBFA"/>
    <line x1="1030" y1="810" x2="1030" y2="956" stroke="#DCEBFA"/>
    <text x="716" y="830" fill="#6FC3FF" letter-spacing="1">PROJECT</text>
    <text x="716" y="840" font-size="12" font-weight="bold">OFF-WORLD CIVILISATION TOOLKIT</text>
    <text x="1046" y="830" fill="#6FC3FF">DRAWING NO.</text>
    <text x="1046" y="840" font-size="12" font-weight="bold">CH-1-GA-001 · REV A</text>
    <text x="716" y="866" fill="#6FC3FF">UNIT DESIGNATION</text>
    <text x="716" y="876" font-weight="bold" font-size="11">CH-1 "AEGIS" — GENERAL ARRANGEMENT</text>
    <text x="1046" y="866" fill="#6FC3FF">SWARM SIZE</text>
    <text x="1046" y="876" font-weight="bold" font-size="11">10^3 UNITS</text>
    <text x="716" y="902" fill="#6FC3FF">DEPLOYMENT</text>
    <text x="716" y="912" font-weight="bold" font-size="11">ORBITAL, AROUND PROTECTED ASSET</text>
    <text x="1046" y="902" fill="#6FC3FF">BASIS</text>
    <text x="1046" y="912" font-weight="bold" font-size="11">WHIPPLE + CONSTELLATION</text>
    <text x="716" y="936" fill="#6FC3FF">FUNCTION</text>
    <text x="716" y="946" font-weight="bold" font-size="11">SELF-HEALING SWARM SHIELD vs DEBRIS + THREATS</text>
    <text x="1046" y="936" fill="#6FC3FF">STATUS</text>
    <text x="1046" y="946" font-weight="bold" font-size="10">CONCEPT — NEAR-TERM (DEBRIS FIRST)</text>
  </g>
</svg>
