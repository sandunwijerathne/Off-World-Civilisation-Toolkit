<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#16406B" stroke-width="0.6"/>
    </pattern>
    <pattern id="gridMajor" width="125" height="125" patternUnits="userSpaceOnUse">
      <rect width="125" height="125" fill="url(#grid)"/>
      <path d="M 125 0 L 0 0 0 125" fill="none" stroke="#1E5288" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6FC3FF"/>
    </marker>
    <marker id="dim" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M1,1 L9,9 M5,0 L5,10" stroke="#DCEBFA" stroke-width="1" fill="none"/>
    </marker>
  </defs>

  <rect width="1400" height="1000" fill="#0B2A4A"/>
  <rect width="1400" height="1000" fill="url(#gridMajor)"/>
  <rect x="20" y="20" width="1360" height="960" fill="none" stroke="#DCEBFA" stroke-width="2"/>
  <rect x="28" y="28" width="1344" height="944" fill="none" stroke="#DCEBFA" stroke-width="0.8"/>

  <text x="50" y="70" fill="#DCEBFA" font-size="30" letter-spacing="3" font-weight="bold">ERGOSPHERE SIPHON — ES-1 "TARTARUS"</text>
  <text x="50" y="96" fill="#6FC3FF" font-size="14" letter-spacing="2">PENROSE-PROCESS POWER STATION · SYSTEM SCHEMATIC · CYCLE DETAIL · SHEET 1 OF 5</text>
  <line x1="50" y1="110" x2="1350" y2="110" stroke="#6FC3FF" stroke-width="1"/>

  <!-- ======== MAIN SCHEMATIC: black hole + zones + ring station ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="2">
    <!-- event horizon (solid black disc) -->
    <circle cx="470" cy="440" r="70" fill="#0B2A4A"/>
    <circle cx="470" cy="440" r="70" stroke-width="2.5"/>
    <text x="470" y="444" fill="#6FC3FF" font-size="9" text-anchor="middle" stroke="none">EVENT</text>
    <text x="470" y="455" fill="#6FC3FF" font-size="9" text-anchor="middle" stroke="none">HORIZON</text>

    <!-- ergosphere (oblate, dashed) -->
    <ellipse cx="470" cy="440" rx="150" ry="110" stroke-width="1.4" stroke-dasharray="7 5"/>
    <text x="470" y="320" fill="#6FC3FF" font-size="10" text-anchor="middle" stroke="none">ERGOSPHERE (STATIC LIMIT)</text>

    <!-- frame-dragging swirl arrows -->
    <g stroke="#6FC3FF" stroke-width="1">
      <path d="M 560 380 a 100 80 0 0 1 -30 130" marker-end="url(#arrow)"/>
      <path d="M 380 500 a 100 80 0 0 1 30 -130" marker-end="url(#arrow)"/>
    </g>
    <text x="620" y="440" fill="#6FC3FF" font-size="9" stroke="none">FRAME DRAGGING</text>

    <!-- spin axis + arrow -->
    <line x1="470" y1="300" x2="470" y2="260" stroke-width="1"/>
    <path d="M 470 268 a 18 8 0 1 0 18 -6" stroke="#6FC3FF" stroke-width="1" marker-end="url(#arrow)"/>
    <text x="500" y="256" fill="#6FC3FF" font-size="9" stroke="none">SPIN J</text>

    <!-- ring station (large ellipse orbit outside ergosphere) -->
    <ellipse cx="470" cy="440" rx="300" ry="215" stroke-width="2"/>
    <ellipse cx="470" cy="440" rx="300" ry="215" stroke-width="0.7" stroke-dasharray="3 6"/>
    <!-- station segments (habitat/collector nodes) -->
    <g>
      <rect x="758" y="428" width="26" height="24"/>
      <rect x="156" y="428" width="26" height="24"/>
      <rect x="457" y="217" width="26" height="20"/>
      <rect x="457" y="643" width="26" height="20"/>
      <rect x="660" y="290" width="24" height="20" transform="rotate(35 672 300)"/>
      <rect x="256" y="580" width="24" height="20" transform="rotate(35 268 590)"/>
    </g>
    <text x="800" y="440" fill="#6FC3FF" font-size="9" stroke="none">RING STATION</text>

    <!-- mass package dropped inward -->
    <circle cx="700" cy="360" r="7"/>
    <path d="M 700 360 Q 600 380 560 410" stroke="#6FC3FF" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
    <text x="712" y="352" fill="#DCEBFA" font-size="9" stroke="none">WASTE MASS IN</text>

    <!-- split point inside ergosphere -->
    <circle cx="540" cy="420" r="4" fill="#6FC3FF"/>
    <!-- negative-energy fragment into horizon -->
    <path d="M 540 420 Q 510 430 500 440" stroke="#DCEBFA" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="470" y="500" fill="#6FC3FF" font-size="8.5" text-anchor="middle" stroke="none">NEG-ENERGY FRAGMENT → HOLE</text>
    <!-- escaping fragment, energised, out to station -->
    <path d="M 540 420 Q 640 380 758 440" stroke="#6FC3FF" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="660" y="356" fill="#6FC3FF" font-size="8.5" stroke="none">ESCAPES WITH MORE ENERGY</text>
  </g>

  <!-- ======== PENROSE CYCLE INSET (top right) ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.2">
    <rect x="1000" y="140" width="340" height="250" fill="#0E3357" stroke="#6FC3FF"/>
    <text x="1016" y="164" fill="#6FC3FF" font-size="12" letter-spacing="1" stroke="none">FIG. B — PENROSE CYCLE</text>
    <!-- incoming -->
    <circle cx="1040" cy="230" r="8"/>
    <line x1="1048" y1="230" x2="1090" y2="230" marker-end="url(#arrow)" stroke="#6FC3FF"/>
    <!-- split -->
    <circle cx="1100" cy="230" r="4" fill="#6FC3FF"/>
    <line x1="1100" y1="230" x2="1140" y2="200" marker-end="url(#arrow)" stroke="#6FC3FF"/>
    <line x1="1100" y1="230" x2="1140" y2="270" marker-end="url(#arrow)" stroke="#6FC3FF"/>
    <text x="1148" y="196" fill="#DCEBFA" font-size="8.5" stroke="none">E &gt; E0 (OUT)</text>
    <text x="1148" y="278" fill="#DCEBFA" font-size="8.5" stroke="none">E &lt; 0 (IN)</text>
    <!-- energy balance -->
    <text x="1016" y="316" fill="#DCEBFA" font-size="9" stroke="none">GAIN = |E_neg| DRAWN FROM SPIN</text>
    <text x="1016" y="336" fill="#DCEBFA" font-size="9" stroke="none">FLOOR = IRREDUCIBLE MASS</text>
    <text x="1016" y="366" fill="#6FC3FF" font-size="9" stroke="none">NATURE'S VERSION: QUASAR JETS</text>
  </g>

  <!-- ======== DETAIL A: energy balance bar ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.4">
    <circle cx="1150" cy="560" r="86" stroke="#6FC3FF"/>
    <!-- total mass-energy bar -->
    <rect x="1096" y="530" width="108" height="20"/>
    <line x1="1170" y1="530" x2="1170" y2="550" stroke-width="1.2"/>
    <text x="1133" y="524" fill="#DCEBFA" font-size="8" text-anchor="middle" stroke="none">IRREDUCIBLE</text>
    <text x="1187" y="524" fill="#6FC3FF" font-size="8" text-anchor="middle" stroke="none">SPIN (≤29%)</text>
    <text x="1150" y="566" fill="#DCEBFA" font-size="8" text-anchor="middle" stroke="none">TOTAL MASS-ENERGY</text>
    <!-- arrow showing extractable part -->
    <path d="M 1170 578 h 34" stroke="#6FC3FF" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="1150" y="600" fill="#6FC3FF" font-size="8.5" text-anchor="middle" stroke="none">EXTRACTABLE PORTION</text>
    <text x="1150" y="672" fill="#6FC3FF" font-size="12" text-anchor="middle" stroke="none">DETAIL A — ENERGY BUDGET</text>
    <line x1="770" y1="440" x2="1064" y2="556" stroke="#6FC3FF" stroke-width="0.9" stroke-dasharray="5 4"/>
  </g>

  <!-- ======== CALLOUTS ======== -->
  <g stroke="#6FC3FF" stroke-width="1" fill="none">
    <line x1="470" y1="510" x2="470" y2="760" marker-start="url(#arrow)"/>
    <line x1="600" y1="360" x2="740" y2="760" marker-start="url(#arrow)"/>
    <line x1="758" y1="440" x2="900" y2="760" marker-start="url(#arrow)"/>
    <line x1="700" y1="360" x2="360" y2="760" marker-start="url(#arrow)"/>
    <line x1="540" y1="420" x2="200" y2="760" marker-start="url(#arrow)"/>
  </g>
  <g fill="#DCEBFA" font-size="13">
    <g><circle cx="470" cy="772" r="12" fill="none" stroke="#6FC3FF"/><text x="470" y="777" text-anchor="middle">1</text></g>
    <g><circle cx="740" cy="772" r="12" fill="none" stroke="#6FC3FF"/><text x="740" y="777" text-anchor="middle">2</text></g>
    <g><circle cx="900" cy="772" r="12" fill="none" stroke="#6FC3FF"/><text x="900" y="777" text-anchor="middle">3</text></g>
    <g><circle cx="360" cy="772" r="12" fill="none" stroke="#6FC3FF"/><text x="360" y="777" text-anchor="middle">4</text></g>
    <g><circle cx="200" cy="772" r="12" fill="none" stroke="#6FC3FF"/><text x="200" y="777" text-anchor="middle">5</text></g>
  </g>

  <!-- ======== PARTS LIST ======== -->
  <g font-size="13" fill="#DCEBFA">
    <rect x="50" y="800" width="620" height="156" fill="#0E3357" stroke="#6FC3FF" stroke-width="1"/>
    <text x="66" y="825" fill="#6FC3FF" font-size="14" letter-spacing="2" font-weight="bold">PARTS &amp; SYSTEMS INDEX</text>
    <line x1="66" y1="834" x2="654" y2="834" stroke="#6FC3FF" stroke-width="0.7"/>
    <text x="66" y="854">1 — EVENT HORIZON: point of no return (station never crosses static limit)</text>
    <text x="66" y="874">2 — ESCAPING FRAGMENT: returns energised, captured + converted at ring</text>
    <text x="66" y="894">3 — RING STATION: orbits outside ergosphere, mass-drivers + collectors</text>
    <text x="66" y="914">4 — WASTE-MASS PACKAGE: any mass, dropped inward on computed trajectory</text>
    <text x="66" y="934">5 — SPLIT POINT: inside ergosphere; neg-energy piece falls to hole (FIG. B)</text>
  </g>

  <text x="1350" y="790" fill="#6FC3FF" font-size="11" text-anchor="end" letter-spacing="1">DESIGNED BY: W.A. SANDUN PRIYANKARA WIJERATHNE · sandunwijerathne51@gmail.com · github.com/sandunwijerathne</text>

  <!-- ======== TITLE BLOCK ======== -->
  <g font-size="12" fill="#DCEBFA">
    <rect x="700" y="800" width="650" height="156" fill="#0E3357" stroke="#DCEBFA" stroke-width="1.5"/>
    <line x1="700" y1="836" x2="1350" y2="836" stroke="#DCEBFA"/>
    <line x1="700" y1="872" x2="1350" y2="872" stroke="#DCEBFA"/>
    <line x1="700" y1="914" x2="1350" y2="914" stroke="#DCEBFA"/>
    <line x1="1030" y1="800" x2="1030" y2="956" stroke="#DCEBFA"/>
    <text x="716" y="820" fill="#6FC3FF" letter-spacing="1">PROJECT</text>
    <text x="716" y="830" font-size="12" font-weight="bold">OFF-WORLD CIVILISATION TOOLKIT</text>
    <text x="1046" y="820" fill="#6FC3FF">DRAWING NO.</text>
    <text x="1046" y="830" font-size="12" font-weight="bold">ES-1-GA-001 · REV A</text>
    <text x="716" y="856" fill="#6FC3FF">UNIT DESIGNATION</text>
    <text x="716" y="866" font-weight="bold" font-size="11">ES-1 "TARTARUS" — GENERAL ARRANGEMENT</text>
    <text x="1046" y="856" fill="#6FC3FF">HOST</text>
    <text x="1046" y="866" font-weight="bold" font-size="11">ROTATING (KERR) BH</text>
    <text x="716" y="892" fill="#6FC3FF">PRINCIPLE</text>
    <text x="716" y="902" font-weight="bold" font-size="11">PENROSE PROCESS (SETTLED PHYSICS, 1969-71)</text>
    <text x="1046" y="892" fill="#6FC3FF">OUTPUT</text>
    <text x="1046" y="902" font-weight="bold" font-size="11">BLACK-HOLE SPIN → POWER</text>
    <text x="716" y="936" fill="#6FC3FF">FUNCTION</text>
    <text x="716" y="946" font-weight="bold" font-size="11">DRAINS ROTATIONAL ENERGY OF A SPINNING BLACK HOLE</text>
    <text x="1046" y="936" fill="#6FC3FF">STATUS</text>
    <text x="1046" y="946" font-weight="bold" font-size="10">CONCEPT — FAR HORIZON, PHYSICS REAL</text>
  </g>
</svg>
