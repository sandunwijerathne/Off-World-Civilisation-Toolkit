<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#16406B" stroke-width="0.6"/>
    </pattern>
    <pattern id="gridMajor" width="125" height="125" patternUnits="userSpaceOnUse">
      <rect width="125" height="125" fill="url(#grid)"/>
      <path d="M 125 0 L 0 0 0 125" fill="none" stroke="#1E5288" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6FC3FF"/>
    </marker>
    <marker id="dim" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M1,1 L9,9 M5,0 L5,10" stroke="#DCEBFA" stroke-width="1" fill="none"/>
    </marker>
  </defs>

  <rect width="1400" height="1000" fill="#0B2A4A"/>
  <rect width="1400" height="1000" fill="url(#gridMajor)"/>
  <rect x="20" y="20" width="1360" height="960" fill="none" stroke="#DCEBFA" stroke-width="2"/>
  <rect x="28" y="28" width="1344" height="944" fill="none" stroke="#DCEBFA" stroke-width="0.8"/>

  <text x="50" y="70" fill="#DCEBFA" font-size="28" letter-spacing="3" font-weight="bold">MYRMIDON SWARM — MY-1</text>
  <text x="50" y="96" fill="#6FC3FF" font-size="14" letter-spacing="2">INSECT-SCALE HULL REPAIR ROBOTS · HULL SECTION VIEW · UNIT DETAIL · SHARED LEARNING · SHEET 1 OF 5</text>
  <line x1="50" y1="110" x2="1350" y2="110" stroke="#6FC3FF" stroke-width="1"/>

  <!-- ======== HULL SECTION VIEW (main) ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="2">
    <!-- hull panel surface -->
    <path d="M 90 420 h 820" stroke-width="2.5"/>
    <path d="M 90 452 h 820" stroke-width="1.2"/>
    <!-- hull hatching (structure below) -->
    <g stroke-width="0.6">
      <line x1="110" y1="452" x2="96" y2="470"/><line x1="150" y1="452" x2="136" y2="470"/>
      <line x1="190" y1="452" x2="176" y2="470"/><line x1="230" y1="452" x2="216" y2="470"/>
      <line x1="270" y1="452" x2="256" y2="470"/><line x1="310" y1="452" x2="296" y2="470"/>
      <line x1="350" y1="452" x2="336" y2="470"/><line x1="390" y1="452" x2="376" y2="470"/>
      <line x1="430" y1="452" x2="416" y2="470"/><line x1="470" y1="452" x2="456" y2="470"/>
      <line x1="510" y1="452" x2="496" y2="470"/><line x1="550" y1="452" x2="536" y2="470"/>
      <line x1="590" y1="452" x2="576" y2="470"/><line x1="630" y1="452" x2="616" y2="470"/>
      <line x1="670" y1="452" x2="656" y2="470"/><line x1="710" y1="452" x2="696" y2="470"/>
      <line x1="750" y1="452" x2="736" y2="470"/><line x1="790" y1="452" x2="776" y2="470"/>
      <line x1="830" y1="452" x2="816" y2="470"/><line x1="870" y1="452" x2="856" y2="470"/>
    </g>
    <text x="120" y="492" fill="#6FC3FF" font-size="10" stroke="none">SPACECRAFT HULL (SECTION)</text>
    <!-- panel seams -->
    <line x1="330" y1="420" x2="330" y2="452" stroke-width="1.2"/>
    <line x1="620" y1="420" x2="620" y2="452" stroke-width="1.2"/>
    <text x="330" y="412" fill="#6FC3FF" font-size="8" text-anchor="middle" stroke="none">SEAM</text>

    <!-- micrometeoroid impact incoming -->
    <path d="M 440 250 l 40 150" stroke="#DCEBFA" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="400" y="242" fill="#DCEBFA" font-size="9" stroke="none">MICROMETEOROID / DEBRIS IMPACT</text>
    <!-- crater + crack in hull -->
    <path d="M 470 420 q 12 14 24 0" stroke="#6FC3FF" stroke-width="2"/>
    <path d="M 482 428 l -6 16 M 482 428 l 8 14" stroke="#6FC3FF" stroke-width="1"/>
    <text x="530" y="440" fill="#6FC3FF" font-size="9" stroke="none">MICRO-CRACK</text>

    <!-- myrmidons crawling on hull (simple insect glyphs) -->
    <g stroke-width="1.4">
      <!-- unit A: patrolling left -->
      <ellipse cx="180" cy="408" rx="12" ry="7"/>
      <path d="M 170 415 l -6 8 M 178 415 l -3 9 M 186 415 l 3 9 M 192 415 l 6 8"/>
      <!-- unit B -->
      <ellipse cx="270" cy="408" rx="12" ry="7"/>
      <path d="M 260 415 l -6 8 M 268 415 l -3 9 M 276 415 l 3 9 M 282 415 l 6 8"/>
      <!-- work party at damage: 3 units -->
      <ellipse cx="440" cy="406" rx="12" ry="7"/>
      <path d="M 430 413 l -6 8 M 438 413 l -3 9 M 446 413 l 3 9 M 452 413 l 6 8"/>
      <ellipse cx="520" cy="406" rx="12" ry="7"/>
      <path d="M 510 413 l -6 8 M 518 413 l -3 9 M 526 413 l 3 9 M 532 413 l 6 8"/>
      <ellipse cx="480" cy="384" rx="12" ry="7"/>
      <path d="M 470 391 l -6 8 M 478 391 l -3 9 M 486 391 l 3 9 M 492 391 l 6 8"/>
      <!-- unit further right -->
      <ellipse cx="700" cy="408" rx="12" ry="7"/>
      <path d="M 690 415 l -6 8 M 698 415 l -3 9 M 706 415 l 3 9 M 712 415 l 6 8"/>
      <ellipse cx="820" cy="408" rx="12" ry="7"/>
      <path d="M 810 415 l -6 8 M 818 415 l -3 9 M 826 415 l 3 9 M 832 415 l 6 8"/>
    </g>
    <text x="480" y="358" fill="#6FC3FF" font-size="9" text-anchor="middle" stroke="none">WORK PARTY RECRUITED TO DAMAGE</text>

    <!-- recruit signal arcs -->
    <g stroke="#6FC3FF" stroke-width="0.8" stroke-dasharray="3 3">
      <path d="M 288 404 q 70 -30 140 -4" marker-end="url(#arrow)"/>
      <path d="M 688 404 q -70 -30 -140 -4" marker-end="url(#arrow)"/>
    </g>
    <text x="640" y="372" fill="#6FC3FF" font-size="8.5" stroke="none">LOCAL RECRUIT SIGNAL</text>

    <!-- charging dock -->
    <rect x="880" y="392" width="30" height="28"/>
    <path d="M 888 400 v12 M 896 400 v12 M 904 400 v12" stroke-width="0.7"/>
    <text x="895" y="382" fill="#6FC3FF" font-size="8.5" text-anchor="middle" stroke="none">DOCK</text>
  </g>

  <!-- ======== SHARED LEARNING INSET (top right) ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.2">
    <rect x="990" y="140" width="350" height="250" fill="#0E3357" stroke="#6FC3FF"/>
    <text x="1006" y="164" fill="#6FC3FF" font-size="12" letter-spacing="1" stroke="none">FIG. B — ONE LEARNS, ALL KNOW</text>
    <line x1="1006" y1="174" x2="1324" y2="174" stroke="#6FC3FF" stroke-width="0.7"/>
    <!-- local units -->
    <g>
      <ellipse cx="1040" cy="230" rx="10" ry="6"/>
      <ellipse cx="1040" cy="280" rx="10" ry="6"/>
      <ellipse cx="1040" cy="330" rx="10" ry="6"/>
    </g>
    <text x="1010" y="212" fill="#DCEBFA" font-size="8" stroke="none">LOCAL EXPERIENCE</text>
    <!-- arrows to shared model -->
    <g stroke="#6FC3FF" stroke-width="1">
      <line x1="1054" y1="230" x2="1150" y2="270" marker-end="url(#arrow)"/>
      <line x1="1054" y1="280" x2="1150" y2="280" marker-end="url(#arrow)"/>
      <line x1="1054" y1="330" x2="1150" y2="292" marker-end="url(#arrow)"/>
    </g>
    <!-- shared model box -->
    <rect x="1156" y="256" width="90" height="48" rx="4"/>
    <path d="M 1166 268 h70 M 1166 280 h70 M 1166 292 h70" stroke-width="0.6"/>
    <text x="1201" y="322" fill="#DCEBFA" font-size="8" text-anchor="middle" stroke="none">SHARED MODEL</text>
    <!-- distribute back -->
    <path d="M 1246 280 q 50 -50 40 -100" stroke="#6FC3FF" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
    <text x="1256" y="200" fill="#6FC3FF" font-size="8" stroke="none">BACK TO ALL</text>
    <text x="1006" y="366" fill="#6FC3FF" font-size="8.5" stroke="none">MODEL UPDATES, NOT RAW DATA (LOW BANDWIDTH)</text>
  </g>

  <!-- ======== DETAIL A: single unit ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.4">
    <circle cx="1150" cy="600" r="92" stroke="#6FC3FF"/>
    <!-- body -->
    <ellipse cx="1150" cy="600" rx="42" ry="24"/>
    <!-- legs with grip pads -->
    <g stroke-width="1.2">
      <path d="M 1118 614 l -18 18"/><circle cx="1097" cy="635" r="4"/>
      <path d="M 1136 620 l -10 22"/><circle cx="1124" cy="645" r="4"/>
      <path d="M 1164 620 l 10 22"/><circle cx="1176" cy="645" r="4"/>
      <path d="M 1182 614 l 18 18"/><circle cx="1203" cy="635" r="4"/>
    </g>
    <!-- sensor eye -->
    <circle cx="1122" cy="596" r="7"/>
    <!-- antenna -->
    <line x1="1150" y1="576" x2="1150" y2="558"/><circle cx="1150" cy="555" r="3"/>
    <!-- solar strip on back -->
    <path d="M 1136 586 h 40" stroke-width="1"/>
    <path d="M 1142 582 v8 M 1152 582 v8 M 1162 582 v8" stroke-width="0.5"/>
    <!-- repair applicator -->
    <path d="M 1192 596 l 14 -4 l -2 8 z"/>
    <g fill="#DCEBFA" font-size="8" stroke="none">
      <text x="1150" y="548" text-anchor="middle">LINK</text>
      <text x="1094" y="588" text-anchor="end">SENSOR</text>
      <text x="1214" y="592">APPLICATOR</text>
      <text x="1150" y="668" text-anchor="middle">DRY-ADHESION GRIP PADS</text>
    </g>
    <text x="1150" y="716" fill="#6FC3FF" font-size="12" text-anchor="middle" stroke="none">DETAIL A — SINGLE MYRMIDON</text>
    <line x1="530" y1="400" x2="1062" y2="580" stroke="#6FC3FF" stroke-width="0.9" stroke-dasharray="5 4"/>
  </g>

  <!-- ======== SCALE DIMENSION ======== -->
  <g stroke="#DCEBFA" stroke-width="1" fill="#DCEBFA">
    <line x1="168" y1="530" x2="192" y2="530" marker-start="url(#dim)" marker-end="url(#dim)"/>
    <line x1="168" y1="420" x2="168" y2="540" stroke-dasharray="4 3" stroke-width="0.5"/>
    <line x1="192" y1="420" x2="192" y2="540" stroke-dasharray="4 3" stroke-width="0.5"/>
    <text x="180" y="552" text-anchor="middle" font-size="11">INSECT SCALE</text>
  </g>

  <!-- ======== CALLOUTS ======== -->
  <g stroke="#6FC3FF" stroke-width="1" fill="none">
    <line x1="180" y1="415" x2="150" y2="700" marker-start="url(#arrow)"/>
    <line x1="482" y1="430" x2="340" y2="700" marker-start="url(#arrow)"/>
    <line x1="480" y1="384" x2="530" y2="700" marker-start="url(#arrow)"/>
    <line x1="620" y1="380" x2="720" y2="700" marker-start="url(#arrow)"/>
    <line x1="895" y1="392" x2="890" y2="700" marker-start="url(#arrow)"/>
  </g>
  <g fill="#DCEBFA" font-size="13">
    <g><circle cx="150" cy="712" r="12" fill="none" stroke="#6FC3FF"/><text x="150" y="717" text-anchor="middle">1</text></g>
    <g><circle cx="340" cy="712" r="12" fill="none" stroke="#6FC3FF"/><text x="340" y="717" text-anchor="middle">2</text></g>
    <g><circle cx="530" cy="712" r="12" fill="none" stroke="#6FC3FF"/><text x="530" y="717" text-anchor="middle">3</text></g>
    <g><circle cx="720" cy="712" r="12" fill="none" stroke="#6FC3FF"/><text x="720" y="717" text-anchor="middle">4</text></g>
    <g><circle cx="890" cy="712" r="12" fill="none" stroke="#6FC3FF"/><text x="890" y="717" text-anchor="middle">5</text></g>
  </g>

  <!-- ======== PARTS LIST ======== -->
  <g font-size="13" fill="#DCEBFA">
    <rect x="50" y="800" width="620" height="156" fill="#0E3357" stroke="#6FC3FF" stroke-width="1"/>
    <text x="66" y="825" fill="#6FC3FF" font-size="14" letter-spacing="2" font-weight="bold">PARTS &amp; SYSTEMS INDEX</text>
    <line x1="66" y1="834" x2="654" y2="834" stroke="#6FC3FF" stroke-width="0.7"/>
    <text x="66" y="854">1 — PATROLLING UNIT: crawls hull continuously, inspects as it goes</text>
    <text x="66" y="874">2 — MICRO-CRACK: impact damage found in hours, not years</text>
    <text x="66" y="894">3 — WORK PARTY: neighbours recruited locally, disperse when done</text>
    <text x="66" y="914">4 — LOCAL SIGNAL: no central controller, behaviour emerges (swarm robotics)</text>
    <text x="66" y="934">5 — CHARGING DOCK: insect-scale bodies hold almost no stored energy</text>
    <text x="66" y="951" font-size="10.5" fill="#6FC3FF">UNIT DETAIL A · SHARED LEARNING FIG. B · REPAIRS ARE SMALL BY DESIGN</text>
  </g>

  <text x="1350" y="790" fill="#6FC3FF" font-size="11" text-anchor="end" letter-spacing="1">DESIGNED BY: W.A. SANDUN PRIYANKARA WIJERATHNE · sandunwijerathne51@gmail.com · github.com/sandunwijerathne</text>

  <!-- ======== TITLE BLOCK ======== -->
  <g font-size="12" fill="#DCEBFA">
    <rect x="700" y="800" width="650" height="156" fill="#0E3357" stroke="#DCEBFA" stroke-width="1.5"/>
    <line x1="700" y1="836" x2="1350" y2="836" stroke="#DCEBFA"/>
    <line x1="700" y1="872" x2="1350" y2="872" stroke="#DCEBFA"/>
    <line x1="700" y1="914" x2="1350" y2="914" stroke="#DCEBFA"/>
    <line x1="1030" y1="800" x2="1030" y2="956" stroke="#DCEBFA"/>
    <text x="716" y="820" fill="#6FC3FF" letter-spacing="1">PROJECT</text>
    <text x="716" y="830" font-size="12" font-weight="bold">OFF-WORLD CIVILISATION TOOLKIT</text>
    <text x="1046" y="820" fill="#6FC3FF">DRAWING NO.</text>
    <text x="1046" y="830" font-size="12" font-weight="bold">MY-1-GA-001 · REV A</text>
    <text x="716" y="856" fill="#6FC3FF">UNIT DESIGNATION</text>
    <text x="716" y="866" font-weight="bold" font-size="11">MY-1 "MYRMIDON" — GENERAL ARRANGEMENT</text>
    <text x="1046" y="856" fill="#6FC3FF">SWARM SIZE</text>
    <text x="1046" y="866" font-weight="bold" font-size="11">10^3 UNITS, PERMANENT</text>
    <text x="716" y="892" fill="#6FC3FF">DEPLOYMENT</text>
    <text x="716" y="902" font-weight="bold" font-size="11">EXTERIOR OF LONG-DURATION SPACECRAFT</text>
    <text x="1046" y="892" fill="#6FC3FF">LEARNING</text>
    <text x="1046" y="902" font-weight="bold" font-size="11">FEDERATED, FLEET-WIDE</text>
    <text x="716" y="936" fill="#6FC3FF">FUNCTION</text>
    <text x="716" y="946" font-weight="bold" font-size="11">CONTINUOUS PREVENTIVE HULL CARE, NEVER UNATTENDED</text>
    <text x="1046" y="936" fill="#6FC3FF">STATUS</text>
    <text x="1046" y="946" font-weight="bold" font-size="10">CONCEPT — INSPECT FIRST, EARN AUTONOMY</text>
  </g>
</svg>
