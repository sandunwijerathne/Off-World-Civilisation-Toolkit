<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#16406B" stroke-width="0.6"/>
    </pattern>
    <pattern id="gridMajor" width="125" height="125" patternUnits="userSpaceOnUse">
      <rect width="125" height="125" fill="url(#grid)"/>
      <path d="M 125 0 L 0 0 0 125" fill="none" stroke="#1E5288" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6FC3FF"/>
    </marker>
    <marker id="warrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#DCEBFA"/>
    </marker>
  </defs>

  <rect width="1400" height="1000" fill="#0B2A4A"/>
  <rect width="1400" height="1000" fill="url(#gridMajor)"/>
  <rect x="20" y="20" width="1360" height="960" fill="none" stroke="#DCEBFA" stroke-width="2"/>
  <rect x="28" y="28" width="1344" height="944" fill="none" stroke="#DCEBFA" stroke-width="0.8"/>

  <text x="50" y="70" fill="#DCEBFA" font-size="27" letter-spacing="2" font-weight="bold">RECYCLING CASCADE — RC-1 "OUROBOROS"</text>
  <text x="50" y="96" fill="#6FC3FF" font-size="14" letter-spacing="2">TOTAL MATERIALS RECLAMATION · CASCADE FLOW · RETURN LOOPS · VOLUME II · SHEET 1 OF 5</text>
  <line x1="50" y1="110" x2="1350" y2="110" stroke="#6FC3FF" stroke-width="1"/>

  <!-- ======== MAIN: descending cascade ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="2">
    <!-- mixed refuse in -->
    <path d="M 100 160 h 120 l -22 46 h -76 z"/>
    <g fill="#6FC3FF"><circle cx="130" cy="176" r="2.5"/><circle cx="152" cy="186" r="2.5"/><circle cx="176" cy="174" r="2.5"/><circle cx="196" cy="188" r="2.5"/><circle cx="150" cy="198" r="2.5"/></g>
    <text x="160" y="152" fill="#DCEBFA" font-size="10" text-anchor="middle" stroke="none">MIXED REFUSE IN</text>
    <text x="160" y="222" fill="#6FC3FF" font-size="8" text-anchor="middle" stroke="none">habitat · shops · greenhouse · plant</text>

    <!-- stage 1 sort -->
    <rect x="90" y="240" width="200" height="46" rx="5" fill="#0E3357"/>
    <rect x="90" y="240" width="200" height="46" rx="5"/>
    <text x="106" y="268" fill="#DCEBFA" font-size="11" stroke="none">1 · SORT / IDENTIFY</text>
    <path d="M 190 286 l 0 34" stroke="#6FC3FF" stroke-width="1.4" marker-end="url(#arrow)"/>

    <!-- stage 2 reuse/repair -->
    <rect x="90" y="320" width="200" height="46" rx="5" fill="#0E3357"/>
    <rect x="90" y="320" width="200" height="46" rx="5"/>
    <text x="106" y="348" fill="#DCEBFA" font-size="11" stroke="none">2 · REUSE / REPAIR</text>
    <path d="M 290 343 l 90 0" stroke="#DCEBFA" stroke-width="1.8" marker-end="url(#warrow)"/>
    <text x="392" y="340" fill="#DCEBFA" font-size="9.5" stroke="none">→ BACK IN SERVICE</text>
    <text x="392" y="354" fill="#6FC3FF" font-size="8" stroke="none">ALL EMBODIED WORK KEPT</text>
    <path d="M 190 366 l 0 34" stroke="#6FC3FF" stroke-width="1.4" marker-end="url(#arrow)"/>

    <!-- stage 3 reform -->
    <rect x="90" y="400" width="200" height="46" rx="5" fill="#0E3357"/>
    <rect x="90" y="400" width="200" height="46" rx="5"/>
    <text x="106" y="428" fill="#DCEBFA" font-size="11" stroke="none">3 · REFORM</text>
    <path d="M 290 423 l 90 0" stroke="#DCEBFA" stroke-width="1.6" marker-end="url(#warrow)"/>
    <text x="392" y="420" fill="#DCEBFA" font-size="9.5" stroke="none">→ FEEDSTOCK</text>
    <text x="392" y="434" fill="#6FC3FF" font-size="8" stroke="none">material kept, shape lost</text>
    <path d="M 190 446 l 0 34" stroke="#6FC3FF" stroke-width="1.4" marker-end="url(#arrow)"/>

    <!-- stage 4 break down -->
    <rect x="90" y="480" width="200" height="46" rx="5" fill="#0E3357"/>
    <rect x="90" y="480" width="200" height="46" rx="5"/>
    <text x="106" y="508" fill="#DCEBFA" font-size="11" stroke="none">4 · BREAK DOWN</text>
    <path d="M 290 503 l 90 0" stroke="#DCEBFA" stroke-width="1.4" marker-end="url(#warrow)"/>
    <text x="392" y="500" fill="#DCEBFA" font-size="9.5" stroke="none">→ NUTRIENTS + GASES</text>
    <text x="392" y="514" fill="#6FC3FF" font-size="8" stroke="none">to algal loop · insect reactor · crops</text>
    <path d="M 190 526 l 0 34" stroke="#6FC3FF" stroke-width="1.4" marker-end="url(#arrow)"/>

    <!-- stage 5 reduce -->
    <rect x="90" y="560" width="200" height="46" rx="5" fill="#0E3357"/>
    <rect x="90" y="560" width="200" height="46" rx="5"/>
    <text x="106" y="588" fill="#DCEBFA" font-size="11" stroke="none">5 · REDUCE (THERMAL)</text>
    <path d="M 290 583 l 90 0" stroke="#DCEBFA" stroke-width="1.2" marker-end="url(#warrow)"/>
    <text x="392" y="580" fill="#DCEBFA" font-size="9.5" stroke="none">→ SORTED ELEMENTS</text>
    <text x="392" y="594" fill="#6FC3FF" font-size="8" stroke="none">via vapour refinery (#36)</text>
    <path d="M 190 606 l 0 30" stroke="#6FC3FF" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- residue -->
    <rect x="120" y="636" width="140" height="34" rx="4"/>
    <text x="190" y="658" fill="#6FC3FF" font-size="9.5" text-anchor="middle" stroke="none">RESIDUE — THE ONLY TRUE WASTE</text>
    <text x="190" y="690" fill="#DCEBFA" font-size="8.5" text-anchor="middle" stroke="none">DESIGN GOAL: MAKE THIS AS SMALL AS POSSIBLE</text>

    <!-- energy cost gradient arrow down the side -->
    <line x1="66" y1="248" x2="66" y2="636" stroke="#6FC3FF" stroke-width="1" marker-end="url(#arrow)"/>
    <text x="58" y="440" fill="#6FC3FF" font-size="9" text-anchor="middle" transform="rotate(-90 58 440)" stroke="none">ENERGY COST RISES · VALUE FALLS — SO EXIT EARLY</text>
  </g>

  <!-- ======== NO-ELSEWHERE INSET ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.2">
    <rect x="700" y="140" width="640" height="180" fill="#0E3357" stroke="#6FC3FF"/>
    <text x="718" y="166" fill="#6FC3FF" font-size="12" letter-spacing="1" stroke="none">FIG. B — WHY "WASTE" IS AN EARTH WORD</text>
    <line x1="718" y1="176" x2="1322" y2="176" stroke="#6FC3FF" stroke-width="0.7"/>
    <!-- earth: open system -->
    <circle cx="800" cy="238" r="34"/>
    <path d="M 838 238 l 60 0" stroke="#6FC3FF" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="800" y="292" fill="#DCEBFA" font-size="8.5" text-anchor="middle" stroke="none">EARTH: OPEN</text>
    <text x="906" y="234" fill="#6FC3FF" font-size="8.5" stroke="none">"AWAY" EXISTS —</text>
    <text x="906" y="248" fill="#6FC3FF" font-size="8.5" stroke="none">huge reservoirs absorb it</text>
    <!-- habitat: closed -->
    <circle cx="1130" cy="238" r="34"/>
    <circle cx="1130" cy="238" r="44" stroke-dasharray="5 4" stroke-width="1"/>
    <path d="M 1174 238 l 30 0" stroke="#6FC3FF" stroke-width="1.4"/>
    <line x1="1204" y1="226" x2="1216" y2="250" stroke="#DCEBFA" stroke-width="1.6"/>
    <line x1="1216" y1="226" x2="1204" y2="250" stroke="#DCEBFA" stroke-width="1.6"/>
    <text x="1130" y="292" fill="#DCEBFA" font-size="8.5" text-anchor="middle" stroke="none">HABITAT: CLOSED</text>
    <text x="1130" y="306" fill="#6FC3FF" font-size="8.5" text-anchor="middle" stroke="none">DISCARDING IS NOT DISPOSAL — IT IS LOSS</text>
  </g>

  <!-- ======== RETURN LOOPS DETAIL A ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.4">
    <circle cx="1000" cy="470" r="106" stroke="#6FC3FF"/>
    <!-- central settlement -->
    <rect x="962" y="450" width="76" height="40" rx="6" fill="#0E3357"/>
    <rect x="962" y="450" width="76" height="40" rx="6"/>
    <text x="1000" y="474" fill="#DCEBFA" font-size="8.5" text-anchor="middle" stroke="none">SETTLEMENT</text>
    <!-- circulating arrows -->
    <path d="M 1000 430 A 60 60 0 0 1 1058 500" stroke="#6FC3FF" stroke-width="1.4" marker-end="url(#arrow)"/>
    <path d="M 1058 510 A 60 60 0 0 1 942 510" stroke="#6FC3FF" stroke-width="1.4" marker-end="url(#arrow)"/>
    <path d="M 942 500 A 60 60 0 0 1 1000 430" stroke="#6FC3FF" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="1000" y="404" fill="#6FC3FF" font-size="8" text-anchor="middle" stroke="none">MATERIAL GOES ROUND, NOT THROUGH</text>
    <text x="1000" y="556" fill="#DCEBFA" font-size="8" text-anchor="middle" stroke="none">ORGANICS → BIO · METALS → REFINERY</text>
    <text x="1000" y="570" fill="#DCEBFA" font-size="8" text-anchor="middle" stroke="none">POLYMERS → FABRICATION · WATER → LIFE SUPPORT</text>
    <text x="1000" y="600" fill="#6FC3FF" font-size="12" text-anchor="middle" stroke="none">DETAIL A — THE RETURN PATH OF EVERY CONCEPT</text>
    <line x1="600" y1="503" x2="900" y2="470" stroke="#6FC3FF" stroke-width="0.9" stroke-dasharray="5 4"/>
  </g>

  <!-- ======== CLOSURE PANEL ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.4">
    <rect x="700" y="640" width="640" height="116" fill="#0E3357" stroke="#6FC3FF" stroke-width="1.4"/>
    <text x="718" y="664" fill="#6FC3FF" font-size="11" letter-spacing="1" stroke="none">! PERFECT CLOSURE IS IMPOSSIBLE — SAY SO</text>
    <line x1="718" y1="672" x2="1322" y2="672" stroke="#6FC3FF" stroke-width="0.7"/>
    <g fill="#DCEBFA" font-size="9" stroke="none">
      <text x="718" y="690">EVERY PROCESS LOSES A LITTLE: ADHESION, DUST, VAPOUR, DILUTION</text>
      <text x="718" y="708">SO A TRICKLE OF NEW MATERIAL IS ALWAYS NEEDED TO MAKE UP LOSSES</text>
      <text x="718" y="726">COMPOSITES RESIST SORTING → DESIGN FOR DISASSEMBLY FROM THE START</text>
      <text x="718" y="746" fill="#6FC3FF">THE GAP BETWEEN 95% AND 100% IS WHERE THE REAL ENGINEERING LIVES</text>
    </g>
  </g>

  <!-- ======== CALLOUTS ======== -->
  <g stroke="#6FC3FF" stroke-width="1" fill="none">
    <line x1="160" y1="206" x2="180" y2="830" marker-start="url(#arrow)"/>
    <line x1="290" y1="343" x2="360" y2="830" marker-start="url(#arrow)"/>
    <line x1="290" y1="423" x2="500" y2="830" marker-start="url(#arrow)"/>
    <line x1="290" y1="503" x2="640" y2="830" marker-start="url(#arrow)"/>
    <line x1="190" y1="670" x2="790" y2="830" marker-start="url(#arrow)"/>
  </g>
  <g fill="#DCEBFA" font-size="13">
    <g><circle cx="180" cy="842" r="12" fill="none" stroke="#6FC3FF"/><text x="180" y="847" text-anchor="middle">1</text></g>
    <g><circle cx="360" cy="842" r="12" fill="none" stroke="#6FC3FF"/><text x="360" y="847" text-anchor="middle">2</text></g>
    <g><circle cx="500" cy="842" r="12" fill="none" stroke="#6FC3FF"/><text x="500" y="847" text-anchor="middle">3</text></g>
    <g><circle cx="640" cy="842" r="12" fill="none" stroke="#6FC3FF"/><text x="640" y="847" text-anchor="middle">4</text></g>
    <g><circle cx="790" cy="842" r="12" fill="none" stroke="#6FC3FF"/><text x="790" y="847" text-anchor="middle">5</text></g>
  </g>

  <!-- ======== PARTS LIST ======== -->
  <g font-size="11.5" fill="#DCEBFA">
    <rect x="50" y="862" width="640" height="96" fill="#0E3357" stroke="#6FC3FF" stroke-width="1"/>
    <text x="66" y="882" fill="#6FC3FF" font-size="12.5" letter-spacing="2" font-weight="bold">PARTS &amp; SYSTEMS INDEX</text>
    <line x1="66" y1="889" x2="674" y2="889" stroke="#6FC3FF" stroke-width="0.7"/>
    <text x="66" y="906">1 — INTAKE: mixed refuse from habitat, workshops, greenhouse, plant</text>
    <text x="66" y="924">2 — REUSE / REPAIR: highest return, least plant — keeps all embodied work</text>
    <text x="66" y="942">3 — REFORM: regrind, remelt, remould — keeps the material, loses the shape</text>
    <text x="66" y="954" font-size="10" fill="#6FC3FF">4 — BREAK DOWN to nutrients + gases · 5 — RESIDUE: minimise the only true waste</text>
  </g>

  <text x="1350" y="842" fill="#6FC3FF" font-size="11" text-anchor="end" letter-spacing="1">DESIGNED BY: W.A. SANDUN PRIYANKARA WIJERATHNE · sandunwijerathne51@gmail.com · github.com/sandunwijerathne</text>

  <!-- ======== TITLE BLOCK ======== -->
  <g font-size="11.5" fill="#DCEBFA">
    <rect x="710" y="862" width="640" height="96" fill="#0E3357" stroke="#DCEBFA" stroke-width="1.5"/>
    <line x1="710" y1="890" x2="1350" y2="890" stroke="#DCEBFA"/>
    <line x1="710" y1="918" x2="1350" y2="918" stroke="#DCEBFA"/>
    <line x1="710" y1="940" x2="1350" y2="940" stroke="#DCEBFA"/>
    <line x1="1040" y1="862" x2="1040" y2="958" stroke="#DCEBFA"/>
    <text x="726" y="880" fill="#6FC3FF" letter-spacing="1">PROJECT</text>
    <text x="726" y="888" font-size="10.5" font-weight="bold">OFF-WORLD TOOLKIT · VOLUME II — FINAL SHEET</text>
    <text x="1056" y="880" fill="#6FC3FF">DRAWING NO.</text>
    <text x="1056" y="888" font-size="10.5" font-weight="bold">RC-1-GA-001 · REV A</text>
    <text x="726" y="906" fill="#6FC3FF">UNIT DESIGNATION</text>
    <text x="726" y="915" font-weight="bold" font-size="9.5">RC-1 "OUROBOROS" — GENERAL ARRANGEMENT</text>
    <text x="1056" y="906" fill="#6FC3FF">PRINCIPLE</text>
    <text x="1056" y="915" font-weight="bold" font-size="10">CASCADE — EXIT AT THE HIGHEST VALUE</text>
    <text x="726" y="932" fill="#6FC3FF">CLOSES LOOPS FOR</text>
    <text x="726" y="938" font-weight="bold" font-size="9.5">ALL THIRTY-NINE OTHER CONCEPTS</text>
    <text x="1056" y="932" fill="#6FC3FF">STARTS AS</text>
    <text x="1056" y="938" font-weight="bold" font-size="9.5">A POLICY, NOT A PLANT</text>
    <text x="726" y="952" fill="#6FC3FF">FUNCTION</text>
    <text x="726" y="956" font-weight="bold" font-size="9">MAKES THE WORD "WASTE" OBSOLETE</text>
    <text x="1056" y="952" fill="#6FC3FF">STATUS</text>
    <text x="1056" y="956" font-weight="bold" font-size="9">CONCEPT — ACTIONABLE TODAY</text>
  </g>
</svg>
