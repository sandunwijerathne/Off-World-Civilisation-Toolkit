<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#16406B" stroke-width="0.6"/>
    </pattern>
    <pattern id="gridMajor" width="125" height="125" patternUnits="userSpaceOnUse">
      <rect width="125" height="125" fill="url(#grid)"/>
      <path d="M 125 0 L 0 0 0 125" fill="none" stroke="#1E5288" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6FC3FF"/>
    </marker>
    <marker id="dim" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M1,1 L9,9 M5,0 L5,10" stroke="#DCEBFA" stroke-width="1" fill="none"/>
    </marker>
  </defs>

  <rect width="1400" height="1000" fill="#0B2A4A"/>
  <rect width="1400" height="1000" fill="url(#gridMajor)"/>
  <rect x="20" y="20" width="1360" height="960" fill="none" stroke="#DCEBFA" stroke-width="2"/>
  <rect x="28" y="28" width="1344" height="944" fill="none" stroke="#DCEBFA" stroke-width="0.8"/>

  <text x="50" y="70" fill="#DCEBFA" font-size="28" letter-spacing="3" font-weight="bold">PLANETARY POWER LOOP — PL-1 "HELIOS RING"</text>
  <text x="50" y="96" fill="#6FC3FF" font-size="14" letter-spacing="2">ORBITAL SOLAR-POWER CONSTELLATION · SYSTEM SCHEMATIC · COLLECTOR + RECTENNA · SHEET 1 OF 5</text>
  <line x1="50" y1="110" x2="1350" y2="110" stroke="#6FC3FF" stroke-width="1"/>

  <!-- ======== SYSTEM SCHEMATIC (main) ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="2">
    <!-- Sun (top left) -->
    <circle cx="150" cy="200" r="40"/>
    <g stroke-width="1">
      <line x1="150" y1="150" x2="150" y2="130"/><line x1="150" y1="250" x2="150" y2="270"/>
      <line x1="100" y1="200" x2="80" y2="200"/><line x1="200" y1="200" x2="220" y2="200"/>
      <line x1="115" y1="165" x2="100" y2="150"/><line x1="185" y1="235" x2="200" y2="250"/>
      <line x1="185" y1="165" x2="200" y2="150"/><line x1="115" y1="235" x2="100" y2="250"/>
    </g>
    <!-- sunlight arrows to collectors -->
    <g stroke="#6FC3FF" stroke-width="0.9" stroke-dasharray="6 4">
      <line x1="210" y1="215" x2="360" y2="270" marker-end="url(#arrow)"/>
      <line x1="215" y1="200" x2="560" y2="245" marker-end="url(#arrow)"/>
    </g>

    <!-- planet (bottom, big arc) -->
    <path d="M 120 900 Q 700 560 1280 900" stroke-width="1.4"/>
    <path d="M 120 900 Q 700 580 1280 900" stroke-width="0.6" stroke-dasharray="4 6"/>
    <text x="700" y="720" fill="#6FC3FF" font-size="11" text-anchor="middle" stroke="none">COLONY WORLD (MOON / MARS)</text>

    <!-- orbital ring (dashed ellipse) -->
    <path d="M 320 300 Q 700 210 1080 300" stroke-width="0.9" stroke-dasharray="8 6"/>

    <!-- collector satellites (3 around ring) -->
    <!-- collector A (left, active beam) -->
    <g>
      <rect x="330" y="250" width="90" height="34"/>
      <path d="M 348 250 v34 M 366 250 v34 M 384 250 v34 M 402 250 v34" stroke-width="0.7"/>
      <rect x="368" y="284" width="14" height="14"/>
    </g>
    <!-- collector B (center) -->
    <g>
      <rect x="655" y="222" width="90" height="34"/>
      <path d="M 673 222 v34 M 691 222 v34 M 709 222 v34 M 727 222 v34" stroke-width="0.7"/>
      <rect x="693" y="256" width="14" height="14"/>
    </g>
    <!-- collector C (right) -->
    <g>
      <rect x="980" y="250" width="90" height="34"/>
      <path d="M 998 250 v34 M 1016 250 v34 M 1034 250 v34 M 1052 250 v34" stroke-width="0.7"/>
      <rect x="1018" y="284" width="14" height="14"/>
    </g>
    <!-- baton hand-off arcs -->
    <path d="M 420 267 Q 540 232 655 239" stroke="#6FC3FF" stroke-width="0.8" stroke-dasharray="3 4" marker-end="url(#arrow)"/>
    <path d="M 745 239 Q 862 232 980 267" stroke="#6FC3FF" stroke-width="0.8" stroke-dasharray="3 4" marker-end="url(#arrow)"/>
    <text x="700" y="200" fill="#6FC3FF" font-size="9" text-anchor="middle" stroke="none">RELAY HAND-OFF (CONTINUOUS COVERAGE)</text>

    <!-- microwave beam from collector B down to rectenna -->
    <path d="M 690 270 L 660 660 M 710 270 L 740 660" stroke="#6FC3FF" stroke-width="1.4"/>
    <g stroke="#6FC3FF" stroke-width="0.7">
      <path d="M 693 360 h 22 M 690 440 h 28 M 686 520 h 36 M 682 600 h 44"/>
    </g>
    <text x="770" y="470" fill="#6FC3FF" font-size="10" stroke="none">MICROWAVE BEAM</text>
    <text x="770" y="484" fill="#6FC3FF" font-size="9" stroke="none">(LOW INTENSITY, PILOT-LOCKED)</text>

    <!-- rectenna on surface -->
    <path d="M 640 662 h 120" stroke-width="2"/>
    <g stroke-width="0.8">
      <line x1="650" y1="662" x2="650" y2="650"/><line x1="666" y1="662" x2="666" y2="648"/>
      <line x1="682" y1="662" x2="682" y2="646"/><line x1="698" y1="662" x2="698" y2="646"/>
      <line x1="714" y1="662" x2="714" y2="646"/><line x1="730" y1="662" x2="730" y2="648"/>
      <line x1="746" y1="662" x2="746" y2="650"/>
    </g>
    <text x="700" y="694" fill="#6FC3FF" font-size="9" text-anchor="middle" stroke="none">RECTENNA (MESH → DC)</text>

    <!-- pilot beam up -->
    <path d="M 760 660 L 720 275" stroke="#DCEBFA" stroke-width="0.7" stroke-dasharray="2 5" marker-end="url(#arrow)"/>
    <text x="792" y="560" fill="#DCEBFA" font-size="8.5" stroke="none">PILOT SIGNAL</text>

    <!-- base habitat -->
    <path d="M 560 662 q 20 -26 40 0 z"/>
    <rect x="566" y="650" width="8" height="12"/>
  </g>

  <!-- ======== DETAIL A: rectenna element ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.4">
    <circle cx="1150" cy="470" r="82" stroke="#6FC3FF"/>
    <!-- dipole + diode -->
    <line x1="1108" y1="450" x2="1192" y2="450" stroke-width="1.6"/>
    <path d="M 1150 450 l 0 30" stroke-width="1.2"/>
    <path d="M 1140 480 l 20 0 l -10 16 z"/>
    <line x1="1150" y1="496" x2="1150" y2="512" stroke-width="1.2"/>
    <line x1="1120" y1="512" x2="1180" y2="512" stroke-width="1.6"/>
    <g fill="#DCEBFA" font-size="9" stroke="none">
      <text x="1150" y="440" text-anchor="middle">ANTENNA</text>
      <text x="1200" y="492">DIODE</text>
      <text x="1150" y="528" text-anchor="middle">DC BUS</text>
    </g>
    <text x="1150" y="580" fill="#6FC3FF" font-size="12" text-anchor="middle" stroke="none">DETAIL A — RECTENNA CELL</text>
    <line x1="740" y1="640" x2="1068" y2="480" stroke="#6FC3FF" stroke-width="0.9" stroke-dasharray="5 4"/>
  </g>

  <!-- ======== CALLOUTS ======== -->
  <g stroke="#6FC3FF" stroke-width="1" fill="none">
    <line x1="150" y1="240" x2="150" y2="760" marker-start="url(#arrow)"/>
    <line x1="700" y1="222" x2="700" y2="150" marker-start="url(#arrow)"/>
    <line x1="700" y1="400" x2="900" y2="760" marker-start="url(#arrow)"/>
    <line x1="700" y1="662" x2="480" y2="760" marker-start="url(#arrow)"/>
    <line x1="580" y1="655" x2="360" y2="760" marker-start="url(#arrow)"/>
  </g>
  <g fill="#DCEBFA" font-size="13">
    <g><circle cx="150" cy="772" r="12" fill="none" stroke="#6FC3FF"/><text x="150" y="777" text-anchor="middle">1</text></g>
    <g><circle cx="700" cy="142" r="12" fill="none" stroke="#6FC3FF"/><text x="700" y="147" text-anchor="middle">2</text></g>
    <g><circle cx="900" cy="772" r="12" fill="none" stroke="#6FC3FF"/><text x="900" y="777" text-anchor="middle">3</text></g>
    <g><circle cx="480" cy="772" r="12" fill="none" stroke="#6FC3FF"/><text x="480" y="777" text-anchor="middle">4</text></g>
    <g><circle cx="360" cy="772" r="12" fill="none" stroke="#6FC3FF"/><text x="360" y="777" text-anchor="middle">5</text></g>
  </g>

  <!-- ======== PARTS LIST ======== -->
  <g font-size="13" fill="#DCEBFA">
    <rect x="50" y="800" width="620" height="156" fill="#0E3357" stroke="#6FC3FF" stroke-width="1"/>
    <text x="66" y="825" fill="#6FC3FF" font-size="14" letter-spacing="2" font-weight="bold">PARTS &amp; SYSTEMS INDEX</text>
    <line x1="66" y1="834" x2="654" y2="834" stroke="#6FC3FF" stroke-width="0.7"/>
    <text x="66" y="854">1 — SUNLIGHT: unbroken above atmosphere, no night, no dust storm</text>
    <text x="66" y="874">2 — COLLECTOR CONSTELLATION: PV + phased-array transmitter, relay ring</text>
    <text x="66" y="894">3 — MICROWAVE BEAM: low-intensity, pilot-locked, fail-safe defocus</text>
    <text x="66" y="914">4 — RECTENNA FIELD: wire mesh + diodes → DC, no moving parts (DETAIL A)</text>
    <text x="66" y="934">5 — BASE GRID: continuous power to life support, greenhouse, ISRU fuel</text>
  </g>

  <text x="1350" y="790" fill="#6FC3FF" font-size="11" text-anchor="end" letter-spacing="1">DESIGNED BY: W.A. SANDUN PRIYANKARA WIJERATHNE · sandunwijerathne51@gmail.com · github.com/sandunwijerathne</text>

  <!-- ======== TITLE BLOCK ======== -->
  <g font-size="12" fill="#DCEBFA">
    <rect x="700" y="800" width="650" height="156" fill="#0E3357" stroke="#DCEBFA" stroke-width="1.5"/>
    <line x1="700" y1="836" x2="1350" y2="836" stroke="#DCEBFA"/>
    <line x1="700" y1="872" x2="1350" y2="872" stroke="#DCEBFA"/>
    <line x1="700" y1="914" x2="1350" y2="914" stroke="#DCEBFA"/>
    <line x1="1030" y1="800" x2="1030" y2="956" stroke="#DCEBFA"/>
    <text x="716" y="820" fill="#6FC3FF" letter-spacing="1">PROJECT</text>
    <text x="716" y="830" font-size="12" font-weight="bold">OFF-WORLD CIVILISATION TOOLKIT</text>
    <text x="1046" y="820" fill="#6FC3FF">DRAWING NO.</text>
    <text x="1046" y="830" font-size="12" font-weight="bold">PL-1-GA-001 · REV A</text>
    <text x="716" y="856" fill="#6FC3FF">UNIT DESIGNATION</text>
    <text x="716" y="866" font-weight="bold" font-size="11">PL-1 "HELIOS RING" — GENERAL ARRANGEMENT</text>
    <text x="1046" y="856" fill="#6FC3FF">SEGMENT</text>
    <text x="1046" y="866" font-weight="bold" font-size="11">ORBIT + SURFACE</text>
    <text x="716" y="892" fill="#6FC3FF">DEPLOYMENT</text>
    <text x="716" y="902" font-weight="bold" font-size="11">LUNAR / MARTIAN ORBIT + COLONY SURFACE</text>
    <text x="1046" y="892" fill="#6FC3FF">DELIVERS</text>
    <text x="1046" y="902" font-weight="bold" font-size="11">CONTINUOUS ELECTRICITY</text>
    <text x="716" y="936" fill="#6FC3FF">FUNCTION</text>
    <text x="716" y="946" font-weight="bold" font-size="11">BEAMS ORBITAL SUNLIGHT TO SURFACE, DAY + NIGHT</text>
    <text x="1046" y="936" fill="#6FC3FF">STATUS</text>
    <text x="1046" y="946" font-weight="bold" font-size="10">CONCEPT — ORBIT-DEMOED, OFF-EARTH FIRST</text>
  </g>
</svg>
