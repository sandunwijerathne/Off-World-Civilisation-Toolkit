<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#16406B" stroke-width="0.6"/>
    </pattern>
    <pattern id="gridMajor" width="125" height="125" patternUnits="userSpaceOnUse">
      <rect width="125" height="125" fill="url(#grid)"/>
      <path d="M 125 0 L 0 0 0 125" fill="none" stroke="#1E5288" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6FC3FF"/>
    </marker>
    <marker id="dim" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M1,1 L9,9 M5,0 L5,10" stroke="#DCEBFA" stroke-width="1" fill="none"/>
    </marker>
  </defs>

  <rect width="1400" height="1000" fill="#0B2A4A"/>
  <rect width="1400" height="1000" fill="url(#gridMajor)"/>
  <rect x="20" y="20" width="1360" height="960" fill="none" stroke="#DCEBFA" stroke-width="2"/>
  <rect x="28" y="28" width="1344" height="944" fill="none" stroke="#DCEBFA" stroke-width="0.8"/>

  <text x="50" y="70" fill="#DCEBFA" font-size="27" letter-spacing="2" font-weight="bold">RAIL INTERCEPTOR — RI-1 (CONCEPTUAL)</text>
  <text x="50" y="96" fill="#6FC3FF" font-size="14" letter-spacing="2">ORBITAL KINETIC POINT-DEFENCE · PRINCIPLE SCHEMATIC ONLY · NOT AN ENGINEERING DRAWING · SHEET 1 OF 1</text>
  <line x1="50" y1="110" x2="1350" y2="110" stroke="#6FC3FF" stroke-width="1"/>

  <!-- ======== PRINCIPLE SCHEMATIC (block-level only) ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="2">
    <!-- power source block -->
    <rect x="150" y="400" width="120" height="90" rx="6"/>
    <path d="M 180 420 v50 M 200 420 v50 M 220 420 v50" stroke-width="0.7"/>
    <circle cx="245" cy="435" r="8"/>
    <text x="210" y="512" fill="#6FC3FF" font-size="10" text-anchor="middle" stroke="none">SOLAR POWER</text>

    <!-- energy store block (abstract) -->
    <rect x="330" y="400" width="120" height="90" rx="6"/>
    <text x="390" y="450" fill="#DCEBFA" font-size="14" text-anchor="middle" stroke="none">ENERGY</text>
    <text x="390" y="468" fill="#DCEBFA" font-size="14" text-anchor="middle" stroke="none">STORE</text>
    <text x="390" y="512" fill="#6FC3FF" font-size="9" text-anchor="middle" stroke="none">(BLOCK-LEVEL ONLY)</text>

    <!-- flow arrows -->
    <line x1="270" y1="445" x2="330" y2="445" marker-end="url(#arrow)" stroke="#6FC3FF" stroke-width="1.2"/>
    <line x1="450" y1="445" x2="510" y2="445" marker-end="url(#arrow)" stroke="#6FC3FF" stroke-width="1.2"/>

    <!-- accelerator (two parallel rails, abstract) -->
    <line x1="510" y1="420" x2="820" y2="420" stroke-width="3"/>
    <line x1="510" y1="470" x2="820" y2="470" stroke-width="3"/>
    <!-- inert projectile between rails -->
    <rect x="545" y="435" width="30" height="20" rx="3" fill="#0B2A4A"/>
    <text x="560" y="500" fill="#6FC3FF" font-size="9" text-anchor="middle" stroke="none">INERT MASS</text>
    <text x="665" y="408" fill="#6FC3FF" font-size="10" text-anchor="middle" stroke="none">ELECTROMAGNETIC ACCELERATOR (SCHEMATIC)</text>

    <!-- muzzle + velocity arrow -->
    <line x1="820" y1="445" x2="1000" y2="445" stroke="#6FC3FF" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#arrow)"/>
    <text x="900" y="432" fill="#6FC3FF" font-size="10" text-anchor="middle" stroke="none">HIGH CLOSING SPEED</text>
    <text x="900" y="474" fill="#DCEBFA" font-size="9" text-anchor="middle" stroke="none">NO WARHEAD — MOTION IS THE ENERGY</text>

    <!-- incoming threat + intercept -->
    <circle cx="1120" cy="360" r="10"/>
    <path d="M 1112 368 l -70 60" stroke="#DCEBFA" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="1130" y="352" fill="#DCEBFA" font-size="9" stroke="none">INCOMING THREAT</text>
    <!-- intercept flash -->
    <g stroke="#6FC3FF" stroke-width="1">
      <path d="M 1030 440 l 16 -8 M 1030 440 l 18 4 M 1030 440 l 12 16 M 1030 440 l -4 -18"/>
    </g>
    <text x="1030" y="490" fill="#6FC3FF" font-size="9" text-anchor="middle" stroke="none">KINETIC INTERCEPT</text>

    <!-- radiator (heat) -->
    <g stroke-width="1.4">
      <line x1="600" y1="490" x2="590" y2="540"/><line x1="640" y1="490" x2="632" y2="540"/>
      <line x1="680" y1="490" x2="674" y2="540"/>
    </g>
    <text x="640" y="558" fill="#6FC3FF" font-size="9" text-anchor="middle" stroke="none">WASTE HEAT RADIATORS</text>
  </g>

  <!-- ======== GOVERNANCE PANEL (prominent, replaces a 'detail') ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.4">
    <rect x="960" y="560" width="360" height="180" fill="#0E3357" stroke="#6FC3FF" stroke-width="1.4"/>
    <text x="978" y="586" fill="#6FC3FF" font-size="12" letter-spacing="1" stroke="none">! GOVERNANCE, NOT ENGINEERING</text>
    <line x1="978" y1="596" x2="1302" y2="596" stroke="#6FC3FF" stroke-width="0.7"/>
    <g fill="#DCEBFA" font-size="10.5" stroke="none">
      <text x="978" y="618">• DEFENSIVE + OFFENSIVE FORMS NEARLY IDENTICAL</text>
      <text x="978" y="640">• ROLE SET BY INTENT, NOT BY DESIGN</text>
      <text x="978" y="662">• KINETIC HITS CREATE LONG-LIVED DEBRIS</text>
      <text x="978" y="684">• DESTABILISING — BELONGS TO ARMS CONTROL</text>
      <text x="978" y="712" fill="#6FC3FF">PRESENTED AS A CAUTION, NOT A BLUEPRINT</text>
    </g>
  </g>

  <!-- ======== CALLOUTS ======== -->
  <g stroke="#6FC3FF" stroke-width="1" fill="none">
    <line x1="210" y1="490" x2="200" y2="800" marker-start="url(#arrow)"/>
    <line x1="390" y1="490" x2="380" y2="800" marker-start="url(#arrow)"/>
    <line x1="665" y1="420" x2="520" y2="800" marker-start="url(#arrow)"/>
    <line x1="560" y1="455" x2="660" y2="800" marker-start="url(#arrow)"/>
    <line x1="1030" y1="452" x2="820" y2="800" marker-start="url(#arrow)"/>
  </g>
  <g fill="#DCEBFA" font-size="13">
    <g><circle cx="200" cy="812" r="12" fill="none" stroke="#6FC3FF"/><text x="200" y="817" text-anchor="middle">1</text></g>
    <g><circle cx="380" cy="812" r="12" fill="none" stroke="#6FC3FF"/><text x="380" y="817" text-anchor="middle">2</text></g>
    <g><circle cx="520" cy="812" r="12" fill="none" stroke="#6FC3FF"/><text x="520" y="817" text-anchor="middle">3</text></g>
    <g><circle cx="660" cy="812" r="12" fill="none" stroke="#6FC3FF"/><text x="660" y="817" text-anchor="middle">4</text></g>
    <g><circle cx="820" cy="812" r="12" fill="none" stroke="#6FC3FF"/><text x="820" y="817" text-anchor="middle">5</text></g>
  </g>

  <!-- ======== PARTS LIST ======== -->
  <g font-size="13" fill="#DCEBFA">
    <rect x="50" y="832" width="620" height="124" fill="#0E3357" stroke="#6FC3FF" stroke-width="1"/>
    <text x="66" y="857" fill="#6FC3FF" font-size="13" letter-spacing="2" font-weight="bold">PRINCIPLE INDEX (BLOCK-LEVEL)</text>
    <line x1="66" y1="866" x2="654" y2="866" stroke="#6FC3FF" stroke-width="0.7"/>
    <text x="66" y="886" font-size="12">1 — SOLAR POWER: charges the store slowly · 2 — ENERGY STORE (abstract)</text>
    <text x="66" y="906" font-size="12">3 — EM ACCELERATOR: shown as principle only, no engineering detail</text>
    <text x="66" y="926" font-size="12">4 — INERT MASS: no warhead; orbital speed supplies the energy</text>
    <text x="66" y="946" font-size="12">5 — KINETIC INTERCEPT: defeats threat by impact · SEE GOVERNANCE PANEL</text>
  </g>

  <text x="1350" y="820" fill="#6FC3FF" font-size="11" text-anchor="end" letter-spacing="1">DESIGNED BY: W.A. SANDUN PRIYANKARA WIJERATHNE · sandunwijerathne51@gmail.com · github.com/sandunwijerathne</text>

  <!-- ======== TITLE BLOCK ======== -->
  <g font-size="12" fill="#DCEBFA">
    <rect x="700" y="832" width="650" height="124" fill="#0E3357" stroke="#DCEBFA" stroke-width="1.5"/>
    <line x1="700" y1="864" x2="1350" y2="864" stroke="#DCEBFA"/>
    <line x1="700" y1="898" x2="1350" y2="898" stroke="#DCEBFA"/>
    <line x1="700" y1="928" x2="1350" y2="928" stroke="#DCEBFA"/>
    <line x1="1030" y1="832" x2="1030" y2="956" stroke="#DCEBFA"/>
    <text x="716" y="851" fill="#6FC3FF" letter-spacing="1">PROJECT</text>
    <text x="716" y="861" font-size="11" font-weight="bold">OFF-WORLD CIVILISATION TOOLKIT</text>
    <text x="1046" y="851" fill="#6FC3FF">DRAWING NO.</text>
    <text x="1046" y="861" font-size="11" font-weight="bold">RI-1-GA-001 · REV A</text>
    <text x="716" y="884" fill="#6FC3FF">UNIT DESIGNATION</text>
    <text x="716" y="894" font-weight="bold" font-size="10.5">RI-1 — PRINCIPLE SCHEMATIC (CONCEPTUAL)</text>
    <text x="1046" y="884" fill="#6FC3FF">DETAIL LEVEL</text>
    <text x="1046" y="894" font-weight="bold" font-size="11">BLOCK / PRINCIPLE ONLY</text>
    <text x="716" y="916" fill="#6FC3FF">PHYSICS</text>
    <text x="716" y="926" font-weight="bold" font-size="11">KINETIC ENERGY AT ORBITAL SPEED (PUBLIC)</text>
    <text x="1046" y="916" fill="#6FC3FF">REAL DOMAIN</text>
    <text x="1046" y="926" font-weight="bold" font-size="11">ARMS CONTROL</text>
    <text x="716" y="948" fill="#6FC3FF">STATUS</text>
    <text x="716" y="958" font-weight="bold" font-size="10.5">CONCEPT — CAUTIONARY, NOT FOR CONSTRUCTION</text>
    <text x="1046" y="948" fill="#6FC3FF">FRAMING</text>
    <text x="1046" y="958" font-weight="bold" font-size="11">GOVERN, DON'T BUILD</text>
  </g>
</svg>
