<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#16406B" stroke-width="0.6"/>
    </pattern>
    <pattern id="gridMajor" width="125" height="125" patternUnits="userSpaceOnUse">
      <rect width="125" height="125" fill="url(#grid)"/>
      <path d="M 125 0 L 0 0 0 125" fill="none" stroke="#1E5288" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6FC3FF"/>
    </marker>
    <marker id="warrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#DCEBFA"/>
    </marker>
    <marker id="dim" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M1,1 L9,9 M5,0 L5,10" stroke="#DCEBFA" stroke-width="1" fill="none"/>
    </marker>
  </defs>

  <rect width="1400" height="1000" fill="#0B2A4A"/>
  <rect width="1400" height="1000" fill="url(#gridMajor)"/>
  <rect x="20" y="20" width="1360" height="960" fill="none" stroke="#DCEBFA" stroke-width="2"/>
  <rect x="28" y="28" width="1344" height="944" fill="none" stroke="#DCEBFA" stroke-width="0.8"/>

  <text x="50" y="70" fill="#DCEBFA" font-size="26" letter-spacing="2" font-weight="bold">ATMOSPHERIC WATER CONDENSER — AW-1 "AQUARIUS"</text>
  <text x="50" y="96" fill="#6FC3FF" font-size="14" letter-spacing="2">FROST-HARVEST FROM MARTIAN AIR · COLD-TRAP FLOW · FROST DETAIL · VOLUME II · SHEET 1 OF 5</text>
  <line x1="50" y1="110" x2="1350" y2="110" stroke="#6FC3FF" stroke-width="1"/>

  <!-- ======== MAIN CONDENSER SCHEMATIC ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="2">
    <!-- intake: thin martian air -->
    <text x="120" y="280" fill="#DCEBFA" font-size="10" stroke="none">THIN MARTIAN AIR (~1/100 EARTH)</text>
    <g stroke="#6FC3FF" stroke-width="1">
      <path d="M 120 300 l 60 0" marker-end="url(#arrow)"/>
      <path d="M 120 330 l 60 0" marker-end="url(#arrow)"/>
      <path d="M 120 360 l 60 0" marker-end="url(#arrow)"/>
    </g>
    <text x="120" y="392" fill="#6FC3FF" font-size="8.5" stroke="none">TRACE WATER VAPOUR</text>

    <!-- air-mover / blower -->
    <circle cx="230" cy="330" r="42"/>
    <path d="M 230 330 l 0 -30 M 230 330 l 26 15 M 230 330 l -26 15" stroke="#6FC3FF" stroke-width="1.4"/>
    <text x="230" y="392" fill="#6FC3FF" font-size="9" text-anchor="middle" stroke="none">AIR MOVER</text>
    <text x="230" y="290" fill="#DCEBFA" font-size="8" text-anchor="middle" stroke="none">DRAWS LARGE VOLUME</text>
    <path d="M 272 330 l 50 0" stroke="#6FC3FF" stroke-width="1.4" marker-end="url(#arrow)"/>

    <!-- cold trap chamber -->
    <rect x="325" y="250" width="230" height="170" rx="8" fill="#0E3357"/>
    <rect x="325" y="250" width="230" height="170" rx="8"/>
    <text x="440" y="242" fill="#6FC3FF" font-size="11" text-anchor="middle" stroke="none">COLD TRAP (BELOW FROST POINT)</text>
    <!-- cold plates -->
    <g stroke-width="1.6">
      <line x1="360" y1="280" x2="360" y2="390"/>
      <line x1="400" y1="280" x2="400" y2="390"/>
      <line x1="440" y1="280" x2="440" y2="390"/>
      <line x1="480" y1="280" x2="480" y2="390"/>
      <line x1="520" y1="280" x2="520" y2="390"/>
    </g>
    <!-- frost dots on plates -->
    <g fill="#DCEBFA"><circle cx="360" cy="310" r="2"/><circle cx="360" cy="350" r="2"/><circle cx="400" cy="330" r="2"/><circle cx="440" cy="300" r="2"/><circle cx="440" cy="360" r="2"/><circle cx="480" cy="330" r="2"/><circle cx="520" cy="310" r="2"/><circle cx="520" cy="360" r="2"/></g>
    <text x="440" y="408" fill="#DCEBFA" font-size="8" text-anchor="middle" stroke="none">FROST DEPOSITS ON COLD PLATES</text>

    <!-- radiative cooling to sky -->
    <g stroke="#6FC3FF" stroke-width="1"><path d="M 380 250 l -10 -30 M 440 250 l 0 -30 M 500 250 l 10 -30"/></g>
    <text x="440" y="200" fill="#6FC3FF" font-size="9" text-anchor="middle" stroke="none">RADIATE HEAT TO COLD NIGHT SKY (FREE COOLING)</text>

    <!-- drier air exhaust -->
    <path d="M 555 300 l 60 0" stroke="#DCEBFA" stroke-width="1.2" marker-end="url(#warrow)"/>
    <text x="625" y="296" fill="#DCEBFA" font-size="9" stroke="none">DRIER AIR OUT</text>

    <!-- warm + melt -> collection -->
    <path d="M 440 420 l 0 50" stroke="#6FC3FF" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="455" y="450" fill="#6FC3FF" font-size="8.5" stroke="none">WARM → MELT</text>
    <!-- storage cistern -->
    <path d="M 370 470 h 140 v 70 a 20 20 0 0 1 -20 20 h -100 a 20 20 0 0 1 -20 -20 z" fill="#0E3357"/>
    <path d="M 380 520 q 30 -12 60 0 q 30 12 60 0" stroke="#6FC3FF" stroke-width="1.2"/>
    <text x="440" y="586" fill="#6FC3FF" font-size="10" text-anchor="middle" stroke="none">LIQUID WATER STORED</text>
  </g>

  <!-- ======== SOURCE-NICHE INSET (top right) ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.2">
    <rect x="720" y="140" width="620" height="200" fill="#0E3357" stroke="#6FC3FF"/>
    <text x="738" y="166" fill="#6FC3FF" font-size="12" letter-spacing="1" stroke="none">FIG. B — MARS WATER SOURCES: THE NICHE</text>
    <line x1="738" y1="176" x2="1322" y2="176" stroke="#6FC3FF" stroke-width="0.7"/>
    <g fill="#DCEBFA" font-size="9.5" stroke="none">
      <text x="738" y="204">BURIED ICE — large, but FIXED: dig + haul</text>
      <text x="738" y="228">HYDRATED MINERALS — moderate, FIXED: mine + heat</text>
      <text x="738" y="252" fill="#6FC3FF">ATMOSPHERE — small, but EVERYWHERE: condense in place</text>
    </g>
    <line x1="738" y1="272" x2="1322" y2="272" stroke="#16406B" stroke-width="0.7"/>
    <text x="738" y="298" fill="#DCEBFA" font-size="9" stroke="none">THE CONDENSER DOESN'T OUT-PRODUCE THE MINES —</text>
    <text x="738" y="318" fill="#6FC3FF" font-size="9" stroke="none">IT RUNS WHERE THE MINES ARE NOT. A WELL DUG ANYWHERE.</text>
  </g>

  <!-- ======== FROST DETAIL A ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.4">
    <circle cx="1120" cy="560" r="92" stroke="#6FC3FF"/>
    <!-- cold surface -->
    <line x1="1050" y1="580" x2="1190" y2="580" stroke-width="2"/>
    <text x="1120" y="600" fill="#DCEBFA" font-size="8" text-anchor="middle" stroke="none">COLD SURFACE (BELOW FROST POINT)</text>
    <!-- vapour molecules approaching -->
    <g fill="#6FC3FF"><circle cx="1075" cy="530" r="2"/><circle cx="1100" cy="520" r="2"/><circle cx="1130" cy="528" r="2"/><circle cx="1160" cy="518" r="2"/></g>
    <g stroke="#6FC3FF" stroke-width="0.8">
      <path d="M 1075 534 l 4 20" marker-end="url(#arrow)"/>
      <path d="M 1100 524 l 2 30" marker-end="url(#arrow)"/>
      <path d="M 1130 532 l -2 22" marker-end="url(#arrow)"/>
      <path d="M 1160 522 l -4 32" marker-end="url(#arrow)"/>
    </g>
    <text x="1120" y="512" fill="#6FC3FF" font-size="8" text-anchor="middle" stroke="none">WATER VAPOUR</text>
    <!-- frost crystals on surface -->
    <g stroke="#DCEBFA" stroke-width="1.2">
      <path d="M 1075 580 l 0 -10 M 1072 574 l 6 0 M 1100 580 l 0 -12 M 1096 573 l 8 0 M 1130 580 l 0 -9 M 1160 580 l 0 -11 M 1156 574 l 8 0"/>
    </g>
    <text x="1120" y="626" fill="#6FC3FF" font-size="8" text-anchor="middle" stroke="none">DEPOSITS AS FROST (LIKE DAWN)</text>
    <text x="1120" y="676" fill="#6FC3FF" font-size="12" text-anchor="middle" stroke="none">DETAIL A — FROST ON COLD SURFACE</text>
    <line x1="520" y1="330" x2="1032" y2="548" stroke="#6FC3FF" stroke-width="0.9" stroke-dasharray="5 4"/>
  </g>

  <!-- ======== DILUTION PANEL ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.4">
    <rect x="720" y="640" width="360" height="146" fill="#0E3357" stroke="#6FC3FF" stroke-width="1.4"/>
    <text x="738" y="664" fill="#6FC3FF" font-size="11" letter-spacing="1" stroke="none">! A PATIENT TRICKLE, NOT A TORRENT</text>
    <line x1="738" y1="672" x2="1064" y2="672" stroke="#6FC3FF" stroke-width="0.7"/>
    <g fill="#DCEBFA" font-size="9" stroke="none">
      <text x="738" y="692">DILUTION: AIR HOLDS VERY LITTLE WATER —</text>
      <text x="738" y="710">MUST PROCESS LARGE VOLUME FOR MODEST YIELD</text>
      <text x="738" y="734">• LEAN ON NIGHT COLD + RADIATIVE COOLING</text>
      <text x="738" y="752">• DUST CAN FOUL THE COLD SURFACE</text>
      <text x="738" y="774" fill="#6FC3FF">VALUE = UBIQUITY, NOT ABUNDANCE</text>
    </g>
  </g>

  <!-- ======== CALLOUTS ======== -->
  <g stroke="#6FC3FF" stroke-width="1" fill="none">
    <line x1="230" y1="372" x2="180" y2="810" marker-start="url(#arrow)"/>
    <line x1="440" y1="330" x2="360" y2="810" marker-start="url(#arrow)"/>
    <line x1="440" y1="220" x2="500" y2="810" marker-start="url(#arrow)"/>
    <line x1="440" y1="470" x2="640" y2="810" marker-start="url(#arrow)"/>
    <line x1="555" y1="300" x2="790" y2="810" marker-start="url(#arrow)"/>
  </g>
  <g fill="#DCEBFA" font-size="13">
    <g><circle cx="180" cy="822" r="12" fill="none" stroke="#6FC3FF"/><text x="180" y="827" text-anchor="middle">1</text></g>
    <g><circle cx="360" cy="822" r="12" fill="none" stroke="#6FC3FF"/><text x="360" y="827" text-anchor="middle">2</text></g>
    <g><circle cx="500" cy="822" r="12" fill="none" stroke="#6FC3FF"/><text x="500" y="827" text-anchor="middle">3</text></g>
    <g><circle cx="640" cy="822" r="12" fill="none" stroke="#6FC3FF"/><text x="640" y="827" text-anchor="middle">4</text></g>
    <g><circle cx="790" cy="822" r="12" fill="none" stroke="#6FC3FF"/><text x="790" y="827" text-anchor="middle">5</text></g>
  </g>

  <!-- ======== PARTS LIST ======== -->
  <g font-size="12" fill="#DCEBFA">
    <rect x="50" y="842" width="640" height="114" fill="#0E3357" stroke="#6FC3FF" stroke-width="1"/>
    <text x="66" y="864" fill="#6FC3FF" font-size="13" letter-spacing="2" font-weight="bold">PARTS &amp; SYSTEMS INDEX</text>
    <line x1="66" y1="872" x2="674" y2="872" stroke="#6FC3FF" stroke-width="0.7"/>
    <text x="66" y="890">1 — AIR MOVER: draws large volume of thin atmosphere across the trap</text>
    <text x="66" y="908">2 — COLD TRAP: plates below frost point; water deposits as frost (DETAIL A)</text>
    <text x="66" y="926">3 — RADIATIVE / NIGHT COOLING: free cold from the Martian sky</text>
    <text x="66" y="944" font-size="10.5" fill="#6FC3FF">4 — WARM → MELT → STORE liquid water · 5 — DRIER AIR EXHAUSTED</text>
  </g>

  <text x="1350" y="822" fill="#6FC3FF" font-size="11" text-anchor="end" letter-spacing="1">DESIGNED BY: W.A. SANDUN PRIYANKARA WIJERATHNE · sandunwijerathne51@gmail.com · github.com/sandunwijerathne</text>

  <!-- ======== TITLE BLOCK ======== -->
  <g font-size="12" fill="#DCEBFA">
    <rect x="710" y="842" width="640" height="114" fill="#0E3357" stroke="#DCEBFA" stroke-width="1.5"/>
    <line x1="710" y1="874" x2="1350" y2="874" stroke="#DCEBFA"/>
    <line x1="710" y1="906" x2="1350" y2="906" stroke="#DCEBFA"/>
    <line x1="710" y1="936" x2="1350" y2="936" stroke="#DCEBFA"/>
    <line x1="1040" y1="842" x2="1040" y2="956" stroke="#DCEBFA"/>
    <text x="726" y="862" fill="#6FC3FF" letter-spacing="1">PROJECT</text>
    <text x="726" y="872" font-size="11" font-weight="bold">OFF-WORLD TOOLKIT · VOLUME II</text>
    <text x="1056" y="862" fill="#6FC3FF">DRAWING NO.</text>
    <text x="1056" y="872" font-size="11" font-weight="bold">AW-1-GA-001 · REV A</text>
    <text x="726" y="894" fill="#6FC3FF">UNIT DESIGNATION</text>
    <text x="726" y="903" font-weight="bold" font-size="10">AW-1 "AQUARIUS" — GENERAL ARRANGEMENT</text>
    <text x="1056" y="894" fill="#6FC3FF">SOURCE</text>
    <text x="1056" y="903" font-weight="bold" font-size="11">MARTIAN AIR (EVERYWHERE)</text>
    <text x="726" y="925" fill="#6FC3FF">METHOD</text>
    <text x="726" y="934" font-weight="bold" font-size="10.5">COOL BELOW FROST POINT → COLLECT FROST</text>
    <text x="1056" y="925" fill="#6FC3FF">YIELD</text>
    <text x="1056" y="934" font-weight="bold" font-size="11">SMALL BUT LOCATION-FREE</text>
    <text x="726" y="950" fill="#6FC3FF">FUNCTION</text>
    <text x="726" y="958" font-weight="bold" font-size="9.5">THE WELL THAT CAN BE DUG ANYWHERE</text>
    <text x="1056" y="950" fill="#6FC3FF">STATUS</text>
    <text x="1056" y="958" font-weight="bold" font-size="9.5">CONCEPT — CONDENSATION OBSERVED ON MARS</text>
  </g>
</svg>
