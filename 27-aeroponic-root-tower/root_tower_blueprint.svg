<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#16406B" stroke-width="0.6"/>
    </pattern>
    <pattern id="gridMajor" width="125" height="125" patternUnits="userSpaceOnUse">
      <rect width="125" height="125" fill="url(#grid)"/>
      <path d="M 125 0 L 0 0 0 125" fill="none" stroke="#1E5288" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6FC3FF"/>
    </marker>
    <marker id="warrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#DCEBFA"/>
    </marker>
    <marker id="dim" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M1,1 L9,9 M5,0 L5,10" stroke="#DCEBFA" stroke-width="1" fill="none"/>
    </marker>
  </defs>

  <rect width="1400" height="1000" fill="#0B2A4A"/>
  <rect width="1400" height="1000" fill="url(#gridMajor)"/>
  <rect x="20" y="20" width="1360" height="960" fill="none" stroke="#DCEBFA" stroke-width="2"/>
  <rect x="28" y="28" width="1344" height="944" fill="none" stroke="#DCEBFA" stroke-width="0.8"/>

  <text x="50" y="70" fill="#DCEBFA" font-size="27" letter-spacing="2" font-weight="bold">AEROPONIC ROOT TOWER — AR-1 "ANTAEUS"</text>
  <text x="50" y="96" fill="#6FC3FF" font-size="14" letter-spacing="2">SOIL-FREE MIST GROWING · TOWER SECTION · MIST + RECIRCULATION · VOLUME II · SHEET 1 OF 5</text>
  <line x1="50" y1="110" x2="1350" y2="110" stroke="#6FC3FF" stroke-width="1"/>

  <!-- ======== MAIN TOWER SECTION ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="2">
    <!-- tower body (vertical, cutaway) -->
    <rect x="360" y="200" width="180" height="480" rx="10"/>
    <!-- interior dark root chamber -->
    <rect x="392" y="230" width="116" height="420" fill="#0E3357"/>
    <text x="450" y="192" fill="#6FC3FF" font-size="11" text-anchor="middle" stroke="none">AEROPONIC TOWER (CUTAWAY)</text>

    <!-- plants around ports: leaves outside, roots inside -->
    <!-- left column plants -->
    <g stroke-width="1.6">
      <!-- plant 1 -->
      <path d="M 360 280 l -30 -6 M 360 280 l -28 -20 M 360 280 l -22 -30"/>
      <path d="M 360 280 q -20 30 -6 70 M 360 280 q 10 30 0 70 M 360 280 q -30 24 -30 62" stroke="#6FC3FF" stroke-width="0.8"/>
      <!-- plant 2 -->
      <path d="M 360 420 l -30 -6 M 360 420 l -28 -20 M 360 420 l -22 -30"/>
      <path d="M 360 420 q -20 30 -6 70 M 360 420 q 10 30 0 70 M 360 420 q -30 24 -30 62" stroke="#6FC3FF" stroke-width="0.8"/>
      <!-- plant 3 -->
      <path d="M 360 560 l -30 -6 M 360 560 l -28 -20 M 360 560 l -22 -30"/>
      <path d="M 360 560 q -20 30 -6 70 M 360 560 q 10 30 0 70 M 360 560 q -30 24 -30 62" stroke="#6FC3FF" stroke-width="0.8"/>
    </g>
    <!-- right column plants -->
    <g stroke-width="1.6">
      <path d="M 540 350 l 30 -6 M 540 350 l 28 -20 M 540 350 l 22 -30"/>
      <path d="M 540 350 q 20 30 6 70 M 540 350 q -10 30 0 70 M 540 350 q 30 24 30 62" stroke="#6FC3FF" stroke-width="0.8"/>
      <path d="M 540 490 l 30 -6 M 540 490 l 28 -20 M 540 490 l 22 -30"/>
      <path d="M 540 490 q 20 30 6 70 M 540 490 q -10 30 0 70 M 540 490 q 30 24 30 62" stroke="#6FC3FF" stroke-width="0.8"/>
    </g>
    <text x="250" y="270" fill="#DCEBFA" font-size="9" stroke="none">LEAVES IN LIGHT</text>
    <text x="580" y="340" fill="#DCEBFA" font-size="9" stroke="none">ROOTS IN DARK MISTED CHAMBER</text>

    <!-- mist nozzles inside -->
    <g fill="#DCEBFA"><circle cx="450" cy="260" r="4"/><circle cx="450" cy="400" r="4"/><circle cx="450" cy="540" r="4"/></g>
    <g stroke="#6FC3FF" stroke-width="0.7">
      <path d="M 450 264 l -18 20 M 450 264 l 0 24 M 450 264 l 18 20"/>
      <path d="M 450 404 l -18 20 M 450 404 l 0 24 M 450 404 l 18 20"/>
      <path d="M 450 544 l -18 20 M 450 544 l 0 24 M 450 544 l 18 20"/>
    </g>
    <text x="450" y="230" fill="#6FC3FF" font-size="8.5" text-anchor="middle" stroke="none">MIST NOZZLES</text>

    <!-- light source both sides -->
    <g stroke="#6FC3FF" stroke-width="1"><path d="M 300 230 l 30 20 M 300 260 l 30 20 M 300 290 l 30 20"/></g>
    <text x="300" y="222" fill="#6FC3FF" font-size="8.5" stroke="none">GROW LIGHT</text>
    <g stroke="#6FC3FF" stroke-width="1"><path d="M 600 400 l -30 20 M 600 430 l -30 20 M 600 460 l -30 20"/></g>

    <!-- collection sump at base -->
    <path d="M 392 650 l 116 0 l -20 30 l -76 0 z" fill="#0E3357"/>
    <text x="450" y="700" fill="#6FC3FF" font-size="9" text-anchor="middle" stroke="none">RUNOFF COLLECTED</text>

    <!-- recirculation loop -->
    <path d="M 480 675 C 650 700 720 500 660 360" stroke="#6FC3FF" stroke-width="1.6" marker-end="url(#arrow)"/>
    <!-- reservoir + pump -->
    <rect x="640" y="320" width="70" height="46" rx="4"/>
    <text x="675" y="312" fill="#DCEBFA" font-size="8.5" text-anchor="middle" stroke="none">RESERVOIR + PUMP</text>
    <text x="675" y="344" fill="#6FC3FF" font-size="8" text-anchor="middle" stroke="none">NUTRIENT MIX</text>
    <!-- feed back to nozzles -->
    <path d="M 640 350 C 560 340 520 300 470 258" stroke="#6FC3FF" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="560" y="300" fill="#6FC3FF" font-size="8" stroke="none">PRESSURISED FEED</text>
    <text x="720" y="420" fill="#DCEBFA" font-size="9" stroke="none">WATER USED MANY TIMES</text>
  </g>

  <!-- ======== OXYGEN+WATER INSET (top right) ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.2">
    <rect x="920" y="140" width="420" height="210" fill="#0E3357" stroke="#6FC3FF"/>
    <text x="938" y="166" fill="#6FC3FF" font-size="12" letter-spacing="1" stroke="none">FIG. B — WHY MISTING BEATS FLOODING</text>
    <line x1="938" y1="176" x2="1322" y2="176" stroke="#6FC3FF" stroke-width="0.7"/>
    <!-- flooded root -->
    <rect x="950" y="200" width="80" height="60" fill="#16406B"/>
    <path d="M 990 200 q -10 30 0 56 M 990 200 q 8 26 0 56" stroke="#6FC3FF" stroke-width="0.8"/>
    <text x="990" y="278" fill="#DCEBFA" font-size="8" text-anchor="middle" stroke="none">FLOODED: DROWNS ✗</text>
    <!-- misted root -->
    <rect x="1120" y="200" width="80" height="60"/>
    <path d="M 1160 200 q -10 30 0 56 M 1160 200 q 8 26 0 56" stroke="#6FC3FF" stroke-width="0.8"/>
    <g fill="#DCEBFA"><circle cx="1145" cy="220" r="1.6"/><circle cx="1170" cy="230" r="1.6"/><circle cx="1155" cy="244" r="1.6"/><circle cx="1178" cy="216" r="1.6"/></g>
    <text x="1160" y="278" fill="#6FC3FF" font-size="8" text-anchor="middle" stroke="none">MISTED: BREATHES + DRINKS ✓</text>
    <text x="938" y="308" fill="#DCEBFA" font-size="9" stroke="none">ROOTS NEED WATER + OXYGEN — WHICH COMPETE</text>
    <text x="938" y="330" fill="#6FC3FF" font-size="9" stroke="none">MIST GIVES BOTH · AND SUITS MICROGRAVITY (NO POOLS)</text>
  </g>

  <!-- ======== FRAGILITY PANEL ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.4">
    <rect x="920" y="500" width="420" height="240" fill="#0E3357" stroke="#6FC3FF" stroke-width="1.4"/>
    <text x="938" y="526" fill="#6FC3FF" font-size="12" letter-spacing="1" stroke="none">! MINUTES FROM DROUGHT</text>
    <line x1="938" y1="536" x2="1322" y2="536" stroke="#6FC3FF" stroke-width="0.7"/>
    <g fill="#DCEBFA" font-size="10" stroke="none">
      <text x="938" y="560">NO SOIL = NO MOISTURE BUFFER</text>
      <text x="938" y="586">• PUMP FAILS / NOZZLE CLOGS / POWER DROPS</text>
      <text x="938" y="608">  → BARE ROOTS DRY OUT FAST → CROP LOST</text>
      <text x="938" y="636">DEMANDS: REDUNDANT PUMPS + MISTERS,</text>
      <text x="938" y="658">VIGILANT MONITORING, BALANCED NUTRIENT MIX</text>
      <text x="938" y="690" fill="#6FC3FF">THE PRICE OF LIGHTNESS + THRIFT +</text>
      <text x="938" y="710" fill="#6FC3FF">PRECISION IS: NEVER FORGET TO TEND IT</text>
    </g>
  </g>

  <!-- ======== CALLOUTS ======== -->
  <g stroke="#6FC3FF" stroke-width="1" fill="none">
    <line x1="340" y1="290" x2="180" y2="800" marker-start="url(#arrow)"/>
    <line x1="450" y1="260" x2="340" y2="800" marker-start="url(#arrow)"/>
    <line x1="500" y1="420" x2="500" y2="800" marker-start="url(#arrow)"/>
    <line x1="450" y1="665" x2="640" y2="800" marker-start="url(#arrow)"/>
    <line x1="675" y1="366" x2="790" y2="800" marker-start="url(#arrow)"/>
  </g>
  <g fill="#DCEBFA" font-size="13">
    <g><circle cx="180" cy="812" r="12" fill="none" stroke="#6FC3FF"/><text x="180" y="817" text-anchor="middle">1</text></g>
    <g><circle cx="340" cy="812" r="12" fill="none" stroke="#6FC3FF"/><text x="340" y="817" text-anchor="middle">2</text></g>
    <g><circle cx="500" cy="812" r="12" fill="none" stroke="#6FC3FF"/><text x="500" y="817" text-anchor="middle">3</text></g>
    <g><circle cx="640" cy="812" r="12" fill="none" stroke="#6FC3FF"/><text x="640" y="817" text-anchor="middle">4</text></g>
    <g><circle cx="790" cy="812" r="12" fill="none" stroke="#6FC3FF"/><text x="790" y="817" text-anchor="middle">5</text></g>
  </g>

  <!-- ======== PARTS LIST ======== -->
  <g font-size="12.5" fill="#DCEBFA">
    <rect x="50" y="832" width="640" height="124" fill="#0E3357" stroke="#6FC3FF" stroke-width="1"/>
    <text x="66" y="856" fill="#6FC3FF" font-size="13" letter-spacing="2" font-weight="bold">PARTS &amp; SYSTEMS INDEX</text>
    <line x1="66" y1="865" x2="674" y2="865" stroke="#6FC3FF" stroke-width="0.7"/>
    <text x="66" y="885">1 — GROW LIGHT + LEAVES: tops in the light, outside the tower</text>
    <text x="66" y="905">2 — MIST NOZZLES: fine nutrient spray onto bare hanging roots</text>
    <text x="66" y="925">3 — DARK ROOT CHAMBER: roots breathe + drink, never flooded</text>
    <text x="66" y="941" font-size="10.5" fill="#6FC3FF">4 — RUNOFF SUMP → 5 — RESERVOIR + PUMP: recirculates, water used many times</text>
  </g>

  <text x="1350" y="812" fill="#6FC3FF" font-size="11" text-anchor="end" letter-spacing="1">DESIGNED BY: W.A. SANDUN PRIYANKARA WIJERATHNE · sandunwijerathne51@gmail.com · github.com/sandunwijerathne</text>

  <!-- ======== TITLE BLOCK ======== -->
  <g font-size="12" fill="#DCEBFA">
    <rect x="710" y="832" width="640" height="124" fill="#0E3357" stroke="#DCEBFA" stroke-width="1.5"/>
    <line x1="710" y1="866" x2="1350" y2="866" stroke="#DCEBFA"/>
    <line x1="710" y1="900" x2="1350" y2="900" stroke="#DCEBFA"/>
    <line x1="710" y1="934" x2="1350" y2="934" stroke="#DCEBFA"/>
    <line x1="1040" y1="832" x2="1040" y2="956" stroke="#DCEBFA"/>
    <text x="726" y="852" fill="#6FC3FF" letter-spacing="1">PROJECT</text>
    <text x="726" y="862" font-size="11" font-weight="bold">OFF-WORLD TOOLKIT · VOLUME II</text>
    <text x="1056" y="852" fill="#6FC3FF">DRAWING NO.</text>
    <text x="1056" y="862" font-size="11" font-weight="bold">AR-1-GA-001 · REV A</text>
    <text x="726" y="886" fill="#6FC3FF">UNIT DESIGNATION</text>
    <text x="726" y="896" font-weight="bold" font-size="10">AR-1 "ANTAEUS" — GENERAL ARRANGEMENT</text>
    <text x="1056" y="886" fill="#6FC3FF">MEDIUM</text>
    <text x="1056" y="896" font-weight="bold" font-size="11">NONE — ROOTS IN AIR</text>
    <text x="726" y="920" fill="#6FC3FF">WATER USE</text>
    <text x="726" y="930" font-weight="bold" font-size="10.5">LOW, RECIRCULATED (VS SOIL)</text>
    <text x="1056" y="920" fill="#6FC3FF">SUITS</text>
    <text x="1056" y="930" font-weight="bold" font-size="11">MICROGRAVITY (MIST, NO POOLS)</text>
    <text x="726" y="944" fill="#6FC3FF">FUNCTION</text>
    <text x="726" y="954" font-weight="bold" font-size="10.5">FRESH FOOD, NO SOIL, MINIMAL WATER</text>
    <text x="1056" y="944" fill="#6FC3FF">STATUS</text>
    <text x="1056" y="954" font-weight="bold" font-size="10">CONCEPT — METHOD COMMERCIAL ON EARTH</text>
  </g>
</svg>
