<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#16406B" stroke-width="0.6"/>
    </pattern>
    <pattern id="gridMajor" width="125" height="125" patternUnits="userSpaceOnUse">
      <rect width="125" height="125" fill="url(#grid)"/>
      <path d="M 125 0 L 0 0 0 125" fill="none" stroke="#1E5288" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6FC3FF"/>
    </marker>
    <marker id="warrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#DCEBFA"/>
    </marker>
    <marker id="dim" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M1,1 L9,9 M5,0 L5,10" stroke="#DCEBFA" stroke-width="1" fill="none"/>
    </marker>
  </defs>

  <rect width="1400" height="1000" fill="#0B2A4A"/>
  <rect width="1400" height="1000" fill="url(#gridMajor)"/>
  <rect x="20" y="20" width="1360" height="960" fill="none" stroke="#DCEBFA" stroke-width="2"/>
  <rect x="28" y="28" width="1344" height="944" fill="none" stroke="#DCEBFA" stroke-width="0.8"/>

  <text x="50" y="70" fill="#DCEBFA" font-size="27" letter-spacing="2" font-weight="bold">REGOLITH SINTER DOME — RS-1 "HESTIA"</text>
  <text x="50" y="96" fill="#6FC3FF" font-size="14" letter-spacing="2">MICROWAVE SINTERING CRAWLER · SECTION VIEW · LOAD-PATH DETAIL · VOLUME II · SHEET 1 OF 5</text>
  <line x1="50" y1="110" x2="1350" y2="110" stroke="#6FC3FF" stroke-width="1"/>

  <!-- ======== MAIN SECTION VIEW: dome under construction ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="2">
    <!-- ground line -->
    <path d="M 90 620 h 780" stroke-width="2.5"/>
    <g stroke-width="0.6">
      <line x1="120" y1="620" x2="108" y2="636"/><line x1="180" y1="620" x2="168" y2="636"/>
      <line x1="240" y1="620" x2="228" y2="636"/><line x1="700" y1="620" x2="688" y2="636"/>
      <line x1="760" y1="620" x2="748" y2="636"/><line x1="820" y1="620" x2="808" y2="636"/>
    </g>
    <text x="120" y="654" fill="#6FC3FF" font-size="10" stroke="none">LUNAR SURFACE — LOOSE REGOLITH (FREE FEEDSTOCK)</text>

    <!-- dome shell (partial, under construction) - left half complete, right half rising -->
    <path d="M 250 620 A 230 230 0 0 1 480 390" stroke-width="2.6"/>
    <path d="M 286 620 A 194 194 0 0 1 480 426" stroke-width="1.4"/>
    <!-- course lines on the finished half -->
    <g stroke-width="0.7">
      <path d="M 254 580 A 230 230 0 0 1 300 500"/>
      <path d="M 272 540 A 220 220 0 0 1 340 462"/>
      <path d="M 306 496 A 215 215 0 0 1 392 424"/>
      <path d="M 356 452 A 210 210 0 0 1 440 402"/>
    </g>
    <text x="300" y="430" fill="#6FC3FF" font-size="9" stroke="none">SINTERED COURSES</text>

    <!-- right side: partially built, stepped courses -->
    <path d="M 710 620 A 230 230 0 0 0 618 452" stroke-width="2.6"/>
    <path d="M 674 620 A 194 194 0 0 0 606 486" stroke-width="1.4"/>
    <!-- open crown gap -->
    <path d="M 480 390 L 618 452" stroke-width="0.8" stroke-dasharray="6 5"/>
    <text x="520" y="382" fill="#DCEBFA" font-size="9" stroke="none">CROWN NOT YET CLOSED</text>

    <!-- the crawler on top of the rising course -->
    <g stroke-width="2">
      <rect x="596" y="404" width="76" height="40" rx="5"/>
      <!-- tracks -->
      <rect x="592" y="444" width="84" height="14" rx="6"/>
      <circle cx="606" cy="451" r="4"/><circle cx="634" cy="451" r="4"/><circle cx="662" cy="451" r="4"/>
      <!-- scoop arm forward -->
      <path d="M 596 416 l -34 -18 l -14 14" stroke-width="1.6"/>
      <path d="M 548 412 l -10 12 l 16 8 z"/>
      <!-- microwave applicator horn under/behind -->
      <path d="M 660 444 l 20 20 l -12 8 l -18 -18 z"/>
      <!-- solar panel on top -->
      <rect x="606" y="384" width="56" height="18"/>
      <path d="M 620 384 v18 M 634 384 v18 M 648 384 v18" stroke-width="0.6"/>
    </g>
    <text x="700" y="400" fill="#DCEBFA" font-size="10" stroke="none">RS-1 CRAWLER</text>
    <text x="700" y="414" fill="#6FC3FF" font-size="8.5" stroke="none">LAYS + FUSES ONE COURSE</text>

    <!-- microwave energy into fresh course -->
    <g stroke="#6FC3FF" stroke-width="1">
      <path d="M 672 468 q 8 10 0 20" />
      <path d="M 682 464 q 12 14 0 28" />
      <path d="M 692 460 q 16 18 0 36" />
    </g>
    <text x="712" y="492" fill="#6FC3FF" font-size="9" stroke="none">MICROWAVE APPLICATOR</text>
    <text x="712" y="506" fill="#DCEBFA" font-size="8.5" stroke="none">FUSES GRAINS IN PLACE</text>

    <!-- scoop pile of loose regolith -->
    <path d="M 500 620 q 28 -30 56 0 z" stroke-width="1.4"/>
    <text x="528" y="640" fill="#6FC3FF" font-size="8.5" text-anchor="middle" stroke="none">SCOOPED FEED</text>

    <!-- overburden ballast shown banked on finished side -->
    <path d="M 180 620 q 60 -100 120 -150" stroke="#6FC3FF" stroke-width="1.2" stroke-dasharray="5 4"/>
    <g stroke="#6FC3FF" stroke-width="0.6">
      <path d="M 210 590 l -12 8 M 240 556 l -12 8 M 268 520 l -12 8"/>
    </g>
    <text x="120" y="560" fill="#6FC3FF" font-size="9" stroke="none">REGOLITH OVERBURDEN</text>
    <text x="120" y="574" fill="#6FC3FF" font-size="8.5" stroke="none">(BALLAST + SHIELDING)</text>

    <!-- pressure liner inside, separate -->
    <path d="M 300 620 A 180 180 0 0 1 480 440" stroke="#DCEBFA" stroke-width="1.6" stroke-dasharray="9 4"/>
    <text x="330" y="592" fill="#DCEBFA" font-size="8.5" stroke="none">SEPARATE PRESSURE LINER</text>
  </g>

  <!-- ======== LOAD PATH INSET (top right) ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.2">
    <rect x="900" y="140" width="440" height="250" fill="#0E3357" stroke="#6FC3FF"/>
    <text x="918" y="166" fill="#6FC3FF" font-size="12" letter-spacing="1" stroke="none">FIG. B — WHY A DOME IS NOT A PRESSURE VESSEL</text>
    <line x1="918" y1="176" x2="1322" y2="176" stroke="#6FC3FF" stroke-width="0.7"/>
    <!-- left: bare dome, pressure pushes out -->
    <path d="M 950 300 A 60 60 0 0 1 1070 300" stroke-width="2"/>
    <line x1="950" y1="300" x2="1070" y2="300" stroke-width="1"/>
    <g stroke="#DCEBFA" stroke-width="1">
      <path d="M 1010 268 l 0 -22" marker-end="url(#warrow)"/>
      <path d="M 976 284 l -16 -14" marker-end="url(#warrow)"/>
      <path d="M 1044 284 l 16 -14" marker-end="url(#warrow)"/>
    </g>
    <text x="1010" y="322" fill="#DCEBFA" font-size="8.5" text-anchor="middle" stroke="none">AIR PUSHES OUT → TENSION</text>
    <text x="1010" y="336" fill="#6FC3FF" font-size="8.5" text-anchor="middle" stroke="none">CERAMIC IS WEAK IN TENSION ✗</text>
    <!-- right: ballasted dome, compression -->
    <path d="M 1170 300 A 60 60 0 0 1 1290 300" stroke-width="2"/>
    <line x1="1170" y1="300" x2="1290" y2="300" stroke-width="1"/>
    <path d="M 1160 300 A 70 70 0 0 1 1300 300" stroke="#6FC3FF" stroke-width="1" stroke-dasharray="4 3"/>
    <g stroke="#6FC3FF" stroke-width="1">
      <path d="M 1230 216 l 0 22" marker-end="url(#arrow)"/>
      <path d="M 1190 232 l 14 16" marker-end="url(#arrow)"/>
      <path d="M 1270 232 l -14 16" marker-end="url(#arrow)"/>
    </g>
    <text x="1230" y="322" fill="#DCEBFA" font-size="8.5" text-anchor="middle" stroke="none">OVERBURDEN PRESSES DOWN</text>
    <text x="1230" y="336" fill="#6FC3FF" font-size="8.5" text-anchor="middle" stroke="none">NET COMPRESSION ✓</text>
    <text x="918" y="368" fill="#6FC3FF" font-size="9" stroke="none">DOME = SHIELD + SHELL · LINER = PRESSURE BOUNDARY</text>
  </g>

  <!-- ======== DETAIL A: sintering the course ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.4">
    <circle cx="1120" cy="580" r="92" stroke="#6FC3FF"/>
    <!-- loose grains left -->
    <g fill="#DCEBFA">
      <circle cx="1062" cy="600" r="4"/><circle cx="1074" cy="590" r="3.5"/><circle cx="1070" cy="610" r="3"/>
      <circle cx="1084" cy="604" r="4"/><circle cx="1058" cy="586" r="3"/>
    </g>
    <text x="1062" y="632" fill="#DCEBFA" font-size="8" text-anchor="middle" stroke="none">LOOSE</text>
    <!-- transition arrow -->
    <line x1="1096" y1="598" x2="1126" y2="598" marker-end="url(#arrow)" stroke="#6FC3FF" stroke-width="1.2"/>
    <text x="1111" y="588" fill="#6FC3FF" font-size="7.5" text-anchor="middle" stroke="none">HEAT</text>
    <!-- fused mass right -->
    <path d="M 1136 584 q 22 -8 42 6 q 10 18 -8 26 q -30 8 -40 -6 q -6 -14 6 -26 z" stroke-width="1.6"/>
    <g stroke-width="0.5">
      <path d="M 1146 594 q 12 -4 22 2 M 1144 606 q 16 -2 30 4"/>
    </g>
    <text x="1158" y="632" fill="#6FC3FF" font-size="8" text-anchor="middle" stroke="none">FUSED CERAMIC</text>
    <!-- nanophase iron note -->
    <text x="1120" y="524" fill="#DCEBFA" font-size="8" text-anchor="middle" stroke="none">NANOPHASE IRON ON GRAINS</text>
    <text x="1120" y="537" fill="#6FC3FF" font-size="8" text-anchor="middle" stroke="none">COUPLES STRONGLY WITH MICROWAVES</text>
    <text x="1120" y="694" fill="#6FC3FF" font-size="12" text-anchor="middle" stroke="none">DETAIL A — SINTERING, NO BINDER</text>
    <line x1="700" y1="480" x2="1034" y2="566" stroke="#6FC3FF" stroke-width="0.9" stroke-dasharray="5 4"/>
  </g>

  <!-- ======== DIMENSION ======== -->
  <g stroke="#DCEBFA" stroke-width="1" fill="#DCEBFA">
    <line x1="250" y1="676" x2="710" y2="676" marker-start="url(#dim)" marker-end="url(#dim)"/>
    <line x1="250" y1="620" x2="250" y2="686" stroke-dasharray="4 3" stroke-width="0.5"/>
    <line x1="710" y1="620" x2="710" y2="686" stroke-dasharray="4 3" stroke-width="0.5"/>
    <text x="480" y="698" text-anchor="middle" font-size="12">DOME SPAN — BUILT IN COURSES, NO FORMWORK</text>
  </g>

  <!-- ======== CALLOUTS ======== -->
  <g stroke="#6FC3FF" stroke-width="1" fill="none">
    <line x1="634" y1="404" x2="360" y2="790" marker-start="url(#arrow)"/>
    <line x1="680" y1="470" x2="500" y2="790" marker-start="url(#arrow)"/>
    <line x1="380" y1="480" x2="200" y2="790" marker-start="url(#arrow)"/>
    <line x1="240" y1="556" x2="640" y2="790" marker-start="url(#arrow)"/>
    <line x1="390" y1="520" x2="790" y2="790" marker-start="url(#arrow)"/>
  </g>
  <g fill="#DCEBFA" font-size="13">
    <g><circle cx="360" cy="802" r="12" fill="none" stroke="#6FC3FF"/><text x="360" y="807" text-anchor="middle">1</text></g>
    <g><circle cx="500" cy="802" r="12" fill="none" stroke="#6FC3FF"/><text x="500" y="807" text-anchor="middle">2</text></g>
    <g><circle cx="200" cy="802" r="12" fill="none" stroke="#6FC3FF"/><text x="200" y="807" text-anchor="middle">3</text></g>
    <g><circle cx="640" cy="802" r="12" fill="none" stroke="#6FC3FF"/><text x="640" y="807" text-anchor="middle">4</text></g>
    <g><circle cx="790" cy="802" r="12" fill="none" stroke="#6FC3FF"/><text x="790" y="807" text-anchor="middle">5</text></g>
  </g>

  <!-- ======== PARTS LIST ======== -->
  <g font-size="12.5" fill="#DCEBFA">
    <rect x="50" y="822" width="640" height="134" fill="#0E3357" stroke="#6FC3FF" stroke-width="1"/>
    <text x="66" y="846" fill="#6FC3FF" font-size="13" letter-spacing="2" font-weight="bold">PARTS &amp; SYSTEMS INDEX</text>
    <line x1="66" y1="855" x2="674" y2="855" stroke="#6FC3FF" stroke-width="0.7"/>
    <text x="66" y="875">1 — RS-1 CRAWLER: scoops, lays a course, fuses it, advances, repeats</text>
    <text x="66" y="895">2 — MICROWAVE APPLICATOR: penetrating heat, no binder, no water (DETAIL A)</text>
    <text x="66" y="915">3 — SINTERED SHELL: vault in compression, shielding + structure only</text>
    <text x="66" y="935">4 — OVERBURDEN BALLAST: keeps shell in net compression + adds shielding</text>
    <text x="66" y="951" font-size="10.5" fill="#6FC3FF">5 — SEPARATE PRESSURE LINER: holds the air — the dome does NOT (FIG. B)</text>
  </g>

  <text x="1350" y="812" fill="#6FC3FF" font-size="11" text-anchor="end" letter-spacing="1">DESIGNED BY: W.A. SANDUN PRIYANKARA WIJERATHNE · sandunwijerathne51@gmail.com · github.com/sandunwijerathne</text>

  <!-- ======== TITLE BLOCK ======== -->
  <g font-size="12" fill="#DCEBFA">
    <rect x="710" y="822" width="640" height="134" fill="#0E3357" stroke="#DCEBFA" stroke-width="1.5"/>
    <line x1="710" y1="856" x2="1350" y2="856" stroke="#DCEBFA"/>
    <line x1="710" y1="890" x2="1350" y2="890" stroke="#DCEBFA"/>
    <line x1="710" y1="924" x2="1350" y2="924" stroke="#DCEBFA"/>
    <line x1="1040" y1="822" x2="1040" y2="956" stroke="#DCEBFA"/>
    <text x="726" y="842" fill="#6FC3FF" letter-spacing="1">PROJECT</text>
    <text x="726" y="852" font-size="11" font-weight="bold">OFF-WORLD TOOLKIT · VOLUME II</text>
    <text x="1056" y="842" fill="#6FC3FF">DRAWING NO.</text>
    <text x="1056" y="852" font-size="11" font-weight="bold">RS-1-GA-001 · REV A</text>
    <text x="726" y="876" fill="#6FC3FF">UNIT DESIGNATION</text>
    <text x="726" y="886" font-weight="bold" font-size="10.5">RS-1 "HESTIA" — GENERAL ARRANGEMENT</text>
    <text x="1056" y="876" fill="#6FC3FF">FEEDSTOCK</text>
    <text x="1056" y="886" font-weight="bold" font-size="11">RAW REGOLITH, NO BINDER</text>
    <text x="726" y="910" fill="#6FC3FF">PROCESS</text>
    <text x="726" y="920" font-weight="bold" font-size="10.5">MICROWAVE SINTERING (LAB-DEMONSTRATED)</text>
    <text x="1056" y="910" fill="#6FC3FF">SHELL CARRIES</text>
    <text x="1056" y="920" font-weight="bold" font-size="11">COMPRESSION ONLY</text>
    <text x="726" y="944" fill="#6FC3FF">FUNCTION</text>
    <text x="726" y="954" font-weight="bold" font-size="10.5">BUILDS PADS, WALLS + VAULTS FROM THE GROUND ITSELF</text>
    <text x="1056" y="944" fill="#6FC3FF">STATUS</text>
    <text x="1056" y="954" font-weight="bold" font-size="10">CONCEPT — NEAR-TERM (PADS FIRST)</text>
  </g>
</svg>
