<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#16406B" stroke-width="0.6"/>
    </pattern>
    <pattern id="gridMajor" width="125" height="125" patternUnits="userSpaceOnUse">
      <rect width="125" height="125" fill="url(#grid)"/>
      <path d="M 125 0 L 0 0 0 125" fill="none" stroke="#1E5288" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6FC3FF"/>
    </marker>
    <marker id="warrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#DCEBFA"/>
    </marker>
    <marker id="dim" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M1,1 L9,9 M5,0 L5,10" stroke="#DCEBFA" stroke-width="1" fill="none"/>
    </marker>
  </defs>

  <rect width="1400" height="1000" fill="#0B2A4A"/>
  <rect width="1400" height="1000" fill="url(#gridMajor)"/>
  <rect x="20" y="20" width="1360" height="960" fill="none" stroke="#DCEBFA" stroke-width="2"/>
  <rect x="28" y="28" width="1344" height="944" fill="none" stroke="#DCEBFA" stroke-width="0.8"/>

  <text x="50" y="70" fill="#DCEBFA" font-size="27" letter-spacing="2" font-weight="bold">VACUUM VAPOUR REFINERY — VR-1 "ALEMBIC"</text>
  <text x="50" y="96" fill="#6FC3FF" font-size="14" letter-spacing="2">FRACTIONAL VAPORISATION · COLLECTOR TRAIN · CRUCIBLE DETAIL · VOLUME II · SHEET 1 OF 5</text>
  <line x1="50" y1="110" x2="1350" y2="110" stroke="#6FC3FF" stroke-width="1"/>

  <!-- ======== MAIN PROCESS SCHEMATIC ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="2">
    <!-- feed hopper -->
    <path d="M 100 240 h 90 l -18 56 h -54 z"/>
    <g fill="#6FC3FF"><circle cx="128" cy="260" r="2.5"/><circle cx="146" cy="270" r="2.5"/><circle cx="162" cy="258" r="2.5"/><circle cx="140" cy="282" r="2.5"/></g>
    <text x="145" y="232" fill="#DCEBFA" font-size="10" text-anchor="middle" stroke="none">CRUSHED FEED</text>
    <text x="145" y="312" fill="#6FC3FF" font-size="8.5" text-anchor="middle" stroke="none">REGOLITH / SCRAP</text>
    <path d="M 145 296 l 0 44" stroke="#6FC3FF" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- vacuum chamber outline (whole plant) -->
    <rect x="80" y="340" width="800" height="280" rx="10" stroke-dasharray="10 6" stroke-width="1"/>
    <text x="96" y="362" fill="#6FC3FF" font-size="10" stroke="none">CHAMBER OPEN TO AMBIENT VACUUM — NO PUMPS NEEDED</text>

    <!-- crucible + heater -->
    <path d="M 105 400 h 110 v 70 a 20 20 0 0 1 -20 20 h -70 a 20 20 0 0 1 -20 -20 z" fill="#0E3357"/>
    <path d="M 105 400 h 110 v 70 a 20 20 0 0 1 -20 20 h -70 a 20 20 0 0 1 -20 -20 z"/>
    <path d="M 120 460 q 20 -14 40 0 q 20 14 40 0" stroke="#6FC3FF" stroke-width="1.2"/>
    <text x="160" y="392" fill="#6FC3FF" font-size="10" text-anchor="middle" stroke="none">HEATED CRUCIBLE</text>
    <text x="160" y="510" fill="#DCEBFA" font-size="8.5" text-anchor="middle" stroke="none">HEAT IN STAGES</text>
    <!-- heater coils -->
    <g stroke="#6FC3FF" stroke-width="0.8"><path d="M 92 420 h 12 M 92 436 h 12 M 92 452 h 12 M 216 420 h 12 M 216 436 h 12 M 216 452 h 12"/></g>
    <!-- solar input -->
    <g stroke="#6FC3FF" stroke-width="1"><path d="M 130 350 l 10 40 M 160 344 l 0 44 M 190 350 l -10 40"/></g>
    <text x="160" y="336" fill="#6FC3FF" font-size="8.5" text-anchor="middle" stroke="none">SOLAR / ELECTRIC HEAT</text>

    <!-- vapour path -->
    <path d="M 220 420 C 300 400 340 400 380 410" stroke="#6FC3FF" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="290" y="392" fill="#6FC3FF" font-size="9" text-anchor="middle" stroke="none">VAPOUR</text>

    <!-- collector train: descending temperature -->
    <g>
      <rect x="390" y="380" width="60" height="120" rx="4" fill="#0E3357"/>
      <rect x="390" y="380" width="60" height="120" rx="4"/>
      <text x="420" y="372" fill="#DCEBFA" font-size="8.5" text-anchor="middle" stroke="none">HOT</text>
      <text x="420" y="522" fill="#6FC3FF" font-size="8" text-anchor="middle" stroke="none">least volatile</text>
      <rect x="398" y="470" width="44" height="10" fill="#DCEBFA"/>

      <rect x="500" y="380" width="60" height="120" rx="4" fill="#0E3357"/>
      <rect x="500" y="380" width="60" height="120" rx="4"/>
      <text x="530" y="372" fill="#DCEBFA" font-size="8.5" text-anchor="middle" stroke="none">WARM</text>
      <rect x="508" y="470" width="44" height="8" fill="#DCEBFA"/>

      <rect x="610" y="380" width="60" height="120" rx="4" fill="#0E3357"/>
      <rect x="610" y="380" width="60" height="120" rx="4"/>
      <text x="640" y="372" fill="#DCEBFA" font-size="8.5" text-anchor="middle" stroke="none">COOL</text>
      <rect x="618" y="470" width="44" height="6" fill="#DCEBFA"/>

      <rect x="720" y="380" width="60" height="120" rx="4" fill="#0E3357"/>
      <rect x="720" y="380" width="60" height="120" rx="4"/>
      <text x="750" y="372" fill="#DCEBFA" font-size="8.5" text-anchor="middle" stroke="none">COLD</text>
      <text x="750" y="522" fill="#6FC3FF" font-size="8" text-anchor="middle" stroke="none">most volatile</text>
      <rect x="728" y="470" width="44" height="5" fill="#DCEBFA"/>
    </g>
    <!-- vapour travelling along -->
    <g stroke="#6FC3FF" stroke-width="1" stroke-dasharray="5 4">
      <path d="M 450 420 l 44 0" marker-end="url(#arrow)"/>
      <path d="M 560 420 l 44 0" marker-end="url(#arrow)"/>
      <path d="M 670 420 l 44 0" marker-end="url(#arrow)"/>
    </g>
    <text x="585" y="560" fill="#DCEBFA" font-size="10" text-anchor="middle" stroke="none">COLLECTOR TRAIN — EACH SPECIES CONDENSES WHERE ITS TEMPERATURE SUITS</text>

    <!-- residue out -->
    <path d="M 160 490 l 0 60" stroke="#6FC3FF" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="160" y="572" fill="#6FC3FF" font-size="9" text-anchor="middle" stroke="none">RESIDUE (REFRACTORY)</text>

    <!-- sorted metals out -->
    <path d="M 880 440 l 70 0" stroke="#6FC3FF" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="965" y="436" fill="#DCEBFA" font-size="10" stroke="none">→ SORTED METAL STOCK</text>
    <text x="965" y="454" fill="#6FC3FF" font-size="8.5" stroke="none">to foundry / fabrication</text>
  </g>

  <!-- ======== BOILING-POINT INSET ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.2">
    <rect x="950" y="140" width="390" height="200" fill="#0E3357" stroke="#6FC3FF"/>
    <text x="968" y="166" fill="#6FC3FF" font-size="12" letter-spacing="1" stroke="none">FIG. B — VACUUM LOWERS THE BAR</text>
    <line x1="968" y1="176" x2="1322" y2="176" stroke="#6FC3FF" stroke-width="0.7"/>
    <!-- axis -->
    <line x1="990" y1="290" x2="1300" y2="290" stroke-width="1"/>
    <line x1="990" y1="290" x2="990" y2="200" stroke-width="1"/>
    <text x="978" y="198" fill="#DCEBFA" font-size="8" text-anchor="end" stroke="none">T</text>
    <!-- sea level bar high -->
    <rect x="1030" y="206" width="50" height="84" fill="#16406B"/>
    <text x="1055" y="306" fill="#DCEBFA" font-size="8" text-anchor="middle" stroke="none">SEA LEVEL</text>
    <!-- vacuum bar low -->
    <rect x="1180" y="250" width="50" height="40" fill="#DCEBFA"/>
    <text x="1205" y="306" fill="#6FC3FF" font-size="8" text-anchor="middle" stroke="none">VACUUM</text>
    <path d="M 1090 240 l 80 20" stroke="#6FC3FF" stroke-width="1" marker-end="url(#arrow)"/>
    <text x="968" y="330" fill="#6FC3FF" font-size="9" stroke="none">BOILS AT FAR LOWER T WHEN PRESSURE ≈ 0</text>
  </g>

  <!-- ======== NO-CONSUMABLES DETAIL A ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.4">
    <circle cx="1130" cy="560" r="92" stroke="#6FC3FF"/>
    <text x="1130" y="512" fill="#6FC3FF" font-size="9" text-anchor="middle" stroke="none">WHAT IT DOESN'T NEED</text>
    <g fill="#DCEBFA" font-size="8.5" stroke="none">
      <text x="1130" y="534" text-anchor="middle">✗ CARBON   ✗ ACIDS</text>
      <text x="1130" y="552" text-anchor="middle">✗ FLUXES   ✗ SOLVENTS</text>
      <text x="1130" y="570" text-anchor="middle">✗ WATER    ✗ MOLTEN SALTS</text>
      <text x="1130" y="588" text-anchor="middle">✗ VACUUM PUMPS</text>
    </g>
    <line x1="1060" y1="600" x2="1200" y2="600" stroke="#6FC3FF" stroke-width="0.8"/>
    <text x="1130" y="620" fill="#6FC3FF" font-size="9" text-anchor="middle" stroke="none">ONLY INPUT: HEAT</text>
    <text x="1130" y="676" fill="#6FC3FF" font-size="12" text-anchor="middle" stroke="none">DETAIL A — NOTHING TO IMPORT</text>
    <line x1="800" y1="500" x2="1044" y2="548" stroke="#6FC3FF" stroke-width="0.9" stroke-dasharray="5 4"/>
  </g>

  <!-- ======== LIMITS PANEL ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.4">
    <rect x="900" y="700" width="440" height="96" fill="#0E3357" stroke="#6FC3FF" stroke-width="1.4"/>
    <text x="918" y="724" fill="#6FC3FF" font-size="11" letter-spacing="1" stroke="none">! IT SORTS ONLY WHAT WILL BOIL</text>
    <line x1="918" y1="732" x2="1322" y2="732" stroke="#6FC3FF" stroke-width="0.7"/>
    <g fill="#DCEBFA" font-size="9" stroke="none">
      <text x="918" y="750">REFRACTORY OXIDES RESIST — COMPLEMENTS, NOT REPLACES</text>
      <text x="918" y="768">ENERGY BOUNDS THROUGHPUT · VAPOUR COATS EVERYTHING</text>
      <text x="918" y="786" fill="#6FC3FF">POWER, NOT CHEMISTRY, PACES THE WHOLE PROGRESSION</text>
    </g>
  </g>

  <!-- ======== CALLOUTS ======== -->
  <g stroke="#6FC3FF" stroke-width="1" fill="none">
    <line x1="145" y1="296" x2="180" y2="830" marker-start="url(#arrow)"/>
    <line x1="160" y1="490" x2="360" y2="830" marker-start="url(#arrow)"/>
    <line x1="290" y1="410" x2="500" y2="830" marker-start="url(#arrow)"/>
    <line x1="585" y1="500" x2="640" y2="830" marker-start="url(#arrow)"/>
    <line x1="880" y1="440" x2="790" y2="830" marker-start="url(#arrow)"/>
  </g>
  <g fill="#DCEBFA" font-size="13">
    <g><circle cx="180" cy="842" r="12" fill="none" stroke="#6FC3FF"/><text x="180" y="847" text-anchor="middle">1</text></g>
    <g><circle cx="360" cy="842" r="12" fill="none" stroke="#6FC3FF"/><text x="360" y="847" text-anchor="middle">2</text></g>
    <g><circle cx="500" cy="842" r="12" fill="none" stroke="#6FC3FF"/><text x="500" y="847" text-anchor="middle">3</text></g>
    <g><circle cx="640" cy="842" r="12" fill="none" stroke="#6FC3FF"/><text x="640" y="847" text-anchor="middle">4</text></g>
    <g><circle cx="790" cy="842" r="12" fill="none" stroke="#6FC3FF"/><text x="790" y="847" text-anchor="middle">5</text></g>
  </g>

  <!-- ======== PARTS LIST ======== -->
  <g font-size="11.5" fill="#DCEBFA">
    <rect x="50" y="862" width="640" height="96" fill="#0E3357" stroke="#6FC3FF" stroke-width="1"/>
    <text x="66" y="882" fill="#6FC3FF" font-size="12.5" letter-spacing="2" font-weight="bold">PARTS &amp; SYSTEMS INDEX</text>
    <line x1="66" y1="889" x2="674" y2="889" stroke="#6FC3FF" stroke-width="0.7"/>
    <text x="66" y="906">1 — FEED: crushed regolith, concentrate, or mixed scrap</text>
    <text x="66" y="924">2 — HEATED CRUCIBLE: solar or electric, raised in stages; residue drawn off</text>
    <text x="66" y="942">3 — VAPOUR PATH: each species leaves the melt at its own temperature</text>
    <text x="66" y="954" font-size="10" fill="#6FC3FF">4 — COLLECTOR TRAIN: descending temps sort the condensates · 5 — SORTED METAL OUT</text>
  </g>

  <text x="1350" y="842" fill="#6FC3FF" font-size="11" text-anchor="end" letter-spacing="1">DESIGNED BY: W.A. SANDUN PRIYANKARA WIJERATHNE · sandunwijerathne51@gmail.com · github.com/sandunwijerathne</text>

  <!-- ======== TITLE BLOCK ======== -->
  <g font-size="11.5" fill="#DCEBFA">
    <rect x="710" y="862" width="640" height="96" fill="#0E3357" stroke="#DCEBFA" stroke-width="1.5"/>
    <line x1="710" y1="890" x2="1350" y2="890" stroke="#DCEBFA"/>
    <line x1="710" y1="918" x2="1350" y2="918" stroke="#DCEBFA"/>
    <line x1="710" y1="940" x2="1350" y2="940" stroke="#DCEBFA"/>
    <line x1="1040" y1="862" x2="1040" y2="958" stroke="#DCEBFA"/>
    <text x="726" y="880" fill="#6FC3FF" letter-spacing="1">PROJECT</text>
    <text x="726" y="888" font-size="10.5" font-weight="bold">OFF-WORLD TOOLKIT · VOLUME II</text>
    <text x="1056" y="880" fill="#6FC3FF">DRAWING NO.</text>
    <text x="1056" y="888" font-size="10.5" font-weight="bold">VR-1-GA-001 · REV A</text>
    <text x="726" y="906" fill="#6FC3FF">UNIT DESIGNATION</text>
    <text x="726" y="915" font-weight="bold" font-size="9.5">VR-1 "ALEMBIC" — GENERAL ARRANGEMENT</text>
    <text x="1056" y="906" fill="#6FC3FF">SEPARATES BY</text>
    <text x="1056" y="915" font-weight="bold" font-size="10">BOILING POINT (FRACTIONAL VAPOUR)</text>
    <text x="726" y="932" fill="#6FC3FF">CONSUMABLES</text>
    <text x="726" y="938" font-weight="bold" font-size="9.5">NONE — HEAT ONLY · VACUUM IS FREE</text>
    <text x="1056" y="932" fill="#6FC3FF">FEEDS</text>
    <text x="1056" y="938" font-weight="bold" font-size="9.5">FOUNDRY · FABRICATION · RECYCLING</text>
    <text x="726" y="952" fill="#6FC3FF">FUNCTION</text>
    <text x="726" y="956" font-weight="bold" font-size="9">TURNS ROCK AND SCRAP INTO SORTED METAL</text>
    <text x="1056" y="952" fill="#6FC3FF">STATUS</text>
    <text x="1056" y="956" font-weight="bold" font-size="9">CONCEPT — VACUUM METALLURGY IS MATURE</text>
  </g>
</svg>
