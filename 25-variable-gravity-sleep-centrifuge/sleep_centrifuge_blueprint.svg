<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#16406B" stroke-width="0.6"/>
    </pattern>
    <pattern id="gridMajor" width="125" height="125" patternUnits="userSpaceOnUse">
      <rect width="125" height="125" fill="url(#grid)"/>
      <path d="M 125 0 L 0 0 0 125" fill="none" stroke="#1E5288" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6FC3FF"/>
    </marker>
    <marker id="warrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#DCEBFA"/>
    </marker>
    <marker id="dim" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M1,1 L9,9 M5,0 L5,10" stroke="#DCEBFA" stroke-width="1" fill="none"/>
    </marker>
  </defs>

  <rect width="1400" height="1000" fill="#0B2A4A"/>
  <rect width="1400" height="1000" fill="url(#gridMajor)"/>
  <rect x="20" y="20" width="1360" height="960" fill="none" stroke="#DCEBFA" stroke-width="2"/>
  <rect x="28" y="28" width="1344" height="944" fill="none" stroke="#DCEBFA" stroke-width="0.8"/>

  <text x="50" y="70" fill="#DCEBFA" font-size="25" letter-spacing="2" font-weight="bold">VARIABLE-GRAVITY SLEEP CENTRIFUGE — VG-1 "IXION"</text>
  <text x="50" y="96" fill="#6FC3FF" font-size="14" letter-spacing="2">SHORT-ARM SLEEP CENTRIFUGE · PLAN VIEW · BERTH DETAIL · VOLUME II · SHEET 1 OF 5</text>
  <line x1="50" y1="110" x2="1350" y2="110" stroke="#6FC3FF" stroke-width="1"/>

  <!-- ======== MAIN PLAN VIEW: rotating arm ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="2">
    <!-- rotation axis hub -->
    <circle cx="440" cy="470" r="30"/>
    <circle cx="440" cy="470" r="10" fill="#DCEBFA"/>
    <text x="440" y="524" fill="#6FC3FF" font-size="10" text-anchor="middle" stroke="none">ROTATION AXIS / HUB</text>
    <text x="440" y="538" fill="#DCEBFA" font-size="8.5" text-anchor="middle" stroke="none">DRIVE + BEARINGS</text>

    <!-- arm to berth -->
    <rect x="470" y="462" width="240" height="16"/>
    <text x="590" y="454" fill="#6FC3FF" font-size="10" text-anchor="middle" stroke="none">ARM (FEW METRES)</text>

    <!-- berth / bed at end -->
    <rect x="700" y="430" width="120" height="80" rx="6"/>
    <!-- sleeper -->
    <g stroke-width="1.4">
      <circle cx="720" cy="470" r="10"/>
      <line x1="730" y1="470" x2="800" y2="470"/>
      <line x1="800" y1="470" x2="810" y2="462"/>
      <line x1="800" y1="470" x2="810" y2="478"/>
    </g>
    <text x="760" y="424" fill="#DCEBFA" font-size="9" text-anchor="middle" stroke="none">SLEEPER: HEAD IN, FEET OUT</text>

    <!-- artificial gravity arrow (outward) -->
    <path d="M 830 470 l 40 0" stroke="#6FC3FF" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="838" y="458" fill="#6FC3FF" font-size="9" stroke="none">APPARENT GRAVITY</text>
    <text x="838" y="494" fill="#DCEBFA" font-size="8.5" stroke="none">PRESSES INTO BED (~1 g)</text>

    <!-- counterbalance opposite -->
    <rect x="300" y="454" width="60" height="32" rx="4"/>
    <path d="M 316 462 h28 M 316 470 h28 M 316 478 h28" stroke-width="0.6"/>
    <text x="330" y="446" fill="#6FC3FF" font-size="8.5" text-anchor="middle" stroke="none">COUNTERBALANCE</text>
    <rect x="360" y="462" width="80" height="16"/>

    <!-- rotation direction arc -->
    <path d="M 560 300 A 200 200 0 0 1 700 340" stroke="#6FC3FF" stroke-width="1" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
    <text x="560" y="290" fill="#6FC3FF" font-size="9" stroke="none">ROTATION THROUGH SLEEP PERIOD</text>

    <!-- radius dimension -->
    <line x1="440" y1="580" x2="760" y2="580" stroke="#DCEBFA" stroke-width="1" marker-start="url(#dim)" marker-end="url(#dim)"/>
    <line x1="440" y1="500" x2="440" y2="590" stroke-dasharray="4 3" stroke-width="0.5"/>
    <line x1="760" y1="510" x2="760" y2="590" stroke-dasharray="4 3" stroke-width="0.5"/>
    <text x="600" y="600" fill="#DCEBFA" font-size="10" text-anchor="middle" stroke="none">RADIUS r — LONGER r = GENTLER GRADIENT, SLOWER SPIN</text>
  </g>

  <!-- ======== TRADE-OFF INSET (top right) ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.2">
    <rect x="900" y="140" width="440" height="220" fill="#0E3357" stroke="#6FC3FF"/>
    <text x="918" y="166" fill="#6FC3FF" font-size="12" letter-spacing="1" stroke="none">FIG. B — THE ARM-LENGTH TRADE</text>
    <line x1="918" y1="176" x2="1322" y2="176" stroke="#6FC3FF" stroke-width="0.7"/>
    <!-- short arm -->
    <line x1="940" y1="230" x2="1000" y2="230" stroke-width="2"/>
    <circle cx="940" cy="230" r="5" fill="#DCEBFA"/>
    <rect x="1000" y="220" width="20" height="20"/>
    <path d="M 946 230 l 0 -14" marker-end="url(#warrow)" stroke-width="0.8"/>
    <path d="M 1010 214 l 0 -8" marker-end="url(#warrow)" stroke-width="1.4"/>
    <text x="1035" y="228" fill="#DCEBFA" font-size="8" stroke="none">SHORT: FAST SPIN,</text>
    <text x="1035" y="240" fill="#6FC3FF" font-size="8" stroke="none">STEEP GRADIENT ✗</text>
    <!-- long arm -->
    <line x1="940" y1="300" x2="1120" y2="300" stroke-width="2"/>
    <circle cx="940" cy="300" r="5" fill="#DCEBFA"/>
    <rect x="1120" y="290" width="20" height="20"/>
    <path d="M 1128 288 l 0 -6" marker-end="url(#arrow)" stroke-width="1"/>
    <text x="1155" y="298" fill="#DCEBFA" font-size="8" stroke="none">LONG: SLOW SPIN,</text>
    <text x="1155" y="310" fill="#6FC3FF" font-size="8" stroke="none">GENTLE ✓ BUT BIGGER</text>
    <text x="918" y="344" fill="#6FC3FF" font-size="9" stroke="none">DESIGN LIVES IN A NARROW TOLERABLE WINDOW</text>
  </g>

  <!-- ======== BERTH DETAIL A ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.4">
    <circle cx="1120" cy="560" r="96" stroke="#6FC3FF"/>
    <!-- bed side view -->
    <rect x="1050" y="560" width="140" height="18"/>
    <!-- sleeper on it -->
    <g stroke-width="1.2">
      <circle cx="1066" cy="550" r="8"/>
      <line x1="1074" y1="552" x2="1176" y2="556"/>
    </g>
    <!-- restraint straps -->
    <path d="M 1090 542 q 0 20 0 36 M 1130 544 q 0 18 0 34" stroke="#6FC3FF" stroke-width="1"/>
    <text x="1120" y="606" fill="#6FC3FF" font-size="8" text-anchor="middle" stroke="none">GENTLE RESTRAINT KEEPS SLEEPER ALIGNED</text>
    <!-- coriolis warning -->
    <path d="M 1066 528 q 14 -14 28 0" stroke="#DCEBFA" stroke-width="1" marker-end="url(#warrow)"/>
    <text x="1120" y="520" fill="#DCEBFA" font-size="8" text-anchor="middle" stroke="none">HEAD MOVEMENT → CORIOLIS CUE</text>
    <text x="1120" y="674" fill="#6FC3FF" font-size="12" text-anchor="middle" stroke="none">DETAIL A — THE BERTH (HARD PART)</text>
    <line x1="760" y1="450" x2="1030" y2="540" stroke="#6FC3FF" stroke-width="0.9" stroke-dasharray="5 4"/>
  </g>

  <!-- ======== OPEN-QUESTION PANEL ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.4">
    <rect x="900" y="690" width="270" height="96" fill="#0E3357" stroke="#6FC3FF" stroke-width="1.4"/>
    <text x="916" y="714" fill="#6FC3FF" font-size="11" letter-spacing="1" stroke="none">? THE OPEN QUESTION</text>
    <line x1="916" y1="722" x2="1154" y2="722" stroke="#6FC3FF" stroke-width="0.7"/>
    <g fill="#DCEBFA" font-size="9" stroke="none">
      <text x="916" y="740">DOES PART-TIME GRAVITY PROTECT THE BODY?</text>
      <text x="916" y="758">UNKNOWN — SO THE MACHINE IS AN EXPERIMENT</text>
      <text x="916" y="776" fill="#6FC3FF">BUILD IT TO FIND OUT</text>
    </g>
  </g>

  <!-- ======== CALLOUTS ======== -->
  <g stroke="#6FC3FF" stroke-width="1" fill="none">
    <line x1="440" y1="500" x2="180" y2="800" marker-start="url(#arrow)"/>
    <line x1="590" y1="478" x2="340" y2="800" marker-start="url(#arrow)"/>
    <line x1="760" y1="510" x2="500" y2="800" marker-start="url(#arrow)"/>
    <line x1="850" y1="470" x2="640" y2="800" marker-start="url(#arrow)"/>
    <line x1="330" y1="486" x2="790" y2="800" marker-start="url(#arrow)"/>
  </g>
  <g fill="#DCEBFA" font-size="13">
    <g><circle cx="180" cy="812" r="12" fill="none" stroke="#6FC3FF"/><text x="180" y="817" text-anchor="middle">1</text></g>
    <g><circle cx="340" cy="812" r="12" fill="none" stroke="#6FC3FF"/><text x="340" y="817" text-anchor="middle">2</text></g>
    <g><circle cx="500" cy="812" r="12" fill="none" stroke="#6FC3FF"/><text x="500" y="817" text-anchor="middle">3</text></g>
    <g><circle cx="640" cy="812" r="12" fill="none" stroke="#6FC3FF"/><text x="640" y="817" text-anchor="middle">4</text></g>
    <g><circle cx="790" cy="812" r="12" fill="none" stroke="#6FC3FF"/><text x="790" y="817" text-anchor="middle">5</text></g>
  </g>

  <!-- ======== PARTS LIST ======== -->
  <g font-size="12.5" fill="#DCEBFA">
    <rect x="50" y="832" width="640" height="124" fill="#0E3357" stroke="#6FC3FF" stroke-width="1"/>
    <text x="66" y="856" fill="#6FC3FF" font-size="13" letter-spacing="2" font-weight="bold">PARTS &amp; SYSTEMS INDEX</text>
    <line x1="66" y1="865" x2="674" y2="865" stroke="#6FC3FF" stroke-width="0.7"/>
    <text x="66" y="885">1 — HUB: rotation axis, drive, bearings (quiet, vibration-free)</text>
    <text x="66" y="905">2 — ARM: length sets spin rate and gravity gradient trade-off</text>
    <text x="66" y="925">3 — BERTH: sleeper head-in/feet-out, gently restrained (DETAIL A)</text>
    <text x="66" y="941" font-size="10.5" fill="#6FC3FF">4 — APPARENT GRAVITY presses sleeper into bed ~1g · 5 — COUNTERBALANCE</text>
  </g>

  <text x="1350" y="812" fill="#6FC3FF" font-size="11" text-anchor="end" letter-spacing="1">DESIGNED BY: W.A. SANDUN PRIYANKARA WIJERATHNE · sandunwijerathne51@gmail.com · github.com/sandunwijerathne</text>

  <!-- ======== TITLE BLOCK ======== -->
  <g font-size="12" fill="#DCEBFA">
    <rect x="710" y="832" width="640" height="124" fill="#0E3357" stroke="#DCEBFA" stroke-width="1.5"/>
    <line x1="710" y1="866" x2="1350" y2="866" stroke="#DCEBFA"/>
    <line x1="710" y1="900" x2="1350" y2="900" stroke="#DCEBFA"/>
    <line x1="710" y1="934" x2="1350" y2="934" stroke="#DCEBFA"/>
    <line x1="1040" y1="832" x2="1040" y2="956" stroke="#DCEBFA"/>
    <text x="726" y="852" fill="#6FC3FF" letter-spacing="1">PROJECT</text>
    <text x="726" y="862" font-size="11" font-weight="bold">OFF-WORLD TOOLKIT · VOLUME II</text>
    <text x="1056" y="852" fill="#6FC3FF">DRAWING NO.</text>
    <text x="1056" y="862" font-size="11" font-weight="bold">VG-1-GA-001 · REV A</text>
    <text x="726" y="886" fill="#6FC3FF">UNIT DESIGNATION</text>
    <text x="726" y="896" font-weight="bold" font-size="10">VG-1 "IXION" — GENERAL ARRANGEMENT</text>
    <text x="1056" y="886" fill="#6FC3FF">LOADS BODY</text>
    <text x="1056" y="896" font-weight="bold" font-size="11">~1g DURING SLEEP ONLY</text>
    <text x="726" y="920" fill="#6FC3FF">PHYSICS</text>
    <text x="726" y="930" font-weight="bold" font-size="10.5">ROTATION (TRIVIAL) · BIOLOGY (UNKNOWN)</text>
    <text x="1056" y="920" fill="#6FC3FF">FIRST JOB</text>
    <text x="1056" y="930" font-weight="bold" font-size="11">TEST THE HYPOTHESIS</text>
    <text x="726" y="944" fill="#6FC3FF">FUNCTION</text>
    <text x="726" y="954" font-weight="bold" font-size="10.5">SLOW BONE/MUSCLE LOSS AT NO COST TO THE DAY</text>
    <text x="1056" y="944" fill="#6FC3FF">STATUS</text>
    <text x="1056" y="954" font-weight="bold" font-size="10">CONCEPT — HYPOTHESIS + MACHINE</text>
  </g>
</svg>
