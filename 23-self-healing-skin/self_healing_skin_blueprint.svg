<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#16406B" stroke-width="0.6"/>
    </pattern>
    <pattern id="gridMajor" width="125" height="125" patternUnits="userSpaceOnUse">
      <rect width="125" height="125" fill="url(#grid)"/>
      <path d="M 125 0 L 0 0 0 125" fill="none" stroke="#1E5288" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6FC3FF"/>
    </marker>
    <marker id="warrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#DCEBFA"/>
    </marker>
    <marker id="dim" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M1,1 L9,9 M5,0 L5,10" stroke="#DCEBFA" stroke-width="1" fill="none"/>
    </marker>
  </defs>

  <rect width="1400" height="1000" fill="#0B2A4A"/>
  <rect width="1400" height="1000" fill="url(#gridMajor)"/>
  <rect x="20" y="20" width="1360" height="960" fill="none" stroke="#DCEBFA" stroke-width="2"/>
  <rect x="28" y="28" width="1344" height="944" fill="none" stroke="#DCEBFA" stroke-width="0.8"/>

  <text x="50" y="70" fill="#DCEBFA" font-size="26" letter-spacing="2" font-weight="bold">SELF-HEALING PRESSURE SKIN — SH-1 "COAGULANT"</text>
  <text x="50" y="96" fill="#6FC3FF" font-size="14" letter-spacing="2">SELF-SEALING HULL MEMBRANE · LAYER SECTION · HEAL SEQUENCE · VOLUME II · SHEET 1 OF 5</text>
  <line x1="50" y1="110" x2="1350" y2="110" stroke="#6FC3FF" stroke-width="1"/>

  <!-- ======== MAIN LAYER SECTION (large, horizontal sandwich) ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="2">
    <!-- outer solid layer -->
    <rect x="150" y="300" width="640" height="40"/>
    <g stroke-width="0.6"><line x1="170" y1="300" x2="158" y2="316"/><line x1="210" y1="300" x2="198" y2="316"/><line x1="250" y1="300" x2="238" y2="316"/><line x1="600" y1="300" x2="588" y2="316"/><line x1="700" y1="300" x2="688" y2="316"/><line x1="760" y1="300" x2="748" y2="316"/></g>
    <text x="810" y="324" fill="#6FC3FF" font-size="10" stroke="none">OUTER SOLID WALL</text>

    <!-- reactive liquid layer -->
    <rect x="150" y="340" width="640" height="46" fill="#0E3357"/>
    <rect x="150" y="340" width="640" height="46"/>
    <g stroke="#6FC3FF" stroke-width="0.7">
      <path d="M 180 363 q 20 -10 40 0 q 20 10 40 0 q 20 -10 40 0"/>
      <path d="M 400 363 q 20 -10 40 0 q 20 10 40 0 q 20 -10 40 0"/>
      <path d="M 620 363 q 20 -10 40 0 q 20 10 40 0 q 20 -10 40 0"/>
    </g>
    <text x="810" y="370" fill="#6FC3FF" font-size="10" stroke="none">REACTIVE LIQUID HEALING AGENT</text>

    <!-- inner solid layer -->
    <rect x="150" y="386" width="640" height="40"/>
    <g stroke-width="0.6"><line x1="170" y1="386" x2="158" y2="402"/><line x1="210" y1="386" x2="198" y2="402"/><line x1="250" y1="386" x2="238" y2="402"/><line x1="600" y1="386" x2="588" y2="402"/><line x1="700" y1="386" x2="688" y2="402"/><line x1="760" y1="386" x2="748" y2="402"/></g>
    <text x="810" y="412" fill="#6FC3FF" font-size="10" stroke="none">INNER SOLID WALL (PRESSURE SIDE)</text>

    <!-- labels: space above, cabin below -->
    <text x="150" y="270" fill="#DCEBFA" font-size="11" stroke="none">SPACE (VACUUM) — MICROMETEOROID FIELD</text>
    <text x="150" y="466" fill="#DCEBFA" font-size="11" stroke="none">CABIN (PRESSURISED AIR)</text>
    <line x1="150" y1="440" x2="790" y2="440" stroke-width="0.5" stroke-dasharray="4 5"/>

    <!-- incoming projectile far left (intact) -->
    <circle cx="230" cy="250" r="8"/>
    <path d="M 226 258 l 0 40" stroke="#DCEBFA" stroke-width="1.4" marker-end="url(#warrow)"/>
    <text x="242" y="246" fill="#DCEBFA" font-size="9" stroke="none">MICROMETEOROID (mm-SCALE)</text>

    <!-- puncture channel mid -->
    <line x1="470" y1="300" x2="470" y2="426" stroke="#6FC3FF" stroke-width="1.2" stroke-dasharray="3 3"/>
    <circle cx="470" cy="290" r="7"/>
    <path d="M 470 300 l 0 130" stroke="#DCEBFA" stroke-width="0.8"/>
    <text x="490" y="288" fill="#6FC3FF" font-size="9" stroke="none">PUNCTURE CHANNEL</text>

    <!-- air escaping through hole (outward) -->
    <g stroke="#6FC3FF" stroke-width="1">
      <path d="M 462 300 l -8 -20" marker-end="url(#arrow)"/>
      <path d="M 470 300 l 0 -22" marker-end="url(#arrow)"/>
      <path d="M 478 300 l 8 -20" marker-end="url(#arrow)"/>
    </g>
    <text x="500" y="264" fill="#6FC3FF" font-size="8.5" stroke="none">ESCAPING AIR DRAGS SEALANT UP</text>

    <!-- sealant being pulled into channel -->
    <g stroke="#6FC3FF" stroke-width="1">
      <path d="M 440 363 q 24 -6 28 -18" marker-end="url(#arrow)"/>
      <path d="M 500 363 q -24 -6 -28 -18" marker-end="url(#arrow)"/>
    </g>
    <!-- hardened plug -->
    <path d="M 462 300 q 8 20 0 130 q -8 -60 -8 -70 q 4 -40 8 -60 z" stroke="#DCEBFA" stroke-width="1.4" fill="#0E3357"/>
    <text x="380" y="470" fill="#6FC3FF" font-size="8.5" stroke="none">→ HARDENS ON EXPOSURE → PLUG SET IN &lt;1 s</text>
  </g>

  <!-- ======== HEAL SEQUENCE INSET (top right) ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.2">
    <rect x="900" y="140" width="440" height="230" fill="#0E3357" stroke="#6FC3FF"/>
    <text x="918" y="166" fill="#6FC3FF" font-size="12" letter-spacing="1" stroke="none">FIG. B — HEAL SEQUENCE (PASSIVE)</text>
    <line x1="918" y1="176" x2="1322" y2="176" stroke="#6FC3FF" stroke-width="0.7"/>
    <!-- step 1 intact -->
    <g stroke-width="1"><rect x="930" y="210" width="60" height="12"/><rect x="930" y="222" width="60" height="16" fill="#16406B"/><rect x="930" y="238" width="60" height="12"/></g>
    <text x="960" y="266" fill="#DCEBFA" font-size="8" text-anchor="middle" stroke="none">1 INTACT</text>
    <!-- arrow -->
    <line x1="1000" y1="230" x2="1040" y2="230" marker-end="url(#arrow)" stroke="#6FC3FF" stroke-width="0.8"/>
    <!-- step 2 pierced -->
    <g stroke-width="1"><rect x="1050" y="210" width="60" height="12"/><rect x="1050" y="222" width="60" height="16" fill="#16406B"/><rect x="1050" y="238" width="60" height="12"/><line x1="1080" y1="206" x2="1080" y2="254" stroke="#6FC3FF" stroke-dasharray="2 2"/></g>
    <text x="1080" y="266" fill="#DCEBFA" font-size="8" text-anchor="middle" stroke="none">2 PIERCED</text>
    <line x1="1120" y1="230" x2="1160" y2="230" marker-end="url(#arrow)" stroke="#6FC3FF" stroke-width="0.8"/>
    <!-- step 3 sealed -->
    <g stroke-width="1"><rect x="1170" y="210" width="60" height="12"/><rect x="1170" y="222" width="60" height="16" fill="#16406B"/><rect x="1170" y="238" width="60" height="12"/><rect x="1196" y="208" width="8" height="46" fill="#0E3357" stroke="#DCEBFA"/></g>
    <text x="1200" y="266" fill="#DCEBFA" font-size="8" text-anchor="middle" stroke="none">3 SEALED</text>
    <text x="918" y="304" fill="#6FC3FF" font-size="9" stroke="none">NO SENSOR · NO VALVE · NO CREW ACTION</text>
    <text x="918" y="326" fill="#DCEBFA" font-size="9" stroke="none">THE LEAK DRIVES ITS OWN REPAIR</text>
    <text x="918" y="352" fill="#6FC3FF" font-size="9" stroke="none">SEALS AIRTIGHTNESS, NOT STRENGTH — BUYS TIME</text>
  </g>

  <!-- ======== DETAIL A: heritage ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.4">
    <circle cx="1120" cy="580" r="90" stroke="#6FC3FF"/>
    <!-- fuel tank wall -->
    <rect x="1064" y="536" width="112" height="20"/>
    <text x="1120" y="530" fill="#DCEBFA" font-size="8" text-anchor="middle" stroke="none">1918 FUEL TANK</text>
    <!-- rubber layer -->
    <rect x="1064" y="556" width="112" height="16" fill="#16406B"/>
    <text x="1120" y="568" fill="#DCEBFA" font-size="7.5" text-anchor="middle" stroke="none">RUBBER SWELLS ON FUEL</text>
    <!-- bullet -->
    <circle cx="1120" cy="520" r="5"/>
    <path d="M 1120 525 l 0 8" stroke="#DCEBFA" stroke-width="1"/>
    <!-- swell seal -->
    <path d="M 1108 572 q 12 14 24 0" stroke="#6FC3FF" stroke-width="1.4"/>
    <text x="1120" y="600" fill="#6FC3FF" font-size="8" text-anchor="middle" stroke="none">SAME IDEA, 100+ YEARS PROVEN</text>
    <text x="1120" y="694" fill="#6FC3FF" font-size="12" text-anchor="middle" stroke="none">DETAIL A — HERITAGE: SELF-SEALING TANK</text>
    <line x1="470" y1="386" x2="1032" y2="562" stroke="#6FC3FF" stroke-width="0.9" stroke-dasharray="5 4"/>
  </g>

  <!-- ======== LIMIT PANEL ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.4">
    <rect x="900" y="700" width="270" height="86" fill="#0E3357" stroke="#6FC3FF" stroke-width="1.4"/>
    <text x="916" y="724" fill="#6FC3FF" font-size="11" letter-spacing="1" stroke="none">! HONEST LIMIT</text>
    <line x1="916" y1="732" x2="1154" y2="732" stroke="#6FC3FF" stroke-width="0.7"/>
    <g fill="#DCEBFA" font-size="9" stroke="none">
      <text x="916" y="750">SEALS mm PUNCTURES — NOT LARGE BREACHES</text>
      <text x="916" y="768">A THIRD LINE BEHIND SHIELDING + STRUCTURE</text>
    </g>
  </g>

  <!-- ======== DIMENSION ======== -->
  <g stroke="#DCEBFA" stroke-width="1" fill="#DCEBFA">
    <line x1="120" y1="300" x2="120" y2="426" marker-start="url(#dim)" marker-end="url(#dim)"/>
    <text x="100" y="363" text-anchor="middle" font-size="10" transform="rotate(-90 100 363)">SKIN CROSS-SECTION</text>
  </g>

  <!-- ======== CALLOUTS ======== -->
  <g stroke="#6FC3FF" stroke-width="1" fill="none">
    <line x1="300" y1="320" x2="200" y2="800" marker-start="url(#arrow)"/>
    <line x1="300" y1="363" x2="360" y2="800" marker-start="url(#arrow)"/>
    <line x1="300" y1="406" x2="500" y2="800" marker-start="url(#arrow)"/>
    <line x1="470" y1="360" x2="640" y2="800" marker-start="url(#arrow)"/>
    <line x1="462" y1="410" x2="790" y2="800" marker-start="url(#arrow)"/>
  </g>
  <g fill="#DCEBFA" font-size="13">
    <g><circle cx="200" cy="812" r="12" fill="none" stroke="#6FC3FF"/><text x="200" y="817" text-anchor="middle">1</text></g>
    <g><circle cx="360" cy="812" r="12" fill="none" stroke="#6FC3FF"/><text x="360" y="817" text-anchor="middle">2</text></g>
    <g><circle cx="500" cy="812" r="12" fill="none" stroke="#6FC3FF"/><text x="500" y="817" text-anchor="middle">3</text></g>
    <g><circle cx="640" cy="812" r="12" fill="none" stroke="#6FC3FF"/><text x="640" y="817" text-anchor="middle">4</text></g>
    <g><circle cx="790" cy="812" r="12" fill="none" stroke="#6FC3FF"/><text x="790" y="817" text-anchor="middle">5</text></g>
  </g>

  <!-- ======== PARTS LIST ======== -->
  <g font-size="12.5" fill="#DCEBFA">
    <rect x="50" y="832" width="640" height="124" fill="#0E3357" stroke="#6FC3FF" stroke-width="1"/>
    <text x="66" y="856" fill="#6FC3FF" font-size="13" letter-spacing="2" font-weight="bold">PARTS &amp; SYSTEMS INDEX</text>
    <line x1="66" y1="865" x2="674" y2="865" stroke="#6FC3FF" stroke-width="0.7"/>
    <text x="66" y="885">1 — OUTER SOLID WALL: structural face toward space</text>
    <text x="66" y="905">2 — REACTIVE LIQUID LAYER: healing agent, inert until released</text>
    <text x="66" y="925">3 — INNER SOLID WALL: pressure side, toward cabin</text>
    <text x="66" y="941" font-size="10.5" fill="#6FC3FF">4 — ESCAPING AIR DRAGS SEALANT INTO CHANNEL · 5 — SEALANT HARDENS → PLUG (&lt;1 s)</text>
  </g>

  <text x="1350" y="812" fill="#6FC3FF" font-size="11" text-anchor="end" letter-spacing="1">DESIGNED BY: W.A. SANDUN PRIYANKARA WIJERATHNE · sandunwijerathne51@gmail.com · github.com/sandunwijerathne</text>

  <!-- ======== TITLE BLOCK ======== -->
  <g font-size="12" fill="#DCEBFA">
    <rect x="710" y="832" width="640" height="124" fill="#0E3357" stroke="#DCEBFA" stroke-width="1.5"/>
    <line x1="710" y1="866" x2="1350" y2="866" stroke="#DCEBFA"/>
    <line x1="710" y1="900" x2="1350" y2="900" stroke="#DCEBFA"/>
    <line x1="710" y1="934" x2="1350" y2="934" stroke="#DCEBFA"/>
    <line x1="1040" y1="832" x2="1040" y2="956" stroke="#DCEBFA"/>
    <text x="726" y="852" fill="#6FC3FF" letter-spacing="1">PROJECT</text>
    <text x="726" y="862" font-size="11" font-weight="bold">OFF-WORLD TOOLKIT · VOLUME II</text>
    <text x="1056" y="852" fill="#6FC3FF">DRAWING NO.</text>
    <text x="1056" y="862" font-size="11" font-weight="bold">SH-1-GA-001 · REV A</text>
    <text x="726" y="886" fill="#6FC3FF">UNIT DESIGNATION</text>
    <text x="726" y="896" font-weight="bold" font-size="10">SH-1 "COAGULANT" — GENERAL ARRANGEMENT</text>
    <text x="1056" y="886" fill="#6FC3FF">HERITAGE</text>
    <text x="1056" y="896" font-weight="bold" font-size="11">SELF-SEALING FUEL TANK</text>
    <text x="726" y="920" fill="#6FC3FF">MECHANISM</text>
    <text x="726" y="930" font-weight="bold" font-size="10">PASSIVE — LEAK DRIVES ITS OWN REPAIR</text>
    <text x="1056" y="920" fill="#6FC3FF">SEALS</text>
    <text x="1056" y="930" font-weight="bold" font-size="11">mm PUNCTURES, NOT BREACHES</text>
    <text x="726" y="944" fill="#6FC3FF">FUNCTION</text>
    <text x="726" y="954" font-weight="bold" font-size="10">CLOSES SMALL HULL PUNCTURES AUTOMATICALLY</text>
    <text x="1056" y="944" fill="#6FC3FF">STATUS</text>
    <text x="1056" y="954" font-weight="bold" font-size="10">CONCEPT — LAB-DEMONSTRATED</text>
  </g>
</svg>
