<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#16406B" stroke-width="0.6"/>
    </pattern>
    <pattern id="gridMajor" width="125" height="125" patternUnits="userSpaceOnUse">
      <rect width="125" height="125" fill="url(#grid)"/>
      <path d="M 125 0 L 0 0 0 125" fill="none" stroke="#1E5288" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6FC3FF"/>
    </marker>
    <marker id="warrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#DCEBFA"/>
    </marker>
    <marker id="dim" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M1,1 L9,9 M5,0 L5,10" stroke="#DCEBFA" stroke-width="1" fill="none"/>
    </marker>
  </defs>

  <rect width="1400" height="1000" fill="#0B2A4A"/>
  <rect width="1400" height="1000" fill="url(#gridMajor)"/>
  <rect x="20" y="20" width="1360" height="960" fill="none" stroke="#DCEBFA" stroke-width="2"/>
  <rect x="28" y="28" width="1344" height="944" fill="none" stroke="#DCEBFA" stroke-width="0.8"/>

  <text x="50" y="70" fill="#DCEBFA" font-size="27" letter-spacing="2" font-weight="bold">REGOLITH RAIL GRADER — RG-1 "APPIUS"</text>
  <text x="50" y="96" fill="#6FC3FF" font-size="14" letter-spacing="2">SINTERED ROAD CRAWLER · SIDE ELEVATION · SINTER-ZONE DETAIL · VOLUME II · SHEET 1 OF 5</text>
  <line x1="50" y1="110" x2="1350" y2="110" stroke="#6FC3FF" stroke-width="1"/>

  <!-- ======== MAIN SIDE ELEVATION ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="2">
    <!-- ground line: loose ahead (right), fused behind (left) -->
    <line x1="90" y1="520" x2="1000" y2="520" stroke-width="1.6"/>
    <!-- loose regolith ahead (right of machine) -->
    <g fill="#6FC3FF"><circle cx="800" cy="512" r="2.5"/><circle cx="830" cy="516" r="2.5"/><circle cx="860" cy="510" r="2.5"/><circle cx="890" cy="516" r="2.5"/><circle cx="920" cy="511" r="2.5"/><circle cx="950" cy="515" r="2.5"/><circle cx="815" cy="500" r="2"/><circle cx="875" cy="499" r="2"/><circle cx="935" cy="502" r="2"/></g>
    <text x="880" y="480" fill="#DCEBFA" font-size="10" text-anchor="middle" stroke="none">LOOSE REGOLITH AHEAD</text>
    <text x="880" y="494" fill="#6FC3FF" font-size="8.5" text-anchor="middle" stroke="none">SHARP · CLINGING · DUSTY</text>

    <!-- fused road behind (left of machine) -->
    <rect x="90" y="514" width="240" height="12" fill="#0E3357"/>
    <rect x="90" y="514" width="240" height="12"/>
    <g stroke="#6FC3FF" stroke-width="0.5"><line x1="130" y1="514" x2="130" y2="526"/><line x1="180" y1="514" x2="180" y2="526"/><line x1="230" y1="514" x2="230" y2="526"/><line x1="280" y1="514" x2="280" y2="526"/></g>
    <text x="200" y="556" fill="#6FC3FF" font-size="10" text-anchor="middle" stroke="none">FUSED ROAD — BOUND, NO DUST</text>

    <!-- machine body (crawler), travelling right-to-left -->
    <rect x="350" y="330" width="420" height="130" rx="10"/>
    <text x="560" y="316" fill="#6FC3FF" font-size="11" text-anchor="middle" stroke="none">RG-1 CRAWLER (SLOW, HEAVY)</text>
    <!-- tracks -->
    <rect x="360" y="466" width="400" height="40" rx="18"/>
    <g stroke-width="0.8"><line x1="400" y1="466" x2="400" y2="506"/><line x1="450" y1="466" x2="450" y2="506"/><line x1="500" y1="466" x2="500" y2="506"/><line x1="550" y1="466" x2="550" y2="506"/><line x1="600" y1="466" x2="600" y2="506"/><line x1="650" y1="466" x2="650" y2="506"/><line x1="700" y1="466" x2="700" y2="506"/></g>
    <!-- direction of travel -->
    <path d="M 340 300 l -60 0" stroke="#6FC3FF" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="300" y="290" fill="#6FC3FF" font-size="9" text-anchor="middle" stroke="none">TRAVEL</text>

    <!-- 1. grading blade at FRONT (right side, leading edge) -->
    <path d="M 790 470 l 0 50 l -26 0 z" fill="#0E3357"/>
    <path d="M 790 470 l 0 50 l -26 0 z"/>
    <line x1="770" y1="440" x2="786" y2="474"/>
    <text x="812" y="452" fill="#DCEBFA" font-size="9" stroke="none">GRADE BLADE</text>
    <text x="812" y="466" fill="#6FC3FF" font-size="8" stroke="none">levels, clears rocks</text>

    <!-- 2. solar concentrator on top -->
    <path d="M 470 330 A 90 90 0 0 1 650 330" stroke-width="2"/>
    <g stroke="#6FC3FF" stroke-width="1"><path d="M 500 250 l 20 60 M 540 240 l 12 68 M 580 240 l -6 68 M 620 250 l -22 60"/></g>
    <text x="560" y="228" fill="#6FC3FF" font-size="9.5" text-anchor="middle" stroke="none">SOLAR CONCENTRATOR (FREE HEAT)</text>
    <!-- focused beam down -->
    <path d="M 560 340 l 0 120" stroke="#6FC3FF" stroke-width="1.6" marker-end="url(#arrow)"/>

    <!-- 3. microwave head alt -->
    <rect x="380" y="352" width="80" height="46" rx="4" fill="#0E3357"/>
    <g stroke="#6FC3FF" stroke-width="0.9"><path d="M 396 376 q 8 -8 16 0 q 8 8 16 0 q 8 -8 16 0"/></g>
    <text x="420" y="344" fill="#DCEBFA" font-size="8.5" text-anchor="middle" stroke="none">MICROWAVE HEAD</text>
    <text x="420" y="414" fill="#6FC3FF" font-size="7.5" text-anchor="middle" stroke="none">works at night</text>

    <!-- sinter zone under machine -->
    <rect x="480" y="508" width="180" height="18" fill="#16406B"/>
    <text x="570" y="500" fill="#DCEBFA" font-size="9" text-anchor="middle" stroke="none">SINTER ZONE</text>
    <text x="570" y="546" fill="#6FC3FF" font-size="8.5" text-anchor="middle" stroke="none">GRAINS SOFTEN + BOND</text>

    <!-- cooling trail label -->
    <path d="M 470 526 l -60 0" stroke="#6FC3FF" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
    <text x="380" y="580" fill="#DCEBFA" font-size="8.5" stroke="none">COOLS TO HARD CRUST</text>
  </g>

  <!-- ======== DUST PROBLEM INSET (top right) ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.2">
    <rect x="960" y="140" width="380" height="210" fill="#0E3357" stroke="#6FC3FF"/>
    <text x="978" y="166" fill="#6FC3FF" font-size="12" letter-spacing="1" stroke="none">FIG. B — WHY BIND THE GROUND</text>
    <line x1="978" y1="176" x2="1322" y2="176" stroke="#6FC3FF" stroke-width="0.7"/>
    <!-- rover on loose ground throwing dust -->
    <rect x="1000" y="216" width="46" height="20" rx="4"/>
    <circle cx="1012" cy="240" r="6"/><circle cx="1036" cy="240" r="6"/>
    <g stroke="#6FC3FF" stroke-width="0.8"><path d="M 1050 232 q 24 -18 46 -6 M 1050 240 q 28 -8 52 4"/></g>
    <text x="1024" y="266" fill="#DCEBFA" font-size="7.5" text-anchor="middle" stroke="none">LOOSE ✗</text>
    <text x="1110" y="222" fill="#6FC3FF" font-size="8" stroke="none">DUST FLUNG FAR</text>
    <text x="1110" y="234" fill="#6FC3FF" font-size="8" stroke="none">(NO AIR TO STOP IT)</text>
    <!-- rover on fused ground, clean -->
    <rect x="1000" y="290" width="46" height="20" rx="4"/>
    <circle cx="1012" cy="314" r="6"/><circle cx="1036" cy="314" r="6"/>
    <rect x="980" y="320" width="140" height="8" fill="#16406B"/>
    <text x="1024" y="342" fill="#6FC3FF" font-size="7.5" text-anchor="middle" stroke="none">FUSED ✓ CLEAN</text>
    <text x="1140" y="316" fill="#DCEBFA" font-size="8" stroke="none">TRAFFIC = THE</text>
    <text x="1140" y="328" fill="#DCEBFA" font-size="8" stroke="none">BIGGEST DUST SOURCE</text>
  </g>

  <!-- ======== SINTER DETAIL A ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.4">
    <circle cx="1130" cy="560" r="92" stroke="#6FC3FF"/>
    <!-- loose grains left -->
    <g fill="#6FC3FF"><circle cx="1072" cy="556" r="4"/><circle cx="1086" cy="566" r="4"/><circle cx="1070" cy="574" r="4"/><circle cx="1090" cy="548" r="4"/></g>
    <text x="1078" y="596" fill="#DCEBFA" font-size="7.5" text-anchor="middle" stroke="none">LOOSE GRAINS</text>
    <!-- heat arrow -->
    <path d="M 1104 540 l 24 0" stroke="#6FC3FF" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="1122" y="530" fill="#6FC3FF" font-size="7.5" stroke="none">HEAT</text>
    <!-- bonded grains right -->
    <g fill="#DCEBFA"><circle cx="1160" cy="556" r="4"/><circle cx="1172" cy="564" r="4"/><circle cx="1160" cy="572" r="4"/><circle cx="1176" cy="548" r="4"/></g>
    <g stroke="#DCEBFA" stroke-width="1.2"><line x1="1163" y1="558" x2="1170" y2="562"/><line x1="1162" y1="568" x2="1170" y2="566"/><line x1="1166" y1="552" x2="1174" y2="550"/></g>
    <text x="1168" y="596" fill="#6FC3FF" font-size="7.5" text-anchor="middle" stroke="none">NECKS FORM → BONDED</text>
    <text x="1130" y="620" fill="#DCEBFA" font-size="7.5" text-anchor="middle" stroke="none">SINTERED, NOT MELTED · NO BINDER</text>
    <text x="1130" y="676" fill="#6FC3FF" font-size="12" text-anchor="middle" stroke="none">DETAIL A — SINTERING</text>
    <line x1="660" y1="518" x2="1040" y2="556" stroke="#6FC3FF" stroke-width="0.9" stroke-dasharray="5 4"/>
  </g>

  <!-- ======== LIMITS PANEL ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.4">
    <rect x="900" y="690" width="440" height="96" fill="#0E3357" stroke="#6FC3FF" stroke-width="1.4"/>
    <text x="918" y="714" fill="#6FC3FF" font-size="11" letter-spacing="1" stroke="none">! SLOW AND POWER-HUNGRY</text>
    <line x1="918" y1="722" x2="1322" y2="722" stroke="#6FC3FF" stroke-width="0.7"/>
    <g fill="#DCEBFA" font-size="9" stroke="none">
      <text x="918" y="740">ENERGY PER UNIT AREA IS THE LIMIT — ROADS ARE BIG</text>
      <text x="918" y="758">CRUST IS CERAMIC: STRONG IN COMPRESSION, CRACKS IN TENSION</text>
      <text x="918" y="776" fill="#6FC3FF">BUT EVERY STRIP FUSED IS FUSED FOREVER</text>
    </g>
  </g>

  <!-- ======== CALLOUTS ======== -->
  <g stroke="#6FC3FF" stroke-width="1" fill="none">
    <line x1="780" y1="500" x2="180" y2="810" marker-start="url(#arrow)"/>
    <line x1="560" y1="270" x2="360" y2="810" marker-start="url(#arrow)"/>
    <line x1="420" y1="398" x2="500" y2="810" marker-start="url(#arrow)"/>
    <line x1="570" y1="518" x2="640" y2="810" marker-start="url(#arrow)"/>
    <line x1="200" y1="520" x2="790" y2="810" marker-start="url(#arrow)"/>
  </g>
  <g fill="#DCEBFA" font-size="13">
    <g><circle cx="180" cy="822" r="12" fill="none" stroke="#6FC3FF"/><text x="180" y="827" text-anchor="middle">1</text></g>
    <g><circle cx="360" cy="822" r="12" fill="none" stroke="#6FC3FF"/><text x="360" y="827" text-anchor="middle">2</text></g>
    <g><circle cx="500" cy="822" r="12" fill="none" stroke="#6FC3FF"/><text x="500" y="827" text-anchor="middle">3</text></g>
    <g><circle cx="640" cy="822" r="12" fill="none" stroke="#6FC3FF"/><text x="640" y="827" text-anchor="middle">4</text></g>
    <g><circle cx="790" cy="822" r="12" fill="none" stroke="#6FC3FF"/><text x="790" y="827" text-anchor="middle">5</text></g>
  </g>

  <!-- ======== PARTS LIST ======== -->
  <g font-size="12" fill="#DCEBFA">
    <rect x="50" y="842" width="640" height="114" fill="#0E3357" stroke="#6FC3FF" stroke-width="1"/>
    <text x="66" y="864" fill="#6FC3FF" font-size="13" letter-spacing="2" font-weight="bold">PARTS &amp; SYSTEMS INDEX</text>
    <line x1="66" y1="872" x2="674" y2="872" stroke="#6FC3FF" stroke-width="0.7"/>
    <text x="66" y="890">1 — GRADE BLADE: levels the strip, clears rocks (leading edge)</text>
    <text x="66" y="908">2 — SOLAR CONCENTRATOR: focuses sunlight for free daytime heat</text>
    <text x="66" y="926">3 — MICROWAVE HEAD: heats regolith from within; works through the night</text>
    <text x="66" y="944" font-size="10.5" fill="#6FC3FF">4 — SINTER ZONE: grains bond (DETAIL A) · 5 — FUSED ROAD: permanent, dust-free</text>
  </g>

  <text x="1350" y="822" fill="#6FC3FF" font-size="11" text-anchor="end" letter-spacing="1">DESIGNED BY: W.A. SANDUN PRIYANKARA WIJERATHNE · sandunwijerathne51@gmail.com · github.com/sandunwijerathne</text>

  <!-- ======== TITLE BLOCK ======== -->
  <g font-size="12" fill="#DCEBFA">
    <rect x="710" y="842" width="640" height="114" fill="#0E3357" stroke="#DCEBFA" stroke-width="1.5"/>
    <line x1="710" y1="874" x2="1350" y2="874" stroke="#DCEBFA"/>
    <line x1="710" y1="906" x2="1350" y2="906" stroke="#DCEBFA"/>
    <line x1="710" y1="936" x2="1350" y2="936" stroke="#DCEBFA"/>
    <line x1="1040" y1="842" x2="1040" y2="956" stroke="#DCEBFA"/>
    <text x="726" y="862" fill="#6FC3FF" letter-spacing="1">PROJECT</text>
    <text x="726" y="872" font-size="11" font-weight="bold">OFF-WORLD TOOLKIT · VOLUME II</text>
    <text x="1056" y="862" fill="#6FC3FF">DRAWING NO.</text>
    <text x="1056" y="872" font-size="11" font-weight="bold">RG-1-GA-001 · REV A</text>
    <text x="726" y="894" fill="#6FC3FF">UNIT DESIGNATION</text>
    <text x="726" y="903" font-weight="bold" font-size="9.5">RG-1 "APPIUS" — GENERAL ARRANGEMENT</text>
    <text x="1056" y="894" fill="#6FC3FF">FEEDSTOCK</text>
    <text x="1056" y="903" font-weight="bold" font-size="10.5">THE GROUND IT DRIVES OVER</text>
    <text x="726" y="925" fill="#6FC3FF">HEAT SOURCE</text>
    <text x="726" y="934" font-weight="bold" font-size="10.5">CONCENTRATED SOLAR / MICROWAVE</text>
    <text x="1056" y="925" fill="#6FC3FF">BUILDS</text>
    <text x="1056" y="934" font-weight="bold" font-size="10.5">ROADS · PADS · RAIL BEDS</text>
    <text x="726" y="950" fill="#6FC3FF">FUNCTION</text>
    <text x="726" y="958" font-weight="bold" font-size="9.5">TURNS THE DUST ENEMY INTO THE PAVEMENT</text>
    <text x="1056" y="950" fill="#6FC3FF">STATUS</text>
    <text x="1056" y="958" font-weight="bold" font-size="9.5">CONCEPT — SINTERING DEMONSTRATED</text>
  </g>
</svg>
