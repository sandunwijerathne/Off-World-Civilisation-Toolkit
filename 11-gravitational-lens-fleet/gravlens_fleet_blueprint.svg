<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#16406B" stroke-width="0.6"/>
    </pattern>
    <pattern id="gridMajor" width="125" height="125" patternUnits="userSpaceOnUse">
      <rect width="125" height="125" fill="url(#grid)"/>
      <path d="M 125 0 L 0 0 0 125" fill="none" stroke="#1E5288" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6FC3FF"/>
    </marker>
    <marker id="dim" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M1,1 L9,9 M5,0 L5,10" stroke="#DCEBFA" stroke-width="1" fill="none"/>
    </marker>
  </defs>

  <rect width="1400" height="1000" fill="#0B2A4A"/>
  <rect width="1400" height="1000" fill="url(#gridMajor)"/>
  <rect x="20" y="20" width="1360" height="960" fill="none" stroke="#DCEBFA" stroke-width="2"/>
  <rect x="28" y="28" width="1344" height="944" fill="none" stroke="#DCEBFA" stroke-width="0.8"/>

  <text x="50" y="70" fill="#DCEBFA" font-size="28" letter-spacing="3" font-weight="bold">GRAV-LENS FLEET — GL-1 "CYCLOPS"</text>
  <text x="50" y="96" fill="#6FC3FF" font-size="14" letter-spacing="2">SOLAR GRAVITATIONAL LENS TELESCOPE · OPTICAL SCHEMATIC · EINSTEIN-RING DETAIL · SHEET 1 OF 5</text>
  <line x1="50" y1="110" x2="1350" y2="110" stroke="#6FC3FF" stroke-width="1"/>

  <!-- ======== OPTICAL SCHEMATIC (main, horizontal ray path) ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="2">
    <!-- exoplanet (far left) -->
    <circle cx="120" cy="400" r="26"/>
    <path d="M 104 388 q 10 6 20 0 q 10 -6 20 2 M 106 412 q 12 -4 22 2" stroke-width="0.7"/>
    <text x="120" y="452" fill="#DCEBFA" font-size="10" text-anchor="middle" stroke="none">EXOPLANET</text>
    <text x="120" y="466" fill="#6FC3FF" font-size="8.5" text-anchor="middle" stroke="none">(TARGET WORLD)</text>

    <!-- light rays from planet toward Sun -->
    <g stroke-width="1">
      <line x1="146" y1="388" x2="500" y2="356"/>
      <line x1="146" y1="412" x2="500" y2="444"/>
    </g>

    <!-- Sun (center-left) -->
    <circle cx="540" cy="400" r="40"/>
    <g stroke-width="1">
      <line x1="540" y1="350" x2="540" y2="336"/><line x1="540" y1="450" x2="540" y2="464"/>
      <line x1="490" y1="400" x2="476" y2="400"/><line x1="590" y1="400" x2="604" y2="400"/>
      <line x1="505" y1="365" x2="495" y2="355"/><line x1="575" y1="435" x2="585" y2="445"/>
    </g>
    <text x="540" y="404" fill="#6FC3FF" font-size="10" text-anchor="middle" stroke="none">SUN</text>

    <!-- rays bending around the Sun (deflection) -->
    <g stroke="#6FC3FF" stroke-width="1.2">
      <path d="M 500 356 Q 540 360 580 380 Q 720 420 1000 400"/>
      <path d="M 500 444 Q 540 440 580 420 Q 720 380 1000 400"/>
    </g>
    <text x="600" y="336" fill="#6FC3FF" font-size="8.5" stroke="none">LIGHT BENT BY GRAVITY</text>

    <!-- focal line + 550 AU marker -->
    <line x1="600" y1="400" x2="1000" y2="400" stroke-width="0.7" stroke-dasharray="4 5"/>
    <line x1="1000" y1="380" x2="1000" y2="420" stroke-width="1"/>
    <text x="1000" y="372" fill="#DCEBFA" font-size="9" text-anchor="middle" stroke="none">FOCUS BEGINS ~550 AU</text>

    <!-- telescope at focus (right) -->
    <g>
      <rect x="1000" y="384" width="60" height="32" rx="4"/>
      <path d="M 1000 392 l -20 -8 v 32 l 20 -8" stroke-width="1.4"/>
      <!-- coronagraph disc -->
      <circle cx="990" cy="400" r="6" fill="#0B2A4A"/>
      <!-- solar panels -->
      <rect x="1016" y="352" width="28" height="16"/>
      <rect x="1016" y="432" width="28" height="16"/>
      <line x1="1030" y1="368" x2="1030" y2="384"/><line x1="1030" y1="416" x2="1030" y2="432"/>
    </g>
    <text x="1030" y="472" fill="#DCEBFA" font-size="10" text-anchor="middle" stroke="none">CYCLOPS TELESCOPE</text>

    <!-- scan motion arrows at focus -->
    <g stroke="#6FC3FF" stroke-width="1">
      <path d="M 1075 384 v -14" marker-end="url(#arrow)"/>
      <path d="M 1075 416 v 14" marker-end="url(#arrow)"/>
    </g>
    <text x="1085" y="404" fill="#6FC3FF" font-size="8.5" stroke="none">SCAN</text>
  </g>

  <!-- ======== FLEET INSET (top right) ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.2">
    <rect x="1060" y="520" width="280" height="200" fill="#0E3357" stroke="#6FC3FF"/>
    <text x="1076" y="544" fill="#6FC3FF" font-size="11" letter-spacing="1" stroke="none">FIG. B — ONE PER TARGET</text>
    <circle cx="1200" cy="620" r="14"/>
    <text x="1200" y="624" fill="#6FC3FF" font-size="8" text-anchor="middle" stroke="none">SUN</text>
    <!-- three focal lines to three telescopes -->
    <g stroke-width="0.9">
      <line x1="1214" y1="612" x2="1300" y2="576" marker-end="url(#arrow)" stroke="#6FC3FF"/>
      <line x1="1214" y1="620" x2="1310" y2="620" marker-end="url(#arrow)" stroke="#6FC3FF"/>
      <line x1="1214" y1="628" x2="1300" y2="664" marker-end="url(#arrow)" stroke="#6FC3FF"/>
    </g>
    <rect x="1300" y="570" width="14" height="10"/>
    <rect x="1312" y="615" width="14" height="10"/>
    <rect x="1300" y="660" width="14" height="10"/>
    <text x="1076" y="700" fill="#DCEBFA" font-size="8.5" stroke="none">EACH LINE AIMS AT ONE STAR SYSTEM</text>
  </g>

  <!-- ======== DETAIL A: Einstein ring ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.4">
    <circle cx="360" cy="640" r="92" stroke="#6FC3FF"/>
    <!-- occulted sun center -->
    <circle cx="360" cy="640" r="20" fill="#0B2A4A"/>
    <circle cx="360" cy="640" r="20" stroke-dasharray="3 3" stroke-width="0.8"/>
    <!-- bright einstein ring -->
    <circle cx="360" cy="640" r="46" stroke="#6FC3FF" stroke-width="2.5"/>
    <circle cx="360" cy="640" r="52" stroke-width="0.7" stroke-dasharray="2 3"/>
    <!-- ring brightness ticks -->
    <g stroke="#6FC3FF" stroke-width="0.8">
      <line x1="360" y1="594" x2="360" y2="586"/><line x1="360" y1="686" x2="360" y2="694"/>
      <line x1="314" y1="640" x2="306" y2="640"/><line x1="406" y1="640" x2="414" y2="640"/>
    </g>
    <g fill="#DCEBFA" font-size="8.5" stroke="none">
      <text x="360" y="644" text-anchor="middle" font-size="8">SUN</text>
      <text x="360" y="655" text-anchor="middle" font-size="8">BLOCKED</text>
      <text x="360" y="712" text-anchor="middle">EINSTEIN RING = LENSED PLANET</text>
    </g>
    <text x="360" y="756" fill="#6FC3FF" font-size="12" text-anchor="middle" stroke="none">DETAIL A — RECONSTRUCT MAP FROM RING SCAN</text>
    <line x1="990" y1="410" x2="452" y2="640" stroke="#6FC3FF" stroke-width="0.9" stroke-dasharray="5 4"/>
  </g>

  <!-- ======== CALLOUTS ======== -->
  <g stroke="#6FC3FF" stroke-width="1" fill="none">
    <line x1="120" y1="426" x2="120" y2="820" marker-start="url(#arrow)"/>
    <line x1="540" y1="440" x2="600" y2="820" marker-start="url(#arrow)"/>
    <line x1="700" y1="410" x2="820" y2="820" marker-start="url(#arrow)"/>
    <line x1="1000" y1="416" x2="1000" y2="500" marker-start="url(#arrow)"/>
    <line x1="1030" y1="384" x2="1130" y2="500" marker-start="url(#arrow)"/>
  </g>
  <g fill="#DCEBFA" font-size="13">
    <g><circle cx="120" cy="832" r="12" fill="none" stroke="#6FC3FF"/><text x="120" y="837" text-anchor="middle">1</text></g>
    <g><circle cx="600" cy="832" r="12" fill="none" stroke="#6FC3FF"/><text x="600" y="837" text-anchor="middle">2</text></g>
    <g><circle cx="820" cy="832" r="12" fill="none" stroke="#6FC3FF"/><text x="820" y="837" text-anchor="middle">3</text></g>
    <g><circle cx="1000" cy="512" r="12" fill="none" stroke="#6FC3FF"/><text x="1000" y="517" text-anchor="middle">4</text></g>
    <g><circle cx="1130" cy="512" r="12" fill="none" stroke="#6FC3FF"/><text x="1130" y="517" text-anchor="middle">5</text></g>
  </g>

  <!-- ======== PARTS LIST ======== -->
  <g font-size="13" fill="#DCEBFA">
    <rect x="50" y="800" width="500" height="156" fill="#0E3357" stroke="#6FC3FF" stroke-width="1"/>
    <text x="66" y="825" fill="#6FC3FF" font-size="13" letter-spacing="2" font-weight="bold">PARTS &amp; SYSTEMS INDEX</text>
    <line x1="66" y1="834" x2="534" y2="834" stroke="#6FC3FF" stroke-width="0.7"/>
    <text x="66" y="854" font-size="12">1 — TARGET EXOPLANET: light source, dozens of ly away</text>
    <text x="66" y="874" font-size="12">2 — SUN AS LENS: bends grazing light to a focal line (1919-proven)</text>
    <text x="66" y="894" font-size="12">3 — FOCAL LINE: begins ~550 AU, extends outward</text>
    <text x="66" y="914" font-size="12">4 — CORONAGRAPH: blocks solar disk to reveal Einstein ring</text>
    <text x="66" y="934" font-size="12">5 — CYCLOPS TELESCOPE: ~1 m aperture, scans + reconstructs map</text>
  </g>

  <text x="1350" y="790" fill="#6FC3FF" font-size="11" text-anchor="end" letter-spacing="1">DESIGNED BY: W.A. SANDUN PRIYANKARA WIJERATHNE · sandunwijerathne51@gmail.com · github.com/sandunwijerathne</text>

  <!-- ======== TITLE BLOCK ======== -->
  <g font-size="12" fill="#DCEBFA">
    <rect x="580" y="800" width="770" height="156" fill="#0E3357" stroke="#DCEBFA" stroke-width="1.5"/>
    <line x1="580" y1="836" x2="1350" y2="836" stroke="#DCEBFA"/>
    <line x1="580" y1="872" x2="1350" y2="872" stroke="#DCEBFA"/>
    <line x1="580" y1="914" x2="1350" y2="914" stroke="#DCEBFA"/>
    <line x1="960" y1="800" x2="960" y2="956" stroke="#DCEBFA"/>
    <text x="596" y="820" fill="#6FC3FF" letter-spacing="1">PROJECT</text>
    <text x="596" y="830" font-size="12" font-weight="bold">OFF-WORLD CIVILISATION TOOLKIT</text>
    <text x="976" y="820" fill="#6FC3FF">DRAWING NO.</text>
    <text x="976" y="830" font-size="12" font-weight="bold">GL-1-GA-001 · REV A</text>
    <text x="596" y="856" fill="#6FC3FF">UNIT DESIGNATION</text>
    <text x="596" y="866" font-weight="bold" font-size="11">GL-1 "CYCLOPS" — GENERAL ARRANGEMENT</text>
    <text x="976" y="856" fill="#6FC3FF">DISTANCE</text>
    <text x="976" y="866" font-weight="bold" font-size="11">550+ AU (FOCAL LINE)</text>
    <text x="596" y="892" fill="#6FC3FF">PRINCIPLE</text>
    <text x="596" y="902" font-weight="bold" font-size="11">SOLAR GRAVITATIONAL LENS (GR, PROVEN 1919)</text>
    <text x="976" y="892" fill="#6FC3FF">PRODUCT</text>
    <text x="976" y="902" font-weight="bold" font-size="11">EXOPLANET SURFACE MAPS</text>
    <text x="596" y="936" fill="#6FC3FF">FUNCTION</text>
    <text x="596" y="946" font-weight="bold" font-size="11">IMAGES ALIEN CONTINENTS USING THE SUN AS A LENS</text>
    <text x="976" y="936" fill="#6FC3FF">STATUS</text>
    <text x="976" y="946" font-weight="bold" font-size="10">CONCEPT — NASA-STUDIED, PROPULSION-GATED</text>
  </g>
</svg>
