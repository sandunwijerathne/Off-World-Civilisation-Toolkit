<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#16406B" stroke-width="0.6"/>
    </pattern>
    <pattern id="gridMajor" width="125" height="125" patternUnits="userSpaceOnUse">
      <rect width="125" height="125" fill="url(#grid)"/>
      <path d="M 125 0 L 0 0 0 125" fill="none" stroke="#1E5288" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6FC3FF"/>
    </marker>
    <marker id="warrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#DCEBFA"/>
    </marker>
  </defs>

  <rect width="1400" height="1000" fill="#0B2A4A"/>
  <rect width="1400" height="1000" fill="url(#gridMajor)"/>
  <rect x="20" y="20" width="1360" height="960" fill="none" stroke="#DCEBFA" stroke-width="2"/>
  <rect x="28" y="28" width="1344" height="944" fill="none" stroke="#DCEBFA" stroke-width="0.8"/>

  <text x="50" y="70" fill="#DCEBFA" font-size="27" letter-spacing="2" font-weight="bold">DAZZLER CONSTELLATION — DC-1 (CONCEPTUAL)</text>
  <text x="50" y="96" fill="#6FC3FF" font-size="14" letter-spacing="2">REVERSIBLE NON-DESTRUCTIVE SENSOR DENIAL · PRINCIPLE SCHEMATIC ONLY · NOT AN ENGINEERING DRAWING · SHEET 1 OF 1</text>
  <line x1="50" y1="110" x2="1350" y2="110" stroke="#6FC3FF" stroke-width="1"/>

  <!-- ======== PRINCIPLE SCHEMATIC ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="2">
    <!-- Earth arc bottom-left -->
    <path d="M 60 700 Q 400 600 740 700" stroke-width="1.4"/>
    <text x="380" y="726" fill="#6FC3FF" font-size="10" text-anchor="middle" stroke="none">EARTH — AREA OF INTEREST</text>

    <!-- target satellite (imaging sat, above) -->
    <g stroke-width="2">
      <rect x="330" y="300" width="80" height="52" rx="5"/>
      <rect x="272" y="312" width="52" height="28"/>
      <rect x="416" y="312" width="52" height="28"/>
      <path d="M 286 312 v28 M 300 312 v28 M 430 312 v28 M 444 312 v28" stroke-width="0.6"/>
      <!-- sensor aperture pointing down -->
      <path d="M 358 352 l -10 22 h 44 l -10 -22 z"/>
    </g>
    <text x="370" y="288" fill="#DCEBFA" font-size="10" text-anchor="middle" stroke="none">TARGET IMAGING SATELLITE</text>
    <text x="370" y="392" fill="#6FC3FF" font-size="9" text-anchor="middle" stroke="none">OPTICAL SENSOR</text>

    <!-- sensor field of view down to Earth (denied) -->
    <g stroke="#DCEBFA" stroke-width="0.9" stroke-dasharray="5 5">
      <line x1="352" y1="374" x2="250" y2="650"/>
      <line x1="388" y1="374" x2="500" y2="650"/>
    </g>
    <text x="375" y="560" fill="#DCEBFA" font-size="9" text-anchor="middle" stroke="none">FIELD OF VIEW</text>
    <!-- washed-out marker -->
    <g stroke="#6FC3FF" stroke-width="1.2">
      <line x1="300" y1="600" x2="450" y2="600"/>
      <line x1="310" y1="614" x2="440" y2="614"/>
      <line x1="322" y1="628" x2="428" y2="628"/>
    </g>
    <text x="520" y="614" fill="#6FC3FF" font-size="9" stroke="none">IMAGERY WASHED OUT (TEMPORARY)</text>

    <!-- dazzler constellation satellites (right) -->
    <g stroke-width="2">
      <rect x="800" y="240" width="56" height="34" rx="4"/>
      <rect x="770" y="248" width="26" height="18"/>
      <rect x="860" y="248" width="26" height="18"/>
      <rect x="930" y="380" width="56" height="34" rx="4"/>
      <rect x="900" y="388" width="26" height="18"/>
      <rect x="990" y="388" width="26" height="18"/>
      <rect x="820" y="500" width="56" height="34" rx="4"/>
      <rect x="790" y="508" width="26" height="18"/>
      <rect x="880" y="508" width="26" height="18"/>
    </g>
    <!-- constellation orbit dashes -->
    <path d="M 760 200 Q 1000 380 800 560" stroke-width="0.8" stroke-dasharray="7 6"/>
    <text x="1000" y="330" fill="#6FC3FF" font-size="10" stroke="none">DAZZLER CONSTELLATION</text>

    <!-- light directed at target sensor (from one sat only) -->
    <line x1="800" y1="257" x2="392" y2="366" stroke="#6FC3FF" stroke-width="2"/>
    <g stroke="#6FC3FF" stroke-width="0.7">
      <path d="M 700 285 l 4 -12 M 640 301 l 4 -12 M 580 317 l 4 -12 M 520 333 l 4 -12"/>
    </g>
    <text x="640" y="248" fill="#6FC3FF" font-size="10" stroke="none">LIGHT DIRECTED INTO SENSOR</text>
    <text x="640" y="264" fill="#DCEBFA" font-size="9" stroke="none">SENSOR OVERWHELMED — NOTHING DAMAGED</text>
  </g>

  <!-- ======== REVERSIBILITY PANEL (left of governance) ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.2">
    <rect x="60" y="760" width="380" height="196" fill="#0E3357" stroke="#6FC3FF"/>
    <text x="78" y="786" fill="#6FC3FF" font-size="12" letter-spacing="1" stroke="none">FIG. B — EFFECT IS REVERSIBLE</text>
    <line x1="78" y1="796" x2="422" y2="796" stroke="#6FC3FF" stroke-width="0.7"/>
    <!-- on state -->
    <rect x="90" y="812" width="56" height="40" rx="3"/>
    <g stroke="#6FC3FF" stroke-width="1"><line x1="98" y1="826" x2="138" y2="826"/><line x1="98" y1="838" x2="138" y2="838"/></g>
    <text x="118" y="868" fill="#DCEBFA" font-size="8.5" text-anchor="middle" stroke="none">ON: DENIED</text>
    <!-- arrow -->
    <line x1="158" y1="832" x2="208" y2="832" marker-end="url(#arrow)" stroke="#6FC3FF" stroke-width="1"/>
    <text x="183" y="822" fill="#6FC3FF" font-size="8" text-anchor="middle" stroke="none">STOP</text>
    <!-- off state -->
    <rect x="222" y="812" width="56" height="40" rx="3"/>
    <path d="M 232 842 l 12 -16 l 10 10 l 12 -14" stroke="#DCEBFA" stroke-width="1"/>
    <text x="250" y="868" fill="#DCEBFA" font-size="8.5" text-anchor="middle" stroke="none">OFF: SEES AGAIN</text>
    <g fill="#DCEBFA" font-size="9.5" stroke="none">
      <text x="78" y="898">• NO DAMAGE · NO FRAGMENTS · NO DEBRIS</text>
      <text x="78" y="918">• TARGET ORBIT + OTHER SYSTEMS UNTOUCHED</text>
      <text x="78" y="938">• EFFECT LASTS ONLY WHILE APPLIED</text>
    </g>
  </g>

  <!-- ======== GOVERNANCE PANEL ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.4">
    <rect x="470" y="760" width="410" height="196" fill="#0E3357" stroke="#6FC3FF" stroke-width="1.4"/>
    <text x="488" y="786" fill="#6FC3FF" font-size="12" letter-spacing="1" stroke="none">! LESS BAD IS NOT GOOD</text>
    <line x1="488" y1="796" x2="862" y2="796" stroke="#6FC3FF" stroke-width="0.7"/>
    <g fill="#DCEBFA" font-size="10" stroke="none">
      <text x="488" y="818">• INTERFERENCE IS STILL A HOSTILE ACT</text>
      <text x="488" y="840">• ATTRIBUTION IS HARD — FAILURE OR ATTACK?</text>
      <text x="488" y="862">• CIVIL / WEATHER / SAFETY SATS MAY BE AFFECTED</text>
      <text x="488" y="884">• "CHEAP" EFFECTS MAY LOWER THE THRESHOLD</text>
      <text x="488" y="906">• "REVERSIBLE" MUST BE VERIFIED, NOT ASSUMED</text>
      <text x="488" y="936" fill="#6FC3FF">DOMAIN: NORMS + AGREEMENTS, NOT HARDWARE</text>
    </g>
  </g>

  <!-- ======== CALLOUTS ======== -->
  <g stroke="#6FC3FF" stroke-width="1" fill="none">
    <line x1="370" y1="374" x2="200" y2="700" marker-start="url(#arrow)"/>
    <line x1="600" y1="300" x2="600" y2="700" marker-start="url(#arrow)"/>
    <line x1="880" y1="420" x2="1000" y2="700" marker-start="url(#arrow)"/>
    <line x1="375" y1="614" x2="740" y2="700" marker-start="url(#arrow)"/>
  </g>
  <g fill="#DCEBFA" font-size="13">
    <g><circle cx="200" cy="712" r="12" fill="none" stroke="#6FC3FF"/><text x="200" y="717" text-anchor="middle">1</text></g>
    <g><circle cx="600" cy="712" r="12" fill="none" stroke="#6FC3FF"/><text x="600" y="717" text-anchor="middle">2</text></g>
    <g><circle cx="1000" cy="712" r="12" fill="none" stroke="#6FC3FF"/><text x="1000" y="717" text-anchor="middle">3</text></g>
    <g><circle cx="740" cy="712" r="12" fill="none" stroke="#6FC3FF"/><text x="740" y="717" text-anchor="middle">4</text></g>
  </g>

  <!-- ======== PRINCIPLE INDEX ======== -->
  <g font-size="12" fill="#DCEBFA">
    <rect x="910" y="600" width="440" height="150" fill="#0E3357" stroke="#6FC3FF" stroke-width="1"/>
    <text x="926" y="625" fill="#6FC3FF" font-size="13" letter-spacing="2" font-weight="bold">PRINCIPLE INDEX</text>
    <line x1="926" y1="634" x2="1334" y2="634" stroke="#6FC3FF" stroke-width="0.7"/>
    <text x="926" y="656" font-size="11">1 — TARGET SENSOR: optical imager, overwhelmed not damaged</text>
    <text x="926" y="678" font-size="11">2 — DIRECTED LIGHT: principle only, no engineering detail</text>
    <text x="926" y="700" font-size="11">3 — CONSTELLATION: provides coverage windows over an area</text>
    <text x="926" y="722" font-size="11">4 — DENIED IMAGERY: temporary washout, reverses when stopped</text>
    <text x="926" y="742" font-size="10" fill="#6FC3FF">ALREADY DOCUMENTED (GROUND-BASED) IN OPEN ASSESSMENTS</text>
  </g>

  <text x="1350" y="586" fill="#6FC3FF" font-size="11" text-anchor="end" letter-spacing="1">DESIGNED BY: W.A. SANDUN PRIYANKARA WIJERATHNE · sandunwijerathne51@gmail.com · github.com/sandunwijerathne</text>

  <!-- ======== TITLE BLOCK ======== -->
  <g font-size="11" fill="#DCEBFA">
    <rect x="910" y="760" width="440" height="196" fill="#0E3357" stroke="#DCEBFA" stroke-width="1.5"/>
    <line x1="910" y1="800" x2="1350" y2="800" stroke="#DCEBFA"/>
    <line x1="910" y1="840" x2="1350" y2="840" stroke="#DCEBFA"/>
    <line x1="910" y1="880" x2="1350" y2="880" stroke="#DCEBFA"/>
    <line x1="910" y1="920" x2="1350" y2="920" stroke="#DCEBFA"/>
    <text x="926" y="778" fill="#6FC3FF" letter-spacing="1">PROJECT</text>
    <text x="926" y="792" font-weight="bold">OFF-WORLD CIVILISATION TOOLKIT</text>
    <text x="1150" y="778" fill="#6FC3FF">DRAWING NO.</text>
    <text x="1150" y="792" font-weight="bold">DC-1-GA-001 · REV A</text>
    <text x="926" y="818" fill="#6FC3FF">UNIT DESIGNATION</text>
    <text x="926" y="832" font-weight="bold" font-size="10">DC-1 — PRINCIPLE SCHEMATIC (CONCEPTUAL)</text>
    <text x="926" y="858" fill="#6FC3FF">EFFECT</text>
    <text x="926" y="872" font-weight="bold" font-size="10">REVERSIBLE · NON-DESTRUCTIVE · DEBRIS-FREE</text>
    <text x="926" y="898" fill="#6FC3FF">DETAIL LEVEL</text>
    <text x="926" y="912" font-weight="bold" font-size="10">PRINCIPLE ONLY — NO ENGINEERING</text>
    <text x="926" y="938" fill="#6FC3FF">FRAMING</text>
    <text x="926" y="952" font-weight="bold" font-size="10">LEAST-BAD OPTION · ARGUE FOR RESTRAINT</text>
  </g>
</svg>
