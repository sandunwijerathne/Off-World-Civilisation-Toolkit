<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#16406B" stroke-width="0.6"/>
    </pattern>
    <pattern id="gridMajor" width="125" height="125" patternUnits="userSpaceOnUse">
      <rect width="125" height="125" fill="url(#grid)"/>
      <path d="M 125 0 L 0 0 0 125" fill="none" stroke="#1E5288" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6FC3FF"/>
    </marker>
    <marker id="warrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#DCEBFA"/>
    </marker>
    <marker id="dim" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M1,1 L9,9 M5,0 L5,10" stroke="#DCEBFA" stroke-width="1" fill="none"/>
    </marker>
  </defs>

  <rect width="1400" height="1000" fill="#0B2A4A"/>
  <rect width="1400" height="1000" fill="url(#gridMajor)"/>
  <rect x="20" y="20" width="1360" height="960" fill="none" stroke="#DCEBFA" stroke-width="2"/>
  <rect x="28" y="28" width="1344" height="944" fill="none" stroke="#DCEBFA" stroke-width="0.8"/>

  <text x="50" y="70" fill="#DCEBFA" font-size="27" letter-spacing="2" font-weight="bold">ORBITAL FOUNDRY RING — OF-1 "HEPHAESTUS"</text>
  <text x="50" y="96" fill="#6FC3FF" font-size="14" letter-spacing="2">CONTAINERLESS CASTING IN FREE FALL · RING PLAN · LEVITATION BAY · VOLUME II · SHEET 1 OF 5</text>
  <line x1="50" y1="110" x2="1350" y2="110" stroke="#6FC3FF" stroke-width="1"/>

  <!-- ======== MAIN: ring plan with bays ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="2">
    <circle cx="440" cy="430" r="240"/>
    <circle cx="440" cy="430" r="210" stroke-width="1"/>
    <text x="440" y="168" fill="#6FC3FF" font-size="11" text-anchor="middle" stroke="none">FOUNDRY RING (ORBITAL, FREE FALL)</text>

    <!-- bays around the ring -->
    <g>
      <!-- bay 1: melt -->
      <rect x="404" y="178" width="72" height="54" rx="6" fill="#0E3357"/>
      <rect x="404" y="178" width="72" height="54" rx="6"/>
      <circle cx="440" cy="205" r="12" fill="#DCEBFA"/>
      <text x="440" y="252" fill="#DCEBFA" font-size="8" text-anchor="middle" stroke="none">MELT BAY</text>
      <!-- bay 2: shape -->
      <rect x="626" y="404" width="72" height="54" rx="6" fill="#0E3357"/>
      <rect x="626" y="404" width="72" height="54" rx="6"/>
      <ellipse cx="662" cy="431" rx="18" ry="9" fill="#DCEBFA"/>
      <text x="662" y="478" fill="#DCEBFA" font-size="8" text-anchor="middle" stroke="none">SHAPE BAY</text>
      <!-- bay 3: cool -->
      <rect x="404" y="628" width="72" height="54" rx="6" fill="#0E3357"/>
      <rect x="404" y="628" width="72" height="54" rx="6"/>
      <path d="M 422 668 q 18 -22 36 0" stroke="#DCEBFA" stroke-width="1.6"/>
      <text x="440" y="702" fill="#DCEBFA" font-size="8" text-anchor="middle" stroke="none">COOL BAY</text>
      <!-- bay 4: harvest -->
      <rect x="182" y="404" width="72" height="54" rx="6" fill="#0E3357"/>
      <rect x="182" y="404" width="72" height="54" rx="6"/>
      <rect x="204" y="422" width="28" height="18"/>
      <text x="218" y="478" fill="#DCEBFA" font-size="8" text-anchor="middle" stroke="none">HARVEST BAY</text>
    </g>
    <!-- flow arrows around ring -->
    <g stroke="#6FC3FF" stroke-width="1.2" stroke-dasharray="6 5">
      <path d="M 560 250 A 240 240 0 0 1 620 380" marker-end="url(#arrow)"/>
      <path d="M 640 490 A 240 240 0 0 1 540 620" marker-end="url(#arrow)"/>
      <path d="M 330 630 A 240 240 0 0 1 230 490" marker-end="url(#arrow)"/>
      <path d="M 240 370 A 240 240 0 0 1 330 240" marker-end="url(#arrow)"/>
    </g>

    <!-- feedstock arriving -->
    <path d="M 110 300 l 90 40" stroke="#6FC3FF" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="90" y="286" fill="#DCEBFA" font-size="9" stroke="none">FEEDSTOCK IN:</text>
    <text x="90" y="300" fill="#6FC3FF" font-size="8.5" stroke="none">REFINERY (#36) · MASS DRIVER (#31) · SCRAP</text>

    <!-- product leaving -->
    <path d="M 690 560 l 90 50" stroke="#6FC3FF" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="700" y="628" fill="#DCEBFA" font-size="9" stroke="none">→ GREAT STRUCTURES, MADE WHERE USED</text>

    <!-- radiators -->
    <g stroke-width="1.2">
      <rect x="300" y="106" width="46" height="14"/>
      <rect x="534" y="106" width="46" height="14"/>
      <line x1="323" y1="120" x2="360" y2="196"/>
      <line x1="557" y1="120" x2="520" y2="196"/>
    </g>
    <text x="440" y="132" fill="#6FC3FF" font-size="8.5" text-anchor="middle" stroke="none">RADIATORS — HEAT LEAVES ONLY BY RADIATION</text>
  </g>

  <!-- ======== LEVITATION BAY DETAIL A ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.4">
    <circle cx="1120" cy="430" r="110" stroke="#6FC3FF"/>
    <!-- coils above and below -->
    <path d="M 1052 372 h 136" stroke-width="2"/>
    <path d="M 1052 488 h 136" stroke-width="2"/>
    <g stroke="#6FC3FF" stroke-width="1"><path d="M 1068 372 v -12 M 1096 372 v -12 M 1144 372 v -12 M 1172 372 v -12 M 1068 488 v 12 M 1096 488 v 12 M 1144 488 v 12 M 1172 488 v 12"/></g>
    <text x="1120" y="352" fill="#6FC3FF" font-size="8" text-anchor="middle" stroke="none">LEVITATION FIELD COILS</text>
    <!-- suspended melt sphere -->
    <circle cx="1120" cy="430" r="26" fill="#0E3357"/>
    <circle cx="1120" cy="430" r="26"/>
    <!-- field lines cradling it -->
    <g stroke="#6FC3FF" stroke-width="0.8" stroke-dasharray="3 3">
      <path d="M 1094 430 q -14 -30 26 -44 q 40 14 26 44 q 14 30 -26 44 q -40 -14 -26 -44"/>
    </g>
    <text x="1120" y="434" fill="#DCEBFA" font-size="8" text-anchor="middle" stroke="none">MELT</text>
    <!-- gap callouts -->
    <line x1="1120" y1="404" x2="1120" y2="378" stroke="#DCEBFA" stroke-width="0.8" marker-start="url(#dim)" marker-end="url(#dim)"/>
    <text x="1200" y="404" fill="#6FC3FF" font-size="7.5" text-anchor="end" stroke="none">TOUCHES NOTHING</text>
    <text x="1120" y="524" fill="#6FC3FF" font-size="8" text-anchor="middle" stroke="none">SURFACE TENSION PULLS IT SPHERICAL</text>
    <text x="1120" y="560" fill="#6FC3FF" font-size="12" text-anchor="middle" stroke="none">DETAIL A — CONTAINERLESS BAY</text>
    <line x1="700" y1="300" x2="1020" y2="390" stroke="#6FC3FF" stroke-width="0.9" stroke-dasharray="5 4"/>
  </g>

  <!-- ======== GRAVITY-REMOVED INSET ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.2">
    <rect x="900" y="140" width="440" height="176" fill="#0E3357" stroke="#6FC3FF"/>
    <text x="918" y="166" fill="#6FC3FF" font-size="12" letter-spacing="1" stroke="none">FIG. B — WHAT GRAVITY FORBIDS, ORBIT ALLOWS</text>
    <line x1="918" y1="176" x2="1322" y2="176" stroke="#6FC3FF" stroke-width="0.7"/>
    <g fill="#DCEBFA" font-size="9" stroke="none">
      <text x="918" y="198">MELT MUST BE CONTAINED  →  levitated: ultra-pure</text>
      <text x="918" y="218">DENSE PARTS SINK        →  no settling: uniform alloys</text>
      <text x="918" y="238">BUBBLES RISE / TRAP     →  stay put: metallic foams</text>
      <text x="918" y="258">LARGE PARTS SAG         →  no weight: vast thin shells</text>
      <text x="918" y="278" fill="#6FC3FF">WALL SEEDS CRYSTALS     →  no wall: deep undercooling</text>
    </g>
    <text x="918" y="304" fill="#6FC3FF" font-size="9" stroke="none">SHIP RAW MATERIAL — NOT FINISHED HARDWARE</text>
  </g>

  <!-- ======== HEAT PANEL ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.4">
    <rect x="900" y="640" width="440" height="116" fill="#0E3357" stroke="#6FC3FF" stroke-width="1.4"/>
    <text x="918" y="664" fill="#6FC3FF" font-size="11" letter-spacing="1" stroke="none">! HEAT IS THE GOVERNING PROBLEM</text>
    <line x1="918" y1="672" x2="1322" y2="672" stroke="#6FC3FF" stroke-width="0.7"/>
    <g fill="#DCEBFA" font-size="9" stroke="none">
      <text x="918" y="690">NO AIR, NO WATER — HEAT LEAVES ONLY BY RADIATING</text>
      <text x="918" y="708">COOLING IS SLOW · WASTE HEAT NEEDS HUGE RADIATORS</text>
      <text x="918" y="726">A LOOSE MOLTEN MASS DOESN'T FALL — IT DRIFTS</text>
      <text x="918" y="746" fill="#6FC3FF">ONLY WORTH IT FOR WHAT ORBIT NEEDS OR ONLY ORBIT CAN MAKE</text>
    </g>
  </g>

  <!-- ======== CALLOUTS ======== -->
  <g stroke="#6FC3FF" stroke-width="1" fill="none">
    <line x1="200" y1="340" x2="180" y2="830" marker-start="url(#arrow)"/>
    <line x1="440" y1="232" x2="360" y2="830" marker-start="url(#arrow)"/>
    <line x1="662" y1="458" x2="500" y2="830" marker-start="url(#arrow)"/>
    <line x1="440" y1="682" x2="640" y2="830" marker-start="url(#arrow)"/>
    <line x1="218" y1="458" x2="790" y2="830" marker-start="url(#arrow)"/>
  </g>
  <g fill="#DCEBFA" font-size="13">
    <g><circle cx="180" cy="842" r="12" fill="none" stroke="#6FC3FF"/><text x="180" y="847" text-anchor="middle">1</text></g>
    <g><circle cx="360" cy="842" r="12" fill="none" stroke="#6FC3FF"/><text x="360" y="847" text-anchor="middle">2</text></g>
    <g><circle cx="500" cy="842" r="12" fill="none" stroke="#6FC3FF"/><text x="500" y="847" text-anchor="middle">3</text></g>
    <g><circle cx="640" cy="842" r="12" fill="none" stroke="#6FC3FF"/><text x="640" y="847" text-anchor="middle">4</text></g>
    <g><circle cx="790" cy="842" r="12" fill="none" stroke="#6FC3FF"/><text x="790" y="847" text-anchor="middle">5</text></g>
  </g>

  <!-- ======== PARTS LIST ======== -->
  <g font-size="11.5" fill="#DCEBFA">
    <rect x="50" y="862" width="640" height="96" fill="#0E3357" stroke="#6FC3FF" stroke-width="1"/>
    <text x="66" y="882" fill="#6FC3FF" font-size="12.5" letter-spacing="2" font-weight="bold">PARTS &amp; SYSTEMS INDEX</text>
    <line x1="66" y1="889" x2="674" y2="889" stroke="#6FC3FF" stroke-width="0.7"/>
    <text x="66" y="906">1 — FEEDSTOCK IN: refined metal, mass-driver cargo, or orbital scrap</text>
    <text x="66" y="924">2 — MELT BAY: induction / e-beam / solar heating, no crucible (DETAIL A)</text>
    <text x="66" y="942">3 — SHAPE BAY: fields deform the free melt — spheres, shells, booms, foams</text>
    <text x="66" y="954" font-size="10" fill="#6FC3FF">4 — COOL BAY: radiative, thermal history chosen · 5 — HARVEST BAY: capture + inspect</text>
  </g>

  <text x="1350" y="842" fill="#6FC3FF" font-size="11" text-anchor="end" letter-spacing="1">DESIGNED BY: W.A. SANDUN PRIYANKARA WIJERATHNE · sandunwijerathne51@gmail.com · github.com/sandunwijerathne</text>

  <!-- ======== TITLE BLOCK ======== -->
  <g font-size="11.5" fill="#DCEBFA">
    <rect x="710" y="862" width="640" height="96" fill="#0E3357" stroke="#DCEBFA" stroke-width="1.5"/>
    <line x1="710" y1="890" x2="1350" y2="890" stroke="#DCEBFA"/>
    <line x1="710" y1="918" x2="1350" y2="918" stroke="#DCEBFA"/>
    <line x1="710" y1="940" x2="1350" y2="940" stroke="#DCEBFA"/>
    <line x1="1040" y1="862" x2="1040" y2="958" stroke="#DCEBFA"/>
    <text x="726" y="880" fill="#6FC3FF" letter-spacing="1">PROJECT</text>
    <text x="726" y="888" font-size="10.5" font-weight="bold">OFF-WORLD TOOLKIT · VOLUME II</text>
    <text x="1056" y="880" fill="#6FC3FF">DRAWING NO.</text>
    <text x="1056" y="888" font-size="10.5" font-weight="bold">OF-1-GA-001 · REV A</text>
    <text x="726" y="906" fill="#6FC3FF">UNIT DESIGNATION</text>
    <text x="726" y="915" font-weight="bold" font-size="9.5">OF-1 "HEPHAESTUS" — GENERAL ARRANGEMENT</text>
    <text x="1056" y="906" fill="#6FC3FF">METHOD</text>
    <text x="1056" y="915" font-weight="bold" font-size="10">CONTAINERLESS · FIELD-LEVITATED MELT</text>
    <text x="726" y="932" fill="#6FC3FF">EXPLOITS</text>
    <text x="726" y="938" font-weight="bold" font-size="9.5">FREE FALL: NO SAG · NO SETTLING · NO MOULD</text>
    <text x="1056" y="932" fill="#6FC3FF">FED BY</text>
    <text x="1056" y="938" font-weight="bold" font-size="9.5">REFINERY #36 · MASS DRIVER #31</text>
    <text x="726" y="952" fill="#6FC3FF">FUNCTION</text>
    <text x="726" y="956" font-weight="bold" font-size="9">CASTS WHAT GRAVITY FORBIDS, WHERE IT WILL BE USED</text>
    <text x="1056" y="952" fill="#6FC3FF">STATUS</text>
    <text x="1056" y="956" font-weight="bold" font-size="9">CONCEPT — LAB-PROVEN, NOT YET AT SCALE</text>
  </g>
</svg>
