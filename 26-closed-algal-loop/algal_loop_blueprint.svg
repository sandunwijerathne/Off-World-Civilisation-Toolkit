<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#16406B" stroke-width="0.6"/>
    </pattern>
    <pattern id="gridMajor" width="125" height="125" patternUnits="userSpaceOnUse">
      <rect width="125" height="125" fill="url(#grid)"/>
      <path d="M 125 0 L 0 0 0 125" fill="none" stroke="#1E5288" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6FC3FF"/>
    </marker>
    <marker id="warrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#DCEBFA"/>
    </marker>
    <marker id="dim" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M1,1 L9,9 M5,0 L5,10" stroke="#DCEBFA" stroke-width="1" fill="none"/>
    </marker>
  </defs>

  <rect width="1400" height="1000" fill="#0B2A4A"/>
  <rect width="1400" height="1000" fill="url(#gridMajor)"/>
  <rect x="20" y="20" width="1360" height="960" fill="none" stroke="#DCEBFA" stroke-width="2"/>
  <rect x="28" y="28" width="1344" height="944" fill="none" stroke="#DCEBFA" stroke-width="0.8"/>

  <text x="50" y="70" fill="#DCEBFA" font-size="27" letter-spacing="2" font-weight="bold">CLOSED ALGAL LOOP — AL-1 "CHLORELLA"</text>
  <text x="50" y="96" fill="#6FC3FF" font-size="14" letter-spacing="2">PHOTOBIOREACTOR LIFE SUPPORT · GAS-EXCHANGE LOOP · REACTOR DETAIL · VOLUME II · SHEET 1 OF 5</text>
  <line x1="50" y1="110" x2="1350" y2="110" stroke="#6FC3FF" stroke-width="1"/>

  <!-- ======== MAIN LOOP DIAGRAM ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="2">
    <!-- crew cabin (left) -->
    <rect x="110" y="360" width="200" height="180" rx="8"/>
    <text x="210" y="352" fill="#6FC3FF" font-size="11" text-anchor="middle" stroke="none">CREW CABIN</text>
    <!-- crew figure -->
    <g stroke-width="1.6">
      <circle cx="210" cy="420" r="16"/>
      <line x1="210" y1="436" x2="210" y2="490"/>
      <line x1="210" y1="450" x2="186" y2="470"/><line x1="210" y1="450" x2="234" y2="470"/>
      <line x1="210" y1="490" x2="190" y2="520"/><line x1="210" y1="490" x2="230" y2="520"/>
    </g>
    <text x="210" y="470" fill="#6FC3FF" font-size="9" text-anchor="middle" stroke="none">RESPIRATION</text>

    <!-- photobioreactor (right) -->
    <rect x="640" y="330" width="240" height="240" rx="10" fill="#0E3357"/>
    <rect x="640" y="330" width="240" height="240" rx="10"/>
    <!-- algae suspension marks -->
    <g fill="#6FC3FF"><circle cx="680" cy="400" r="3"/><circle cx="720" cy="430" r="3"/><circle cx="760" cy="400" r="3"/><circle cx="800" cy="440" r="3"/><circle cx="700" cy="480" r="3"/><circle cx="760" cy="500" r="3"/><circle cx="820" cy="470" r="3"/><circle cx="690" cy="520" r="3"/><circle cx="800" cy="520" r="3"/></g>
    <text x="760" y="322" fill="#6FC3FF" font-size="11" text-anchor="middle" stroke="none">PHOTOBIOREACTOR (MICROALGAE)</text>
    <!-- light source -->
    <g stroke="#6FC3FF" stroke-width="1"><path d="M 760 300 l 0 22 M 730 306 l 8 16 M 790 306 l -8 16"/></g>
    <text x="760" y="292" fill="#DCEBFA" font-size="9" text-anchor="middle" stroke="none">LIGHT (SUN / LAMPS)</text>

    <!-- CO2 pipe: cabin -> reactor (top) -->
    <path d="M 310 390 C 460 340 520 340 640 380" stroke="#DCEBFA" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="475" y="332" fill="#DCEBFA" font-size="10" text-anchor="middle" stroke="none">EXHALED CO2 →</text>

    <!-- O2 pipe: reactor -> cabin (bottom) -->
    <path d="M 640 520 C 520 560 460 560 310 510" stroke="#6FC3FF" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="475" y="572" fill="#6FC3FF" font-size="10" text-anchor="middle" stroke="none">← REGENERATED O2</text>

    <!-- harvest -> food -->
    <path d="M 880 470 l 90 0" stroke="#6FC3FF" stroke-width="1.4" marker-end="url(#arrow)"/>
    <rect x="980" y="450" width="60" height="40" rx="4"/>
    <path d="M 992 462 h36 M 992 472 h36 M 992 482 h24" stroke-width="0.6"/>
    <text x="1010" y="512" fill="#DCEBFA" font-size="9" text-anchor="middle" stroke="none">HARVEST → FOOD</text>

    <!-- nutrients + water in -->
    <path d="M 760 570 l 0 40" stroke="#6FC3FF" stroke-width="1.2" marker-end="url(#warrow)"/>
    <text x="760" y="628" fill="#6FC3FF" font-size="9" text-anchor="middle" stroke="none">NUTRIENTS + WATER (RECYCLED)</text>
  </g>

  <!-- ======== HERITAGE INSET (top right) ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.2">
    <rect x="1080" y="140" width="260" height="220" fill="#0E3357" stroke="#6FC3FF"/>
    <text x="1096" y="166" fill="#6FC3FF" font-size="11" letter-spacing="1" stroke="none">FIG. B — PROVEN LINEAGE</text>
    <line x1="1096" y1="176" x2="1322" y2="176" stroke="#6FC3FF" stroke-width="0.7"/>
    <g fill="#DCEBFA" font-size="9.5" stroke="none">
      <text x="1096" y="200">BIOS-3 (USSR, 1970s-80s):</text>
      <text x="1108" y="216" fill="#6FC3FF">crews breathed on algae + plants</text>
      <text x="1096" y="242">MELiSSA (ESA, decades):</text>
      <text x="1108" y="258" fill="#6FC3FF">engineered closed micro-ecosystem</text>
      <text x="1096" y="292">THE LOOP IS OLD SCIENCE.</text>
      <text x="1096" y="312" fill="#6FC3FF">CLOSING IT FULLY IS THE HARD PART.</text>
    </g>
  </g>

  <!-- ======== REACTOR DETAIL A ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.4">
    <circle cx="1150" cy="560" r="92" stroke="#6FC3FF"/>
    <!-- thin illuminated channel -->
    <rect x="1090" y="530" width="120" height="16"/>
    <g stroke="#6FC3FF" stroke-width="1"><path d="M 1100 512 l 0 16 M 1120 512 l 0 16 M 1140 512 l 0 16 M 1160 512 l 0 16 M 1180 512 l 0 16 M 1200 512 l 0 16"/></g>
    <text x="1150" y="506" fill="#DCEBFA" font-size="8" text-anchor="middle" stroke="none">LIGHT IN</text>
    <g fill="#6FC3FF"><circle cx="1108" cy="538" r="2.5"/><circle cx="1132" cy="538" r="2.5"/><circle cx="1156" cy="538" r="2.5"/><circle cx="1182" cy="538" r="2.5"/></g>
    <text x="1150" y="562" fill="#6FC3FF" font-size="7.5" text-anchor="middle" stroke="none">THIN CULTURE = LIGHT REACHES ALL</text>
    <!-- gas exchange arrows -->
    <path d="M 1100 578 l 0 16" stroke="#DCEBFA" stroke-width="1" marker-end="url(#warrow)"/>
    <text x="1090" y="606" fill="#DCEBFA" font-size="7.5" stroke="none">CO2 IN</text>
    <path d="M 1200 594 l 0 -16" stroke="#6FC3FF" stroke-width="1" marker-end="url(#arrow)"/>
    <text x="1188" y="606" fill="#6FC3FF" font-size="7.5" stroke="none">O2 OUT</text>
    <text x="1150" y="674" fill="#6FC3FF" font-size="12" text-anchor="middle" stroke="none">DETAIL A — LIGHT + GAS EXCHANGE</text>
    <line x1="820" y1="450" x2="1064" y2="548" stroke="#6FC3FF" stroke-width="0.9" stroke-dasharray="5 4"/>
  </g>

  <!-- ======== HONEST PANEL ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.4">
    <rect x="110" y="640" width="360" height="100" fill="#0E3357" stroke="#6FC3FF" stroke-width="1.4"/>
    <text x="126" y="664" fill="#6FC3FF" font-size="11" letter-spacing="1" stroke="none">! LIVING SYSTEM = RESILIENT + FRAGILE</text>
    <line x1="126" y1="672" x2="454" y2="672" stroke="#6FC3FF" stroke-width="0.7"/>
    <g fill="#DCEBFA" font-size="9" stroke="none">
      <text x="126" y="690">• A CULTURE CAN CRASH — KEEP A BACKUP</text>
      <text x="126" y="708">• MICROGRAVITY: GAS + LIQUID DON'T SEPARATE</text>
      <text x="126" y="726" fill="#6FC3FF">• FULL CLOSURE IS DECADES OF ENGINEERING</text>
    </g>
  </g>

  <!-- ======== CALLOUTS ======== -->
  <g stroke="#6FC3FF" stroke-width="1" fill="none">
    <line x1="210" y1="540" x2="200" y2="800" marker-start="url(#arrow)"/>
    <line x1="475" y1="360" x2="360" y2="800" marker-start="url(#arrow)"/>
    <line x1="760" y1="440" x2="520" y2="800" marker-start="url(#arrow)"/>
    <line x1="475" y1="540" x2="660" y2="800" marker-start="url(#arrow)"/>
    <line x1="1010" y1="470" x2="800" y2="800" marker-start="url(#arrow)"/>
  </g>
  <g fill="#DCEBFA" font-size="13">
    <g><circle cx="200" cy="812" r="12" fill="none" stroke="#6FC3FF"/><text x="200" y="817" text-anchor="middle">1</text></g>
    <g><circle cx="360" cy="812" r="12" fill="none" stroke="#6FC3FF"/><text x="360" y="817" text-anchor="middle">2</text></g>
    <g><circle cx="520" cy="812" r="12" fill="none" stroke="#6FC3FF"/><text x="520" y="817" text-anchor="middle">3</text></g>
    <g><circle cx="660" cy="812" r="12" fill="none" stroke="#6FC3FF"/><text x="660" y="817" text-anchor="middle">4</text></g>
    <g><circle cx="800" cy="812" r="12" fill="none" stroke="#6FC3FF"/><text x="800" y="817" text-anchor="middle">5</text></g>
  </g>

  <!-- ======== PARTS LIST ======== -->
  <g font-size="12.5" fill="#DCEBFA">
    <rect x="50" y="832" width="640" height="124" fill="#0E3357" stroke="#6FC3FF" stroke-width="1"/>
    <text x="66" y="856" fill="#6FC3FF" font-size="13" letter-spacing="2" font-weight="bold">PARTS &amp; SYSTEMS INDEX</text>
    <line x1="66" y1="865" x2="674" y2="865" stroke="#6FC3FF" stroke-width="0.7"/>
    <text x="66" y="885">1 — CREW CABIN: consumes O2, exhales CO2 (the animal half)</text>
    <text x="66" y="905">2 — CO2 FEED: exhaled carbon carried to the reactor</text>
    <text x="66" y="925">3 — PHOTOBIOREACTOR: algae + light regenerate O2 (the plant half, DETAIL A)</text>
    <text x="66" y="941" font-size="10.5" fill="#6FC3FF">4 — O2 RETURNED to cabin · 5 — HARVEST: edible biomass as by-product</text>
  </g>

  <text x="1350" y="812" fill="#6FC3FF" font-size="11" text-anchor="end" letter-spacing="1">DESIGNED BY: W.A. SANDUN PRIYANKARA WIJERATHNE · sandunwijerathne51@gmail.com · github.com/sandunwijerathne</text>

  <!-- ======== TITLE BLOCK ======== -->
  <g font-size="12" fill="#DCEBFA">
    <rect x="710" y="832" width="640" height="124" fill="#0E3357" stroke="#DCEBFA" stroke-width="1.5"/>
    <line x1="710" y1="866" x2="1350" y2="866" stroke="#DCEBFA"/>
    <line x1="710" y1="900" x2="1350" y2="900" stroke="#DCEBFA"/>
    <line x1="710" y1="934" x2="1350" y2="934" stroke="#DCEBFA"/>
    <line x1="1040" y1="832" x2="1040" y2="956" stroke="#DCEBFA"/>
    <text x="726" y="852" fill="#6FC3FF" letter-spacing="1">PROJECT</text>
    <text x="726" y="862" font-size="11" font-weight="bold">OFF-WORLD TOOLKIT · VOLUME II</text>
    <text x="1056" y="852" fill="#6FC3FF">DRAWING NO.</text>
    <text x="1056" y="862" font-size="11" font-weight="bold">AL-1-GA-001 · REV A</text>
    <text x="726" y="886" fill="#6FC3FF">UNIT DESIGNATION</text>
    <text x="726" y="896" font-weight="bold" font-size="10">AL-1 "CHLORELLA" — GENERAL ARRANGEMENT</text>
    <text x="1056" y="886" fill="#6FC3FF">ENGINE</text>
    <text x="1056" y="896" font-weight="bold" font-size="11">PHOTOSYNTHESIS</text>
    <text x="726" y="920" fill="#6FC3FF">HERITAGE</text>
    <text x="726" y="930" font-weight="bold" font-size="10.5">BIOS-3 · MELiSSA (DECADES OF WORK)</text>
    <text x="1056" y="920" fill="#6FC3FF">YIELDS</text>
    <text x="1056" y="930" font-weight="bold" font-size="11">O2 + EDIBLE BIOMASS</text>
    <text x="726" y="944" fill="#6FC3FF">FUNCTION</text>
    <text x="726" y="954" font-weight="bold" font-size="10.5">REGENERATES AIR — BREATH BACK INTO BREATH</text>
    <text x="1056" y="944" fill="#6FC3FF">STATUS</text>
    <text x="1056" y="954" font-weight="bold" font-size="10">CONCEPT — SUPPLEMENT FIRST</text>
  </g>
</svg>
