<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#16406B" stroke-width="0.6"/>
    </pattern>
    <pattern id="gridMajor" width="125" height="125" patternUnits="userSpaceOnUse">
      <rect width="125" height="125" fill="url(#grid)"/>
      <path d="M 125 0 L 0 0 0 125" fill="none" stroke="#1E5288" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6FC3FF"/>
    </marker>
    <marker id="warrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#DCEBFA"/>
    </marker>
    <marker id="dim" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M1,1 L9,9 M5,0 L5,10" stroke="#DCEBFA" stroke-width="1" fill="none"/>
    </marker>
  </defs>

  <rect width="1400" height="1000" fill="#0B2A4A"/>
  <rect width="1400" height="1000" fill="url(#gridMajor)"/>
  <rect x="20" y="20" width="1360" height="960" fill="none" stroke="#DCEBFA" stroke-width="2"/>
  <rect x="28" y="28" width="1344" height="944" fill="none" stroke="#DCEBFA" stroke-width="0.8"/>

  <text x="50" y="70" fill="#DCEBFA" font-size="27" letter-spacing="2" font-weight="bold">LAVA TUBE SURVEYOR — LT-1 "ARIADNE"</text>
  <text x="50" y="96" fill="#6FC3FF" font-size="14" letter-spacing="2">TETHERED CAVE-SURVEY DRONE · SECTION THROUGH SKYLIGHT · VOLUME II · SHEET 1 OF 5</text>
  <line x1="50" y1="110" x2="1350" y2="110" stroke="#6FC3FF" stroke-width="1"/>

  <!-- ======== MAIN SECTION: surface, skylight, tube ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="2">
    <!-- surface line with pit opening -->
    <line x1="90" y1="260" x2="420" y2="260" stroke-width="1.6"/>
    <line x1="600" y1="260" x2="900" y2="260" stroke-width="1.6"/>
    <g stroke="#6FC3FF" stroke-width="0.6"><line x1="140" y1="260" x2="128" y2="276"/><line x1="220" y1="260" x2="208" y2="276"/><line x1="300" y1="260" x2="288" y2="276"/><line x1="660" y1="260" x2="648" y2="276"/><line x1="760" y1="260" x2="748" y2="276"/><line x1="850" y1="260" x2="838" y2="276"/></g>
    <text x="150" y="248" fill="#DCEBFA" font-size="10" stroke="none">SURFACE — RADIATION, IMPACTS, TEMP SWINGS</text>

    <!-- radiation arrows hitting surface -->
    <g stroke="#6FC3FF" stroke-width="0.9">
      <path d="M 180 180 l 10 60" marker-end="url(#arrow)"/>
      <path d="M 260 175 l -6 62" marker-end="url(#arrow)"/>
      <path d="M 700 178 l 8 60" marker-end="url(#arrow)"/>
      <path d="M 800 174 l -8 62" marker-end="url(#arrow)"/>
    </g>
    <text x="380" y="170" fill="#6FC3FF" font-size="9" stroke="none">COSMIC RAYS · SOLAR PARTICLES · MICROMETEORITES</text>

    <!-- rock overburden between surface and tube roof -->
    <path d="M 90 260 L 90 400 L 420 400 L 420 260" stroke-width="0.8"/>
    <path d="M 600 260 L 600 400 L 900 400 L 900 260" stroke-width="0.8"/>
    <g stroke="#16406B" stroke-width="6" opacity="0.9">
      <line x1="110" y1="290" x2="400" y2="290"/><line x1="110" y1="320" x2="400" y2="320"/><line x1="110" y1="350" x2="400" y2="350"/>
      <line x1="620" y1="290" x2="880" y2="290"/><line x1="620" y1="320" x2="880" y2="320"/><line x1="620" y1="350" x2="880" y2="350"/>
    </g>
    <text x="240" y="378" fill="#DCEBFA" font-size="9" text-anchor="middle" stroke="none">TENS OF METRES OF ROCK</text>
    <text x="750" y="378" fill="#6FC3FF" font-size="9" text-anchor="middle" stroke="none">= FREE SHIELDING</text>

    <!-- skylight pit walls (collapse) -->
    <path d="M 420 260 L 448 400" stroke-width="1.6"/>
    <path d="M 600 260 L 568 400" stroke-width="1.6"/>
    <text x="510" y="248" fill="#6FC3FF" font-size="10" text-anchor="middle" stroke="none">SKYLIGHT (COLLAPSE PIT)</text>
    <!-- rubble at pit base -->
    <g fill="#6FC3FF"><circle cx="470" cy="560" r="5"/><circle cx="500" cy="572" r="7"/><circle cx="535" cy="562" r="5"/><circle cx="560" cy="576" r="6"/><circle cx="488" cy="586" r="4"/></g>
    <text x="512" y="606" fill="#DCEBFA" font-size="8.5" text-anchor="middle" stroke="none">BREAKDOWN RUBBLE</text>

    <!-- the tube void -->
    <path d="M 120 400 C 200 420 300 430 448 430 L 568 430 C 700 430 820 420 880 400" stroke-width="2"/>
    <path d="M 120 620 C 260 660 420 665 512 660 C 640 654 780 650 880 620" stroke-width="2"/>
    <line x1="120" y1="400" x2="120" y2="620" stroke-width="1"/>
    <line x1="880" y1="400" x2="880" y2="620" stroke-width="1"/>
    <text x="250" y="520" fill="#DCEBFA" font-size="11" stroke="none">LAVA TUBE VOID</text>
    <text x="250" y="538" fill="#6FC3FF" font-size="9" stroke="none">DARK SINCE FORMATION · STEADY TEMP</text>

    <!-- surface anchor unit + winch -->
    <rect x="590" y="212" width="90" height="46" rx="5" fill="#0E3357"/>
    <circle cx="612" cy="235" r="10"/>
    <text x="635" y="204" fill="#DCEBFA" font-size="9" text-anchor="middle" stroke="none">ANCHOR + WINCH + RELAY</text>

    <!-- tether down into tube -->
    <line x1="612" y1="245" x2="560" y2="300" stroke="#6FC3FF" stroke-width="1.4"/>
    <line x1="560" y1="300" x2="530" y2="470" stroke="#6FC3FF" stroke-width="1.4"/>
    <text x="586" y="330" fill="#6FC3FF" font-size="8.5" stroke="none">TETHER: LOAD + POWER + DATA</text>
    <text x="586" y="344" fill="#DCEBFA" font-size="8" stroke="none">(radio will not escape a cave)</text>

    <!-- the drone, suspended mid-void -->
    <rect x="500" y="470" width="60" height="34" rx="6" fill="#0E3357"/>
    <rect x="500" y="470" width="60" height="34" rx="6"/>
    <circle cx="514" cy="487" r="5"/>
    <text x="530" y="462" fill="#DCEBFA" font-size="9" text-anchor="middle" stroke="none">LT-1 SURVEYOR</text>
    <!-- lamp cones -->
    <g stroke="#6FC3FF" stroke-width="0.8">
      <path d="M 500 487 L 380 450 L 380 520 z"/>
      <path d="M 560 487 L 690 452 L 690 522 z"/>
    </g>
    <text x="330" y="490" fill="#6FC3FF" font-size="8" stroke="none">LAMPS</text>
    <!-- scan rays -->
    <g stroke="#DCEBFA" stroke-width="0.5" stroke-dasharray="3 3">
      <line x1="530" y1="470" x2="300" y2="418"/><line x1="530" y1="470" x2="760" y2="415"/>
      <line x1="530" y1="504" x2="260" y2="640"/><line x1="530" y1="504" x2="800" y2="636"/>
    </g>
    <text x="700" y="560" fill="#6FC3FF" font-size="8.5" stroke="none">3D SCAN OF THE VOID</text>
  </g>

  <!-- ======== SURVEY QUESTIONS INSET ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.2">
    <rect x="950" y="140" width="390" height="230" fill="#0E3357" stroke="#6FC3FF"/>
    <text x="968" y="166" fill="#6FC3FF" font-size="12" letter-spacing="1" stroke="none">FIG. B — FIVE QUESTIONS TO ANSWER</text>
    <line x1="968" y1="176" x2="1322" y2="176" stroke="#6FC3FF" stroke-width="0.7"/>
    <g fill="#DCEBFA" font-size="9.5" stroke="none">
      <text x="968" y="200">HOW BIG?  — 3D map: does a settlement fit</text>
      <text x="968" y="224">HOW SAFE? — radiation inside vs surface</text>
      <text x="968" y="248">HOW STABLE? — roof, walls, collapse risk</text>
      <text x="968" y="272">HOW STEADY? — temperature over time</text>
      <text x="968" y="296">HOW USABLE? — floor, and a way in and out</text>
    </g>
    <line x1="968" y1="316" x2="1322" y2="316" stroke="#16406B" stroke-width="0.7"/>
    <text x="968" y="340" fill="#6FC3FF" font-size="9" stroke="none">IS THIS A SHELTER WE CAN USE —</text>
    <text x="968" y="358" fill="#DCEBFA" font-size="9" stroke="none">OR A TRAP WE SHOULD AVOID?</text>
  </g>

  <!-- ======== DETAIL A: habitat inside tube ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.4">
    <circle cx="1140" cy="560" r="92" stroke="#6FC3FF"/>
    <!-- tube roof arc -->
    <path d="M 1070 512 q 70 -22 140 0" stroke-width="1.6"/>
    <g stroke="#16406B" stroke-width="5"><path d="M 1074 500 q 66 -20 132 0"/></g>
    <text x="1140" y="494" fill="#6FC3FF" font-size="7.5" text-anchor="middle" stroke="none">ROCK ROOF = SHIELD</text>
    <!-- floor -->
    <line x1="1068" y1="600" x2="1212" y2="600" stroke-width="1.4"/>
    <!-- light habitat module inside -->
    <rect x="1104" y="570" width="72" height="30" rx="12" fill="#0E3357"/>
    <rect x="1104" y="570" width="72" height="30" rx="12"/>
    <text x="1140" y="622" fill="#DCEBFA" font-size="7.5" text-anchor="middle" stroke="none">LIGHT HABITAT — SUPPLIES ONLY AIR</text>
    <text x="1140" y="636" fill="#6FC3FF" font-size="7.5" text-anchor="middle" stroke="none">NO BURYING REQUIRED</text>
    <text x="1140" y="676" fill="#6FC3FF" font-size="12" text-anchor="middle" stroke="none">DETAIL A — WHY IT'S WORTH LOOKING</text>
    <line x1="700" y1="500" x2="1050" y2="545" stroke="#6FC3FF" stroke-width="0.9" stroke-dasharray="5 4"/>
  </g>

  <!-- ======== RISK PANEL ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.4">
    <rect x="900" y="700" width="440" height="96" fill="#0E3357" stroke="#6FC3FF" stroke-width="1.4"/>
    <text x="918" y="724" fill="#6FC3FF" font-size="11" letter-spacing="1" stroke="none">! NOTHING ESCAPES A CAVE</text>
    <line x1="918" y1="732" x2="1322" y2="732" stroke="#6FC3FF" stroke-width="0.7"/>
    <g fill="#DCEBFA" font-size="9" stroke="none">
      <text x="918" y="750">NOT LIGHT · NOT RADIO · NOT A DRONE THAT STICKS</text>
      <text x="918" y="768">SEVERED TETHER = MISSION OVER · RIMS CRUMBLE</text>
      <text x="918" y="786" fill="#6FC3FF">SOME SURVEYORS WILL BE LOST. GO ANYWAY.</text>
    </g>
  </g>

  <!-- ======== CALLOUTS ======== -->
  <g stroke="#6FC3FF" stroke-width="1" fill="none">
    <line x1="635" y1="258" x2="180" y2="830" marker-start="url(#arrow)"/>
    <line x1="560" y1="330" x2="360" y2="830" marker-start="url(#arrow)"/>
    <line x1="530" y1="504" x2="500" y2="830" marker-start="url(#arrow)"/>
    <line x1="380" y1="490" x2="640" y2="830" marker-start="url(#arrow)"/>
    <line x1="240" y1="360" x2="790" y2="830" marker-start="url(#arrow)"/>
  </g>
  <g fill="#DCEBFA" font-size="13">
    <g><circle cx="180" cy="842" r="12" fill="none" stroke="#6FC3FF"/><text x="180" y="847" text-anchor="middle">1</text></g>
    <g><circle cx="360" cy="842" r="12" fill="none" stroke="#6FC3FF"/><text x="360" y="847" text-anchor="middle">2</text></g>
    <g><circle cx="500" cy="842" r="12" fill="none" stroke="#6FC3FF"/><text x="500" y="847" text-anchor="middle">3</text></g>
    <g><circle cx="640" cy="842" r="12" fill="none" stroke="#6FC3FF"/><text x="640" y="847" text-anchor="middle">4</text></g>
    <g><circle cx="790" cy="842" r="12" fill="none" stroke="#6FC3FF"/><text x="790" y="847" text-anchor="middle">5</text></g>
  </g>

  <!-- ======== PARTS LIST ======== -->
  <g font-size="11.5" fill="#DCEBFA">
    <rect x="50" y="862" width="640" height="96" fill="#0E3357" stroke="#6FC3FF" stroke-width="1"/>
    <text x="66" y="882" fill="#6FC3FF" font-size="12.5" letter-spacing="2" font-weight="bold">PARTS &amp; SYSTEMS INDEX</text>
    <line x1="66" y1="889" x2="674" y2="889" stroke="#6FC3FF" stroke-width="0.7"/>
    <text x="66" y="906">1 — ANCHOR + WINCH + RELAY: rim station, lowers and recovers the drone</text>
    <text x="66" y="924">2 — TETHER: carries load, power, and data (radio cannot escape the cave)</text>
    <text x="66" y="942">3 — LT-1 SURVEYOR: lamps + 3D scanner + radiation and thermal sensors</text>
    <text x="66" y="954" font-size="10" fill="#6FC3FF">4 — LAMPS light a dark never lit before · 5 — ROCK OVERBURDEN: the free shield</text>
  </g>

  <text x="1350" y="842" fill="#6FC3FF" font-size="11" text-anchor="end" letter-spacing="1">DESIGNED BY: W.A. SANDUN PRIYANKARA WIJERATHNE · sandunwijerathne51@gmail.com · github.com/sandunwijerathne</text>

  <!-- ======== TITLE BLOCK ======== -->
  <g font-size="11.5" fill="#DCEBFA">
    <rect x="710" y="862" width="640" height="96" fill="#0E3357" stroke="#DCEBFA" stroke-width="1.5"/>
    <line x1="710" y1="890" x2="1350" y2="890" stroke="#DCEBFA"/>
    <line x1="710" y1="918" x2="1350" y2="918" stroke="#DCEBFA"/>
    <line x1="710" y1="940" x2="1350" y2="940" stroke="#DCEBFA"/>
    <line x1="1040" y1="862" x2="1040" y2="958" stroke="#DCEBFA"/>
    <text x="726" y="880" fill="#6FC3FF" letter-spacing="1">PROJECT</text>
    <text x="726" y="888" font-size="10.5" font-weight="bold">OFF-WORLD TOOLKIT · VOLUME II</text>
    <text x="1056" y="880" fill="#6FC3FF">DRAWING NO.</text>
    <text x="1056" y="888" font-size="10.5" font-weight="bold">LT-1-GA-001 · REV A</text>
    <text x="726" y="906" fill="#6FC3FF">UNIT DESIGNATION</text>
    <text x="726" y="915" font-weight="bold" font-size="9.5">LT-1 "ARIADNE" — GENERAL ARRANGEMENT</text>
    <text x="1056" y="906" fill="#6FC3FF">TARGET</text>
    <text x="1056" y="915" font-weight="bold" font-size="10">LUNAR / MARTIAN LAVA TUBE</text>
    <text x="726" y="932" fill="#6FC3FF">RETURNS</text>
    <text x="726" y="938" font-weight="bold" font-size="9.5">3D MAP · RADIATION · THERMAL · STABILITY</text>
    <text x="1056" y="932" fill="#6FC3FF">EVIDENCE</text>
    <text x="1056" y="938" font-weight="bold" font-size="9.5">PITS IMAGED · GRAIL GRAVITY DATA</text>
    <text x="726" y="952" fill="#6FC3FF">FUNCTION</text>
    <text x="726" y="956" font-weight="bold" font-size="9">CHECKS WHETHER THE HOUSE IS ALREADY STANDING</text>
    <text x="1056" y="952" fill="#6FC3FF">STATUS</text>
    <text x="1056" y="956" font-weight="bold" font-size="9">CONCEPT — RECONNAISSANCE FIRST</text>
  </g>
</svg>
