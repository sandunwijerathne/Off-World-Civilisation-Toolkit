<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#16406B" stroke-width="0.6"/>
    </pattern>
    <pattern id="gridMajor" width="125" height="125" patternUnits="userSpaceOnUse">
      <rect width="125" height="125" fill="url(#grid)"/>
      <path d="M 125 0 L 0 0 0 125" fill="none" stroke="#1E5288" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6FC3FF"/>
    </marker>
    <marker id="warrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#DCEBFA"/>
    </marker>
    <marker id="dim" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M1,1 L9,9 M5,0 L5,10" stroke="#DCEBFA" stroke-width="1" fill="none"/>
    </marker>
  </defs>

  <rect width="1400" height="1000" fill="#0B2A4A"/>
  <rect width="1400" height="1000" fill="url(#gridMajor)"/>
  <rect x="20" y="20" width="1360" height="960" fill="none" stroke="#DCEBFA" stroke-width="2"/>
  <rect x="28" y="28" width="1344" height="944" fill="none" stroke="#DCEBFA" stroke-width="0.8"/>

  <text x="50" y="70" fill="#DCEBFA" font-size="27" letter-spacing="2" font-weight="bold">LUNAR MASS DRIVER — LM-1 "TREBUCHET"</text>
  <text x="50" y="96" fill="#6FC3FF" font-size="14" letter-spacing="2">ELECTROMAGNETIC CARGO LAUNCHER · TRACK PROFILE · DRIVE-COIL DETAIL · VOLUME II · SHEET 1 OF 5</text>
  <line x1="50" y1="110" x2="1350" y2="110" stroke="#6FC3FF" stroke-width="1"/>

  <!-- ======== MAIN TRACK PROFILE ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="2">
    <!-- lunar surface -->
    <path d="M 80 520 L 1000 460" stroke-width="1.4"/>
    <g stroke="#6FC3FF" stroke-width="0.6">
      <line x1="120" y1="520" x2="108" y2="536"/><line x1="200" y1="514" x2="188" y2="530"/>
      <line x1="320" y1="506" x2="308" y2="522"/><line x1="440" y1="498" x2="428" y2="514"/>
      <line x1="560" y1="490" x2="548" y2="506"/><line x1="700" y1="481" x2="688" y2="497"/>
      <line x1="850" y1="471" x2="838" y2="487"/>
    </g>
    <text x="120" y="556" fill="#DCEBFA" font-size="9" stroke="none">LUNAR SURFACE (⅙ g, NO AIR)</text>

    <!-- accelerator track along a gentle rise -->
    <line x1="120" y1="500" x2="900" y2="400" stroke-width="3"/>
    <line x1="120" y1="512" x2="900" y2="412" stroke-width="1"/>
    <!-- drive coils along track -->
    <g stroke="#6FC3FF" stroke-width="1.4">
      <line x1="180" y1="486" x2="180" y2="506"/><line x1="240" y1="479" x2="240" y2="499"/>
      <line x1="300" y1="471" x2="300" y2="491"/><line x1="360" y1="464" x2="360" y2="484"/>
      <line x1="420" y1="456" x2="420" y2="476"/><line x1="480" y1="448" x2="480" y2="468"/>
      <line x1="540" y1="441" x2="540" y2="461"/><line x1="600" y1="433" x2="600" y2="453"/>
      <line x1="660" y1="425" x2="660" y2="445"/><line x1="720" y1="418" x2="720" y2="438"/>
      <line x1="780" y1="410" x2="780" y2="430"/><line x1="840" y1="402" x2="840" y2="422"/>
    </g>
    <text x="330" y="440" fill="#6FC3FF" font-size="10" stroke="none">DRIVE COILS — SWITCHED IN SEQUENCE →</text>

    <!-- bucket at start -->
    <rect x="140" y="482" width="34" height="18" rx="3" fill="#0E3357"/>
    <text x="157" y="475" fill="#DCEBFA" font-size="8" text-anchor="middle" stroke="none">BUCKET + PAYLOAD</text>

    <!-- speed labels along track -->
    <text x="220" y="524" fill="#6FC3FF" font-size="8" stroke="none">SLOW</text>
    <text x="520" y="486" fill="#6FC3FF" font-size="8" stroke="none">FASTER</text>
    <text x="800" y="440" fill="#6FC3FF" font-size="8" stroke="none">LAUNCH SPEED</text>

    <!-- release point + payload flying free -->
    <circle cx="900" cy="400" r="6"/>
    <text x="900" y="384" fill="#DCEBFA" font-size="8" text-anchor="middle" stroke="none">RELEASE</text>
    <path d="M 906 398 C 1000 360 1080 300 1150 240" stroke="#6FC3FF" stroke-width="1.6" marker-end="url(#arrow)"/>
    <rect x="1150" y="228" width="24" height="14" rx="2" fill="#0E3357"/>
    <text x="1180" y="238" fill="#DCEBFA" font-size="9" stroke="none">CARGO COASTS TO ORBIT</text>

    <!-- bucket brake + return -->
    <path d="M 895 412 C 700 480 400 520 160 508" stroke="#6FC3FF" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
    <text x="480" y="536" fill="#6FC3FF" font-size="9" stroke="none">BUCKET BRAKED + RETURNED (REUSED)</text>

    <!-- power source -->
    <rect x="110" y="580" width="150" height="60" rx="6" fill="#0E3357"/>
    <g stroke="#6FC3FF" stroke-width="1"><path d="M 130 600 l 20 0 l 0 -12 l 16 24 l 0 -12 l 20 0"/></g>
    <text x="185" y="600" fill="#DCEBFA" font-size="9" stroke="none">SOLAR / SURFACE</text>
    <text x="185" y="614" fill="#DCEBFA" font-size="9" stroke="none">POWER</text>
    <path d="M 200 580 l 0 -70" stroke="#6FC3FF" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="205" y="560" fill="#6FC3FF" font-size="8" stroke="none">PULSED ELECTRICITY → COILS</text>
  </g>

  <!-- ======== ROCKET-EQUATION INSET (top right) ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.2">
    <rect x="960" y="140" width="380" height="200" fill="#0E3357" stroke="#6FC3FF"/>
    <text x="978" y="166" fill="#6FC3FF" font-size="12" letter-spacing="1" stroke="none">FIG. B — NO PROPELLANT RIDES ALONG</text>
    <line x1="978" y1="176" x2="1322" y2="176" stroke="#6FC3FF" stroke-width="0.7"/>
    <!-- rocket: mostly fuel -->
    <rect x="1000" y="200" width="30" height="90"/>
    <rect x="1000" y="270" width="30" height="20" fill="#16406B"/>
    <text x="1015" y="308" fill="#DCEBFA" font-size="7.5" text-anchor="middle" stroke="none">ROCKET:</text>
    <text x="1015" y="320" fill="#6FC3FF" font-size="7.5" text-anchor="middle" stroke="none">MOSTLY FUEL ✗</text>
    <!-- mass driver: all payload -->
    <rect x="1180" y="270" width="30" height="20" fill="#16406B"/>
    <text x="1195" y="264" fill="#DCEBFA" font-size="7.5" text-anchor="middle" stroke="none">DRIVER:</text>
    <text x="1195" y="308" fill="#6FC3FF" font-size="7.5" text-anchor="middle" stroke="none">ALL PAYLOAD ✓</text>
    <text x="978" y="332" fill="#6FC3FF" font-size="9" stroke="none">ENERGY STAYS ON THE GROUND, AS ELECTRICITY</text>
  </g>

  <!-- ======== DRIVE-COIL DETAIL A ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.4">
    <circle cx="1120" cy="560" r="92" stroke="#6FC3FF"/>
    <!-- rail with coils -->
    <line x1="1050" y1="580" x2="1190" y2="580" stroke-width="2"/>
    <g stroke="#6FC3FF" stroke-width="1.4"><line x1="1065" y1="568" x2="1065" y2="592"/><line x1="1095" y1="568" x2="1095" y2="592"/><line x1="1125" y1="568" x2="1125" y2="592"/><line x1="1155" y1="568" x2="1155" y2="592"/></g>
    <!-- bucket -->
    <rect x="1078" y="562" width="26" height="14" rx="2" fill="#0E3357"/>
    <!-- sequential energise arrows -->
    <path d="M 1095 552 l 24 0" stroke="#6FC3FF" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="1120" y="546" fill="#DCEBFA" font-size="7.5" text-anchor="middle" stroke="none">COILS PULL BUCKET FORWARD</text>
    <text x="1120" y="612" fill="#6FC3FF" font-size="8" text-anchor="middle" stroke="none">SAME AS MAGLEV / AIRCRAFT CATAPULT</text>
    <text x="1120" y="676" fill="#6FC3FF" font-size="12" text-anchor="middle" stroke="none">DETAIL A — DRIVE COILS</text>
    <line x1="600" y1="440" x2="1032" y2="548" stroke="#6FC3FF" stroke-width="0.9" stroke-dasharray="5 4"/>
  </g>

  <!-- ======== LIMITS PANEL ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.4">
    <rect x="900" y="690" width="440" height="96" fill="#0E3357" stroke="#6FC3FF" stroke-width="1.4"/>
    <text x="918" y="714" fill="#6FC3FF" font-size="11" letter-spacing="1" stroke="none">! WHAT IT IS — AND ISN'T — FOR</text>
    <line x1="918" y1="722" x2="1322" y2="722" stroke="#6FC3FF" stroke-width="0.7"/>
    <g fill="#DCEBFA" font-size="9" stroke="none">
      <text x="918" y="740">DURABLE BULK CARGO ONLY — NOT PEOPLE (HARD g)</text>
      <text x="918" y="758">LAUNCHES OUTWARD ONLY · NEEDS A CATCHER IN ORBIT</text>
      <text x="918" y="776" fill="#6FC3FF">INFRASTRUCTURE FOR A MOON THAT ALREADY PRODUCES</text>
    </g>
  </g>

  <!-- ======== CALLOUTS ======== -->
  <g stroke="#6FC3FF" stroke-width="1" fill="none">
    <line x1="157" y1="500" x2="180" y2="810" marker-start="url(#arrow)"/>
    <line x1="480" y1="458" x2="360" y2="810" marker-start="url(#arrow)"/>
    <line x1="900" y1="400" x2="500" y2="810" marker-start="url(#arrow)"/>
    <line x1="1000" y1="340" x2="640" y2="810" marker-start="url(#arrow)"/>
    <line x1="185" y1="580" x2="790" y2="810" marker-start="url(#arrow)"/>
  </g>
  <g fill="#DCEBFA" font-size="13">
    <g><circle cx="180" cy="822" r="12" fill="none" stroke="#6FC3FF"/><text x="180" y="827" text-anchor="middle">1</text></g>
    <g><circle cx="360" cy="822" r="12" fill="none" stroke="#6FC3FF"/><text x="360" y="827" text-anchor="middle">2</text></g>
    <g><circle cx="500" cy="822" r="12" fill="none" stroke="#6FC3FF"/><text x="500" y="827" text-anchor="middle">3</text></g>
    <g><circle cx="640" cy="822" r="12" fill="none" stroke="#6FC3FF"/><text x="640" y="827" text-anchor="middle">4</text></g>
    <g><circle cx="790" cy="822" r="12" fill="none" stroke="#6FC3FF"/><text x="790" y="827" text-anchor="middle">5</text></g>
  </g>

  <!-- ======== PARTS LIST ======== -->
  <g font-size="12" fill="#DCEBFA">
    <rect x="50" y="842" width="640" height="114" fill="#0E3357" stroke="#6FC3FF" stroke-width="1"/>
    <text x="66" y="864" fill="#6FC3FF" font-size="13" letter-spacing="2" font-weight="bold">PARTS &amp; SYSTEMS INDEX</text>
    <line x1="66" y1="872" x2="674" y2="872" stroke="#6FC3FF" stroke-width="0.7"/>
    <text x="66" y="890">1 — BUCKET + PAYLOAD: carrier grips cargo, releases cleanly at the end</text>
    <text x="66" y="908">2 — DRIVE COILS: switched in sequence to accelerate the bucket (DETAIL A)</text>
    <text x="66" y="926">3 — RELEASE: cargo coasts on a ballistic path to orbit (no drag, no fuel)</text>
    <text x="66" y="944" font-size="10.5" fill="#6FC3FF">4 — CARGO CAUGHT IN ORBIT · 5 — SOLAR/SURFACE POWER: pulsed electricity</text>
  </g>

  <text x="1350" y="822" fill="#6FC3FF" font-size="11" text-anchor="end" letter-spacing="1">DESIGNED BY: W.A. SANDUN PRIYANKARA WIJERATHNE · sandunwijerathne51@gmail.com · github.com/sandunwijerathne</text>

  <!-- ======== TITLE BLOCK ======== -->
  <g font-size="12" fill="#DCEBFA">
    <rect x="710" y="842" width="640" height="114" fill="#0E3357" stroke="#DCEBFA" stroke-width="1.5"/>
    <line x1="710" y1="874" x2="1350" y2="874" stroke="#DCEBFA"/>
    <line x1="710" y1="906" x2="1350" y2="906" stroke="#DCEBFA"/>
    <line x1="710" y1="936" x2="1350" y2="936" stroke="#DCEBFA"/>
    <line x1="1040" y1="842" x2="1040" y2="956" stroke="#DCEBFA"/>
    <text x="726" y="862" fill="#6FC3FF" letter-spacing="1">PROJECT</text>
    <text x="726" y="872" font-size="11" font-weight="bold">OFF-WORLD TOOLKIT · VOLUME II</text>
    <text x="1056" y="862" fill="#6FC3FF">DRAWING NO.</text>
    <text x="1056" y="872" font-size="11" font-weight="bold">LM-1-GA-001 · REV A</text>
    <text x="726" y="894" fill="#6FC3FF">UNIT DESIGNATION</text>
    <text x="726" y="903" font-weight="bold" font-size="9.5">LM-1 "TREBUCHET" — GENERAL ARRANGEMENT</text>
    <text x="1056" y="894" fill="#6FC3FF">DRIVE</text>
    <text x="1056" y="903" font-weight="bold" font-size="11">ELECTROMAGNETIC (NO PROPELLANT)</text>
    <text x="726" y="925" fill="#6FC3FF">EXPLOITS</text>
    <text x="726" y="934" font-weight="bold" font-size="10.5">⅙ g + NO ATMOSPHERE = LOW LAUNCH SPEED</text>
    <text x="1056" y="925" fill="#6FC3FF">LAUNCHES</text>
    <text x="1056" y="934" font-weight="bold" font-size="11">DURABLE BULK CARGO</text>
    <text x="726" y="950" fill="#6FC3FF">FUNCTION</text>
    <text x="726" y="958" font-weight="bold" font-size="9.5">THE MOON'S LOADING DOCK — CARGO ON ELECTRICITY</text>
    <text x="1056" y="950" fill="#6FC3FF">STATUS</text>
    <text x="1056" y="958" font-weight="bold" font-size="9.5">CONCEPT — EM LAUNCH MATURING ON EARTH</text>
  </g>
</svg>
