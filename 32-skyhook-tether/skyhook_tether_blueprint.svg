<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#16406B" stroke-width="0.6"/>
    </pattern>
    <pattern id="gridMajor" width="125" height="125" patternUnits="userSpaceOnUse">
      <rect width="125" height="125" fill="url(#grid)"/>
      <path d="M 125 0 L 0 0 0 125" fill="none" stroke="#1E5288" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6FC3FF"/>
    </marker>
    <marker id="warrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#DCEBFA"/>
    </marker>
    <marker id="dim" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M1,1 L9,9 M5,0 L5,10" stroke="#DCEBFA" stroke-width="1" fill="none"/>
    </marker>
  </defs>

  <rect width="1400" height="1000" fill="#0B2A4A"/>
  <rect width="1400" height="1000" fill="url(#gridMajor)"/>
  <rect x="20" y="20" width="1360" height="960" fill="none" stroke="#DCEBFA" stroke-width="2"/>
  <rect x="28" y="28" width="1344" height="944" fill="none" stroke="#DCEBFA" stroke-width="0.8"/>

  <text x="50" y="70" fill="#DCEBFA" font-size="27" letter-spacing="2" font-weight="bold">SKYHOOK TETHER — SK-1 "FUNDIBULUM"</text>
  <text x="50" y="96" fill="#6FC3FF" font-size="14" letter-spacing="2">ROTATING MOMENTUM-EXCHANGE TETHER · CATCH-&amp;-FLING CYCLE · VOLUME II · SHEET 1 OF 5</text>
  <line x1="50" y1="110" x2="1350" y2="110" stroke="#6FC3FF" stroke-width="1"/>

  <!-- ======== MAIN: rotating tether over a planet ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="2">
    <!-- planet limb bottom -->
    <path d="M 60 720 A 900 900 0 0 1 900 720" stroke-width="1.4"/>
    <g stroke="#6FC3FF" stroke-width="0.6"><line x1="180" y1="700" x2="168" y2="716"/><line x1="360" y1="676" x2="348" y2="692"/><line x1="540" y1="668" x2="528" y2="684"/><line x1="720" y1="676" x2="708" y2="692"/></g>
    <text x="120" y="740" fill="#DCEBFA" font-size="10" stroke="none">PLANET / MOON SURFACE</text>

    <!-- orbital path of hub (dashed) -->
    <ellipse cx="470" cy="380" rx="360" ry="60" stroke="#6FC3FF" stroke-width="0.8" stroke-dasharray="7 5"/>
    <text x="760" y="352" fill="#6FC3FF" font-size="9" stroke="none">ORBIT →</text>

    <!-- central hub -->
    <circle cx="470" cy="380" r="26" fill="#0E3357"/>
    <circle cx="470" cy="380" r="26"/>
    <circle cx="470" cy="380" r="8" fill="#DCEBFA"/>
    <text x="470" y="356" fill="#6FC3FF" font-size="10" text-anchor="middle" stroke="none">HUB / COUNTERWEIGHT</text>

    <!-- tether, vertical (bottom tip low, top tip high) -->
    <line x1="470" y1="406" x2="470" y2="620" stroke-width="1.6"/>
    <line x1="470" y1="354" x2="470" y2="150" stroke-width="1.6"/>
    <!-- rotation arc -->
    <path d="M 590 470 A 150 150 0 0 1 470 620" stroke="#6FC3FF" stroke-width="0.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
    <text x="600" y="450" fill="#6FC3FF" font-size="9" stroke="none">SPINS END-OVER-END</text>

    <!-- bottom tip: catch -->
    <circle cx="470" cy="620" r="10"/>
    <text x="490" y="614" fill="#DCEBFA" font-size="9" stroke="none">TIP AT BOTTOM: LOW + SLOW → CATCH</text>
    <!-- payload rising to meet it -->
    <rect x="440" y="690" width="24" height="14" rx="2" fill="#0E3357"/>
    <path d="M 452 688 l 0 -50" stroke="#6FC3FF" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="360" y="708" fill="#6FC3FF" font-size="9" stroke="none">PAYLOAD CLIMBS FROM BELOW</text>

    <!-- top tip: release -->
    <circle cx="470" cy="150" r="10"/>
    <text x="490" y="146" fill="#DCEBFA" font-size="9" stroke="none">TIP AT TOP: HIGH + FAST → RELEASE</text>
    <!-- payload flung onward -->
    <path d="M 480 148 C 620 120 760 130 880 180" stroke="#6FC3FF" stroke-width="1.6" marker-end="url(#arrow)"/>
    <rect x="880" y="172" width="24" height="14" rx="2" fill="#0E3357"/>
    <text x="700" y="120" fill="#DCEBFA" font-size="9" stroke="none">FLUNG TO HIGHER / TRANSFER ORBIT</text>

    <!-- velocity vectors at tips -->
    <path d="M 470 620 l -40 0" stroke="#6FC3FF" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="410" y="640" fill="#6FC3FF" font-size="7.5" stroke="none">tip moves back (slow)</text>
    <path d="M 470 150 l 40 0" stroke="#6FC3FF" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="510" y="140" fill="#6FC3FF" font-size="7.5" stroke="none">tip moves fwd (fast)</text>
  </g>

  <!-- ======== MOMENTUM BOOKKEEPING INSET (top right) ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.2">
    <rect x="960" y="140" width="380" height="220" fill="#0E3357" stroke="#6FC3FF"/>
    <text x="978" y="166" fill="#6FC3FF" font-size="12" letter-spacing="1" stroke="none">FIG. B — MOMENTUM BOOKKEEPING</text>
    <line x1="978" y1="176" x2="1322" y2="176" stroke="#6FC3FF" stroke-width="0.7"/>
    <g fill="#DCEBFA" font-size="9" stroke="none">
      <text x="978" y="200">EACH THROW: payload GAINS momentum,</text>
      <text x="978" y="216" fill="#6FC3FF">tether LOSES it → drops a little</text>
      <text x="978" y="242">RESTORE WITHOUT FUEL:</text>
      <text x="990" y="260">• electrodynamic push on B-field</text>
      <text x="990" y="276">• catch RETURNING traffic (gives it back)</text>
    </g>
    <text x="978" y="308" fill="#6FC3FF" font-size="9" stroke="none">BALANCED TRAFFIC = INDEFINITE, FUEL-FREE LIFT</text>
    <text x="978" y="330" fill="#DCEBFA" font-size="9" stroke="none">A CLOSED MOMENTUM ECONOMY, NOT A FUEL TANK</text>
  </g>

  <!-- ======== PARTNER DETAIL A: mass driver pairing ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.4">
    <circle cx="1120" cy="560" r="94" stroke="#6FC3FF"/>
    <!-- little surface + driver -->
    <path d="M 1050 600 l 140 -14" stroke-width="1.4"/>
    <g stroke="#6FC3FF" stroke-width="1"><line x1="1075" y1="592" x2="1075" y2="600"/><line x1="1105" y1="589" x2="1105" y2="597"/><line x1="1135" y1="586" x2="1135" y2="594"/></g>
    <text x="1120" y="616" fill="#DCEBFA" font-size="7.5" text-anchor="middle" stroke="none">MASS DRIVER (#31)</text>
    <!-- arc up to tether tip -->
    <path d="M 1160 580 C 1150 540 1130 520 1110 512" stroke="#6FC3FF" stroke-width="1.2" marker-end="url(#arrow)"/>
    <circle cx="1108" cy="510" r="6"/>
    <text x="1120" y="498" fill="#6FC3FF" font-size="7.5" text-anchor="middle" stroke="none">SKYHOOK CATCHES</text>
    <text x="1120" y="676" fill="#6FC3FF" font-size="12" text-anchor="middle" stroke="none">DETAIL A — PAIRS WITH THE LAUNCHER</text>
    <line x1="700" y1="620" x2="1030" y2="560" stroke="#6FC3FF" stroke-width="0.9" stroke-dasharray="5 4"/>
  </g>

  <!-- ======== CATCH PANEL ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.4">
    <rect x="900" y="690" width="440" height="96" fill="#0E3357" stroke="#6FC3FF" stroke-width="1.4"/>
    <text x="918" y="714" fill="#6FC3FF" font-size="11" letter-spacing="1" stroke="none">! THE CATCH IS THE HARD PART</text>
    <line x1="918" y1="722" x2="1322" y2="722" stroke="#6FC3FF" stroke-width="0.7"/>
    <g fill="#DCEBFA" font-size="9" stroke="none">
      <text x="918" y="740">TIP + PAYLOAD MUST MEET AT EXACT PLACE/TIME/SPEED</text>
      <text x="918" y="758">TETHER MUST BE STRONG — MULTI-STRAND, IMPACT-PROOF</text>
      <text x="918" y="776" fill="#6FC3FF">WORTH BUILDING ONLY AS A LINK IN A CHAIN</text>
    </g>
  </g>

  <!-- ======== CALLOUTS ======== -->
  <g stroke="#6FC3FF" stroke-width="1" fill="none">
    <line x1="470" y1="406" x2="180" y2="810" marker-start="url(#arrow)"/>
    <line x1="470" y1="620" x2="360" y2="810" marker-start="url(#arrow)"/>
    <line x1="452" y1="690" x2="500" y2="810" marker-start="url(#arrow)"/>
    <line x1="470" y1="150" x2="640" y2="810" marker-start="url(#arrow)"/>
    <line x1="880" y1="180" x2="790" y2="810" marker-start="url(#arrow)"/>
  </g>
  <g fill="#DCEBFA" font-size="13">
    <g><circle cx="180" cy="822" r="12" fill="none" stroke="#6FC3FF"/><text x="180" y="827" text-anchor="middle">1</text></g>
    <g><circle cx="360" cy="822" r="12" fill="none" stroke="#6FC3FF"/><text x="360" y="827" text-anchor="middle">2</text></g>
    <g><circle cx="500" cy="822" r="12" fill="none" stroke="#6FC3FF"/><text x="500" y="827" text-anchor="middle">3</text></g>
    <g><circle cx="640" cy="822" r="12" fill="none" stroke="#6FC3FF"/><text x="640" y="827" text-anchor="middle">4</text></g>
    <g><circle cx="790" cy="822" r="12" fill="none" stroke="#6FC3FF"/><text x="790" y="827" text-anchor="middle">5</text></g>
  </g>

  <!-- ======== PARTS LIST ======== -->
  <g font-size="12" fill="#DCEBFA">
    <rect x="50" y="842" width="640" height="114" fill="#0E3357" stroke="#6FC3FF" stroke-width="1"/>
    <text x="66" y="864" fill="#6FC3FF" font-size="13" letter-spacing="2" font-weight="bold">PARTS &amp; SYSTEMS INDEX</text>
    <line x1="66" y1="872" x2="674" y2="872" stroke="#6FC3FF" stroke-width="0.7"/>
    <text x="66" y="890">1 — HUB / COUNTERWEIGHT: central mass, spins the tether, holds systems</text>
    <text x="66" y="908">2 — BOTTOM TIP: dips low + slow to catch a rising payload</text>
    <text x="66" y="926">3 — PAYLOAD: climbs from below (e.g. off a mass driver) to the catch point</text>
    <text x="66" y="944" font-size="10.5" fill="#6FC3FF">4 — TOP TIP: high + fast, releases → transfer orbit · 5 — FLUNG ONWARD, no fuel</text>
  </g>

  <text x="1350" y="822" fill="#6FC3FF" font-size="11" text-anchor="end" letter-spacing="1">DESIGNED BY: W.A. SANDUN PRIYANKARA WIJERATHNE · sandunwijerathne51@gmail.com · github.com/sandunwijerathne</text>

  <!-- ======== TITLE BLOCK ======== -->
  <g font-size="12" fill="#DCEBFA">
    <rect x="710" y="842" width="640" height="114" fill="#0E3357" stroke="#DCEBFA" stroke-width="1.5"/>
    <line x1="710" y1="874" x2="1350" y2="874" stroke="#DCEBFA"/>
    <line x1="710" y1="906" x2="1350" y2="906" stroke="#DCEBFA"/>
    <line x1="710" y1="936" x2="1350" y2="936" stroke="#DCEBFA"/>
    <line x1="1040" y1="842" x2="1040" y2="956" stroke="#DCEBFA"/>
    <text x="726" y="862" fill="#6FC3FF" letter-spacing="1">PROJECT</text>
    <text x="726" y="872" font-size="11" font-weight="bold">OFF-WORLD TOOLKIT · VOLUME II</text>
    <text x="1056" y="862" fill="#6FC3FF">DRAWING NO.</text>
    <text x="1056" y="872" font-size="11" font-weight="bold">SK-1-GA-001 · REV A</text>
    <text x="726" y="894" fill="#6FC3FF">UNIT DESIGNATION</text>
    <text x="726" y="903" font-weight="bold" font-size="9.5">SK-1 "FUNDIBULUM" — GENERAL ARRANGEMENT</text>
    <text x="1056" y="894" fill="#6FC3FF">DRIVE</text>
    <text x="1056" y="903" font-weight="bold" font-size="10.5">MOMENTUM EXCHANGE (NO PROPELLANT)</text>
    <text x="726" y="925" fill="#6FC3FF">RESTORES ORBIT BY</text>
    <text x="726" y="934" font-weight="bold" font-size="10">ELECTRODYNAMIC PUSH / RETURN TRAFFIC</text>
    <text x="1056" y="925" fill="#6FC3FF">PARTNERS WITH</text>
    <text x="1056" y="934" font-weight="bold" font-size="11">THE MASS DRIVER (#31)</text>
    <text x="726" y="950" fill="#6FC3FF">FUNCTION</text>
    <text x="726" y="958" font-weight="bold" font-size="9.5">FLINGS CARGO FROM LOW ORBIT TO HIGH — FUEL-FREE</text>
    <text x="1056" y="950" fill="#6FC3FF">STATUS</text>
    <text x="1056" y="958" font-weight="bold" font-size="9.5">CONCEPT — TETHERS FLOWN, PHYSICS SETTLED</text>
  </g>
</svg>
