<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#16406B" stroke-width="0.6"/>
    </pattern>
    <pattern id="gridMajor" width="125" height="125" patternUnits="userSpaceOnUse">
      <rect width="125" height="125" fill="url(#grid)"/>
      <path d="M 125 0 L 0 0 0 125" fill="none" stroke="#1E5288" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6FC3FF"/>
    </marker>
    <marker id="warrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#DCEBFA"/>
    </marker>
    <marker id="dim" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M1,1 L9,9 M5,0 L5,10" stroke="#DCEBFA" stroke-width="1" fill="none"/>
    </marker>
  </defs>

  <rect width="1400" height="1000" fill="#0B2A4A"/>
  <rect width="1400" height="1000" fill="url(#gridMajor)"/>
  <rect x="20" y="20" width="1360" height="960" fill="none" stroke="#DCEBFA" stroke-width="2"/>
  <rect x="28" y="28" width="1344" height="944" fill="none" stroke="#DCEBFA" stroke-width="0.8"/>

  <text x="50" y="70" fill="#DCEBFA" font-size="26" letter-spacing="2" font-weight="bold">MINI-MAGNETOSPHERE DEFLECTOR — MD-1 "AEGIS FIELD"</text>
  <text x="50" y="96" fill="#6FC3FF" font-size="14" letter-spacing="2">PLASMA-INFLATED RADIATION SHIELD · FIELD SCHEMATIC · COIL DETAIL · SHEET 1 OF 5</text>
  <line x1="50" y1="110" x2="1350" y2="110" stroke="#6FC3FF" stroke-width="1"/>

  <!-- ======== MAIN FIELD SCHEMATIC ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="2">
    <!-- incoming solar-storm protons (from left) -->
    <g stroke="#DCEBFA" stroke-width="1">
      <line x1="60" y1="300" x2="180" y2="300" marker-end="url(#warrow)"/>
      <line x1="60" y1="380" x2="180" y2="380" marker-end="url(#warrow)"/>
      <line x1="60" y1="460" x2="180" y2="460" marker-end="url(#warrow)"/>
      <line x1="60" y1="540" x2="180" y2="540" marker-end="url(#warrow)"/>
      <line x1="60" y1="620" x2="180" y2="620" marker-end="url(#warrow)"/>
    </g>
    <text x="62" y="284" fill="#6FC3FF" font-size="11" stroke="none">SOLAR STORM PROTONS (SEP EVENT)</text>

    <!-- magnetopause bow (deflection boundary) -->
    <path d="M 250 200 Q 130 460 250 720" stroke="#6FC3FF" stroke-width="1.6"/>
    <text x="150" y="720" fill="#6FC3FF" font-size="10" transform="rotate(-72 160 700)">MAGNETOPAUSE (INFLATED)</text>

    <!-- deflected particle paths curving around -->
    <g stroke="#DCEBFA" stroke-width="1">
      <path d="M 180 300 Q 250 260 320 210" marker-end="url(#warrow)"/>
      <path d="M 180 380 Q 250 320 300 250" marker-end="url(#warrow)"/>
      <path d="M 180 540 Q 250 600 300 670" marker-end="url(#warrow)"/>
      <path d="M 180 620 Q 250 660 320 710" marker-end="url(#warrow)"/>
    </g>

    <!-- magnetic field lines (dipole around ship) -->
    <g stroke="#6FC3FF" stroke-width="0.9" stroke-dasharray="6 5">
      <ellipse cx="560" cy="460" rx="230" ry="120"/>
      <ellipse cx="560" cy="460" rx="300" ry="180"/>
      <ellipse cx="560" cy="460" rx="150" ry="70"/>
    </g>

    <!-- spacecraft at center -->
    <g stroke-width="2">
      <rect x="520" y="430" width="80" height="60" rx="8"/>
      <path d="M 600 445 l 40 -10 v 50 l -40 -10" />
      <rect x="470" y="446" width="50" height="28"/>
      <path d="M 484 446 v28 M 498 446 v28" stroke-width="0.6"/>
    </g>
    <text x="560" y="464" fill="#6FC3FF" font-size="9" text-anchor="middle" stroke="none">CREW</text>

    <!-- superconducting coil (ring around ship) -->
    <ellipse cx="560" cy="460" rx="95" ry="46" stroke-width="2.2"/>
    <text x="560" y="530" fill="#6FC3FF" font-size="9" text-anchor="middle" stroke="none">SC COIL</text>

    <!-- plasma injection puffs -->
    <g stroke="#DCEBFA" stroke-width="1">
      <path d="M 655 440 q 14 -6 24 4 M 655 480 q 14 6 24 -4"/>
    </g>
    <text x="690" y="440" fill="#6FC3FF" font-size="9" stroke="none">PLASMA INJECT (INFLATE)</text>

    <!-- calm zone label -->
    <circle cx="560" cy="460" r="8" fill="none" stroke="#6FC3FF" stroke-width="1"/>
    <text x="560" y="410" fill="#DCEBFA" font-size="9" text-anchor="middle" stroke="none">CALM CENTER</text>
  </g>

  <!-- ======== STORM-RESPONSE INSET (top right) ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.2">
    <rect x="1000" y="140" width="340" height="230" fill="#0E3357" stroke="#6FC3FF"/>
    <text x="1016" y="164" fill="#6FC3FF" font-size="12" letter-spacing="1" stroke="none">FIG. B — STORM-TRIGGERED RAMP</text>
    <!-- quiet state -->
    <ellipse cx="1080" cy="250" rx="30" ry="18" stroke-dasharray="4 3"/>
    <rect x="1072" y="242" width="16" height="16"/>
    <text x="1080" y="292" fill="#DCEBFA" font-size="8.5" text-anchor="middle" stroke="none">QUIET: LOW POWER</text>
    <!-- arrow -->
    <line x1="1120" y1="250" x2="1180" y2="250" marker-end="url(#arrow)" stroke="#6FC3FF"/>
    <text x="1150" y="240" fill="#6FC3FF" font-size="8" text-anchor="middle" stroke="none">FORECAST</text>
    <!-- storm state -->
    <ellipse cx="1250" cy="250" rx="52" ry="30" stroke-dasharray="4 3"/>
    <ellipse cx="1250" cy="250" rx="34" ry="20" stroke-dasharray="3 3"/>
    <rect x="1242" y="242" width="16" height="16"/>
    <text x="1250" y="300" fill="#DCEBFA" font-size="8.5" text-anchor="middle" stroke="none">STORM: INFLATED</text>
    <text x="1016" y="344" fill="#6FC3FF" font-size="9" stroke="none">SHIELD SUMMONED, NOT ALWAYS CARRIED</text>
  </g>

  <!-- ======== DETAIL A: HTS coil section ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.4">
    <circle cx="1150" cy="600" r="88" stroke="#6FC3FF"/>
    <circle cx="1150" cy="600" r="58"/>
    <circle cx="1150" cy="600" r="42" stroke-dasharray="4 3" stroke-width="0.9"/>
    <rect x="1136" y="586" width="28" height="28"/>
    <path d="M 1136 593 h28 M 1136 600 h28 M 1136 607 h28" stroke-width="0.6"/>
    <!-- cryo line -->
    <path d="M 1150 542 q 12 -8 0 -14" stroke="#6FC3FF" stroke-width="1"/>
    <line x1="1150" y1="522" x2="1150" y2="506"/>
    <rect x="1138" y="488" width="24" height="18"/>
    <g fill="#DCEBFA" font-size="8.5" stroke="none">
      <text x="1150" y="502" text-anchor="middle" font-size="8">CRYOCOOLER</text>
      <text x="1224" y="600">MLI</text>
      <text x="1150" y="604" text-anchor="middle" font-size="8">REBCO</text>
    </g>
    <text x="1150" y="712" fill="#6FC3FF" font-size="12" text-anchor="middle" stroke="none">DETAIL A — SUPERCONDUCTING COIL</text>
    <line x1="655" y1="460" x2="1062" y2="590" stroke="#6FC3FF" stroke-width="0.9" stroke-dasharray="5 4"/>
  </g>

  <!-- ======== CALLOUTS ======== -->
  <g stroke="#6FC3FF" stroke-width="1" fill="none">
    <line x1="130" y1="460" x2="150" y2="780" marker-start="url(#arrow)"/>
    <line x1="560" y1="506" x2="380" y2="780" marker-start="url(#arrow)"/>
    <line x1="560" y1="430" x2="560" y2="780" marker-start="url(#arrow)"/>
    <line x1="679" y1="444" x2="760" y2="780" marker-start="url(#arrow)"/>
    <line x1="790" y1="340" x2="900" y2="780" marker-start="url(#arrow)"/>
  </g>
  <g fill="#DCEBFA" font-size="13">
    <g><circle cx="150" cy="792" r="12" fill="none" stroke="#6FC3FF"/><text x="150" y="797" text-anchor="middle">1</text></g>
    <g><circle cx="380" cy="792" r="12" fill="none" stroke="#6FC3FF"/><text x="380" y="797" text-anchor="middle">2</text></g>
    <g><circle cx="560" cy="792" r="12" fill="none" stroke="#6FC3FF"/><text x="560" y="797" text-anchor="middle">3</text></g>
    <g><circle cx="760" cy="792" r="12" fill="none" stroke="#6FC3FF"/><text x="760" y="797" text-anchor="middle">4</text></g>
    <g><circle cx="900" cy="792" r="12" fill="none" stroke="#6FC3FF"/><text x="900" y="797" text-anchor="middle">5</text></g>
  </g>

  <!-- ======== PARTS LIST ======== -->
  <g font-size="13" fill="#DCEBFA">
    <rect x="50" y="810" width="620" height="146" fill="#0E3357" stroke="#6FC3FF" stroke-width="1"/>
    <text x="66" y="835" fill="#6FC3FF" font-size="14" letter-spacing="2" font-weight="bold">PARTS &amp; SYSTEMS INDEX</text>
    <line x1="66" y1="844" x2="654" y2="844" stroke="#6FC3FF" stroke-width="0.7"/>
    <text x="66" y="864">1 — MAGNETOPAUSE: inflated boundary, deflects storm protons around hull</text>
    <text x="66" y="884">2 — SC COIL: superconducting ring generates the dipole field (DETAIL A)</text>
    <text x="66" y="904">3 — CREW HABITAT: rides in the calm field-free center of the bubble</text>
    <text x="66" y="924">4 — PLASMA INJECTOR: inflates compact field far beyond coil reach</text>
    <text x="66" y="946" font-size="11" fill="#6FC3FF">5 — MAGNETIC FIELD LINES · light bulk shield still handles hardest GCRs</text>
  </g>

  <text x="1350" y="800" fill="#6FC3FF" font-size="11" text-anchor="end" letter-spacing="1">DESIGNED BY: W.A. SANDUN PRIYANKARA WIJERATHNE · sandunwijerathne51@gmail.com · github.com/sandunwijerathne</text>

  <!-- ======== TITLE BLOCK ======== -->
  <g font-size="12" fill="#DCEBFA">
    <rect x="700" y="810" width="650" height="146" fill="#0E3357" stroke="#DCEBFA" stroke-width="1.5"/>
    <line x1="700" y1="846" x2="1350" y2="846" stroke="#DCEBFA"/>
    <line x1="700" y1="882" x2="1350" y2="882" stroke="#DCEBFA"/>
    <line x1="700" y1="920" x2="1350" y2="920" stroke="#DCEBFA"/>
    <line x1="1030" y1="810" x2="1030" y2="956" stroke="#DCEBFA"/>
    <text x="716" y="830" fill="#6FC3FF" letter-spacing="1">PROJECT</text>
    <text x="716" y="840" font-size="12" font-weight="bold">OFF-WORLD CIVILISATION TOOLKIT</text>
    <text x="1046" y="830" fill="#6FC3FF">DRAWING NO.</text>
    <text x="1046" y="840" font-size="12" font-weight="bold">MD-1-GA-001 · REV A</text>
    <text x="716" y="866" fill="#6FC3FF">UNIT DESIGNATION</text>
    <text x="716" y="876" font-weight="bold" font-size="10.5">MD-1 "AEGIS FIELD" — GENERAL ARRANGEMENT</text>
    <text x="1046" y="866" fill="#6FC3FF">THREAT</text>
    <text x="1046" y="876" font-weight="bold" font-size="11">SOLAR PARTICLE EVENTS</text>
    <text x="716" y="902" fill="#6FC3FF">DEPLOYMENT</text>
    <text x="716" y="912" font-weight="bold" font-size="11">CREWED DEEP-SPACE TRANSIT VEHICLE</text>
    <text x="1046" y="902" fill="#6FC3FF">BASIS</text>
    <text x="1046" y="912" font-weight="bold" font-size="11">LAB-DEMOED (2008)</text>
    <text x="716" y="936" fill="#6FC3FF">FUNCTION</text>
    <text x="716" y="946" font-weight="bold" font-size="11">GIVES A SHIP ITS OWN MAGNETOSPHERE</text>
    <text x="1046" y="936" fill="#6FC3FF">STATUS</text>
    <text x="1046" y="946" font-weight="bold" font-size="10">CONCEPT — MID-TERM, SHARES MAGSAIL TECH</text>
  </g>
</svg>
