<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#16406B" stroke-width="0.6"/>
    </pattern>
    <pattern id="gridMajor" width="125" height="125" patternUnits="userSpaceOnUse">
      <rect width="125" height="125" fill="url(#grid)"/>
      <path d="M 125 0 L 0 0 0 125" fill="none" stroke="#1E5288" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6FC3FF"/>
    </marker>
    <marker id="warrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#DCEBFA"/>
    </marker>
    <marker id="dim" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M1,1 L9,9 M5,0 L5,10" stroke="#DCEBFA" stroke-width="1" fill="none"/>
    </marker>
  </defs>

  <rect width="1400" height="1000" fill="#0B2A4A"/>
  <rect width="1400" height="1000" fill="url(#gridMajor)"/>
  <rect x="20" y="20" width="1360" height="960" fill="none" stroke="#DCEBFA" stroke-width="2"/>
  <rect x="28" y="28" width="1344" height="944" fill="none" stroke="#DCEBFA" stroke-width="0.8"/>

  <text x="50" y="70" fill="#DCEBFA" font-size="27" letter-spacing="2" font-weight="bold">PERCHLORATE SCRUBBER — PS-1 "HYGEIA"</text>
  <text x="50" y="96" fill="#6FC3FF" font-size="14" letter-spacing="2">MARTIAN SOIL DETOX · WASH-SEPARATE-DESTROY · ION DETAIL · VOLUME II · SHEET 1 OF 5</text>
  <line x1="50" y1="110" x2="1350" y2="110" stroke="#6FC3FF" stroke-width="1"/>

  <!-- ======== MAIN PROCESS FLOW ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="2">
    <!-- raw regolith in -->
    <path d="M 110 300 h 90 l -18 60 h -54 z"/>
    <g fill="#6FC3FF"><circle cx="140" cy="322" r="2.5"/><circle cx="158" cy="330" r="2.5"/><circle cx="172" cy="320" r="2.5"/><circle cx="150" cy="340" r="2.5"/></g>
    <text x="155" y="292" fill="#DCEBFA" font-size="10" text-anchor="middle" stroke="none">RAW REGOLITH</text>
    <text x="155" y="376" fill="#6FC3FF" font-size="8.5" text-anchor="middle" stroke="none">TOXIC PERCHLORATE DUST</text>
    <path d="M 155 360 l 0 40" stroke="#6FC3FF" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- 1. wash tank -->
    <rect x="105" y="400" width="130" height="110" rx="6" fill="#0E3357"/>
    <rect x="105" y="400" width="130" height="110" rx="6"/>
    <path d="M 120 470 q 24 -16 48 0 q 24 16 48 0" stroke="#6FC3FF" stroke-width="1.2"/>
    <text x="170" y="392" fill="#6FC3FF" font-size="10" text-anchor="middle" stroke="none">1 · WASH (WATER)</text>
    <text x="170" y="528" fill="#DCEBFA" font-size="8" text-anchor="middle" stroke="none">PERCHLORATE DISSOLVES OUT</text>
    <path d="M 235 455 l 60 0" stroke="#6FC3FF" stroke-width="1.4" marker-end="url(#arrow)"/>

    <!-- 2. separator -->
    <rect x="300" y="400" width="130" height="110" rx="6"/>
    <path d="M 310 460 h 110" stroke-width="0.8"/>
    <text x="365" y="392" fill="#6FC3FF" font-size="10" text-anchor="middle" stroke="none">2 · SEPARATE</text>
    <!-- clean soil out (down) -->
    <path d="M 365 510 l 0 50" stroke="#6FC3FF" stroke-width="1.4" marker-end="url(#arrow)"/>
    <rect x="310" y="560" width="110" height="46" rx="4"/>
    <g fill="#DCEBFA"><circle cx="336" cy="578" r="2.5"/><circle cx="360" cy="588" r="2.5"/><circle cx="386" cy="576" r="2.5"/></g>
    <text x="365" y="628" fill="#6FC3FF" font-size="9" text-anchor="middle" stroke="none">CLEAN SOIL (SAFE)</text>
    <!-- brine out (right) -->
    <path d="M 430 455 l 60 0" stroke="#DCEBFA" stroke-width="1.4" marker-end="url(#warrow)"/>
    <text x="460" y="446" fill="#DCEBFA" font-size="8" text-anchor="middle" stroke="none">BRINE</text>

    <!-- 3. destruction bioreactor -->
    <rect x="495" y="390" width="150" height="130" rx="8" fill="#0E3357"/>
    <rect x="495" y="390" width="150" height="130" rx="8"/>
    <!-- microbe marks -->
    <g fill="#6FC3FF"><circle cx="525" cy="430" r="3"/><circle cx="565" cy="450" r="3"/><circle cx="610" cy="430" r="3"/><circle cx="540" cy="480" r="3"/><circle cx="600" cy="480" r="3"/></g>
    <text x="570" y="382" fill="#6FC3FF" font-size="10" text-anchor="middle" stroke="none">3 · DESTROY</text>
    <text x="570" y="540" fill="#DCEBFA" font-size="8" text-anchor="middle" stroke="none">MICROBES / HEAT / CHEM</text>

    <!-- oxygen out (up) -->
    <path d="M 570 390 l 0 -50" stroke="#6FC3FF" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="590" y="356" fill="#6FC3FF" font-size="11" stroke="none">O2 RELEASED → BREATHE / FUEL</text>
    <!-- water recovered (loop back to wash) -->
    <path d="M 645 500 C 760 560 300 620 170 512" stroke="#6FC3FF" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
    <text x="470" y="600" fill="#6FC3FF" font-size="9" stroke="none">WATER RECOVERED → REUSED TO WASH NEXT BATCH</text>
  </g>

  <!-- ======== ION DETAIL INSET (top right) ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.2">
    <rect x="900" y="140" width="440" height="220" fill="#0E3357" stroke="#6FC3FF"/>
    <text x="918" y="166" fill="#6FC3FF" font-size="12" letter-spacing="1" stroke="none">FIG. B — A POISON MADE OF OXYGEN</text>
    <line x1="918" y1="176" x2="1322" y2="176" stroke="#6FC3FF" stroke-width="0.7"/>
    <!-- ClO4 ion: central Cl, 4 O around -->
    <circle cx="1120" cy="250" r="16"/>
    <text x="1120" y="255" fill="#DCEBFA" font-size="11" text-anchor="middle" stroke="none">Cl</text>
    <circle cx="1120" cy="205" r="12"/><text x="1120" y="209" fill="#6FC3FF" font-size="9" text-anchor="middle" stroke="none">O</text>
    <circle cx="1165" cy="250" r="12"/><text x="1165" y="254" fill="#6FC3FF" font-size="9" text-anchor="middle" stroke="none">O</text>
    <circle cx="1120" cy="295" r="12"/><text x="1120" y="299" fill="#6FC3FF" font-size="9" text-anchor="middle" stroke="none">O</text>
    <circle cx="1075" cy="250" r="12"/><text x="1075" y="254" fill="#6FC3FF" font-size="9" text-anchor="middle" stroke="none">O</text>
    <line x1="1120" y1="234" x2="1120" y2="217"/><line x1="1136" y1="250" x2="1153" y2="250"/><line x1="1120" y1="266" x2="1120" y2="283"/><line x1="1104" y1="250" x2="1087" y2="250"/>
    <text x="960" y="216" fill="#DCEBFA" font-size="9" stroke="none">PERCHLORATE ION:</text>
    <text x="960" y="232" fill="#DCEBFA" font-size="9" stroke="none">1 CHLORINE +</text>
    <text x="960" y="248" fill="#DCEBFA" font-size="9" stroke="none">4 OXYGEN</text>
    <text x="918" y="332" fill="#DCEBFA" font-size="9" stroke="none">TOXIC OXIDISER + THYROID DISRUPTOR —</text>
    <text x="918" y="350" fill="#6FC3FF" font-size="9" stroke="none">BUT BREAK IT APART → LOTS OF OXYGEN</text>
  </g>

  <!-- ======== DETAIL A: biological route ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.4">
    <circle cx="1120" cy="560" r="92" stroke="#6FC3FF"/>
    <!-- microbe -->
    <ellipse cx="1090" cy="560" rx="18" ry="12"/>
    <text x="1090" y="588" fill="#DCEBFA" font-size="7.5" text-anchor="middle" stroke="none">MICROBE</text>
    <!-- in: perchlorate -->
    <path d="M 1040 540 l 30 12" stroke="#6FC3FF" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="1030" y="532" fill="#DCEBFA" font-size="7.5" stroke="none">ClO4-</text>
    <!-- out: chloride + O2 -->
    <path d="M 1110 552 l 34 -14" stroke="#6FC3FF" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="1150" y="536" fill="#6FC3FF" font-size="7.5" stroke="none">O2 ↑</text>
    <path d="M 1110 568 l 34 12" stroke="#6FC3FF" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="1150" y="588" fill="#DCEBFA" font-size="7.5" stroke="none">Cl- (harmless)</text>
    <text x="1120" y="626" fill="#6FC3FF" font-size="8" text-anchor="middle" stroke="none">"BREATHES" PERCHLORATE, EXHALES O2</text>
    <text x="1120" y="676" fill="#6FC3FF" font-size="12" text-anchor="middle" stroke="none">DETAIL A — BIOLOGICAL ROUTE</text>
    <line x1="620" y1="450" x2="1032" y2="548" stroke="#6FC3FF" stroke-width="0.9" stroke-dasharray="5 4"/>
  </g>

  <!-- ======== CONTAINMENT PANEL ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.4">
    <rect x="900" y="690" width="440" height="96" fill="#0E3357" stroke="#6FC3FF" stroke-width="1.4"/>
    <text x="918" y="714" fill="#6FC3FF" font-size="11" letter-spacing="1" stroke="none">! CONTAINMENT IS THE HARD PART</text>
    <line x1="918" y1="722" x2="1322" y2="722" stroke="#6FC3FF" stroke-width="0.7"/>
    <g fill="#DCEBFA" font-size="9" stroke="none">
      <text x="918" y="740">CHEMISTRY IS EASY · HANDLING TOXIC DUST IS NOT</text>
      <text x="918" y="758">SEAL EVERY TRANSFER · WET PROCESS SUPPRESSES DUST</text>
      <text x="918" y="776" fill="#6FC3FF">DETOX ≠ FERTILE: SAFE FIRST, NUTRIENTS AFTER</text>
    </g>
  </g>

  <!-- ======== CALLOUTS ======== -->
  <g stroke="#6FC3FF" stroke-width="1" fill="none">
    <line x1="155" y1="360" x2="180" y2="800" marker-start="url(#arrow)"/>
    <line x1="170" y1="510" x2="340" y2="800" marker-start="url(#arrow)"/>
    <line x1="365" y1="606" x2="500" y2="800" marker-start="url(#arrow)"/>
    <line x1="570" y1="520" x2="640" y2="800" marker-start="url(#arrow)"/>
    <line x1="570" y1="345" x2="790" y2="800" marker-start="url(#arrow)"/>
  </g>
  <g fill="#DCEBFA" font-size="13">
    <g><circle cx="180" cy="812" r="12" fill="none" stroke="#6FC3FF"/><text x="180" y="817" text-anchor="middle">1</text></g>
    <g><circle cx="340" cy="812" r="12" fill="none" stroke="#6FC3FF"/><text x="340" y="817" text-anchor="middle">2</text></g>
    <g><circle cx="500" cy="812" r="12" fill="none" stroke="#6FC3FF"/><text x="500" y="817" text-anchor="middle">3</text></g>
    <g><circle cx="640" cy="812" r="12" fill="none" stroke="#6FC3FF"/><text x="640" y="817" text-anchor="middle">4</text></g>
    <g><circle cx="790" cy="812" r="12" fill="none" stroke="#6FC3FF"/><text x="790" y="817" text-anchor="middle">5</text></g>
  </g>

  <!-- ======== PARTS LIST ======== -->
  <g font-size="12.5" fill="#DCEBFA">
    <rect x="50" y="832" width="640" height="124" fill="#0E3357" stroke="#6FC3FF" stroke-width="1"/>
    <text x="66" y="856" fill="#6FC3FF" font-size="13" letter-spacing="2" font-weight="bold">PARTS &amp; SYSTEMS INDEX</text>
    <line x1="66" y1="865" x2="674" y2="865" stroke="#6FC3FF" stroke-width="0.7"/>
    <text x="66" y="885">1 — WASH: mix regolith with water, perchlorate dissolves out (soluble)</text>
    <text x="66" y="905">2 — SEPARATE: clean soil down (safe), contaminated brine across</text>
    <text x="66" y="925">3 — DESTROY: microbes/heat/chem break perchlorate → chloride + O2 (DETAIL A)</text>
    <text x="66" y="941" font-size="10.5" fill="#6FC3FF">4 — WATER RECOVERED, reused · 5 — O2 CAPTURED: poison becomes breathable gas</text>
  </g>

  <text x="1350" y="812" fill="#6FC3FF" font-size="11" text-anchor="end" letter-spacing="1">DESIGNED BY: W.A. SANDUN PRIYANKARA WIJERATHNE · sandunwijerathne51@gmail.com · github.com/sandunwijerathne</text>

  <!-- ======== TITLE BLOCK ======== -->
  <g font-size="12" fill="#DCEBFA">
    <rect x="710" y="832" width="640" height="124" fill="#0E3357" stroke="#DCEBFA" stroke-width="1.5"/>
    <line x1="710" y1="866" x2="1350" y2="866" stroke="#DCEBFA"/>
    <line x1="710" y1="900" x2="1350" y2="900" stroke="#DCEBFA"/>
    <line x1="710" y1="934" x2="1350" y2="934" stroke="#DCEBFA"/>
    <line x1="1040" y1="832" x2="1040" y2="956" stroke="#DCEBFA"/>
    <text x="726" y="852" fill="#6FC3FF" letter-spacing="1">PROJECT</text>
    <text x="726" y="862" font-size="11" font-weight="bold">OFF-WORLD TOOLKIT · VOLUME II</text>
    <text x="1056" y="852" fill="#6FC3FF">DRAWING NO.</text>
    <text x="1056" y="862" font-size="11" font-weight="bold">PS-1-GA-001 · REV A</text>
    <text x="726" y="886" fill="#6FC3FF">UNIT DESIGNATION</text>
    <text x="726" y="896" font-weight="bold" font-size="10">PS-1 "HYGEIA" — GENERAL ARRANGEMENT</text>
    <text x="1056" y="886" fill="#6FC3FF">FEEDSTOCK</text>
    <text x="1056" y="896" font-weight="bold" font-size="11">MARTIAN REGOLITH (PLANET-WIDE)</text>
    <text x="726" y="920" fill="#6FC3FF">METHOD</text>
    <text x="726" y="930" font-weight="bold" font-size="10.5">WASH · SEPARATE · DESTROY (BIO/HEAT/CHEM)</text>
    <text x="1056" y="920" fill="#6FC3FF">YIELDS</text>
    <text x="1056" y="930" font-weight="bold" font-size="11">SAFE SOIL + OXYGEN</text>
    <text x="726" y="944" fill="#6FC3FF">FUNCTION</text>
    <text x="726" y="954" font-weight="bold" font-size="10.5">MAKES POISONED GROUND SAFE TO FARM + HANDLE</text>
    <text x="1056" y="944" fill="#6FC3FF">STATUS</text>
    <text x="1056" y="954" font-weight="bold" font-size="10">CONCEPT — CHEMISTRY ESTABLISHED</text>
  </g>
</svg>
