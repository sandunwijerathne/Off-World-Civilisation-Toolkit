<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#16406B" stroke-width="0.6"/>
    </pattern>
    <pattern id="gridMajor" width="125" height="125" patternUnits="userSpaceOnUse">
      <rect width="125" height="125" fill="url(#grid)"/>
      <path d="M 125 0 L 0 0 0 125" fill="none" stroke="#1E5288" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6FC3FF"/>
    </marker>
    <marker id="dim" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M1,1 L9,9 M5,0 L5,10" stroke="#DCEBFA" stroke-width="1" fill="none"/>
    </marker>
  </defs>

  <rect width="1400" height="1000" fill="#0B2A4A"/>
  <rect width="1400" height="1000" fill="url(#gridMajor)"/>
  <rect x="20" y="20" width="1360" height="960" fill="none" stroke="#DCEBFA" stroke-width="2"/>
  <rect x="28" y="28" width="1344" height="944" fill="none" stroke="#DCEBFA" stroke-width="0.8"/>

  <text x="50" y="70" fill="#DCEBFA" font-size="29" letter-spacing="3" font-weight="bold">ASTEROID HERDER — AH-1 "SHEPHERD"</text>
  <text x="50" y="96" fill="#6FC3FF" font-size="14" letter-spacing="2">GRAVITY-TRACTOR PLANETARY DEFENCE · STATION-KEEPING VIEW · DEFLECTION GEOMETRY · SHEET 1 OF 5</text>
  <line x1="50" y1="110" x2="1350" y2="110" stroke="#6FC3FF" stroke-width="1"/>

  <!-- ======== MAIN VIEW: tractor hovering beside asteroid ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="2">
    <!-- asteroid (irregular blob) -->
    <path d="M 320 400 q 40 -60 110 -50 q 70 10 90 60 q 25 60 -20 110 q -50 55 -120 40 q -70 -15 -85 -75 q -12 -55 25 -85 z"/>
    <!-- crater texture -->
    <circle cx="360" cy="420" r="14" stroke-width="0.8"/>
    <circle cx="430" cy="470" r="20" stroke-width="0.8"/>
    <circle cx="400" cy="410" r="8" stroke-width="0.8"/>
    <circle cx="460" cy="420" r="10" stroke-width="0.8"/>
    <text x="400" y="560" fill="#6FC3FF" font-size="10" text-anchor="middle" stroke="none">HAZARDOUS ASTEROID</text>

    <!-- gravity-tractor spacecraft (right of asteroid) -->
    <g stroke-width="2">
      <rect x="700" y="430" width="90" height="60" rx="6"/>
      <!-- big solar arrays -->
      <rect x="620" y="440" width="70" height="40"/>
      <rect x="800" y="440" width="70" height="40"/>
      <path d="M 638 440 v40 M 656 440 v40 M 674 440 v40 M 818 440 v40 M 836 440 v40 M 854 440 v40" stroke-width="0.6"/>
    </g>
    <text x="745" y="514" fill="#6FC3FF" font-size="9" text-anchor="middle" stroke="none">GRAVITY TRACTOR (MASSIVE)</text>

    <!-- canted ion thrusters (angled outward, away from asteroid) -->
    <g stroke-width="1.6">
      <line x1="700" y1="445" x2="660" y2="410"/>
      <line x1="700" y1="475" x2="660" y2="510"/>
    </g>
    <g stroke="#6FC3FF" stroke-width="1.2">
      <path d="M 660 410 l -24 -18" marker-end="url(#arrow)"/>
      <path d="M 660 510 l -24 18" marker-end="url(#arrow)"/>
    </g>
    <text x="600" y="380" fill="#6FC3FF" font-size="9" stroke="none">CANTED THRUSTERS</text>
    <text x="600" y="393" fill="#6FC3FF" font-size="8" stroke="none">(PLUMES MISS ASTEROID)</text>

    <!-- gravitational tug line between the two -->
    <line x1="520" y1="450" x2="700" y2="455" stroke="#6FC3FF" stroke-width="1.4" stroke-dasharray="7 5"/>
    <path d="M 700 455 l -20 -6 m 20 6 l -20 6" stroke="#6FC3FF" stroke-width="1"/>
    <text x="600" y="440" fill="#DCEBFA" font-size="9" text-anchor="middle" stroke="none">MUTUAL GRAVITY</text>

    <!-- tow direction on asteroid -->
    <path d="M 320 450 l -60 8" stroke="#6FC3FF" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="250" y="440" fill="#6FC3FF" font-size="9" stroke="none">SLOW TOW</text>
  </g>

  <!-- ======== DEFLECTION GEOMETRY INSET (top right) ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.2">
    <rect x="1000" y="140" width="340" height="250" fill="#0E3357" stroke="#6FC3FF"/>
    <text x="1016" y="164" fill="#6FC3FF" font-size="12" letter-spacing="1" stroke="none">FIG. B — WARNING TIME = LEVERAGE</text>
    <!-- Earth -->
    <circle cx="1290" cy="300" r="16"/>
    <text x="1290" y="336" fill="#DCEBFA" font-size="8.5" text-anchor="middle" stroke="none">EARTH</text>
    <!-- original impact path -->
    <path d="M 1030 210 Q 1160 250 1274 296" stroke="#DCEBFA" stroke-width="1.2"/>
    <text x="1040" y="200" fill="#DCEBFA" font-size="8" stroke="none">UNDEFLECTED → HIT</text>
    <!-- deflected miss path -->
    <path d="M 1030 230 Q 1160 250 1290 250" stroke="#6FC3FF" stroke-width="1.4" stroke-dasharray="5 3"/>
    <text x="1040" y="248" fill="#6FC3FF" font-size="8" stroke="none">TINY NUDGE, YEARS EARLY → MISS</text>
    <!-- tiny nudge marker -->
    <circle cx="1030" cy="220" r="4" fill="#6FC3FF"/>
    <path d="M 1030 220 l 0 -18" stroke="#6FC3FF" stroke-width="0.8" marker-end="url(#arrow)"/>
    <text x="1016" y="376" fill="#6FC3FF" font-size="9" stroke="none">mm/s NOW = 1000s OF km AT ENCOUNTER</text>
  </g>

  <!-- ======== DETAIL A: pre-deployed fleet ======== -->
  <g stroke="#DCEBFA" fill="none" stroke-width="1.4">
    <circle cx="1150" cy="600" r="90" stroke="#6FC3FF"/>
    <!-- sun -->
    <circle cx="1150" cy="600" r="14"/>
    <text x="1150" y="604" fill="#6FC3FF" font-size="7" text-anchor="middle" stroke="none">SUN</text>
    <!-- orbit rings -->
    <circle cx="1150" cy="600" r="44" stroke-dasharray="4 4" stroke-width="0.8"/>
    <circle cx="1150" cy="600" r="70" stroke-dasharray="4 4" stroke-width="0.8"/>
    <!-- pre-deployed shepherds (small squares on rings) -->
    <rect x="1188" y="580" width="10" height="10"/>
    <rect x="1120" y="558" width="10" height="10"/>
    <rect x="1100" y="636" width="10" height="10"/>
    <rect x="1204" y="628" width="10" height="10"/>
    <rect x="1148" y="528" width="10" height="10"/>
    <text x="1150" y="708" fill="#6FC3FF" font-size="12" text-anchor="middle" stroke="none">DETAIL A — PRE-DEPLOYED FLEET</text>
    <line x1="800" y1="460" x2="1064" y2="588" stroke="#6FC3FF" stroke-width="0.9" stroke-dasharray="5 4"/>
  </g>

  <!-- ======== CALLOUTS ======== -->
  <g stroke="#6FC3FF" stroke-width="1" fill="none">
    <line x1="400" y1="500" x2="300" y2="790" marker-start="url(#arrow)"/>
    <line x1="745" y1="490" x2="620" y2="790" marker-start="url(#arrow)"/>
    <line x1="660" y1="410" x2="470" y2="790" marker-start="url(#arrow)"/>
    <line x1="600" y1="452" x2="760" y2="790" marker-start="url(#arrow)"/>
    <line x1="280" y1="458" x2="900" y2="790" marker-start="url(#arrow)"/>
  </g>
  <g fill="#DCEBFA" font-size="13">
    <g><circle cx="300" cy="802" r="12" fill="none" stroke="#6FC3FF"/><text x="300" y="807" text-anchor="middle">1</text></g>
    <g><circle cx="620" cy="802" r="12" fill="none" stroke="#6FC3FF"/><text x="620" y="807" text-anchor="middle">2</text></g>
    <g><circle cx="470" cy="802" r="12" fill="none" stroke="#6FC3FF"/><text x="470" y="807" text-anchor="middle">3</text></g>
    <g><circle cx="760" cy="802" r="12" fill="none" stroke="#6FC3FF"/><text x="760" y="807" text-anchor="middle">4</text></g>
    <g><circle cx="900" cy="802" r="12" fill="none" stroke="#6FC3FF"/><text x="900" y="807" text-anchor="middle">5</text></g>
  </g>

  <!-- ======== PARTS LIST ======== -->
  <g font-size="13" fill="#DCEBFA">
    <rect x="50" y="822" width="620" height="134" fill="#0E3357" stroke="#6FC3FF" stroke-width="1"/>
    <text x="66" y="847" fill="#6FC3FF" font-size="14" letter-spacing="2" font-weight="bold">PARTS &amp; SYSTEMS INDEX</text>
    <line x1="66" y1="856" x2="654" y2="856" stroke="#6FC3FF" stroke-width="0.7"/>
    <text x="66" y="876">1 — HAZARDOUS ASTEROID: target, towed by mutual gravity (any shape)</text>
    <text x="66" y="896">2 — GRAVITY TRACTOR: massive spacecraft, hovers beside asteroid for years</text>
    <text x="66" y="916">3 — CANTED THRUSTERS: angled out so plumes miss the asteroid</text>
    <text x="66" y="936">4 — ION/HALL DRIVE + ARRAYS: multi-year electric propulsion, station-keep</text>
    <text x="66" y="951" font-size="10.5" fill="#6FC3FF">5 — SLOW TOW: mm/s applied years early → thousands of km at encounter</text>
  </g>

  <text x="1350" y="812" fill="#6FC3FF" font-size="11" text-anchor="end" letter-spacing="1">DESIGNED BY: W.A. SANDUN PRIYANKARA WIJERATHNE · sandunwijerathne51@gmail.com · github.com/sandunwijerathne</text>

  <!-- ======== TITLE BLOCK ======== -->
  <g font-size="12" fill="#DCEBFA">
    <rect x="700" y="822" width="650" height="134" fill="#0E3357" stroke="#DCEBFA" stroke-width="1.5"/>
    <line x1="700" y1="856" x2="1350" y2="856" stroke="#DCEBFA"/>
    <line x1="700" y1="890" x2="1350" y2="890" stroke="#DCEBFA"/>
    <line x1="700" y1="924" x2="1350" y2="924" stroke="#DCEBFA"/>
    <line x1="1030" y1="822" x2="1030" y2="956" stroke="#DCEBFA"/>
    <text x="716" y="842" fill="#6FC3FF" letter-spacing="1">PROJECT</text>
    <text x="716" y="852" font-size="12" font-weight="bold">OFF-WORLD CIVILISATION TOOLKIT</text>
    <text x="1046" y="842" fill="#6FC3FF">DRAWING NO.</text>
    <text x="1046" y="852" font-size="12" font-weight="bold">AH-1-GA-001 · REV A</text>
    <text x="716" y="876" fill="#6FC3FF">UNIT DESIGNATION</text>
    <text x="716" y="886" font-weight="bold" font-size="11">AH-1 "SHEPHERD" — GENERAL ARRANGEMENT</text>
    <text x="1046" y="876" fill="#6FC3FF">METHOD</text>
    <text x="1046" y="886" font-weight="bold" font-size="11">GRAVITY TRACTOR</text>
    <text x="716" y="910" fill="#6FC3FF">POSTURE</text>
    <text x="716" y="920" font-weight="bold" font-size="11">PRE-DEPLOYED STANDING FLEET</text>
    <text x="1046" y="910" fill="#6FC3FF">BASIS</text>
    <text x="1046" y="920" font-weight="bold" font-size="11">DART PROVEN (2022)</text>
    <text x="716" y="944" fill="#6FC3FF">FUNCTION</text>
    <text x="716" y="954" font-weight="bold" font-size="11">DEFLECTS HAZARDOUS ASTEROIDS YEARS IN ADVANCE</text>
    <text x="1046" y="944" fill="#6FC3FF">STATUS</text>
    <text x="1046" y="954" font-weight="bold" font-size="10">CONCEPT — HIGHLY BUILDABLE</text>
  </g>
</svg>
